<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Relic plate — The Veil of Veronica's Thread">
  <rect width="400" height="400" fill="#e9e0c8"/>
  <rect x="10" y="10" width="380" height="380" fill="none" stroke="#1c1a17" stroke-width="2" opacity="0.55"/>
  <path d="M10 44 V10 H44" fill="none" stroke="#1c1a17" stroke-width="3"/>
  <path d="M390 356 V390 H356" fill="none" stroke="#1c1a17" stroke-width="3"/>
  <g transform="rotate(-6 334 40)">
    <rect x="288" y="26" width="88" height="28" rx="3" fill="none" stroke="#7a1f1f" stroke-width="3" opacity="0.6"/>
    <text x="332" y="45" font-family="monospace" font-size="12" fill="#7a1f1f" text-anchor="middle" opacity="0.7">TIER 1</text>
  </g>
  <!-- needle -->
  <path d="M120 300 L286 128" stroke="#8a8578" stroke-width="7" stroke-linecap="round"/>
  <path d="M120 300 L142 280" stroke="#8a8578" stroke-width="11" stroke-linecap="round"/>
  <ellipse cx="132" cy="292" rx="4" ry="9" fill="#e9e0c8" transform="rotate(42 132 292)"/>
  <!-- ochre thread through the eye -->
  <path d="M134 288 C150 320 196 328 224 320 C266 308 280 264 262 232 C246 204 210 200 188 216 C170 228 166 252 178 268" fill="none" stroke="#a8762c" stroke-width="4"/>
  <path d="M178 268 C186 280 202 282 212 272 C224 260 220 240 206 236" fill="none" stroke="#a8762c" stroke-width="4" opacity="0.85"/>
  <!-- loose end -->
  <path d="M206 236 C214 232 226 236 230 246" fill="none" stroke="#a8762c" stroke-width="4" stroke-dasharray="10 6"/>
  <!-- white ash flecks -->
  <g fill="#f4f0e4" stroke="#c9bfa3" stroke-width="1">
    <circle cx="252" cy="300" r="3"/>
    <circle cx="266" cy="312" r="2"/>
    <circle cx="240" cy="318" r="2"/>
    <circle cx="276" cy="294" r="2"/>
  </g>
  <!-- flash burst -->
  <g stroke="#7a1f1f" stroke-width="3" opacity="0.5">
    <path d="M300 120 L326 94"/>
    <path d="M312 150 L344 142"/>
    <path d="M296 170 L322 186"/>
  </g>
</svg>
