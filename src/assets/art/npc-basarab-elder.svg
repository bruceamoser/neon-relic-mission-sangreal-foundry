<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Dossier silhouette — Basarab Elder">
  <rect width="400" height="400" fill="#e9e0c8"/>
  <rect x="10" y="10" width="380" height="380" fill="none" stroke="#1c1a17" stroke-width="2" opacity="0.55"/>
  <path d="M10 44 V10 H44" fill="none" stroke="#1c1a17" stroke-width="3"/>
  <path d="M390 356 V390 H356" fill="none" stroke="#1c1a17" stroke-width="3"/>
  <g transform="rotate(-6 334 40)">
    <rect x="288" y="26" width="88" height="28" rx="3" fill="none" stroke="#7a1f1f" stroke-width="3" opacity="0.6"/>
    <text x="332" y="45" font-family="monospace" font-size="12" fill="#7a1f1f" text-anchor="middle" opacity="0.7">EXTANT 400Y</text>
  </g>
  <!-- cloaked shoulders -->
  <path d="M36 400 C58 300 118 272 200 272 C282 272 342 300 364 400 Z" fill="#12100e"/>
  <!-- high collar -->
  <path d="M156 288 L200 352 L244 288 L230 280 L200 326 L170 280 Z" fill="#1c1a17" stroke="#e9e0c8" stroke-width="2"/>
  <!-- hood -->
  <path d="M128 232 C120 132 156 92 200 92 C244 92 280 132 272 232 C272 180 244 138 200 138 C156 138 128 180 128 232 Z" fill="#12100e"/>
  <!-- long face -->
  <ellipse cx="200" cy="206" rx="48" ry="66" fill="#1c1a17"/>
  <!-- cheekbone lines -->
  <path d="M166 226 C176 252 186 262 196 262" fill="none" stroke="#e9e0c8" stroke-width="3" opacity="0.7"/>
  <path d="M234 226 C224 252 214 262 204 262" fill="none" stroke="#e9e0c8" stroke-width="3" opacity="0.7"/>
  <!-- ageless eyes -->
  <ellipse cx="182" cy="204" rx="8" ry="6" fill="#7a1f1f"/>
  <ellipse cx="218" cy="204" rx="8" ry="6" fill="#7a1f1f"/>
  <circle cx="182" cy="204" r="2.5" fill="#e9e0c8" opacity="0.9"/>
  <circle cx="218" cy="204" r="2.5" fill="#e9e0c8" opacity="0.9"/>
  <!-- thin mouth -->
  <path d="M184 250 H216" stroke="#e9e0c8" stroke-width="3"/>
  <!-- fangs hint -->
  <path d="M192 250 L194 258 L198 250 Z" fill="#e9e0c8"/>
  <path d="M202 250 L206 258 L208 250 Z" fill="#e9e0c8"/>
</svg>
