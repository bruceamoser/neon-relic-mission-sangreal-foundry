<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Relic plate — The Twelve Phials of Gethsemane">
  <rect width="400" height="400" fill="#e9e0c8"/>
