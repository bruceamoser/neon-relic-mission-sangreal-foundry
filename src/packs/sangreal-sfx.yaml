# Mission: Sangreal — Sound Effects (Playlist pack)
# Playlists: playlist
#
# One playlist per module: “Sangreal Sound Effects”. Every track is a short
# ambience bed, prop or sting keyed to a beat of the DA walkthrough — the cue sheet
# (phase → track) is the “Sound Effects — Cue Sheet” page of the DA Walkthrough
# journal, and the licensing record ships in assets/audio/CREDITS.md.
#
# The installer imports this pack into the world as a folder named “Sound Effects”.
# Ambience beds use repeat: true (they loop until stopped); one-shots do not.
---
- _id: sangreal-sfx
  name: Sangreal Sound Effects
  type: playlist
  description: 'Cue-keyed ambience, props and stings for the fourteen days of the Sangreal case. Ambience beds loop; stings play once. Volume trims are starting points — ride them live at the table.'
  mode: 0 # 0 = sequential, 1 = simultaneous, 2 = shuffle
  playing: false
  fade: 2000
  sorting: 'a'
  sounds:
    - _id: sfx-abbey-door
      name: 'Prop — Heavy door, spring lock (abbey, vault)'
      path: modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-abbey-door.mp3
      repeat: false
      volume: 0.5
      playing: false
    - _id: sfx-church-bell
      name: 'Prop — Abbey bell toll'
      path: modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-church-bell.mp3
      repeat: false
      volume: 0.5
      playing: false
    - _id: sfx-clock-tick
      name: 'Ambience — Clock ticking (Operations Board)'
      path: modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-clock-tick.mp3
