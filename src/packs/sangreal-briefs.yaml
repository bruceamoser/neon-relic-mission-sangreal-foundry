      Deposit} retains its 22:41 surveillance timestamp and a matching wall clock, with no fixed calendar
      date. Supply the date from the bank’s authenticated record using the established campaign chronology.
      Nobody must solve a lettering defect to continue.</p><h3>Pacing and the stopping point</h3><p>Allow
      roughly 10–15 minutes for the train, 10 for the approach, 35–50 for Mercier and the records, and 15–25
      for calls and departure. These are table-time guides. In-world time follows actual travel and
      substantial delays, not a separate shift for every question. Finish this segment as the Geneva–Zurich
      train leaves; the Sonnenberg ward encounter belongs to the next chapter.</p><h3>Current-session
      direction</h3><p>Arrival at Sonnenberg is after the injection, with the twenty-four-hour conversion
      complete. The party still expects the Grail; Graf reveals twelve vessels of blood, Hausmann demonstrates
      the human consequence, and an authenticated authority call establishes organized vampire interests. The
      Church did not know Corvi’s treatment plan. Claudia remains helpful and trusted; her volunteered Rome
      telephone inquiry is not a clue to her covert allegiance.</p><h3>Written clues after useful
      calls</h3><p>Whenever a call yields a useful fact, contact, promise or lead, give a persistent clue card
      as a dated call summary or fax. Name the speaker, source, question, actual answer, uncertainty and next
      action. Use an established receiving desk and update the same card after later callbacks; retain the
      prior dated report when status changes. Ordinary appointment and care arrangements deserve cards too. Do
      not auto-reveal the entire packet or put DA secrets in player text.</p><p>Campaign packet by release
      scene: @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.K7J4ZglpZYcLZtlz]{I46 — Corvi at
      Roma Termini}, @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.NYALXJz5OsFM9NiK]{I47 —
      Petra Fax — UBS Interview Contact},
      @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.jkM2vcnrfoWRsfMI]{I48 — Petra Fax —
      Sonnenberg Contact and Route},
      @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.jCO2OHblFeteicpl]{I49 — Petra Fax —
      Graf’s Returned Call},
      @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.S4tdujDWKjlTTBAJ]{I50 — Sonnenberg
      reception movement extract},
      @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.8SS0DFQjCYTpMvCF]{I51 — Graf’s
      treatment and custody statement},
      @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.hnuSDQF9W6V31IPm]{I52 — Telephone
      message retained at reception},
      @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.tBZisHd3TtN3q961]{I53 — Petra Fax —
      Lingotto Callback},
      @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.SQSfCR6mxHrJY1Kt]{I54 — Petra Fax —
      Clinic Handover and Rail Plan},
      @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.2Ai06nmzdOoBVUdV]{I55 — Authority Call
      — The Other Vampires},
      @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.AHvJ7rboPnaNlsnN]{I56 — Claudia’s Train
      Brief — Preliminary UBS Inquiry}. For this train/Geneva segment, use
      @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.K7J4ZglpZYcLZtlz]{I46 — Corvi at Roma
      Termini}–@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.jCO2OHblFeteicpl]{I49 — Petra
      Fax — Graf’s Returned Call} and
      @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.AHvJ7rboPnaNlsnN]{I56 — Claudia’s Train
      Brief — Preliminary UBS Inquiry} alongside the existing bank cards.
      @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.S4tdujDWKjlTTBAJ]{I50 — Sonnenberg
      reception movement
      extract}–@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.2Ai06nmzdOoBVUdV]{I55 —
      Authority Call — The Other Vampires} belong to the later clinic/departure scenes; do not send them in
      the Geneva fax packet.</p>
