      - day: 10
        description: >-
          M1 — Proposed Zurich Treatment: if not prevented, Hausmann receives phial 1 at Sonnenberg; eleven
          intact vessels remain. Record the actual administration time.
      - day: 8
        description: >-
          M2 — Ward Crisis and Onward Travel: conversion completed 24 hours after administration; if
          uncontrolled, the clinic deteriorates and Corvi heads for Turin. A prevented treatment or secured
          patient changes this event.
      - day: 6
        description: >-
          M3 — Refused Second Sale: the broker offers for another phial; Corvi refuses after learning the
          human outcome. Eleven remain. Claudia receives permission to attempt extraction, not guaranteed
          success.
      - day: 4
        description: >-
          M4 — Contested Custody: Claudia attempts extraction only if free, equipped, able to reach the case
          and a route. The cell can prevent or negotiate it. No mandatory daylight spill.
      - day: 2
        description: >-
          M5 — Conditional Novara Attack: if the case reaches the abbey and the pack finds it, an unopposed
