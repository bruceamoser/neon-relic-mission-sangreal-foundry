- _id: sangreal-player-brief
  name: Operation File SANGREAL-87-091 — Player Dossier
  type: playerCaseBrief
  system:
    caseId: SANGREAL-87-091
    caseName: 'Mission: Sangreal'
    region: Region 04 — Western Europe / Italian-Swiss Corridor
    classification: RESTRICTED
    situationSummary: >
      <p>At 04:00 hours yesterday, the Holy Alliance — the diplomatic and security office of the Holy See —
      requisitioned emergency Covenant field recovery aid under the terms of the St. John Custodial
      Concordat.</p> <p>Subterranean Vault IX, located beneath the Campo Santo Teutonico in Vatican City, was
      breached. A customized brushed-steel diplomatic attaché case, manufactured in 1964 and reinforced with
      lead-antimony shielding, was removed.</p> <p>The Holy See refuses to describe the contents of the
      attaché, and will provide no further information. The single detail on record: a tarnished brass sign
      fixed below the electromagnetic mooring plinth where the case was stored in Vault IX, reading one word —
      <strong>SANGREAL</strong>. Church officials decline to explain it. The Holy See guarantees the
      following:</p> <ul> <li>The artifact generates zero bio-contamination risk.</li> <li>The artifact poses
      zero occult memetic or psychic radiation hazard.</li> <li>The artifact must remain sealed; field testing
      or opening the container is strictly prohibited under pontifical treaty.</li> <li>Full legal and
      operational custody must be remanded to Church authorities immediately upon recovery.</li> </ul>
    primaryObjective: |
      <p><strong>Primary:</strong> Locate and secure the 1964 steel attaché case and its contents intact.</p>
    secondaryObjective: >
      <p><strong>Secondary:</strong> Identify the individual who breached Vault IX and determine how its
      electromagnetic mooring systems were bypassed.</p>
    knownOrganizations: >
      <p><strong>The Holy Alliance.</strong> The diplomatic and security office of the Holy See. Your
      contracting authority for this operation; handles the case as a diplomatic matter and expects
      discretion.</p>
    initialContacts:
      - name: Cardinal Enrico Sabbatini
        role: Contracting authority — Congregation for the Doctrine of the Faith
        knownInfo: >-
          Signed the emergency requisition. Your point of authority for the case; treats it as a diplomatic
          incident, not an occult one.
      - name: Sister Claudia Vane
        role: Ecclesiastical liaison
        knownInfo: >-
          Must accompany all inquiries on church property. Holds diplomatic transit papers, pontifical seals,
          and local banking clearances.
      - name: Father Ghiberti
        role: Curial archivist — Subterranean Vault IX
        knownInfo: Nervous, precise. Knows the vault inventory and its custodial history better than anyone alive.
      - name: Gerard, Vatican Gendarme Duty Officer
        role: Campo Santo Teutonico gate detail
        knownInfo: Controls access to the German Cemetery entrance and logs every descent to the vault level.
      - name: Petra, Covenant Logistics Officer
        role: Recovery Division — Region 04 desk
        knownInfo: Your supply line for field gear, vehicles, and safehouses across the Italian-Swiss corridor.
      - name: Stephan, Wayfinder Remote-Sensing Analyst
        role: Covenant HQ — monitoring wing
        knownInfo: Holds the last stable readings from Vault IX; can task follow-up analysis through a request packet.
    startingLeads: >
      <p><strong>Vault IX</strong> — the Campo Santo Teutonico entrance beneath St. Peter's. <strong>Monsignor
      Corvi's private quarters</strong> — the Palazzo del Sant'Uffizio, where the Prefect of the Secret
      Archives lived and worked.</p>
    timelinePressure: >
      <p>Secular authorities have not been alerted. The Covenant has a narrow operational window before
      Italian Carabinieri and Swiss border guards detect irregular cross-border travel.</p>
    constraints: >
      <ul> <li>Sister Claudia Vane must accompany the field cell during all inquiries conducted within church
      properties and ecclesiastical jurisdictions.</li> <li>The attaché must remain sealed — no field testing,
      no opening, under pontifical treaty.</li> <li>Custody of the attaché remands to Church authorities
      immediately upon recovery.</li> <li>No secular law enforcement, international media, or hostile criminal
      syndicates may obtain custody of the container.</li> </ul>
    description: >
      <p>Player-facing dossier for Operation File <strong>SANGREAL-87-091</strong>. Issue to the cell at the
      start of the case. Contains no spoilers beyond the Holy See's official guarantees.</p>
- _id: sangreal-case-board
  name: SANGREAL-87-091 — Case Board
  type: caseBoard
  system:
    caseId: SANGREAL-87-091
    caseName: 'Mission: Sangreal'
    region: Region 04 — Western Europe / Italian-Swiss Corridor
    currentDay: 14
    shiftsFilled: []
    relicMilestones:
      - day: 10
        description: >-
          M1 — Proposed Zurich Treatment: if not prevented, Hausmann receives phial 1 at Sonnenberg; eleven
          intact vessels remain. Record the actual administration time.
      - day: 8
        description: >-
          M2 — Ward Crisis and Onward Travel: conversion completed 24 hours after administration; if
          uncontrolled, the clinic deteriorates and Corvi heads for Turin. A prevented treatment or secured
          patient changes this event.
      - day: 6
        description: >-
          M3 — Refused Second Sale: the broker offers for another phial; Corvi refuses after learning the
          human outcome. Eleven remain. Claudia receives permission to attempt extraction, not guaranteed
          success.
      - day: 4
        description: >-
          M4 — Contested Custody: Claudia attempts extraction only if free, equipped, able to reach the case
          and a route. The cell can prevent or negotiate it. No mandatory daylight spill.
      - day: 2
        description: >-
          M5 — Conditional Novara Attack: if the case reaches the abbey and the pack finds it, an unopposed
          late-night attack at about 23:45 breaks one of eleven; ten are removed. Intervention changes
          casualties and count.
      - day: 1
        description: >-
          M6 — Planned Departure: YR-BAS has a 01:15 slot after the final evening. It departs only if cargo,
          aircraft, crew and clearance remain available. Interception can succeed.
    organizations:
      - id: O1
        name: The Holy Alliance (L'Entità)
        orgSlug: sangreal-org-alliance
        value: 0
        active: true
        dormant: false
        squaresConsumed: []
        milestones:
          - day: 7
            label: O1M1
            description: >-
              Frontier scrutiny: if recovery risk persists, the Alliance pressures transit contacts. Warn
              through Petra; verified clearance or another route can avoid delay.
          - day: 4
            label: O1M2
            description: >-
              Clinic recovery attempt: if staff or samples remain unsecured, operatives demand custody. A
              rescue, stand-down, or quarantine agreement prevents the default escalation.
          - day: 1
            label: O1M3
            description: >-
              Custody ultimatum: hardliners may seek suppression; Sabbatini can authorize, halt, or negotiate.
              Knowledge alone does not automatically cause an assassination.
      - id: O2
        name: The Order of the Talamasca (Registry 16)
        orgSlug: sangreal-org-talamasca
        value: 0
        active: true
        dormant: false
        squaresConsumed: []
        milestones:
          - day: 9
            label: O2M1
            description: >-
              Signal collection: compromised communications can reveal a route. Independent secure channels
              deny this information.
          - day: 6
            label: O2M2
            description: >-
              Extraction permission: Claudia may attempt seizure when opportunity exists. Captivity, lost
              equipment, or changed allegiance blocks it.
          - day: 2
            label: O2M3
            description: >-
              Pack mobilization: the elders act on the case’s known location. The default abbey attack
              requires the case to be there.
      - id: P1
        name: Monsignor Matteo Corvi
        orgSlug: sangreal-npc-corvi
        value: 0
        active: true
        dormant: false
        squaresConsumed: []
        milestones:
          - day: 13
            label: P1M1
            description: >-
              Corvi crosses into Switzerland after the theft. Preserve any route or timing already established
              in play.
          - day: 11
            label: P1M2
            description: Geneva escrow is recorded; Corvi goes to Sonnenberg with a conditional treatment agreement.
          - day: 8
            label: P1M3
            description: >-
              After the clinical outcome, Corvi leaves for Turin seeking protection. If the cell reaches him
              first, follow that custody instead.
          - day: 4
            label: P1M4
            description: >-
              If still free in Turin, he waits in the booth for a contact he can trust. He retains eleven
              unless play changed the count.
      - id: P2
        name: Sister Claudia Vane
        orgSlug: sangreal-npc-vane
        value: 0
        active: true
        dormant: false
        squaresConsumed: []
        milestones:
          - day: 12
            label: P2M1
            description: >-
              Claudia reports through her actual available channel; supervision or a secure communication plan
              can limit what she sends.
          - day: 6
            label: P2M2
            description: >-
              If still an operative, she receives extraction permission and prepares transport. These
              preparations are observable.
          - day: 4
            label: P2M3
            description: >-
              She attempts the Thread only if free, equipped, and able to reach the case. Resolve
              interruption, effect, and pursuit in play.
          - day: 3
            label: P2M4
            description: >-
              If she escaped, she uses the Novara rendezvous. If captured or persuaded, her information can
              instead set up an interception.
      - id: P3
        name: Kurt Hausmann (The Feral Banker)
        orgSlug: sangreal-npc-hausmann
        value: 0
        active: true
        dormant: false
        squaresConsumed: []
        milestones:
          - day: 10
            label: P3M1
            description: If not prevented, treatment is administered at Sonnenberg. Record the exact time.
          - day: 8
            label: P3M2
            description: >-
              Conversion completes 24 hours after treatment. The subsequent ward crisis depends on
              containment; it is not automatic escape.
          - day: 5
            label: P3M3
            description: >-
              If he escaped, he seeks concealment and blood near the forest. A captured or protected Hausmann
              remains where actual play placed him.
      - id: P4
        name: Dr. Elizabeth Graf
        orgSlug: sangreal-npc-graf
        value: 0
        active: true
        dormant: false
        squaresConsumed: []
        milestones:
          - day: 9
            label: P4M1
            description: >-
              After the treatment, Graf preserves slides and a clinical record while seeking protection for
              staff.
          - day: 7
            label: P4M2
            description: >-
              If unprotected, she considers destroying methods that could enable repetition; she prefers an
              accountable safe custodian.
          - day: 4
            label: P4M3
            description: >-
              A Church recovery team threatens any remaining unsecured clinic evidence. Earlier evacuation or
              negotiation prevents a scheduled death.
      - id: P5
        name: The Turin Intermediary
        orgSlug: sangreal-npc-turin-intermediary
        value: 0
        active: true
        dormant: false
        squaresConsumed: []
        milestones:
          - day: 9
            label: P5M1
            description: >-
              The broker takes a conditional deposit from Basarab interests and promises access, not a
              completed transfer.
          - day: 6
            label: P5M2
            description: At Lingotto he proposes a second sale. Corvi refuses; eleven remain.
          - day: 3
            label: P5M3
            description: >-
              If he has learned the current rendezvous, he sells that information unless the cell protects or
              intercepts him.
          - day: 1
            label: P5M4
            description: If still free, he leaves with his fee. His records remain a route to the missing cargo, if any.
      - id: P6
        name: The Basarab Retrieval Pack
        orgSlug: sangreal-npc-basarab-elder
        value: 0
        active: true
        dormant: false
        squaresConsumed: []
        milestones:
          - day: 9
            label: P6M1
            description: >-
              The pack enters the corridor seeking the reserve. It needs observed movements or a contact to
              find it.
          - day: 3
            label: P6M2
            description: >-
              An acquired rendezvous or exposed route allows it to approach. Warn through surveillance or
              local activity where plausible.
          - day: 2
            label: P6M3
            description: >-
              If the default abbey attack is unopposed, one phial breaks and ten leave. All casualties and
              exposure outcomes follow the actual encounter.
          - day: 1
            label: P6M4
            description: >-
              If cargo reaches YR-BAS and no intervention stops it, it departs on the filed slot with the
              actual count.
      - id: P7
        name: The Grey Watcher
        orgSlug: sangreal-npc-watcher
        value: 0
        active: true
        dormant: false
        squaresConsumed: []
        milestones:
          - day: 13
            label: P7M1
            description: >-
              The Watcher follows verified movements and sells observations. He was the default later visitor
              to the vault, not Corvi’s accomplice.
          - day: 10
            label: P7M2
            description: >-
              He records a handoff only if present and able to observe it. No impossible photo appears in an
              HQ packet.
          - day: 2
            label: P7M3
            description: >-
              He leaves a threatened scene or trades a fact for safety. He does not insert himself into
              ordinary C-series photographs.
