    bestCaseResolution: >-
      <p>Recover or verifiably account for the reserve, protect survivors, document wrongdoing, and negotiate
      auditable non-deployment and containment. Prevented tragedies remain prevented. A plane need not leave
      for the mission to succeed.</p>
    worstCaseResolution: >-
      <p>Uncontrolled human exposures, lost vessels, silenced witnesses, or a breakdown of the population
      accommodation. Specify which harm occurred and who now has custody; do not force all harms into every
      branch.</p>
