          casualties and count.
      - day: 1
        description: >-
          M6 — Planned Departure: YR-BAS has a 01:15 slot after the final evening. It departs only if cargo,
          aircraft, crew and clearance remain available. Interception can succeed.
    daNotes: >-
      <h3>Your next session starts here</h3><p><strong>Established continuity:</strong> the investigators
      arrived at the Vatican, researched Vault IX, questioned Gerard, and slept in Vatican guest rooms. They
      have not searched Corvi’s quarters. Those played scenes stand. Do not replay the arrival, erase their
      notes, or announce discoveries they never made. Keep the current world case-board day and filled shifts;
      this rewrite does not reset them.</p><h3>Five-minute preparation</h3><ul><li>Write down exactly what the
      table already knows from Gerard and the vault. Treat everything else as undiscovered, even if an old
      script said it was automatic.</li><li>Have
      @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.5DoANlYa53w4faSv]{I04 — Numerals on Rag
      Paper}, @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.EE4LDI5tCUb9YG9l]{I20 — Safe
      Dial, Drilled}, @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.WNTzWxpF2S7xU230]{I35 —
      Breve Apostolicum, 1582} and
      @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.Hx9jKUQtU1Jmwh2O]{I36 — Suppressed
      Index Card} ready for the apartment. Open
      @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.1xPFy0jFa4uqHScD]{TM03 — Corvi
      quarters arrival} only when they arrive.</li><li>Keep Claudia helpful. Give her one genuinely useful
      action before you give the players a reason to doubt her. Do not perform villainous stillness as a
      tell.</li><li>Choose the current custody state from the ledger on the next page. If your existing clock
      differs from the default route, move future NPC attempts forward coherently rather than retconning
      yesterday.</li><li>Ask each player for one observation from yesterday and one question they intend to
      answer today. Write their questions where you can see them.</li></ul><h3>Morning scene — coffee before
      the inquiry</h3><blockquote><p>The bells arrive before the knock. Someone has left coffee outside your
      door on a tray too small for all the cups. Beyond the guest-room shutters, the Vatican is already at
      work: shoes in the passage, a cart over the paving, a voice asking for a signature. Yesterday there was
      an empty space in a vault. This morning there is a key on the tray.</p></blockquote><p>Claudia brings
      authorized access to Corvi’s quarters and offers to arrange transport once the cell has a destination.
      This is a new offer, not a fact imposed on yesterday. If she has already been detained or excluded at
      your table, Ghiberti brings the key instead. Gerard remains available for clarification through the duty
      desk; do not add a new confession to his previous interview.</p><blockquote><p>Claudia: “His rooms are
      still sealed. They will want a list of what you remove. Would you prefer me to keep it, or one of your
      people?”</p></blockquote><p>Let them choose who controls the record. An agent who takes that job creates
      a real obstacle to Claudia’s later concealment. If asked about the Grail, she answers, “They have not
      given me permission to name what was kept there.” Her actual belief is that an old biological danger
      must be destroyed; she does not yet know the elders’ nature.</p><p>A request for a safety clarification
      reaches Sabbatini. His answer is cautious rather than a fresh supernatural reveal: “The assurance
      applies to sealed custody. Recovery comes first.” This admission matters: the original unqualified
      assurance was misleading. If pressed with a specific contradiction, he will arrange a private
      conversation; use the Council chapter early rather than refusing until the epilogue.</p><h3>Give three
      choices, not a destination order</h3><table><thead><tr><th>Choice</th><th>What it
      accomplishes</th><th>DA response</th></tr></thead><tbody><tr><td>Search the quarters</td><td>Find
      Corvi’s destination and why he left</td><td>Run the apartment chapter.</td></tr><tr><td>Return to
      Gerard/Ghiberti or examine existing samples</td><td>Resolve a question from yesterday</td><td>Answer
      from records and established testimony. This does not consume another whole shift for each
      question.</td></tr><tr><td>Challenge the Church before leaving</td><td>Test the recovery mandate and
      obtain safer handling instructions</td><td>Run an early Council conversation; preserve the unknown
      contents until a witness or record actually reveals them.</td></tr></tbody></table><h3>How to run the
      rest</h3><p>Each location below gives an arrival, a human problem, evidence with limits, likely
      questions, consequences, and exits. The suggested day ranges are the unattended route, not appointments
      the players must keep. Core evidence is found by a sensible search or a cooperative witness. Rolls
      decide time, discretion, collateral damage, and access to guarded extras—not whether the campaign can
      continue.</p><p>End each scene by asking “What does this make you want to do?” If the answer is unclear,
      restate one concrete lead they possess. Do not read the solution aloud. A missed lead returns through a
      credible source: a duplicate bank record, a returned laboratory call, or Corvi seeking contact—not an
      omniscient parcel of every clue.</p><h3>Sharing and images</h3><p>This entire walkthrough is DA-only.
      Read only the blockquotes aloud. Its pictures are selected views, not compulsory events. Share
      individual scenes and cards deliberately. A body photograph must not appear if that person survived. Do
      not share a tactical map merely to establish atmosphere. The scene and photograph appendices retain
      every existing asset.</p><h3>Evidence discipline</h3><p>Use the revised Evidence appendix. Preserve the
      player-approved I04 string and all prior-session testimony. Independent evidence can reveal the truth
      early. The source clock is a default; do not reset the live world’s day or progress. Four operational
      shifts make a day; use 24 elapsed hours, or four board shifts, for human conversion.</p>
    description: >
      <p>Director's master reference for Operation File <strong>SANGREAL-87-091</strong>. DA eyes only —
      contains both twists, both faction tracks, and the full milestone schedule.</p>
