- _id: sangreal-da-brief
  name: 'SANGREAL-87-091 — DA Case Brief'
  type: daCaseBrief
  system:
    caseId: SANGREAL-87-091
    caseName: 'Mission: Sangreal'
    relicTier: 3
    region: 'Region 04 — Western Europe / Italian-Swiss Corridor'
    mysteryStatement: >
      <p>A stolen Vatican diplomatic attaché containing twelve sealed phials of progenitor
      arterial fluid is being brokered across Western Europe under false clerical assurances
      of zero biological risk, while an embedded double agent guides the Covenant cell toward
      a manufactured vampire outbreak — obscuring the truth that the blood is an apex
      biological vector capable of either creating feral predators or permanently purging
      immortal bloodlines.</p>
    realSituation: >
      <p><strong>The truth in plain words.</strong> Twelve phials of blood were taken out of
      circulation in 1582 and sealed in a lead case named <em>Sangreal</em> beneath St. Peter's. The
      blood is not a relic and not a sacrament. It is a cure: a graft that rebuilds marrow and tissue
      and keeps rebuilding them, in the dark, on a falling body temperature, with an appetite for
      plasma that nothing sates. The Church's own histopathology calls it <em>foreign graft — not
      infection</em>.</p>
      <p><strong>Monsignor Matteo Corvi</strong>, Prefect of the Secret Archives, translated the
      Ebionite fragments, understood what the blood was, and decided the Church should not keep it. On
      Day 14 he disabled the vault's electromagnetic cradle with the <em>Lodestone of St. Jude</em>,
      removed the case, and rode north — brokering one phial to a dying man in Zurich
      (<strong>Kurt Hausmann</strong>) and one to a broker in Turin, to fund his road to an Alpine
      monastery. He is not a thief in the ordinary sense: he is a man trying to bury a weapon, and he
      never got the money.</p>
      <p><strong>Cardinal Enrico Sabbatini</strong> engaged the Covenant to recover the case under
      diplomatic secrecy and attached <strong>Sister Claudia Vane</strong> as liaison. Claudia is a
      deep-cover asset of Registry 16, the covert arm of the Talamasca Motherhouse in Amsterdam, whose
      hidden elders are ancient vampire bloodlines. Her orders are to use the Covenant to find Corvi,
      take the case at the first isolated moment, and deliver it to a rendezvous at San Nazzaro for air
      transit to the Carpathians, where the cure will be incinerated. She is running the cell as
      muscle and she has been doing it since Rome.</p>
      <p><strong>The misdirection, stated plainly.</strong> The players will spend ten days certain the
      blood is a demonic plague, and the Zurich material will confirm that reading: Hausmann, cured of
      end-stage cancer in forty-eight hours, becomes photophobic, hypothermic, sleepless and hungry for
      plasma. Nothing in the clinic contradicts them.</p>
      <p><strong>The truth behind it.</strong> The graft is real and the cure works; what the human body
      cannot do is regulate it. The histopathology from Zurich, Corvi's own translation of the Gospel
      of the Twelve, and the two fingers burned to white ash at Novara prove the other half: the same
      fluid that converts a healthy person into a predatory carrier kills an active vampire on contact,
      turning it to ash in minutes. <strong>That is the horror — the cure works, and the people hunting
      it are the ones who are afraid of it.</strong> The hunters are not trying to seize a weapon. They
      are racing to destroy the only substance on Earth that can unmake them.</p>
      <p><strong>Why it matters to both institutions.</strong> Vampirism thins as it is transmitted, and four centuries of transmission have left the dynasties unable to make more of themselves at any worthwhile strength — which is why there has been no war in two hundred years. The Church cannot exterminate them; they cannot renew. The accommodation that results is unwritten and arithmetic: the Church does not hunt, the dynasties do not multiply, and both police their own. The phials are <em>pure</em> blood, and they are the one thing that breaks that arithmetic in either direction — a dynasty restored overnight, or a cure used on the dynasties themselves. The Church fears a rebirth; the dynasties fear an extermination; both fears are correct about the fluid and wrong about each other. That symmetry, not greed, is what kills Claudia at Novara.</p>
      <p><strong>The name.</strong> The case is labelled <strong>Sangreal</strong>, and the word is a trap with two readings. <em>San Greal</em> — the Holy Grail — is the one the players will take, and the Church's refusal to describe the contents exists to encourage it; nobody should correct them. <em>Sang real</em> — royal blood — is the truth, and the case's own evidence re-parses it: twelve phials, a Gethsemane lot, a marrow graft in no known tissue, two calcified fingers, and Corvi's margin note <em>sanguis remedium, non sacramentum</em>. Spend the second reading once, at the Lingotto parley, and not before.</p>
      <p><strong>How it ends.</strong> Claudia snaps <em>The Veil of Veronica's Thread</em> during the
      handling at the Lingotto, blinds the cell, and escapes with the case. The cell tracks her to the
      fortified retreat at San Nazzaro and finds her dead on the dining table — executed by the pack,
      her metacarpals reduced to ash. Ten phials are already loading aboard a Cessna 421 at
      Novara-Cameri; wheels-up at 01:15 closes the case and opens <em>Mission 2: Recover the
      Sangreal</em>.</p>
    primaryObjective: >
      <p>Locate and secure the 1964 steel attaché case and its contents intact before either
      faction does — and prevent any phial from being opened or lost.</p>
    secondaryObjective: >
      <p>Identify the individual who breached Vault IX and determine how its electromagnetic
      mooring systems were bypassed. Establish, without tipping either faction, who the liaison
      actually serves.</p>
    containmentTrigger: >
      <p><strong>CT1 — Trigger.</strong> Introduction into open tissue or mucous membranes.
      Uninfected humans experience mutagenic fever and predatory conversion within six shifts
      (24 hours). In active vampires, it halts necrotic stasis and triggers immediate cellular
      aging, turning them to ash in minutes.</p>
    containmentAppetite: >
      <p><strong>CT2 — Appetite.</strong> Cellular desperation and systemic anemia. Within
      100 meters, unshielded phials emit a psychic pull that accelerates organ failure and
      hemorrhaging in sick individuals, compelling them to consume the fluid.</p>
    containmentQuiescence: >
      <p><strong>CT3 — Quiescence.</strong> Storage in darkness within lead-antimony foil below
      4°C, wrapped in unbleached linen soaked in gall, wine vinegar, and myrrh. Exposure to
      ambient daylight causes the fluid to violently boil and combust into white ash.</p>
    keyActors: >
      <table>
      <thead><tr><th>Player</th><th>Wants</th><th>Will do</th></tr></thead>
      <tbody>
      <tr><td><strong>The Covenant (the cell's own HQ)</strong></td><td>The case recovered and the story
      contained.</td><td>Fund, equip, delay, then blame. Sabbatini is running the recovery through the
      Council as a political instrument, not a rescue.</td></tr>
      <tr><td><strong>O1 — The Holy Alliance (L'Entità)</strong></td><td>Unconditional recovery, total
      public suppression, and retention of the cure as an institutional deterrent.</td><td>Shadow the
      cell, file on it, remove evidence it considers institutional, and sanitise the operation from the
      antechamber if the cell learns too much.</td></tr>
      <tr><td><strong>O2 — The Order of the Talamasca (Registry 16, Amsterdam)</strong></td><td>The
      twelve phials destroyed, with the Order's hands on the fire.</td><td>Read the Covenant's mail,
      run Claudia from Rome, green-light the theft at the Lingotto, and execute her rather than let the
      cure escape.</td></tr>
      <tr><td><strong>Monsignor Matteo Corvi</strong> — the thief</td><td>To bury the phials where no
      institution can reach them, and to be understood.</td><td>Flee, hide, lecture, surrender to the
      right credentials. Never fights; destroys his notes if the Holy Alliance is named.</td></tr>
      <tr><td><strong>Sister Claudia Vane</strong> — the liaison</td><td>The phials burned, and the
      Covenant used up getting them there.</td><td>Lie continuously, stay attached to the case, snap the
      thread at the first isolated moment, then run — never fighting to win, only to escape with it.</td></tr>
      <tr><td><strong>Kurt Hausmann</strong> — the first buyer</td><td>To understand what was done to
      him, and then to eat.</td><td>Talk lucidly in the dark, refuse to leave the ward, and hunt the
      Zurichberg after the break.</td></tr>
      <tr><td><strong>Dr. Elizabeth Graf</strong> — the clinician</td><td>Her research destroyed and her
      family out of the country.</td><td>Administer, record, hide one slide from the cell, burn the
      rest, and lie once about it.</td></tr>
      <tr><td><strong>Cardinal Enrico Sabbatini</strong> — Prefect of the Congregation</td><td>The cure
      back in Church hands and the breach unrecorded.</td><td>Hire, use and discard the Covenant; sign
      nothing until indisputable forensic proof is on his desk.</td></tr>
      <tr><td><strong>The Basarab dynasty</strong> — the buyers</td><td>Ten vessels, flown out of Europe,
      and no survivors who can describe them.</td><td>Buy quietly and often, break off rather than die,
      and remember a face for Mission 2.</td></tr>
      </tbody>
      </table>
    bestCaseResolution: >
      <p>The cell recovers the attaché intact, contains or destroys the escaped vectors under
      CT1–CT3, exposes the Talamasca infiltration, and forces the Holy Alliance into open
      cooperation. The cure ends the case in Covenant custody — or neutralized — rather than in
      the hands of either faction.</p>
    worstCaseResolution: >
      <p>The phials reach the tarmac. Ten intact vessels leave Italy for the Carpathians, where
      an ancient bloodline incinerates the only substance capable of unmaking them. Feral
      carriers multiply across Northern Italy, the Holy Alliance launches a sanitization
      campaign, and the Covenant is left holding the blame for a fire it did not start.</p>
    relicMilestones:
      - day: 10
        description: 'M1 — The Zurich Hand-Off: the attaché surfaces in Zurich. Corvi cuts the seal in a Bahnhofstrasse bank vault and hands Kurt Hausmann the first phial — one vessel gone, and the case is open.'
      - day: 8
        description: 'M2 — The Case Leaves Zurich: Hausmann''s feral break seals the district; Corvi walks the attaché out of the city in the confusion. No custody signatures again until Turin.'
      - day: 6
        description: 'M3 — The Second Sale: the case opens on the Lingotto floor; the Turin intermediary buys the second phial. Two vessels gone, and strangers are handling it now.'
      - day: 4
        description: 'M4 — The Daylight Breach: a droplet from the open case spills during handling and ignites in daylight; the Carabinieri flood the site. The case has been seen.'
      - day: 2
        description: 'M5 — The Novara Slaughter: the retrieval pack hits Claudia''s safehouse, forces the attaché, and walks out with ten phials. The case is spent; the cure is in vampire hands.'
      - day: 1
        description: 'M6 — The Empty Case: the phials are loaded aboard the Cessna 421 on the Novara tarmac. Wheels-up ends the operation and leaves the emptied case behind.'
    daNotes: >
      <h3>How to run this case</h3>
      <p>Read this brief once. Then run from the walkthrough and never open this brief at the table —
      the walkthrough repeats everything a DA needs in the moment, and this document is the reference
      behind it.</p>
      <ul>
      <li><strong>Say the plain thing.</strong> You are never protecting a riddle from the players,
      only from the characters' absence. If the cell asks a question any competent investigator would
      ask, answer it with the fact. The gates in this case buy <em>detail</em>, not the existence of a
      clue — and every card carries an HQ fallback day, so the case can be arrived at late but not
      failed.</li>
      <li><strong>Describe, then stop.</strong> The walkthrough supplies one read-aloud passage per act,
      written to be spoken verbatim. Everything else is yours to paraphrase. Resistance to silence is
      the commonest way a horror case goes flat.</li>
      <li><strong>Play the NPCs as people with jobs.</strong> Nobody in this case is a cultist for its
      own sake: Mercier is a clerk with a debt, Gerard is a sergeant on a stool, Graf is a pathologist
      with a mortgage. The mundane register is what makes the supernatural land — and it is why the
      pack, when it finally arrives, is frightening.</li>
      <li><strong>Reward cleverness before you complicate it.</strong> When the players do something
      smart, let it work, then make the consequences of it interesting. Never punish the table for
      solving your case faster than you planned.</li>
      <li><strong>Protect the two-stage twist, and only the twist.</strong> Zurich is the False
      Revelation: let them conclude that communion was an unholy feast. Turin and Novara are the
      inversion. Hold the palimpsest until the histopathology has landed, and never let an NPC say the
      word <em>cure</em> before the parley at the Lingotto.</li>
      <li><strong>You decide where the material is open.</strong> Where a dossier says <em>you
      decide</em>, invent it, write it down, keep it consistent, and treat the version you invented as
      canon from then on.</li>
      </ul>
      <h3>The peace, and the word</h3>
      <p>Three motives, none of them greed: the Church fears a rebirth of an undiluted bloodline; the dynasties fear the fluid will be used to cure them; and the reason neither side will risk a war is the dilution that has quietly made coexistence cheaper than conflict. Hold both halves of the name in mind at every scene — the players believe they are chasing the Grail, and the Church is content to let them. Full text of both is on the walkthrough's <em>The Case — DA Background</em> page; use that at the table and this brief for reference.</p>
      <h3>What the players must work out</h3>
      <ol>
      <li><strong>The theft was an inside job with two people in it</strong> (Days 14–13): Corvi took
      the case out; somebody with an ouroboros ring went in behind him; a nun was forty metres back in
      the corridor and no report mentions her.</li>
      <li><strong>The case was bought before it was stolen</strong> (Days 12–9): a Church escrow
      account, a Vaduz trust, a Zurich clinic and a dying man — arranged weeks ahead.</li>
      <li><strong>The blood is a cure, and the cure kills the cure's hunters</strong> (Days 8–5):
      histopathology, the calcified fingers, the daylight test, Corvi's margin note.</li>
      <li><strong>The Covenant's own escort has been working for the Order the whole time</strong>
      (Days 4–1): the ledger page, the embossed stamp, the telex dispatch, the snapped thread — all of
      it on the table since Geneva for anyone who looked.</li>
      </ol>
    description: >
      <p>Director's master reference for Operation File <strong>SANGREAL-87-091</strong>.
      DA eyes only — contains both twists, both faction tracks, and the full milestone
      schedule.</p>

- _id: sangreal-player-brief
  name: 'Operation File SANGREAL-87-091 — Player Dossier'
  type: playerCaseBrief
  system:
    caseId: SANGREAL-87-091
    caseName: 'Mission: Sangreal'
    region: 'Region 04 — Western Europe / Italian-Swiss Corridor'
    classification: RESTRICTED
    situationSummary: >
      <p>At 04:00 hours yesterday, the Holy Alliance — the diplomatic and security office
      of the Holy See — requisitioned emergency Covenant field recovery aid under the terms
      of the St. John Custodial Concordat.</p>
      <p>Subterranean Vault IX, located beneath the Campo Santo Teutonico in Vatican City,
      was breached. A customized brushed-steel diplomatic attaché case, manufactured in 1964
      and reinforced with lead-antimony shielding, was removed.</p>
      <p>The Holy See refuses to describe the contents of the attaché, and will provide no
      further information. The single detail on record: a tarnished brass sign fixed below
      the electromagnetic mooring plinth where the case was stored in Vault IX, reading one
      word — <strong>SANGREAL</strong>. Church officials decline to explain it. The Holy See
      guarantees the following:</p>
      <ul>
      <li>The artifact generates zero bio-contamination risk.</li>
      <li>The artifact poses zero occult memetic or psychic radiation hazard.</li>
      <li>The artifact must remain sealed; field testing or opening the container is
      strictly prohibited under pontifical treaty.</li>
      <li>Full legal and operational custody must be remanded to Church authorities
      immediately upon recovery.</li>
      </ul>
    primaryObjective: >
      <p><strong>Primary:</strong> Locate and secure the 1964 steel attaché case and its
      contents intact.</p>
    secondaryObjective: >
      <p><strong>Secondary:</strong> Identify the individual who breached Vault IX and
      determine how its electromagnetic mooring systems were bypassed.</p>
    knownOrganizations: >
      <p><strong>The Holy Alliance.</strong> The diplomatic and security office of the Holy
      See. Your contracting authority for this operation; handles the case as a diplomatic
      matter and expects discretion.</p>
    initialContacts:
      - name: 'Cardinal Enrico Sabbatini'
        role: 'Contracting authority — Congregation for the Doctrine of the Faith'
        knownInfo: 'Signed the emergency requisition. Your point of authority for the case; treats it as a diplomatic incident, not an occult one.'
      - name: 'Sister Claudia Vane'
        role: 'Ecclesiastical liaison'
        knownInfo: 'Must accompany all inquiries on church property. Holds diplomatic transit papers, pontifical seals, and local banking clearances.'
      - name: 'Father Ghiberti'
        role: 'Curial archivist — Subterranean Vault IX'
        knownInfo: 'Nervous, precise. Knows the vault inventory and its custodial history better than anyone alive.'
      - name: 'Gerard, Vatican Gendarme Duty Officer'
        role: 'Campo Santo Teutonico gate detail'
        knownInfo: 'Controls access to the German Cemetery entrance and logs every descent to the vault level.'
      - name: 'Petra, Covenant Logistics Officer'
        role: 'Recovery Division — Region 04 desk'
        knownInfo: 'Your supply line for field gear, vehicles, and safehouses across the Italian-Swiss corridor.'
      - name: 'Stephan, Wayfinder Remote-Sensing Analyst'
        role: 'Covenant HQ — monitoring wing'
        knownInfo: 'Holds the last stable readings from Vault IX; can task follow-up analysis through a request packet.'
    startingLeads: >
      <p><strong>Vault IX</strong> — the Campo Santo Teutonico entrance beneath St. Peter's.
      <strong>Monsignor Corvi's private quarters</strong> — the Palazzo del Sant'Uffizio,
      where the Prefect of the Secret Archives lived and worked.</p>
    timelinePressure: >
      <p>Secular authorities have not been alerted. The Covenant has a narrow operational
      window before Italian Carabinieri and Swiss border guards detect irregular cross-border
      travel.</p>
    constraints: >
      <ul>
      <li>Sister Claudia Vane must accompany the field cell during all inquiries conducted
      within church properties and ecclesiastical jurisdictions.</li>
      <li>The attaché must remain sealed — no field testing, no opening, under pontifical
      treaty.</li>
      <li>Custody of the attaché remands to Church authorities immediately upon recovery.</li>
      <li>No secular law enforcement, international media, or hostile criminal syndicates
      may obtain custody of the container.</li>
      </ul>
    description: >
      <p>Player-facing dossier for Operation File <strong>SANGREAL-87-091</strong>.
      Issue to the cell at the start of the case. Contains no spoilers beyond the Holy
      See's official guarantees.</p>

