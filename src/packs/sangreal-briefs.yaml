  system:
    caseId: SANGREAL-87-091
    caseName: 'Mission: Sangreal'
    relicTier: 3
    region: Region 04 — Western Europe / Italian-Swiss Corridor
    mysteryStatement: >-
      <p>A stolen reserve of undiluted blood threatens a peace built on diluted vampire inheritance. The
      Church fears new potent lines; the elders fear imposed mortality. The cell must find the blood,
      establish what happened to its first recipient, and choose a custody that does not turn recovery into
      deployment.</p>
    realSituation: >-
      <h3>The case in one paragraph</h3><p>The Vatican has lost twelve phials of undiluted blood. A fragile
      accommodation with vampire houses depends on their inability to expand without thinning their own power.
      The Church fears that this pure source could start new, potent lines outside that limit. The old houses
      fear a different possibility: Rome might forcibly “cure” them, ending the condition that keeps centuries
      of age at bay. Corvi steals the reserve to prevent its use as a weapon, then authorizes one reckless
      treatment to finance an escape and prove that the blood can heal. Hausmann’s transformation destroys
      that hope. Claudia, convinced she is preventing an outbreak, helps the investigators find Corvi while
      secretly arranging to deliver the blood to elders who intend to burn the threat to
      themselves.</p><h3>The name is the first invitation</h3><p><strong>San Greal:</strong> the expected Holy
      Grail reading. Church custody, ritual language, secrecy, and a missing sacred object all support the
      players’ assumption. Nobody needs to falsely confirm a cup. Sabbatini says “the entrusted contents”;
      Ghiberti says “the custody”; Claudia says “what was sealed.” Let the players supply the
      Grail.</p><p><strong>Sang Real:</strong> the blood reading—blood royal, treated by these custodians as
      holy blood. This is the mission’s play on words, not a language exam. Use the user’s intended “holy
      blood” sense as ecclesiastical meaning rather than claiming “real” literally translates as “holy.” A
      player who spots blood on the first morning is correct and gets useful traction. Neither the narrator
      nor a frightened NPC needs to withhold the word until a designated act.</p><blockquote><p>Corvi, if the
      players have not already made the connection: “You put the break after the saint. Put it after the
      blood. They let you look for a cup because a cup cannot breed.”</p></blockquote><h3>The peace is
      practical, not benevolent</h3><p>The houses police uncontrolled feeding and unauthorized turning; the
      Church refrains from a general hunt and conceals incidents it can contain. Ordinary people are not
      parties to the bargain. Each new turning divides an already diminished inheritance: expansion now costs
      a house strength it cannot readily replace. This arithmetic, more than friendship, makes coexistence
      preferable to war. The phials threaten the arithmetic. A new human recipient can become a powerful
      predator without drawing on an existing house’s depleted blood. Whether such a new line could be
      stabilized and propagated is unproven; the demonstrated conversion is already enough to make the Church
      fear a rebirth. Do not invent a safe way for elders to drink the source and become stronger: for an
      existing vampire, the same fluid is a
      purge.</p><table><thead><tr><th>Faction/person</th><th>Fear</th><th>What it does at the
      table</th><th>What can change its conduct</th></tr></thead><tbody><tr><td>Sabbatini / Holy
      Alliance</td><td>New potent predators make the current limits meaningless; a rival may force a general
      war</td><td>Demands sealed custody, tracks recipients, restricts transit, pressures witnesses</td><td>A
      credible joint containment plan, documented inventory, protection from public panic, independent
      witnesses to any transfer</td></tr><tr><td>Registry 16 / Basarab elders</td><td>Rome can end their
      condition by force; the theft looks like preparation for deployment</td><td>Uses mortal intermediaries,
      orders incineration, keeps bare skin away from the blood</td><td>Verified destruction or supervised
      neutral custody may buy a pause; no trust in Rome’s promise alone</td></tr><tr><td>Corvi</td><td>The
      reserve becomes a weapon; then his own attempted healing creates the threat he fled</td><td>Leaves a
      route to his research, lies about how certain he was, refuses an unaccountable return</td><td>Admit
      Hausmann matters, preserve records, propose independent custody</td></tr><tr><td>Claudia</td><td>A
      relapse into uncontrolled vampirism that her Order taught her to prevent</td><td>Opens doors, protects
      civilians, secretly reports and prepares extraction</td><td>Proof her handlers serve the threatened
      elders plus an alternative she can believe will contain the blood</td></tr><tr><td>Graf /
      Hausmann</td><td>Responsibility for the experiment / imminent death</td><td>Graf seeks safety and
      accountability; Hausmann first seeks help, then struggles with hunger</td><td>Specific protection and
      medical caution, not a sermon about monstrosity</td></tr></tbody></table><h3>What the blood does: three
      kinds of
      evidence</h3><table><thead><tr><th>Status</th><th>Truth</th></tr></thead><tbody><tr><td>Established in
      play by the clinic</td><td>One treated human loses his cancer and develops predatory physiology. This
      does not establish the origin of a religion or the outcome for every possible
      recipient.</td></tr><tr><td>Established by comparative evidence</td><td>The same vector attacks vampiric
      stasis. I09 supplies the human mechanism; I12 is a historical claim; I38 or direct observation supplies
      physical vampire evidence. Similar-looking ash alone is not a diagnosis.</td></tr><tr><td>Relic
      mechanics for the DA</td><td>CT1 activates through open tissue or mucous membranes; human conversion
      takes 24 elapsed hours. On the four-shift case board that is four shifts. Existing vampires use the
      artifact’s Endure Difficulty 5 outcome: failure brings ash in three rounds; success leaves a mortal with
      organ failure. CT2 operates within 100 m when unshielded. CT3 is darkness, lead-antimony, below 4°C,
      treated linen. Preserve the existing artifact bonuses and fracture
      table.</td></tr></tbody></table><p>The apocryphon attributes the source to Christ and speaks of unmaking
      a curse. It is evidence of what its author believed, not a laboratory proof of divine biography. Let the
      players debate theology. The operational discovery is sufficiently concrete: the danger depends on the
      recipient. The elders call forced mortality a killing; the Church calls keeping the reserve deterrence.
      Neither word settles the ethics.</p><h3>Before the investigators arrived</h3><ul><li>Months earlier,
      Corvi translated the suppressed text and found memoranda contemplating coercive use of the reserve.
      Sabbatini keeps contingency options open; he has not authorized the theft or the Swiss injection. Corvi
      knows those are not the same thing and fears the distinction will not last.</li><li>Corvi approached
      Hausmann’s representatives before the theft. The CHF 500,000 is a conditional escrow routed through a
      dormant ecclesiastical trust Corvi can access—not proof the whole Church commissioned an experiment. He
      promised one speculative treatment to buy protection and fund a remote refuge. It was a deliberate moral
      failure, not an innocent accident.</li><li>Claudia’s Registry assignment predates the breach. She
      searched Corvi’s room for the research during his absence and arranged a Geneva records inquiry. Her
      current presence beside the cell does not require impossible simultaneous travel: the earlier bank visit
      preceded her liaison assignment.</li><li>Corvi used the Lodestone to release the entire closed attaché.
      The vault held a case cradle, not eleven exposed phials. The Grey Watcher entered later to record the
      breach and confirm Corvi had succeeded; he did not help Corvi operate the cradle. Gerard’s actual
      testimony at your table remains authoritative.</li></ul><h3>Custody ledger — count physical vessels, not
      orders</h3><table><thead><tr><th>State</th><th>Intact vessels</th><th>Where the missing contents
      went</th></tr></thead><tbody><tr><td>Vault / theft</td><td>12</td><td>None</td></tr><tr><td>Hausmann
      treated</td><td>11</td><td>Phial 1 consumed in the treatment; Graf retained trace material on slides and
      in test apparatus</td></tr><tr><td>Turin negotiation</td><td>11</td><td>The proposed second sale fails.
      An offer or invoice is not delivery. Corvi refuses once Hausmann’s condition is
      known</td></tr><tr><td>Unopposed Novara breach</td><td>10</td><td>One of those eleven breaks during the
      struggle. Ten remain for the aircraft</td></tr><tr><td>After player intervention</td><td>Record the
      actual count</td><td>Any prevented injection, spill, seizure, or recovered vessel changes the ledger and
      supersedes a preprinted planned manifest</td></tr></tbody></table><p>Do not subtract another whole
      vessel for Graf’s daylight test; it uses residue from the clinical sample. The default Turin daylight
      scare is a threatened exposure or a failed latch, not a mandatory third lost phial. The 10/12 marking in
      I44 is the default post-Novara inventory. If players prevent events, describe a corrected manifest
      instead of presenting a contradictory photograph as current evidence.</p><h3>The default clock: what
      happens only if nobody changes it</h3><table><thead><tr><th>Day remaining</th><th>Attempt /
      condition</th><th>Useful signal</th></tr></thead><tbody><tr><td>14–13</td><td>Theft discovered; Corvi
      crosses into Switzerland; cell begins inquiry</td><td>Already played in this campaign: preserve the
      session record</td></tr><tr><td>11</td><td>Geneva escrow and onward travel</td><td>Bank can identify the
      intended clinic even before treatment</td></tr><tr><td>10</td><td>Hausmann receives first phial if no
      one intervenes</td><td>Graf can still be reached; an early cell can stop the
      procedure</td></tr><tr><td>9–8</td><td>Conversion completes after 24 hours; ward crisis deepens; Corvi
      heads to Turin</td><td>Calls for help, staff absences, intercept I08</td></tr><tr><td>7</td><td>Church
      attempts restrictive transit measures</td><td>Petra warns of checks before they cost the cell
      time</td></tr><tr><td>6</td><td>Broker attempts second purchase; Claudia receives extraction
      permission</td><td>Corvi refuses the sale; an intercepted message exposes the
      plan</td></tr><tr><td>4–3</td><td>Claudia attempts theft if free, equipped, and trusted; Church moves on
      clinic if evidence remains</td><td>Rosary/vehicle/route preparations, visit from security, warning
      call</td></tr><tr><td>2, late evening</td><td>If Claudia has delivered the case to the abbey, pack
      attacks at about 23:45</td><td>Gate watch, broker information, a rendezvous message</td></tr><tr><td>1,
      01:15</td><td>If cargo and aircraft are ready, planned flight departs</td><td>I15 is filed intent, not
      immunity to intervention</td></tr></tbody></table><p>The 22:15 toll stub and approximately 23:45 attack
      belong to the same final evening in the unattended branch. Claudia may have reached Novara earlier; that
      stub records her last local road movement, not necessarily a direct drive from Turin. The aircraft
      departs in the following early hours. Day boxes are planning markers; actual scene time controls a
      chase. Do not trigger this sequence twice because both a person track and faction track mention it.</p>
    primaryObjective: >
      <p>Locate and secure the 1964 steel attaché case and its contents intact before either faction does —
      and prevent any phial from being opened or lost.</p>
    secondaryObjective: >
      <p>Identify the individual who breached Vault IX and determine how its electromagnetic mooring systems
      were bypassed. Establish, without tipping either faction, who the liaison actually serves.</p>
    containmentTrigger: >-
      <p>CT1 — open tissue or mucous membranes; human conversion over 24 hours (four case-board shifts).
      Vampire exposure resolves Endure Difficulty 5: failure brings ash in three rounds; success leaves a
      mortal with organ failure.</p>
    containmentAppetite: >
      <p><strong>CT2 — Appetite.</strong> Cellular desperation and systemic anemia. Within 100 meters,
      unshielded phials emit a psychic pull that accelerates organ failure and hemorrhaging in sick
      individuals, compelling them to consume the fluid.</p>
    containmentQuiescence: >
      <p><strong>CT3 — Quiescence.</strong> Storage in darkness within lead-antimony foil below 4°C, wrapped
      in unbleached linen soaked in gall, wine vinegar, and myrrh. Exposure to ambient daylight causes the
      fluid to violently boil and combust into white ash.</p>
