    daNotes: >-
      <h2>Start Here — Aboard the Train to Geneva</h2><p><strong>Resume the actual campaign here.</strong> The
      investigators have left Rome and boarded the train. They have gathered evidence pointing to Geneva and
      suspect UBS. Preserve their exact discoveries, the current date and filled shifts, and Claudia’s actual
      standing with the party. Do not replay Rome or announce that they already know Hausmann, the box number,
      or the clinic unless they earned those facts.</p><h3>Five-minute preparation</h3><ol><li>Put the
      players’ existing evidence in front of you. Mark which of GENEVA, UBS, HAUSMANN and 4409-C they have
      actually established. Their present Geneva/UBS lead is sufficient to begin.</li><li>Open <strong>Corvi’s
      Rooms and Geneva — Follow the Bargain</strong> and jump to <strong>The train out of Rome</strong>. The
      earlier apartment material is reference only.</li><li>Use the current-session state: Hausmann has
      already received one phial before the Geneva inquiry; conversion will have completed by clinic arrival.
      Corvi has left Sonnenberg with eleven. The players learn those facts through sources, not a DA
      announcement. Warnings prevent further use and improve patient care; the Church did not know of Corvi’s
      experiment.</li><li>Prepare
      @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.lOsCniEBTy2c974w]{I06 — The Escrow
      Transfer Slip} and its separate bank statement, Mercier’s answers, and Petra’s Sonnenberg briefing.
      These are the essential scene materials.
      @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.6RWEHDPMeZJFj86J]{I23 — Night
      Deposit}–@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.SI5TGjifT8qC6Epu]{I26 — Corvi
      at Cornavin} and F07 are optional corroboration. Do not hide a required name in an unreadable
      picture.</li><li>Choose the cell’s next practical contact opportunity: a station telephone during a
      stop, an already established secure radio, or a telephone on arrival at Cornavin. Give a clear callback
      arrangement. No modern mobile-phone access is assumed.</li></ol><h3>The session in six
      beats</h3><table><thead><tr><th>Beat</th><th>Players do</th><th>They leave
      with</th></tr></thead><tbody><tr><td>1. Train from Rome</td><td>Compare the Rome evidence, hear
      Claudia’s volunteered telephone inquiry, and ask Petra to verify the Geneva contact.</td><td>A UBS
      branch appointment or a precise desk to approach, and a way to ask HQ for help.</td></tr><tr><td>2.
      Geneva reception</td><td>Give Corvi’s name and a concrete reason for the inquiry; ask for the clerk who
      handled his visit.</td><td>Jean-Paul Mercier and a private conversation. A key or account number helps
      identify a file; it is not access authority.</td></tr><tr><td>3. Mercier’s problem</td><td>Explain their
      purpose and offer a verifiable safeguard for his testimony, or use the trust’s formal
      request.</td><td>The escrow copy, the name Kurt Hausmann, and Sonnenberg Privatklinik. No essential clue
      depends on winning one roll.</td></tr><tr><td>4. Follow the transaction</td><td>Ask who supplied the
      specimen and where he went.</td><td>Mercier’s witnessed booking account, followed by Graf’s returned
      call confirming that Corvi attended, treatment happened and he departed. Give
      @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.jCO2OHblFeteicpl]{I49 — Petra Fax —
      Graf’s Returned Call} only after that call succeeds.</td></tr><tr><td>5. Petra’s
      briefing</td><td>Request clinic background, a contact, transport and appropriate support.</td><td>A
      location, approach, Dr. Elizabeth Graf’s name, a medical-supplier introduction, and the limits of HQ
      knowledge.</td></tr><tr><td>6. Departure</td><td>Choose the purpose of their clinic visit and preserve
      the bank evidence.</td><td>Tickets from Geneva to Zurich, onward road transport to Sonnenberg, and a
      specific next conversation.</td></tr></tbody></table><h3>The answers the DA must keep
      straight</h3><p><strong>Hausmann:</strong> the paying patient at Sonnenberg, not the bank clerk and not
      a physician. <strong>Corvi:</strong> the supplier who travels there with the case; the bank proves his
      intended destination, while Graf’s actual callback or clinic records establish his attendance and
      departure. A pending callback is still unconfirmed knowledge for the players. <strong>Mercier:</strong>
      handled the paperwork, saw the closed case and arranged Corvi’s onward journey; he never examined the
      specimen. <strong>Petra:</strong> can research a public clinic and arrange contacts; she cannot remotely
      reveal an unrecovered medical chart.</p><p><strong>The bank bargain:</strong> CHF 500,000 into an
      ecclesiastical escrow account in Vaduz, handled through UBS, for one of twelve specimens and an
      experimental oncology treatment. The bank retains the documents. Corvi leaves with the physical case. A
      file reference is not a statement that the Sangreal remains in a bank vault.</p><h3>Image discipline for
      this
      session</h3><p>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.lOsCniEBTy2c974w]{I06 —
      The Escrow Transfer Slip} now visibly names Hausmann, Corvi and Sonnenberg alongside the escrow terms;
