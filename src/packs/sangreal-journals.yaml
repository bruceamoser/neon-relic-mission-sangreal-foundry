- _id: sangreal-journal-bridge
  name: 'The Tarmac at Novara-Cameri — Mission 2 Bridge'
  type: journalEntry
  pages:
    - name: 'The Tarmac'
      type: text
      text:
        content: |
          <h2>The Tarmac at Novara-Cameri</h2>
          <p>When the cell follows the flight manifest to the Novara-Cameri military airfield, they find an abandoned hangar. Rain beats against discarded fueling lines (bed: <audio controls preload="none" style="height:1.7em;vertical-align:middle" src="modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-storm-wind.mp3"></audio> <em>Storm wind</em>) — show it as they reach the doors (show scene @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.tlrpaGAGQo3Qhk98]{TM13 — Abandoned airfield hangar}).</p>
          <p>Then walk them out onto the apron and put the ground down for the last beat of the mission (show map @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.lGukiMcNwlfc2Wh3]{BM09 — Hangar and apron}): the hangar floor and the empty cradle, the dispatch annex, the fuel bowser under the floodlights, the fence line and the gatehouse at the far edge. The Cessna 421 Golden Eagle departed forty minutes earlier, climbing through storm clouds over the Alps into Eastern European airspace. Radar contact was lost as the aircraft crossed into Romanian territory under a falsified commercial corridor.</p>
          <p>Ten intact phials of the <em>Twelve Phials of Gethsemane</em> remain in the hands of an ancient vampire retrieval cell belonging to the Basarab dynasty — a foundational Wallachian bloodline that has influenced European statecraft for centuries.</p>
          <p>The shattered tenth phial at the Novara safehouse revealed their motive: the blood of Christ is an immediate biological execution order for active vampires. They do not seek to drink it; they intend to transport it to a private sanatorium in the Carpathian Mountains and incinerate every droplet in an industrial furnace, extinguishing their only natural predator forever.</p>

    - name: 'The Concordat Requisition'
      type: text
      text:
        content: |
          <h2>The Concordat Requisition</h2>
          <p>Returning to Rome, the agents enter the Palace of the Holy Office. The pretenses of the Holy See have collapsed. Cardinal Sabbatini stands before the open rain-streaked windows overlooking St. Peter's Basilica.</p>
          <blockquote>
          <p>"You have seen the ash upon the floor at Novara," the Cardinal states, placing a pouch of diplomatic passports upon the table. "You understand what lies within that steel case. For two thousand years, Rome has told the world that the blood was shed for their salvation. We never revealed whose death it was intended to buy."</p>
          </blockquote>
          <p>He signs and pushes forward the official <strong>Concordat Requisition Order</strong>:</p>
          <blockquote>
          <p>"The Basarab house believes they have won. They believe they can incinerate the Blood of Golgotha and rule the shadows of Europe without fear of the grave. The Holy See cannot deploy military divisions across the Iron Curtain. But your Covenant recognizes no borders. Requisition whatever equipment you require from our sub-vaults. Fly to Cluj-Napoca. Track that aircraft into the mountains. Recover the Sangreal... or ensure that every monster in that house drinks from the cup."</p>
          </blockquote>
    - name: 'Mission 2: Recover the Sangreal'
      type: text
      text:
        content: |
          <h2>Mission 2: Recover the Sangreal</h2>
          <p>The campaign shifts into <strong>Mission 2: Recover the Sangreal</strong>, transitioning from the urban investigative corridors of Western Europe into the Cold War espionage, fortified mountain keeps, and ancestral horrors of the Carpathian wilderness.</p>
          <ul>
            <li><strong>Theater:</strong> Romania — Cluj-Napoca, the Apuseni foothills, and a private Basarab sanatorium.</li>
            <li><strong>Opposition:</strong> the Basarab Elder and its retrieval pack (see Cast &amp; Antagonists), plus whatever mortal authorities the dynasty owns.</li>
            <li><strong>Assets:</strong> the Concordat Requisition (diplomatic cover, weapons clearances, funding), the Lodestone of St. Jude if recovered, and the Covenant's own capabilities.</li>
            <li><strong>Stakes:</strong> ten phials. The cure is the only weapon that can end vampire elders — and the only thing they fear. Recover it, use it, or burn it: the choice belongs to the cell.</li>
          </ul>

- _id: sangreal-journal-walkthrough
  name: 'SANGREAL-87-091 — DA Walkthrough'
  type: journalEntry
  pages:
    - name: 'How to Use This Walkthrough'
      type: text
      text:
        content: |
          <h2>DA Walkthrough — Mission: Sangreal</h2>
          <p><strong>DA eyes only.</strong> This is the day-by-day walkthrough of the case, written in play order: what the cell walks into, who they meet, what they can find, and the easter eggs hidden in each information card's artwork. It assumes the board runs Day 14 down to Day 1 and that the escalation schedule in the DA Case Brief is live.</p>
          <h3>The three acts</h3>
          <ul>
            <li><strong>Act I — Rome (Days 14–11):</strong> the investigation opens at Vault IX and Corvi's quarters; the Geneva thread surfaces; the trail leaves Italy.</li>
            <li><strong>Act II — Geneva &amp; Zurich (Days 11–7):</strong> the escrow, the first sale, the Sonnenberg clinic — the False Revelation lands here.</li>
            <li><strong>Act III — Turin &amp; Novara (Days 6–1):</strong> the Lingotto, the daylight breach, Claudia's betrayal, the slaughter, the empty tarmac — the Paradigm Inversion lands here.</li>
          </ul>
          <h3>How to run a day</h3>
          <p>Every day page is a script. Run it top to bottom: each numbered <strong>beat</strong> is one scene at the table — narrate or paraphrase it, follow its call-outs, then move to the next beat.</p>
          <ul>
            <li><strong>Inline sound players</strong> — a beat that cues sound carries a small <strong>play button</strong> for that track: hit it as you reach the line. The same tracks, mapped to their beats, are listed with players on the <strong>Sound Effects — Cue Sheet</strong> page; the looping beds live in the <strong>Sangreal Sound Effects</strong> playlist (shared playback for the whole table).</li>
            <li><strong>(show scene …)</strong>, <strong>(show map …)</strong> and <strong>(show cast card …)</strong> are clickable links to the compendium originals: click one and its sheet opens with the art full size for the table. When you want the art on the players' screen, activate the matching installed world scene instead — the complete set, and how to install it, is on the <strong>Scene Art — GM Index</strong> page.</li>
            <li><strong>Cards are linked where the players find them.</strong> When a beat says the sweep turns up a card, open it and hand it over. The <em>Egg:</em> line under each card is the detail hidden in the artwork — that is what a player who studies the image should be rewarded for spotting.</li>
            <li><strong>Off camera — deliver as news:</strong> what happens that day regardless of the cell. Deliver it second-hand — a courier report, a police band, a rumor.</li>
            <li><strong>If the cell stalls:</strong> the fallback packet days. Anything found by searching costs at most one shift, and no single failed roll should ever gate the case.</li>
          </ul>
          <h3>The images</h3>
          <p>All forty-five information cards carry finished artwork, as do every cast card and relic — and the scene set: sixteen theater-of-the-mind views, ten gridless maps, and the landing page. Scene call-outs sit inside the beats, at the moment the art should go up; the full set is catalogued on the Scene Art — GM Index page. When a player lingers on an image, answer with the egg, not the summary.</p>
          <h3>Spoiler discipline</h3>
          <table>
            <tr><th>Twist</th><th>May land from</th><th>Evidence</th></tr>
            <tr><td>False Revelation — the blood is an unholy feast</td><td>Day 10 (Zurich)</td><td>I7, I11, I27–I31 (the feral banker)</td></tr>
            <tr><td>Paradigm Inversion — the blood is a cure</td><td>Day 6, firmly Day 2</td><td>I9, I12, I32, I38 (histology, palimpsest, ash fingers)</td></tr>
          </table>
          <h3>Pressure valves</h3>
          <p>If the cell is ahead of the clock, advance the off-camera tracks a day early — let them overhear a police band mention Sonnenberg, or find the Watcher's newspaper twice. If the cell is behind, hold person tracks and shift fallback packets forward by one day. The milestones themselves never move: the hand-off happens Day 10, the case leaves Zurich Day 8, the second sale Day 6, the breach Day 4, the slaughter Day 2, wheels-up Day 1.</p>

    - name: 'Days 14–13 — Rome: The Empty Plinth'
      type: text
      text:
        content: |
          <h2>Days 14–13 — Rome: The Empty Plinth</h2>
          <p><strong>Off camera — deliver as news:</strong> the breach already happened; the cell arrives after the fact. Monsignor Corvi crosses into Switzerland at Chiasso with the attaché and checks into a Geneva pension under his own name (P1); a grey raincoat reads the same newspaper in three cities this week (P7).</p>
          <h3>Beat 1 — The descent to Vault IX (L1)</h3>
          <p>Open in St. Peter's. Sister Claudia Vane (show cast card @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.AArBxHFCdC7qBCke]{N2 — Sister Claudia Vane}) badges the cell through the Longinus Crossing Pier and takes them down. Play the lift on the way — the hydraulic cage groaning through forty feet of rock (play <audio controls preload="none" style="height:1.7em;vertical-align:middle" src="modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-vault-lift-descent.mp3"></audio> <em>Vault lift descent</em>) (show scene @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.e5iULuABev6xj4n0]{TM01 — Hydraulic lift vestibule and descent}). When the doors open, hold on the room before anyone speaks, then show it: octagonal Roman brick faced in lead, refrigeration lines sweating at 2°C, the black granite altar, the empty mooring plinth — and the tarnished brass sign below it, one word: <strong>SANGREAL</strong> (show scene @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.fk4iveJh9oz2DMDa]{TM02 — Vault IX arrival}). Let the players find the sign themselves; nobody says the word for them.</p>
          <h3>Beat 2 — The sweep (Day 14, one shift)</h3>
          <p>Working the chamber turns up, in whatever order the cell works it:</p>
          <ul>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.9VyBQIhDJHgbR5PF]{I1 — The Burnt Electromagnet Relay}, from the altar and cradle. Egg: sulfurous residue glitters inside the slag; the mooring plinth is scorched <em>from beneath</em> — the failure came up through the cradle, not down from the room. Confirms an occult artifact was used, and names the method: the vault was never opened, it was <em>coaxed</em>.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.MH3cXgf0hGIZzcO3]{I2 — CCTV Reel #87-04}, handed over by the Vatican gendarme duty officer (show cast card @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.FqVBUVA5DaDSClZ4]{N12 — Vatican Gendarme Duty Officer}). Egg: in the puddle beside Corvi the <em>case</em> throws an opaque pitch-black shadow while Corvi himself casts only a faint one; a green railway pass juts from his coat; at the frame's far left a nun's veil catches the lamp light forty metres behind him — a witness no report mentions.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.msJvTkZUJb1CBYqF]{I19 — The Name Below the Plinth}, on close inspection — no roll. Egg: a case-shaped scratch outline in the granite beneath the empty plinth proves the case was repeatedly seated and removed — it was opened in situ more than once; the brass SANGREAL plaque predates the 1964 case entirely.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.gpEG58FggEY1toq2]{I18 — Second Descent}, from the reel or the gendarme ledger; the Wayfinder analyst (show cast card @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.fFnKTEu53aLjQVAF]{N14 — Wayfinder Remote-Sensing Analyst}) can corroborate it independently if asked whether the vault "was disturbed twice." Egg: on the descending figure's hand, a signet ring carrying an eye-in-ouroboros device; the lift indicator behind shows the platform already called from below — someone was inside the vault when Corvi left. The clock reads 04:02.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.1XbUUYGspeQ02iZH]{I3 — The Excised Codex Register}, pressed out of Father Ghiberti (show cast card @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.ooO1Z311YRSrDjVf]{N6 — Father Ghiberti}). Egg: the excised stub shows shelf-mark MS-Vat-Heb-418, and the red card reads <em>Extractum per Breve Apostolicum — Anno Domini 1582 — Ad Capsam XII-SANG-00</em>. The red card has no dust: someone re-filed it recently. Forward-links I35.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.auf7Uqb4VPNc9Hp7]{I5 — The Watcher's Hallmark}, on the casing's paperwork trail (<em>no fallback — must be earned</em>). Egg: three locations circled faintly in pencil — Geneva, Zurich, Turin — the operational clock plotted before the cell had a case file; a second fainter impression beside the stamp shows it has been used many times.</li>
          </ul>
          <p>If the cell sweeps the vault tactically, put the plan down and read it with them (show map @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.FyPnU7Tmzk9RJebD]{BM01 — Vault and lift vestibule}): the lift vestibule is the south door, the altar sits on its dais at the centre of the octagon, the scorched cradle and cable runs follow the east wall, and the machinery store is the north-east room. The plan is layout only — no walls, lights, or tokens are authored, so place anything you need by hand.</p>
          <h3>Beat 3 — Corvi's quarters (Day 13, L2)</h3>
          <p>With the search authorized, the gendarmes admit the team under Claudia's escort — and the apartment tells its own story: drawers searched with academic precision, nothing taken, the safe behind Saint Sebastian drilled cleanly through the spindle (show scene @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.1xPFy0jFa4uqHScD]{TM03 — Corvi quarters arrival}). A patient search (Research undertaking) finds:</p>
          <ul>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.5DoANlYa53w4faSv]{I4 — The Polybius Vulgate Cipher}, on the desk. Egg: the blotter's mirror-writing reads GENEVA and 4409 in reverse — two cipher answers already on the desk; a Roma Termini ticket corner pokes out beneath the blotter (his departure, and I26's destination).</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.cs4mFCPQYvft88T1]{I22 — The Archive, 1962}, in the drawer. Egg: the older prelate beside young Corvi wears the same ouroboros-eye ring as the Watcher (I18); the folder between them is labelled XII-SANG; the red grease-pencil X across the prelate's face is recent — someone alive wanted this face forgotten.</li>
          </ul>
          <p>If the search has to happen under pressure — guards in the corridor, a second team in the building — run it on the apartment plan (show map @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.KpUAj1DanbE4NuOW]{BM02 — Apartment and guarded corridor}): the stair lobby is the south-east entrance, the corridor runs west past the bedroom and library to the study at the far end. Layout only, as with BM01.</p>
          <h3>Beat 4 — HQ channels, and the road out</h3>
          <p>The Covenant logistics officer (show cast card @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.8rLcyDS8gPI8tCdO]{N13 — Covenant Logistics Officer}) carries the cell's fallback packets and can move any card's delivery forward by one day, once per act. <strong>If the cell stalls:</strong> I3 delivers Day 13; I1, I18 and I19 deliver Day 12.</p>
          <p><strong>Closing image of the act:</strong> when the players leave Rome, show I26's platform and I21's passport stamp side by side if they have them — the two timestamps are the case's first hard proof the thief had help.</p>

    - name: 'Days 12–11 — Rome Deep & The Geneva Thread'
      type: text
      text:
        content: |
          <h2>Days 12–11 — Rome Deep &amp; The Geneva Thread</h2>
          <p><strong>Off camera — deliver as news:</strong> Day 11 is escrow release — Corvi signs locker 4409-C into escrow and rides the EC 30 to Zurich, first class, the case on his knees (P1). The Talamasca are learning to read the Covenant's mail (O2).</p>
          <h3>Beat 1 — Rome wrap-up</h3>
          <p>Before the city lets them go, the second pass closes Rome's room. Ghiberti comes back to the table for the interview that matters — with the workshop photographs and the quiescence formula in hand, he admits the case was built to hold something the Church would not describe (show cast card @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.ooO1Z311YRSrDjVf]{N6 — Father Ghiberti}). The searches give up:</p>
          <ul>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.EE4LDI5tCUb9YG9l]{I20 — The Clean Drill}, from the room search at L2. Egg: the safe's dial was drilled precisely at the spindle — professional work — with fine bright swarf; carpet scuffs show someone knelt in the same spot twice, weeks apart; a woman's compact mirror lies half-shadowed under the desk edge. The compact is Claudia's: she searched this room before the Covenant arrived.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.yjSZ4jRoC9F50C62]{I21 — Diplomatic Passport}, from the desk effects. Egg: the Chiasso stamp is timed two hours after the gate film (I2); a second hand has written <em>accompagné</em> in the margin — the border guards logged a companion every report omits; the ID photo is from the same session as the 1962 archive print (I22).</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.Hx9jKUQtU1Jmwh2O]{I36 — Suppressed Index Card}, via Ghiberti. Egg: the handling note reads <em>corrosive to ferrous circuitry — by order of the Prefect</em>: the Lodestone was officially known as the one thing that disables the vault's electromagnets, and the order came from inside the building it robbed.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.mD3LMAVAHB3FK3rL]{I43 — The Case, 1964}, from the workshop file, via Ghiberti. Egg: the brass plaque was stamped <em>before</em> the case was finished — the name came first, the container after; the pinned workshop order reads <em>XII phials — Gethsemane lot — destroyed if opened</em>; the workshop supervisor is the same prelate whose face was X'd out in I22.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.9NpgA6XbC6AKGYEY]{I16 — The Quiescence Formula (CT3)}, from the L2 kit or, if missed, L7. Egg: the kit photographed in I32 — linen, gall, vinegar, myrrh — is already present in a Swiss clinic three days before the cell gets there. Rome's containment protocol is in play in Zurich: someone in the Church knew where the phials were going. This is the mechanical recipe for moving or neutralizing the blood.</li>
          </ul>
          <h3>Beat 2 — North by rail</h3>
          <p>Put the cell on the EC 30 and give the corridor its scene — three carriages back, a raincoat and a newspaper that never quite leave the frame (show scene @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.JdEbI0D8H7Vju6im]{TM16 — Night train compartment}). If the players ask who else is aboard, that is the answer.</p>
          <h3>Beat 3 — Geneva (L3)</h3>
          <p>Approach on the Rue du Rhône — gray alpine granite, brass, rain on the steps (show scene @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.WYkoHrGfng0UZ3lZ]{TM04 — Geneva bank exterior}). Jean-Paul Mercier (show cast card @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.FkHZCtF2IzBAAt3z]{N7 — Jean-Paul Mercier}) can be pressed — or paid — for the escrow slip; the booths and the vault desk give up the rest:</p>
          <ul>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.lOsCniEBTy2c974w]{I6 — The Escrow Transfer Slip}, from bank records or Mercier's desk. Egg: the memo line reads <em>Acquisition of Primary Specimen (1 of 12) — Experimental Oncology Protocol</em>; a small pencilled tick sits beside the "1 of 12" — the clerk understood exactly what he was moving; the fold line shows it lived in a jacket.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.6RWEHDPMeZJFj86J]{I23 — Night Deposit}, from the security office. Egg: the Watcher's reflection sits in the polished marble, newspaper and all; the bank cloth was placed under the case before it touched the counter — Mercier knows this item is not normal luggage; the wall calendar reads 17 September 1987, anchoring every other timestamp.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.TqsNZiq5wWnCyrO1]{I24 — Bank Staff Record}, from personnel files. Egg: the vault-access stamp explains why the buyer chose Mercier — the only clerk with both access and debt; the carbon edge under the card shows CHF 500,000 and box 4409-C: he photographed the transfer himself and kept a copy (I6).</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.NvsqxXBP29kM6SVV]{I25 — The Ledger Page}, from the vault desk. Egg: K. Hausmann accessed the box twice before the sale completed — he wanted more than one phial and was refused; beneath the correction fluid, a struck-through entry reads <em>VANE, C.</em> at 02:10: Claudia visited the vault in person and Mercier was paid to erase it. This is the first hard evidence of her independence.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.SI5TGjifT8qC6Epu]{I26 — The 06:40 to Geneva}, from the prints or purchased. Egg: the Watcher boards three carriages back (same raincoat, same newspaper); the destination board reads EC 30 ROMULUS, matching I2's pass; the porter's trolley label — VATICAN COURIER — proves the case traveled with diplomatic cover, arranged from inside.</li>
          </ul>
          <p>When Mercier takes them below, show the room the transaction happened in (show scene @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.w9Gp844xc19nFp0a]{TM05 — Private viewing room}). If the cell cases — or enters — the vault level, run it on the bank plan (show map @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.b2nGfJTzx9PeMk09]{BM03 — Bank vault level}): the entrance and grand stair are the south side, the three private viewing booths line the north-west wall, and the vault's wheel door sits in the east wing behind the deposit-box hall. Layout only.</p>
          <h3>Beat 4 — The thread on to Zurich</h3>
          <p>Two cards close the Geneva lead and point north:</p>
          <ul>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.SilYzv6luOt5X6Am]{I7 — Patient File 09-Hausmann}, forwarded from the booth records or taken at L4. Egg: the intake photo's gold wristwatch and the clinic logo are the thread-ends — the watch reappears on the feral predator (I27–I30), and the logo reappears on the escrow letterhead (I6): the same institution banked the money that injected him.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.Uanb3MKR6vPcGHq5]{I8 — The Swiss PTT Intercept Tape}. Egg: a second tape box carries the same neat hand as the red charge card in I3 — someone was copying calls before the Covenant arrived; the transcript's final line circles a Turin extension number, unlocking L5.</li>
          </ul>
          <p><strong>If the cell stalls:</strong> I6, I21, I23 deliver Day 9; I22 delivers Day 11; I4 and I20 deliver Day 10; I24, I25, I7 deliver Day 8; I8, I26 deliver Day 7.</p>

    - name: 'Days 10–9 — Zurich: The First Sale'
      type: text
      text:
        content: |
          <h2>Days 10–9 — Zurich: The First Sale</h2>
          <p><strong>Off camera — deliver as news:</strong> Day 10 — M1, the hand-off: the attaché surfaces in Zurich, Corvi cuts the seal in a Bahnhofstrasse vault, and Kurt Hausmann receives the first phial. That same night, at 02:00, the injection enters him (P3). Day 9 — the Talamasca decrypt the Covenant's Swiss PTT traffic (O2); Graf files the histopathology under a dead trial code and hides one slide (P4); the Turin Intermediary takes the second buyer's deposit in an envelope bearing a Wallachian dragon crest (P5); the Basarab pack enters Italy on a freight express and settles under the Lingotto without moving (P6); the Watcher photographs Bahnhofstrasse from a café (P7).</p>
          <h3>Beat 1 — The forest approach (L4)</h3>
          <p>Bring them up the Zurichberg in weather — white concrete and glass between the trees, and one floor of it gone wrong: third-floor windows taped over in black polyethylene (show scene @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.kr4nu0sVNfrcGAJq]{TM06 — Sonnenberg forest approach}). The clinic is a fortress of paperwork; let them choose their door — auditors, visiting clergy, or Graf herself.</p>
          <h3>Beat 2 — The third floor</h3>
          <p>Play the corridor before the room — start <audio controls preload="none" style="height:1.7em;vertical-align:middle" src="modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-corridor-hum.mp3"></audio> <em>Fluorescent corridor hum</em> (loops), then stop it the moment they open the door. Fluorescent tubes smashed, wind moving under sheeting, the air thick with bleach and something older — and something moving in the ceiling conduits overhead (sting: <audio controls preload="none" style="height:1.7em;vertical-align:middle" src="modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-conduit-scrape.mp3"></audio> <em>Something in the ceiling conduits</em>) (show scene @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.1HRljmcL11d0CPLS]{TM07 — Blacked-out third-floor ward}). Establish the clinic's night staff on the way in — they are the first witnesses to come, and their disappearance on Day 8 only lands if the table has met them. Kurt Hausmann (show cast card @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.pJw1z2zM3rWxMe80]{N5 — Kurt Hausmann}) is already here — before the break he is lucid, radiant, wrong: tumors gone, temperature falling, and he no longer sleeps. He cannot explain where the "protocol" came from, only that it was paid for by a Church account.</p>
          <h3>Beat 3 — The theatre (Graf's refuge)</h3>
          <p>The clinic's one lit room is a surgical theatre with the door chained from inside. Dr. Elizabeth Graf (show cast card @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.oNX7pUS8iM6yiENH]{N4 — Dr. Elizabeth Graf}) has not slept; she has the histology, the filtration charts, the freezer room, and eventually the burnt test — and a box of matches she keeps moving further away from the slides. Handle her carefully — O1M2 marks her for liquidation on Day 4. Show the theatre as the refuge it is (show scene @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.jP9jheucndZOEHLE]{TM08 — Surgical theatre refuge}); steadying her (first aid, light discipline, or psychiatric intervention) secures the medical sequence. If the cell has to fight for this floor, run it on the clinic plan (show map @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.jpOPWYTG4Yqt6hk4]{BM04 — Ward, theatre and lab}): the three patient rooms and the stairwell run along the top of the map, the lab with its fridges is the bottom-left, the operating theatre the bottom-right, and the balcony doors are the only quiet way off the floor. Layout only; Hausmann hunts from the conduits, and nothing on the map is lit or walled for you.</p>
          <h3>Beat 4 — What the clinic gives up</h3>
          <p>In whatever order the cell earns it — Graf first, then the rooms:</p>
          <ul>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.p51PQ2RP2raSDBHp]{I27 — Intake Photograph, 09-H}, from the ward wall or records. Egg: the gold wristwatch on his admission photo is the same watch later photographed on the feral predator — the visual argument that the thing on the ceiling was once a man; play the two images together.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.D18a1YRCEQu27KHw]{I9 — Histopathology Log: Marrow Graft}, from Graf. Egg: the filament structures belong to no known tissue; her annotation reads <em>foreign graft — not infection</em>; a second polaroid's edge intrudes at the frame — she took more than one and kept one for herself.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.FIvSwaxBVCP0etIQ]{I10 — The Vector Mechanics (CT1)}, from the L4/L5 laboratory material. Egg: the batch numbers tie the clinical trail to the phial count (1 of 12); the charts give <em>six shifts</em> as the conversion window — the same clock the case board counts.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.dypD1aQAOBWpTyg0]{I11 — The Resonance Field (CT2)}, from the lab freezers. Egg: the blood bags nearest the tray are spoiled, one swollen past bursting — proximity decay, caught mid-experiment; the chart's last line reads <em>subject 09-H attempted to drink from the sharps bin, 02:40</em>; the thermometer sits exactly at the quiescence threshold from I16.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.1dPSK2h5z6DX5Eab]{I28 — Photophobia Test 02:40}, from Graf's clinical photos. Egg: the burns outline a strip light's footprint precisely; his pupils do not react to the flash; the IV batch tag reads XII-1/12; the light switch behind him has been taped over by staff who learned what light does to him.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.VMoT17MWZ543rWHe]{I29 — The Injection Log}, from Graf's study. Egg: the sponsor's Vaduz trust account is the same account as I6's escrow — the money that bought the phial also paid the clinic; room 3.14 echoes the vault timestamp 03:14 (I2) as a deliberate numeric refrain.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.QEO98GDqJtZlL08l]{I30 — Ward 3, Corridor Camera}, from the security room — and if they miss it, the Swiss police will read it into the record for them on Day 8. Egg: the ceiling silhouette at the top of frame is the whole argument — this is not human violence and not a patient loose in the hall; the spill trail from the mop bucket stops under a service duct, showing he left through the ventilation; the clock reads 02:40.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.OvqUML75EHpXFQ0P]{I31 — Sonnenberg, Observed}, from the perimeter night shift. Egg: the parked sedan is SCV 47 — the same Vatican-plated Lancia that will appear at Lingotto (I33) and in I42; the newspaper under the long-lens camera is the Watcher's; one blacked-out window's tape has been pulled <em>inward</em> — from inside.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.t9kMeFOoglJgJeno]{I12 — The Ebionite Palimpsest}, on the L4 desk or later at L5. Egg: the underlayer is the actual Gospel of the Twelve, overwritten; Corvi's margin holds one Latin line — <em>sanguis remedium, non sacramentum</em> (blood is remedy, not sacrament); a Hotel Bristol, Geneva matchbook sits on the bench: his trail, pinned to a table. This card begins the Paradigm Inversion — hold it if the table has not seen I9 yet.</li>
          </ul>
          <h3>Beat 5 — The set-piece: the hand-off, reconstructed</h3>
          <p>End Day 10's session on the reconstruction: seal cut, phial passed, room empty — and let the players believe the clock is still theirs. Day 9 is theirs to work the clinic; <strong>if the cell stalls:</strong> I4/I20 deliver Day 10; I27 delivers Day 8; I28, I29, I31, I9, I36 deliver Day 6; I30, I32, I10, I35 deliver Day 5; I11, I12 deliver Day 4.</p>

    - name: 'Days 8–7 — Zurich Collapse & The Corridor'
      type: text
      text:
        content: |
          <h2>Days 8–7 — Zurich Collapse &amp; The Corridor</h2>
          <p><strong>Off camera — deliver as news:</strong> Day 8 — M2: Hausmann wakes changed; the third floor's night staff are missing by morning; Corvi walks the attaché out of the city in the confusion and takes the coast road south (P1). Custody goes dark until Turin. Day 7 — O1M1, L'Entità locks the Swiss–Italian frontier: crossings fall under paramilitary watch; Graf sits with matches and the research log and puts them away (P4).</p>
          <h3>Beat 1 — The morning after</h3>
          <p>If the cell slept through the break, they arrive into its aftermath; if they were on the floor, they lived it. Either way, walk the same two rooms changed: the blacked-out ward with the trail now cold and the police already in it (show scene @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.1HRljmcL11d0CPLS]{TM07 — Blacked-out third-floor ward}), and the clinic plan under the investigation — patient rooms, lab, theatre, the duct run — while Swiss detectives take statements in the wrong language (show map @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.jpOPWYTG4Yqt6hk4]{BM04 — Ward, theatre and lab}). Use the detectives to read two cards into the official record if the cell missed them: @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.QEO98GDqJtZlL08l]{I30 — Ward 3, Corridor Camera} and @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.OvqUML75EHpXFQ0P]{I31 — Sonnenberg, Observed} fall to the first investigators on scene — the corridor tape and the perimeter photographs.</p>
          <h3>Beat 2 — Graf, cornered</h3>
          <p>She has not slept. Give her the choice the players will remember: stay and testify, run with them, or burn the ward — put her back in the theatre for it (show scene @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.jP9jheucndZOEHLE]{TM08 — Surgical theatre refuge}), with the men in grey coats already in the car park. O1M2 arrives Day 4 regardless. If the cell works the pathology lab before they leave (one shift):</p>
          <ul>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.F6S9nFRmRvOKLqLf]{I32 — Daylight Test: Combustion}, from the pathology lab. Egg: the white ash in the fume hood is the same material as the calcified fingers that will end the case (I38); the linen, gall, vinegar, and myrrh on the bench are the quiescence kit of I16 — already installed in a Swiss clinic; the log's 07:12 stamp is twenty minutes after sunrise. This is CT3 in physical form.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.WNTzWxpF2S7xU230]{I35 — Breve Apostolicum, 1582}, from the L2 or L5 research kit if it was missed in Rome. Egg: its shelf-mark ties it to the excised card in I3; the papal seal was cracked and repaired with red wax — the 1582 custodians broke protocol and hid it — and the marginalia name the case itself: XII-SANG-00.</li>
          </ul>
          <h3>Beat 3 — The corridor south</h3>
          <p>The frontier is a scene now, not a transit: a man in grey who never introduces himself at the checkpoint, and SCV 47 idling at the border café from here to Turin. Take the last leg by rail and use the carriage again — the same raincoat, three carriages back (show scene @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.JdEbI0D8H7Vju6im]{TM16 — Night train compartment}).</p>
          <p><strong>If the cell stalls:</strong> I8, I26 deliver Day 7; I31, I28, I29, I9, I36 deliver Day 6.</p>
          <p><strong>Pressure note:</strong> advance the checkpoints sharply here. If the cell lets the frontier cost them more than a day, hold the Turin material until Day 5 and let the players feel the case cooling.</p>

    - name: 'Days 6–5 — Turin: The Lingotto'
      type: text
      text:
        content: |
          <h2>Days 6–5 — Turin: The Lingotto</h2>
          <p><strong>Off camera — deliver as news:</strong> Day 6 — M3: the case opens on the Lingotto floor and the Turin Intermediary buys the second phial, raising his offer to triple for the remaining eleven (P5); the Talamasca green-light Claudia to steal the case the moment Corvi is isolated (O2, P2) — she repacks her kit in order and argues to move on Lingotto tonight. Day 5 — Corvi retreats to the Lingotto supervisor's booth (P1 sequence); Hausmann is hunted into the Zurichberg forest edge, learning to stay out of the light (P3).</p>
          <h3>Beat 1 — Into the plant (L5)</h3>
          <p>Bring them in through the ramps at dusk: a third of a mile of concrete spiral and rooftop test track, rain falling through broken skylights into abandoned assembly halls (show scene @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.n61lTAaEdGfuCmPZ]{TM09 — Lingotto assembly hall}). Read the space — four assembly stations, the machine lines, stair heads at the corners, and somewhere above it all one lit glass box. Monsignor Corvi (show cast card @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.PYFCZ12Z05zvH46l]{N1 — Monsignor Matteo Corvi}) has barricaded himself in that booth with the case — praying in Latin, refusing food, a man waiting to be found by the right people. Sister Claudia Vane (show cast card @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.AArBxHFCdC7qBCke]{N2 — Sister Claudia Vane}) is at his back, diplomatically, exactly where she wants to be — and she is arguing, hard, to move on Lingotto "tonight." This is the players' chance to catch what the DA knows; reward any scrutiny of her kit now (see I37 below).</p>
          <h3>Beat 2 — The floor and the control room</h3>
          <p>Working the floor before the booth turns up:</p>
          <ul>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.HprCCHuQXSASoSTQ]{I34 — Assembly Hall, Camera 6}, from the control room, still spooling. Egg: the case's deadbolt is taped over — field repair on a cracked latch (he bought a second lock in Turin, P1); in the puddles the lights reflect but Corvi casts no shadow: the relic's active state has changed since the altar photograph (I2 at L1).</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.jFJ2aF20hnTgr1Ul]{I37 — The Empty Needle}, searching Vane's kit — or at L6 as evidence. Egg: the split bead is a clean, deliberate cut; the ochre fibres inside are what remains of the Veronica Thread's sheath; the scorch on the bead's outside is fresh — the thread was snapped <em>recently and near here</em>. This is the single best early-warning prop in the mission: if the players find it in Turin, they can pre-empt the betrayal entirely. Do not protect Claudia.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.WNTzWxpF2S7xU230]{I35 — Breve Apostolicum, 1582} and @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.Hx9jKUQtU1Jmwh2O]{I36 — Suppressed Index Card}, if missed in Rome — the seal that was opened after sealing, and the Lodestone's order from inside the building it robbed.</li>
          </ul>
          <p>If the floor work goes tactical, put down the assembly plan (show map @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.jqBp0bbZpuYJAVE1]{BM05 — Assembly floor}): the spiral test-track ramp curves in at the west edge, the assembly and machine lines fill the floor in four blocks, the stairs are the two top corners, and the main doors are the bottom centre. For the booth, use its own plan (show map @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.gAxI1cJhYftPzFGK]{BM06 — Supervisor booth and catwalk}): the glass booth sits at the top centre, the catwalk runs the full width behind it with stairs at both ends, and the access bridge drops from the booth to the floor — that catwalk is how anyone reaches Corvi without crossing open ground. Both are layout only: no walls, lights, or tokens are authored.</p>
          <h3>Beat 3 — The rooftop parley (set-piece)</h3>
          <p>Stage it in the rain: Corvi at the glass, Vane silent at the door, the cell deciding whether to take the case by force (show scene @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.eu4Vy9WBx8iGce1d]{TM10 — Lingotto rooftop in rain}). For the approach, show the photograph the players will eventually match to this moment (@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.tkYtaX7GeNiTtUeg]{I33 — Lingotto, Rooftop, Rain}): Vane stands precisely between Corvi and the booth's only door; a second case-sized rectangle lies beside the attaché; the Lancia below is SCV 47. If they negotiate instead, Corvi talks — the vector mechanics (@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.FIvSwaxBVCP0etIQ]{I10 — The Vector Mechanics (CT1)}), the resonance field (@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.dypD1aQAOBWpTyg0]{I11 — The Resonance Field (CT2)}), and his own translation of the Gospel of the Twelve (@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.t9kMeFOoglJgJeno]{I12 — The Ebionite Palimpsest}) — and if the cell demonstrates independent custodial credentials and cites Ebionite theology, he surrenders the case to them, and the room goes quiet enough to hear Claudia's thread snap. Whatever they choose, the board keeps ticking (bed: <audio controls preload="none" style="height:1.7em;vertical-align:middle" src="modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-clock-tick.mp3"></audio> <em>Clock ticking</em>): M4 fires next session.</p>
          <h3>Beat 4 — The broker</h3>
          <p>The Turin Intermediary (show cast card @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.IWiyCfB84HvDbIYT]{N15 — The Turin Intermediary}), if the cell flushes him out: a broker, not a believer. He gives up what costs him nothing — the buyer's Wallachian crest (P5), the pack's profile, the rendezvous in outline. The address itself he keeps; he has already sold it once today.</p>
          <p><strong>If the cell stalls:</strong> I30, I32, I10, I35 deliver Day 5; I11, I12, I33, I34, I37 deliver Day 4 (in practice, these land as the raid goes wrong).</p>

    - name: 'Days 4–3 — The Trap Springs'
      type: text
      text:
        content: |
          <h2>Days 4–3 — The Trap Springs</h2>
          <p><strong>Off camera — deliver as news:</strong> Day 4 — M4: the daylight breach. A droplet from the open case spills during handling on the Lingotto floor and ignites — a flash visible across the district. The Carabinieri flood the site; the case has been seen. Sister Claudia Vane snaps the Veronica Thread on the factory floor during the fire and takes the attaché: by the time the flash clears she is out of the building and the cell's transport is gone (P2M3). Corvi, barricaded in the supervisor's booth since that same day, is left without it — waiting to be found, but only by the right people (P1M4). In Zurich, men in grey coats arrive at Sonnenberg to "collect the study"; Dr. Graf barricades herself in Theatre 2 with the slides (P4M3, O1M4). Day 3 — the trap springs: Claudia receives the extraction green-light from Amsterdam and drives alone to Novara, waiting in the abbey for the airstrip rendezvous (P2M4); the Turin Intermediary sells the rendezvous address to the Basarab pack and takes the night train to Milan with his fee (P5M3); a priest in the Novara diocese reports three parishioners who never blink — by evening the abbey's lamps go out one at a time (P6M2).</p>
          <h3>Beat 1 — The flash</h3>
          <p>Open on the factory floor mid-handling, with no warning at all: the drop, the ignition, white light through every broken skylight (show scene @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.n61lTAaEdGfuCmPZ]{TM09 — Lingotto assembly hall}; if the table plays it out square by square, show map @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.jqBp0bbZpuYJAVE1]{BM05 — Assembly floor}). Then the noise. The Carabinieri flood the site and the cell is inside a crime scene with no Covenant cover story — wrong questions, jurisdiction fights, and a fire chief who cannot explain what burned a hole through steel plate. Every hour spent here is an hour Claudia gains on the road. If they were up in the booth when it happened, they hear the thread snap, see the flash-blindness take the room (sting: <audio controls preload="none" style="height:1.7em;vertical-align:middle" src="modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-flash-ring.mp3"></audio> <em>The daylight flash at the parley</em>), and find the case gone and Corvi alone at the glass (show scene @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.gAxI1cJhYftPzFGK]{BM06 — Supervisor booth and catwalk}). Rescue him and he has nothing left to trade but the truth — what the cure actually is, and why he did none of this for money — and he wants an audience for it.</p>
          <h3>Beat 2 — What the fire leaves</h3>
          <ul>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.jFJ2aF20hnTgr1Ul]{I37 — The Empty Needle}, if the kit was never searched. Egg: the split bead is a clean, deliberate cut; the ochre fibres inside are the Veronica Thread's sheath; the scorch is fresh — the thread was snapped <em>recently and near here</em>. On Day 4 the word "here" has become the crime scene itself.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.tkYtaX7GeNiTtUeg]{I33 — Lingotto, Rooftop, Rain} and @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.HprCCHuQXSASoSTQ]{I34 — Assembly Hall, Camera 6}, if missed on Days 6–5 — both surface in the fire's aftermath, and the "no shadow" frame in I34 reads differently now, after the daylight flash: the case is fully awake.</li>
          </ul>
          <h3>Beat 3 — Zurich, if they left her behind</h3>
          <p>If Graf was left in the clinic, pull the cell back one last time — the sanitization sweep is a live scene, not a rumor. Put her behind the chained theatre door with the slides (show scene @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.jP9jheucndZOEHLE]{TM08 — Surgical theatre refuge}), run the floor on the clinic plan if it goes loud (show map @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.jpOPWYTG4Yqt6hk4]{BM04 — Ward, theatre and lab}), and let the men in grey coats refuse to introduce themselves. The extract-or-leave dilemma is hers to force, not yours.</p>
          <h3>Beat 4 — The road south (Day 3)</h3>
          <p>The trail leaves Turin the way the case did: toll stubs, teleprinter logs, and Corvi's own papers — all of it pointing at Novara (L6 only exists once the cell is tracking Claudia). The Intermediary's café is closed; flushed out, he gives up the buyer's Wallachian crest, the pack's profile, and the rendezvous in outline — and keeps the address, which he has already sold once today. The Day 3 HQ packet lands while they drive: @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.XWAylCZFSBMFiPpB]{I41 — The Green Lamp}. Egg: the open dossier is stamped REGISTRY 16 — AMSTERDAM — Sabbatini already has the Talamasca file the cell is still assembling; the waiting silhouette wears the operative's grey coat (I42); three more standing figures gather in the window's reflections — the sanitization squad is in the antechamber.</p>
          <p><strong>If the cell stalls:</strong> I33, I34, I37 deliver Day 4; I41 delivers Day 3.</p>
          <p><strong>Set-piece:</strong> stage the Lingotto fire as a catastrophe the cell cannot prevent, only triage — what to save, whom to drag out, which evidence burns. End the session on the empty mooring where the case was last seen, the Carabinieri cordon's lights swinging through the rain (bed: <audio controls preload="none" style="height:1.7em;vertical-align:middle" src="modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-sirens-distant.mp3"></audio> <em>Distant civil-defence siren</em>), and one nun's absence nobody can yet explain. The theft should never feel arbitrary: the evidence was on the table since Geneva (I5, I14, I25). Cells that found it earned this; cells that didn't are paying tuition.</p>

    - name: 'Days 2–1 — San Nazzaro: The Slaughter & The Tarmac'
      type: text
      text:
        content: |
          <h2>Days 2–1 — San Nazzaro: The Slaughter &amp; The Tarmac</h2>
          <p><strong>Off camera — deliver as news:</strong> Day 2 — M5: the retrieval pack hits the fortified retreat. Ten phials change hands and the eleventh shatters — a single drop burns two of their fingers to white ash (P6M3). The pack executes Claudia to keep the cure from their bloodlines (O2M3). The Watcher reaches Novara before the pack and leaves before the police, adding one pencil line to the gatehouse ledger: <em>second descent, 04:02</em> (P7M3). Day 1 — M6: the consignments are loaded aboard the Cessna 421; the Elder stands at the fence line and looks directly at the watchers (P6M4). Wheels-up at 01:15 ends the operation and leaves the emptied case behind. The Turin Intermediary wires congratulations to Bucharest and closes the account (P5M4).</p>
          <h3>Beat 1 — The abbey approach (L6)</h3>
          <p>Bring them along the Sesia at dusk: moat water, brick walls, and carriage doors that are already open — broken inward, iron hinges torn out of the masonry (show scene @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.EzLXgHrD8SOahA0Z]{TM11 — Breached abbey approach}). If they case the perimeter or the loading yard before going in, put down the gate and courtyard plan (show map @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.5UwVLTp8ofRAjQ9W]{BM07 — Abbey gate and courtyard}): the broken bridge and gate are the south side, the fountain and four garden plots fill the courtyard, the cloister arcade runs along the north, and the stores and cells line the wings. Layout only.</p>
          <h3>Beat 2 — The dining hall threshold</h3>
          <p>Hold the lantern light at the door before they see the table. Sister Claudia Vane is dead on it, pinned like a specimen — render the body and the room with total quiet (no music, no ambience — kill the beds before you read it) (show scene @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.URoAcs3MRSAqrakE]{TM12 — Abbey dining hall threshold}). After fourteen days of tracking her, this is the mission's emotional floor: give the players the moment without DA commentary. If the hall is run as a scene, use its own plan (show map @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.9wHAIjutxJqKmHqB]{BM08 — Abbey dining hall and cloister}): the long table and banners fill the hall, the cloister arcade runs along its south edge to the courtyard, and the kitchen and cellar rooms sit either side. The forensics read as follows — autopsy first, then the satchel, then the telegraph desk:</p>
          <ul>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.zCbHgDIvUDf0NQeB]{I13 — The Novara Slaughter}, from the autopsy of Claudia. Egg: two severed metacarpals gone to white calcified ash — one still shows a legible whorl ridge; a broken phial soaked into the tiles; the attaché gone but its leather carry-strap cut on the table edge; <em>an unused second wine glass</em> at the head of the table — she was waiting for someone, and it was not the pack. Secondary asset: show <em>i13-carotid-detail.webp</em> via Image Popout when the wounds are measured with calipers.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.phIsjPz5WHarCoVB]{I40 — Her Effects, Laid Out}, from her satchel (one shift). Egg: the Talamasca card is the last nail — after I5, I14, and I25 it is incontrovertible; the toll stub is time-stamped ninety minutes before death — she drove straight here from Turin; a ring of grey animal hair is wound around the Beretta's trigger guard: something checked her weapon before she could reach it.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.e7WrCS9xFqFcAJHF]{I14 — Telex Dispatch: Registry 16}, from her satchel or the telegraph desk. Egg: the legible fragment orders the specimen flown to a Carpathian facility — PROTECT THE BLOODLINE; the perforation pattern is Amsterdam's machine; a second melted strip preserves one unburned line: <em>RENDEZVOUS "BASARAB"</em> — the word that names the aircraft's owner.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.GnEgQ3rUIxDi1GQo]{I15 — Flight Clearance: YR-BAS}, from the telegraph desk. Egg: the owner line reads Basarab Holdings S.A. (Bucharest); the cargo line reads "Ecclesiastical Medical Supplies — Ten Consignment Units"; departure 01:15; the cancelled form beneath means the flight waited — not a diversion, a plan.</li>
          </ul>
          <h3>Beat 3 — Full forensics (one shift) and the living witnesses</h3>
          <ul>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.U2IpaLLta03yQl0w]{I38 — Two Fingers, Calcified}, from the full forensic work. Egg: radial fracture lines — the bone aged a century in seconds, CT1's signature, identical to the crucible ash in I32; a surviving whorl ridge is a printable partial to pursue into Mission 2; the melted ring fused into the ash carries the Basarab dragon crest — one of the pack touched the spill and died for it.</li>
          </ul>
          <p>The local priest is the day's only living witness: three parishioners who never blink, confessed to him and then gone. If the cell arrives after dark, he is the one who says the abbey's lamps "went out one at a time (sting: <audio controls preload="none" style="height:1.7em;vertical-align:middle" src="modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-power-down.mp3"></audio> <em>Power down — lamps going out</em>)." Behind the vampires, L'Entità cleanup teams arrive to burn the abbey's records — two factions colliding in the same building is the case's loudest possible alarm; if the cell sparks it, they stop being watchers and become targets. The Grey Watcher himself is never met, if he is doing his job: a damp newspaper, a fresh pencil line in the ledger, and a plain card left where the cell will find it — <em>We watch, and we are always there.</em> If the cell catches him, his negatives are the case file's missing photographs (the unshot frames behind I18, I26, I31, I33).</p>
          <h3>Beat 4 — The hangar and the apron</h3>
          <p>The trail ends at Novara-Cameri. Take them through the abandoned hangar — rain on discarded fuelling lines, the empty cradle where a crate stood (show scene @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.tlrpaGAGQo3Qhk98]{TM13 — Abandoned airfield hangar}) — and out onto the apron (show map @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.lGukiMcNwlfc2Wh3]{BM09 — Hangar and apron}): the hangar floor is the top-left block, the dispatch and office annex the right side, the fuel bowser the right-hand apron square, and the perimeter fence and gatehouse the far edge. The service hangar and dispatch desk give up:</p>
          <ul>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.AwrHknjihUDqll80]{I44 — Consignment Markings}, in the service hangar. Egg: the chalk tally reads 10/12 — two phials were unaccounted for before the aircraft left Europe (one sold, I6; one broken, I13); under the fresh Basarab stencil, ghosted through the paint, an older mark reads VATICAN MUSEUMS — STOREROOM 9: the crate carrying the cure out of Italy was itself Vatican property.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.R4F2ocb2JCwwfKOB]{I45 — Airfield Briefing Sheet}, from the dispatch desk, or the Wayfinder packet. Egg: the crossed-out second aircraft is decoy traffic — the cell that chases it loses the forty minutes that matter; the handwritten confirmation is dated the same night as the flight clearance (I15): the plan was locked before the slaughter, not after.</li>
          </ul>
          <p>The clock is the enemy here: past the first shift, Novara-Cameri empties onto the road and the scene becomes an armed standoff — two shifts lost, evidence impounded, some of it never seen again.</p>
          <h3>Beat 5 — The tarmac (set-piece)</h3>
          <p>Rain on the perimeter fence, props turning (bed: <audio controls preload="none" style="height:1.7em;vertical-align:middle" src="modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-prop-plane.mp3"></audio> <em>Airfield prop plane at night</em>), a crate that once belonged to the Vatican Museum, and an ancient thing in a long coat that turns and looks at the cell like it owns the night (show scene @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.lGukiMcNwlfc2Wh3]{BM09 — Hangar and apron} for the ground, and I39 for the moment — one photograph, then the lights lift, and the case is over): @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.fnZm0Dl4nHlnas4G]{I39 — Tarmac, 01:15}, at the perimeter fence, the cost of the last hours. Egg: the tail reads YR-BAS; the crate carries the dragon crest; the Elder looking down the lens is not a mistake — the pack knows the Covenant is watching and has stopped caring. If the cell arrived with the final HQ packet, it also carries @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.xOiejtMxuQ1Q4vDv]{I42 — L'Entità Team, 1987}: the watch-checking operative wears an issue Vatican gendarme wristwatch — the same procurement chain as the gate detail in I18; the car is SCV 47, the recurring tail (I31, I33); the cylinder at the third man's belt matches the phosphorus canister in the operative's file portrait — by the time this roll is developed, the squad is already armed.</p>
          <p>Whatever happens next — intervention, documentation, or helpless watching — the canonical close is I39's: one photograph, then the lights lift. If the cell blundered through the abbey instead, close on the military police cordon and let the cost be counted in shifts and impounded evidence: the mission ends either way, only its price differs. <strong>If the cell stalls:</strong> I38, I42, I44 deliver Day 2; I39, I45 deliver Day 1 — and if the cell arrives late, the priest, the ledger, and the photographs still deliver every card; the story survives without a single roll.</p>

    - name: 'Epilogue — The Accounting & The Road to Mission 2'
      type: text
      text:
        content: |
          <h2>Epilogue — The Accounting &amp; The Road to Mission 2</h2>
          <p><strong>How it ends:</strong> the mission closes on the empty tarmac with the emptied attaché left behind — the phials are gone, the cure is in vampire hands, and the Covenant is left holding the blame for a fire it did not start. Play the aftermath through three lenses:</p>
          <ul>
            <li><strong>If the phials left (canonical):</strong> feral carriers multiply across Northern Italy as the vector's market spreads; the Holy Alliance launches its sanitization campaign; the Covenant's report becomes a political weapon in the wrong hands. The board's worst-case resolution is now the world's problem — Mission 2's problem.</li>
            <li><strong>If the cell stopped the flight:</strong> the Covenant holds ten vessels of a cure it finally understands. The ethical question lands on the players, not the DA: use the cure as a weapon (Sabbatini's "iron nail" argument, I17), study it, or destroy it. Whatever they choose, the Order of the Talamasca knows the cure exists — and so does the Prefect.</li>
            <li><strong>Partial outcomes:</strong> one canister, one witness, one photograph. Any fraction of the cargo is enough for Mission 2; the cell should leave the table with exactly one unanswered question.</li>
          </ul>
          <h3>Beat 1 — The green-lamp meeting (L7)</h3>
          <p>If the cell brings the file back to the Palace of the Congregation, stage the accounting as a scene, not a summary. Take them through the antechamber first — green carpet, benches, busts, and the particular quiet of a waiting room outside a Prefect's door — and then into the Council Chamber: the oval table, the Renaissance frescoes, the banker's lamps over the dossiers (show map @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.ODBMpIkV30orwoGM]{BM10 — Council chamber and antechamber}). Sabbatini is at his desk, no longer pretending otherwise, and the dossier in front of him is already stamped REGISTRY 16 — AMSTERDAM (show scene @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.c2expM3HLZD9xsBD]{TM14 — Council chamber}). He negotiates as a statesman rather than answering as a suspect; the Church's position has not changed since 1582 — the cure exists to be held, not used, a nail driven into the bloodline's head. Confronting him with the corpse, the telex, and the flight manifest unlocks the containment protocols (@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.9NpgA6XbC6AKGYEY]{I16 — The Quiescence Formula (CT3)}). Retrieve on the way in or out:</p>
          <ul>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.XWAylCZFSBMFiPpB]{I41 — The Green Lamp}, from the approach surveillance, if the Day 3 packet was missed. Egg: the reflections show three more standing figures — and this time they are in the room with the cell.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.xOiejtMxuQ1Q4vDv]{I42 — L'Entità Team, 1987}, from recovered prints. Egg: SCV 47 at the kerb again — the car that has been in every city the case has visited — and a phosphorus canister on a belt.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.bylOSJzw3hElf5Nb]{I17 — The Basarab Extortion File}, if it surfaced at HQ. Egg: on the box lid's underside, an ouroboros-eye has been scorched into the tin — someone else has read this file. Let the players ask who.</li>
          </ul>
          <h3>Beat 2 — Claudia's room</h3>
          <p>If the cell asks where Claudia lived, give them the room and nothing else: a convent cell, packed, in order, waiting for its owner (show scene @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.72tNLODObuOLLVyV]{TM15 — Claudia convent room}). It is the right place for the burial debate — Talamasca agent, Covenant operative, or a woman whose handwriting never trembled once in a year of deceiving everyone she met. Her last message home is with Amsterdam now.</p>
          <h3>Beat 3 — What becomes of the cast</h3>
          <ul>
            <li><strong>Monsignor Corvi</strong> — if he lives, he gets what he wanted: Rome on record, knowing what the cure actually is. Whether that saves or damns him is the cell's report to write.</li>
            <li><strong>Sister Claudia Vane</strong> — buried under one of two names, or neither. Let the players argue it out in character.</li>
            <li><strong>Dr. Graf</strong> — the liquidation order stands. If the cell left her behind, O1M4's fallout arrives in the epilogue: a burned clinic wing and a name to be answered for.</li>
            <li><strong>Kurt Hausmann</strong> — still out there, a hunter who has learned to stay out of the light. The feral banker does not appear in the epilogue unless the DA wants a haunting: livestock, disturbed graves, and cold cases along the forest edge.</li>
            <li><strong>The Grey Watcher</strong> — leaves the card and the negatives, unmasked and unaccounted for. He is the campaign's promise that someone has been reading the same files all along.</li>
            <li><strong>The Turin Intermediary</strong> — wires congratulations to Bucharest and closes the account. Profit, not pride, was always the point.</li>
          </ul>
          <h3>Beat 4 — The hand-off</h3>
          <p>End the session on the empty tarmac and the rain — then hand the table the Concordat Requisition (its own journal page) and the road to Romania: Cluj-Napoca, the Apuseni foothills, a private Basarab sanatorium, and ten phials that must never be used. The board's remaining days belong to Mission 2.</p>
          <p><strong>DA checklist:</strong> log the final board state — which milestones fired, which tracks advanced; record which cards the cell found on-site versus via fallback packets; note every unanswered question the players voiced — each one is a Mission 2 thread. File the case.</p>

    - name: 'Image Egg Index — All 45 Cards'
      type: text
      text:
        content: |
          <h2>Image Egg Index — All 45 Cards</h2>
          <p>Quick reference for the DA: every information card and the hidden details in its artwork. Cards whose <em>fallback</em> day is mentioned in the day entries above can be delivered via HQ packet if the cell misses them on-site — the image is the reward either way. When a player examines a card's art, answer with the egg, not the summary.</p>
          <table>
            <tr><th>Card</th><th>Egg in the art</th></tr>
            <tr><td><strong>I1 — The Burnt Electromagnet Relay</strong></td><td>Sulfurous residue in the slag; the plinth is scorched from <em>beneath</em> — the failure came up through the cradle.</td></tr>
            <tr><td><strong>I2 — CCTV Reel #87-04</strong></td><td>Corvi casts a faint shadow but the case throws opaque black; a nun's veil at the frame edge, forty metres behind, in no report.</td></tr>
            <tr><td><strong>I3 — The Excised Codex Register</strong></td><td>Shelf-mark MS-Vat-Heb-418; the red card (1582, XII-SANG-00) has no dust — it was placed recently.</td></tr>
            <tr><td><strong>I4 — The Polybius Vulgate Cipher</strong></td><td>The blotter's mirror-writing already reads GENEVA and 4409; a Roma Termini ticket beneath it.</td></tr>
            <tr><td><strong>I5 — The Watcher's Hallmark</strong></td><td>Three cities circled in pencil before the case existed; the stamp's second impression shows long use.</td></tr>
            <tr><td><strong>I6 — The Escrow Transfer Slip</strong></td><td>"1 of 12" with a clerk's pencilled tick; the fold where it lived in a jacket.</td></tr>
            <tr><td><strong>I7 — Patient File 09-Hausmann</strong></td><td>The gold wristwatch and clinic logo are thread-ends to the feral predator and the escrow letterhead.</td></tr>
            <tr><td><strong>I8 — The Swiss PTT Intercept Tape</strong></td><td>A second tape box in the same neat hand as I3's red card; the final line circles a Turin extension.</td></tr>
            <tr><td><strong>I9 — Histopathology Log</strong></td><td>"Foreign graft — not infection"; a second polaroid intrudes — she kept one.</td></tr>
            <tr><td><strong>I10 — The Vector Mechanics (CT1)</strong></td><td>Batch numbers tie to 1 of 12; "six shifts" conversion window — the same clock the board counts down.</td></tr>
            <tr><td><strong>I11 — The Resonance Field (CT2)</strong></td><td>A blood bag swollen past bursting — proximity decay; the 02:40 sharps-bin line; the thermometer at I16's quiescence threshold.</td></tr>
            <tr><td><strong>I12 — The Ebionite Palimpsest</strong></td><td>The underlayer is the actual Gospel of the Twelve; <em>sanguis remedium, non sacramentum</em>; a Hotel Bristol matchbook pins his trail.</td></tr>
            <tr><td><strong>I13 — The Novara Slaughter</strong></td><td>White calcified metacarpals, one with a legible whorl; a broken phial in the tiles; the carry-strap cut; the unused second wine glass. Popout asset shows the carotid detail.</td></tr>
            <tr><td><strong>I14 — Telex Dispatch: Registry 16</strong></td><td>PROTECT THE BLOODLINE; Amsterdam perforations; one unburned line survives the melt: RENDEZVOUS "BASARAB".</td></tr>
            <tr><td><strong>I15 — Flight Clearance: YR-BAS</strong></td><td>Basarab Holdings; "Ten Consignment Units"; 01:15; the cancelled form beneath means the flight waited.</td></tr>
            <tr><td><strong>I16 — The Quiescence Formula (CT3)</strong></td><td>The kit in the photograph is already installed in Zurich — Rome's protocol precedes the crime.</td></tr>
            <tr><td><strong>I17 — The Basarab Extortion File</strong></td><td>The "iron nail" memo; an ouroboros-eye scorched into the tin's underside — someone else has read this file.</td></tr>
            <tr><td><strong>I18 — Second Descent</strong></td><td>The ouroboros-eye signet on the descending hand; the lift already called from below; 04:02 matches P7's pencil line.</td></tr>
            <tr><td><strong>I19 — The Name Below the Plinth</strong></td><td>The case's scrape outline: opened in situ more than once; the plaque predates the 1964 case.</td></tr>
            <tr><td><strong>I20 — The Clean Drill</strong></td><td>Professional swarf, not panic; the kneel used twice; Claudia's compact — she searched the room first.</td></tr>
            <tr><td><strong>I21 — Diplomatic Passport</strong></td><td>Chiasso stamp two hours after the gate film; <em>accompagné</em> — a companion the reports omit; same tie as 1962.</td></tr>
            <tr><td><strong>I22 — The Archive, 1962</strong></td><td>The mentor's ouroboros-eye ring; the XII-SANG folder between them; a red X recent enough to still matter.</td></tr>
            <tr><td><strong>I23 — Night Deposit</strong></td><td>The Watcher's reflection in the marble; the bank cloth under the case; the calendar reads 17 September 1987.</td></tr>
            <tr><td><strong>I24 — Bank Staff Record</strong></td><td>The access stamp that explains why Mercier was chosen; the transfer carbon (CHF 500,000, 4409-C) he copied for himself.</td></tr>
            <tr><td><strong>I25 — The Ledger Page</strong></td><td>Hausmann tried to buy more than one phial; under the correction fluid: "Vane, C." at 02:10.</td></tr>
            <tr><td><strong>I26 — The 06:40 to Geneva</strong></td><td>Same raincoat, same newspaper; EC 30 ROMULUS; the Vatican courier label on the luggage trolley.</td></tr>
            <tr><td><strong>I27 — Intake Photograph, 09-H</strong></td><td>The gold watch returns on the feral predator; the clinic logo matches the escrow letterhead.</td></tr>
            <tr><td><strong>I28 — Photophobia Test 02:40</strong></td><td>The XII-1/12 batch tag; the light switch taped over; the nurse's withdrawing hand.</td></tr>
            <tr><td><strong>I29 — The Injection Log</strong></td><td>Vaduz trust account equals the escrow account in I6; room 3.14 rhymes with the vault's 03:14.</td></tr>
            <tr><td><strong>I30 — Ward 3, Corridor Camera</strong></td><td>The ceiling silhouette; the spill trail ends under a service duct — ventilation, not doors; 02:40.</td></tr>
            <tr><td><strong>I31 — Sonnenberg, Observed</strong></td><td>SCV 47 beneath the clinic; the Watcher's newspaper under the camera; one window taped from the inside.</td></tr>
            <tr><td><strong>I32 — Daylight Test: Combustion</strong></td><td>The ash matches the Novara fingers; the quiescence kit already on the bench; 07:12 — twenty minutes after sunrise.</td></tr>
            <tr><td><strong>I33 — Lingotto, Rooftop, Rain</strong></td><td>Vane between Corvi and the booth's only door; the second case-sized rectangle (his papers); SCV 47 below.</td></tr>
            <tr><td><strong>I34 — Assembly Hall, Camera 6</strong></td><td>The deadbolt taped — the case has been forced or dropped; Corvi casts no shadow in the puddles.</td></tr>
            <tr><td><strong>I35 — Breve Apostolicum, 1582</strong></td><td>The shelf-mark ties to I3; the seal was cracked, opened, and repaired; the marginalia name XII-SANG-00.</td></tr>
            <tr><td><strong>I36 — Suppressed Index Card</strong></td><td>"Corrosive to ferrous circuitry" is the whole plan; the handling order came from the Prefect's office.</td></tr>
            <tr><td><strong>I37 — The Empty Needle</strong></td><td>A clean, deliberate cut; ochre sheath fibres inside; the scorch is fresh — snapped recently and near here.</td></tr>
            <tr><td><strong>I38 — Two Fingers, Calcified</strong></td><td>Fracture lines match I32's crucible ash; a printable whorl partial; the dragon-crest ring melted into the ash.</td></tr>
            <tr><td><strong>I39 — Tarmac, 01:15</strong></td><td>Tail reads YR-BAS; the crate carries the dragon crest; the Elder looks down the lens — the pack has stopped caring.</td></tr>
            <tr><td><strong>I40 — Her Effects, Laid Out</strong></td><td>The Talamasca card; the toll stub ninety minutes before death; grey animal hair around the trigger guard.</td></tr>
            <tr><td><strong>I41 — The Green Lamp</strong></td><td>REGISTRY 16 — AMSTERDAM already on Sabbatini's desk; the operative's grey coat; three figures in the reflections.</td></tr>
            <tr><td><strong>I42 — L'Entità Team, 1987</strong></td><td>A Vatican gendarme wristwatch; SCV 47 at the kerb; the phosphorus canister on the third man's belt.</td></tr>
            <tr><td><strong>I43 — The Case, 1964</strong></td><td>The plaque was stamped before the case was built; "destroyed if opened"; the supervisor is I22's prelate.</td></tr>
            <tr><td><strong>I44 — Consignment Markings</strong></td><td>Chalk tally 10/12; VATICAN MUSEUMS — STOREROOM 9 ghosted beneath the fresh paint.</td></tr>
            <tr><td><strong>I45 — Airfield Briefing Sheet</strong></td><td>The crossed-out decoy aircraft; the handwritten confirmation dated the same night as the clearance in I15.</td></tr>
          </table>
          <p><em>DA note: the egg index is deliberately shallow — one sentence per card. The full readings (retrieval, what the image shows, and how to use it) live in each card's own DA notes on the Information Web.</em></p>

