          <p><em>Timing notes the table cannot carry: the empty hangar (C19) is only right after the aircraft has departed; the NPC frames (C09, C22, C23, C24) require that person to be present and a photograph to be possible; C08 needs vault-level access; C21 needs the council chamber and permission. The pack is locked to the GM in the compendium.</em></p>
