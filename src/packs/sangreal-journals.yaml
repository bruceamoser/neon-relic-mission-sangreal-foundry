          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.NvsqxXBP29kM6SVV]{I25 — Geneva
          Escrow Request Register} is the unaltered Geneva request register for dossier 4409-C: K. HAUSMANN /
          Instructions; SERVICE FIDUCIAIRE / Conditions de versement; M. CORVI / Signature, each initialed
