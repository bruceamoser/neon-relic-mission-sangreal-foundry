    - name: Scene Art — GM Index
      type: text
      text:
        content: >
          <h2>Scene Art — GM Index</h2><p>26 approved backgrounds: 16 theater-of-the-mind views and 10
          gridless battle maps, plus the existing landing scene. Use Settings → Mission: Sangreal → Import /
          Update Content to install or refresh them. New scenes start hidden from navigation and inactive.
          Activate scenes deliberately at the correct reveal point.</p><p><strong>Revealing a scene at the
          table:</strong> open the installed world scene, frame the view you want, then click <em>Activate
          Scene</em> — every connected player is pulled to it automatically; no permission change is needed.
          Setting <em>Accessibility</em> to <em>All Players</em> and ticking <em>Show in Navigation</em>
          (Scene Configuration → Basics) is optional: it only lets players re-open the scene themselves from
          their own scene list. Players cannot browse this module's compendium packs (they are locked to the
          GM), so nothing in this index leaks early on its own.</p><p>Backgrounds are q85 WebP, 6.55 MB total.
          No generated masters ship. Each scene keeps its art on a single hidden Level named
          <em>Background</em> — that is Foundry v14's native storage for scene artwork, not a multi-floor
          setup, and it needs no upkeep. Maps use manual token placement; no walls, dynamic lights, automatic
          encounters or measured tactical scale are configured. The two Lingotto maps are separate
