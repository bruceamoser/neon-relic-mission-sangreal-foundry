          <h2>The Tarmac — Conditional Outcome</h2><p>Use this page only after resolving the actual airfield
          situation. @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.GnEgQ3rUIxDi1GQo]{I15 —
          Flight Clearance: YR-BAS} is a flight plan, not proof of departure. If the cell arrives before
          loading or clearance is complete, use the walkthrough’s interception options and
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.lGukiMcNwlfc2Wh3]{BM09 — Hangar
          and apron}.</p><blockquote><p>The hangar light is still on. What it illuminates depends on what you
          managed to stop.</p></blockquote><p>If the flight left, establish the actual departure and cargo
          through tower records or surveillance. If the case was seized, record it. If the cargo split, follow
          each consignment separately. Do not remove recovered phials to restore the default ending.</p>
    - name: The Concordat Requisition
      type: text
      text:
        content: >-
          <h2>The Concordat Requisition</h2><p>Sabbatini can sign funding, transit protection, and a
          non-deployment undertaking when presented with a credible custody plan. A completed Novara slaughter
          is not a prerequisite. Terms should reflect the cell’s negotiated protections for people and
          evidence. Retain copies outside Church custody.</p><p>Record: remaining vessels and residue; named
          custodian; storage conditions; permitted movements; who must witness a transfer; no further
          administration without a separately agreed process; protection of surviving witnesses. The player
          who signs should know what obligation they are accepting.</p>
    - name: 'Mission 2: Recover the Sangreal'
      type: text
      text:
        content: >-
          <h2>Mission 2 — Follow the Consequences</h2><p>If vessels reached Romania, pursue the actual cargo
          before incineration. If the reserve is secured, the next mission may defend the arrangement,
          investigate other research, or renegotiate the peace. If everything was destroyed, do not restore it
          by fiat. If another person was exposed, their safety and the surrounding community become the urgent
          problem. The Basarab command’s motive remains fear of imposed mortality; a different faction needs
          actual evidence before you assign it a restoration scheme.</p>
- _id: sangreal-journal-walkthrough
  name: SANGREAL-87-091 — DA Walkthrough
  type: journalEntry
  pages:
    - name: "Start Here — Aboard the Train to Geneva"
      type: text
      text:
        content: >-
          <h2>Resume Here — Geneva to Sonnenberg</h2><p><strong>Current table state, 20 October session
          preparation:</strong> the investigators have completed the Geneva bank visit, obtained its clues,
          spoken to Petra and asked about Sonnenberg and Hausmann. They are boarding the train Petra
          arranged to Zurich. They still believe they are pursuing the Holy Grail. Open <strong>Sonnenberg —
          A Patient Before a Monster</strong>, Scene 1. Do not replay Geneva or reveal the blood in Petra’s
          briefing.</p><p>Prepare the driver’s sealed packet (I48/I49 as actually obtained, I57/I58), BM04,
          the Hausmann actor and the alarm, corridor and glass cues. Sequence: station envelope → clinic
          reception asks them to wait → red alert → wounded Graf, dead intern and young-vampire fight →
          Graf’s treatment account → Claudia’s convincing breakdown → Corvi’s Lingotto lead and
          sealed-recovery objective. Preserve the actual injuries, escape or death and all earlier
          successful precautions.</p><h3>Earlier-session reference</h3><h2>Start Here — Aboard the Train to
          Geneva</h2><p><strong>Resume the actual campaign here.</strong> The investigators have left Rome
          and boarded the train. They have gathered evidence pointing to Geneva and suspect UBS. Preserve
          their exact discoveries, the current date and filled shifts, and Claudia’s actual standing with
          the party. Do not replay Rome or announce that they already know Hausmann, the box number, or the
          clinic unless they earned those facts.</p><h3>Five-minute preparation</h3><ol><li>Put the players’
          existing evidence in front of you. Mark which of GENEVA, UBS, HAUSMANN and 4409-C they have
          actually established. Their present Geneva/UBS lead is sufficient to begin.</li><li>Open
          <strong>Corvi’s Rooms and Geneva — Follow the Bargain</strong> and jump to <strong>The train out
          of Rome</strong>. The earlier apartment material is reference only.</li><li>Use the
          current-session state: Hausmann has already received one phial before the Geneva inquiry;
          conversion will have completed by clinic arrival. Corvi has left Sonnenberg with eleven. The
          players learn those facts through sources, not a DA announcement. Warnings prevent further use and
          improve patient care; the Church did not know of Corvi’s experiment.</li><li>Prepare
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.lOsCniEBTy2c974w]{I06 — The
          Escrow Transfer Slip} and its separate bank statement, Mercier’s answers, and Petra’s Sonnenberg
          briefing. These are the essential scene materials.
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.6RWEHDPMeZJFj86J]{I23 — Night
          Deposit}–@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.SI5TGjifT8qC6Epu]{I26 —
          Corvi at Cornavin} and F07 are optional corroboration. Do not hide a required name in an
          unreadable picture.</li><li>Choose the cell’s next practical contact opportunity: a station
          telephone during a stop, an already established secure radio, or a telephone on arrival at
          Cornavin. Give a clear callback arrangement. No modern mobile-phone access is
          assumed.</li></ol><h3>The session in six beats</h3><table><thead><tr><th>Beat</th><th>Players
          do</th><th>They leave with</th></tr></thead><tbody><tr><td>1. Train from Rome</td><td>Compare the
          Rome evidence, hear Claudia’s volunteered telephone inquiry, and ask Petra to verify the Geneva
          contact.</td><td>A UBS branch appointment or a precise desk to approach, and a way to ask HQ for
          help.</td></tr><tr><td>2. Geneva reception</td><td>Give Corvi’s name and a concrete reason for the
          inquiry; ask for the clerk who handled his visit.</td><td>Jean-Paul Mercier and a private
          conversation. A key or account number helps identify a file; it is not access
          authority.</td></tr><tr><td>3. Mercier’s problem</td><td>Explain their purpose and offer a
          verifiable safeguard for his testimony, or use the trust’s formal request.</td><td>The escrow
          copy, the name Kurt Hausmann, and Sonnenberg Privatklinik. No essential clue depends on winning
          one roll.</td></tr><tr><td>4. Follow the transaction</td><td>Ask who supplied the specimen and
          where he went.</td><td>Mercier’s witnessed booking account, followed by Graf’s returned call
          confirming that Corvi attended, treatment happened and he departed. Give
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.jCO2OHblFeteicpl]{I49 — Petra Fax
          — Graf’s Returned Call} only after that call succeeds.</td></tr><tr><td>5. Petra’s
          briefing</td><td>Request clinic background, a contact, transport and appropriate
          support.</td><td>A location, approach, Dr. Elizabeth Graf’s name, a medical-supplier introduction,
          and the limits of HQ knowledge.</td></tr><tr><td>6. Departure</td><td>Choose the purpose of their
          clinic visit and preserve the bank evidence.</td><td>Tickets from Geneva to Zurich, onward road
          transport to Sonnenberg, and a specific next conversation.</td></tr></tbody></table><h3>The
          answers the DA must keep straight</h3><p><strong>Hausmann:</strong> the paying patient at
          Sonnenberg, not the bank clerk and not a physician. <strong>Corvi:</strong> the supplier who
          travels there with the case; the bank proves his intended destination, while Graf’s actual
          callback or clinic records establish his attendance and departure. A pending callback is still
          unconfirmed knowledge for the players. <strong>Mercier:</strong> handled the paperwork, saw the
          closed case and arranged Corvi’s onward journey; he never examined the specimen.
          <strong>Petra:</strong> can research a public clinic and arrange contacts; she cannot remotely
          reveal an unrecovered medical chart.</p><p><strong>The bank bargain:</strong> CHF 500,000 into an
          ecclesiastical escrow account in Vaduz, handled through UBS, for one of twelve specimens and an
          experimental oncology treatment. The bank retains the documents. Corvi leaves with the physical
          case. A file reference is not a statement that the Sangreal remains in a bank vault.</p><h3>Image
          discipline for this
          session</h3><p>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.lOsCniEBTy2c974w]{I06
          — The Escrow Transfer Slip} now visibly names Hausmann, Corvi and Sonnenberg alongside the escrow
          terms; the bank statement authenticates and explains them.
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.TqsNZiq5wWnCyrO1]{I24 — Bank
          Staff Record} names Jean-Paul Mercier and his Geneva night-desk role.
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.NvsqxXBP29kM6SVV]{I25 — Geneva
          Escrow Request Register} shows the unaltered escrow request register with Hausmann, the trust
          office and Corvi. Claudia’s preliminary telephone inquiry is openly explained in
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.AHvJ7rboPnaNlsnN]{I56 — Claudia’s
          Train Brief — Preliminary UBS Inquiry} on the train.
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.SI5TGjifT8qC6Epu]{I26 — Corvi at
          Cornavin} shows Corvi at Cornavin beside a coach marked 2 and a departure board reading ZÜRICH HB.
          It corroborates the Zurich rail leg, not his arrival at Sonnenberg or an exact departure
          time.</p><p>Share only earned player-facing card content or read-aloud passages. Keep this
          walkthrough and DA notes private.
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.6RWEHDPMeZJFj86J]{I23 — Night
          Deposit} retains its 22:41 surveillance timestamp and a matching wall clock, with no fixed
          calendar date. Supply the date from the bank’s authenticated record using the established campaign
          chronology. Nobody must solve a lettering defect to continue.</p><h3>Pacing and the stopping
          point</h3><p>Allow roughly 10–15 minutes for the train, 10 for the approach, 35–50 for Mercier and
          the records, and 15–25 for calls and departure. These are table-time guides. In-world time follows
          actual travel and substantial delays, not a separate shift for every question. Finish this segment
          as the Geneva–Zurich train leaves; the Sonnenberg ward encounter belongs to the next
          chapter.</p><h3>Current-session direction</h3><p>Arrival at Sonnenberg is after the injection,
          with the twenty-four-hour conversion complete. The party still expects the Grail; Graf reveals
          twelve vessels of blood, Hausmann demonstrates the human consequence, and an authenticated
          authority call establishes organized vampire interests. The Church did not know Corvi’s treatment
          plan. Claudia remains helpful and trusted; her volunteered Rome telephone inquiry is not a clue to
          her covert allegiance.</p><h3>Written clues after useful calls</h3><p>Whenever a call yields a
          useful fact, contact, promise or lead, give a persistent clue card as a dated call summary or fax.
          Name the speaker, source, question, actual answer, uncertainty and next action. Use an established
          receiving desk and update the same card after later callbacks; retain the prior dated report when
          status changes. Ordinary appointment and care arrangements deserve cards too. Do not auto-reveal
          the entire packet or put DA secrets in player text.</p><p>Campaign packet by release scene:
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.K7J4ZglpZYcLZtlz]{I46 — Corvi at
          Roma Termini},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.NYALXJz5OsFM9NiK]{I47 — Petra Fax
          — UBS Interview Contact},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.jkM2vcnrfoWRsfMI]{I48 — Petra Fax
          — Sonnenberg Contact and Route},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.jCO2OHblFeteicpl]{I49 — Petra Fax
          — Graf’s Returned Call},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.S4tdujDWKjlTTBAJ]{I50 —
          Sonnenberg reception movement extract},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.8SS0DFQjCYTpMvCF]{I51 — Graf’s
          treatment and custody statement},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.hnuSDQF9W6V31IPm]{I52 — Telephone
          message retained at reception},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.tBZisHd3TtN3q961]{I53 — Petra Fax
          — Lingotto Callback},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.SQSfCR6mxHrJY1Kt]{I54 — Petra Fax
          — Clinic Handover and Rail Plan},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.2Ai06nmzdOoBVUdV]{I55 — Authority
          Call — The Other Vampires},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.AHvJ7rboPnaNlsnN]{I56 — Claudia’s
          Train Brief — Preliminary UBS Inquiry}. For this train/Geneva segment, use
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.K7J4ZglpZYcLZtlz]{I46 — Corvi at
          Roma
          Termini}–@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.jCO2OHblFeteicpl]{I49 —
          Petra Fax — Graf’s Returned Call} and
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.AHvJ7rboPnaNlsnN]{I56 — Claudia’s
          Train Brief — Preliminary UBS Inquiry} alongside the existing bank cards.
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.S4tdujDWKjlTTBAJ]{I50 —
          Sonnenberg reception movement
          extract}–@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.2Ai06nmzdOoBVUdV]{I55 —
          Authority Call — The Other Vampires} belong to the later clinic/departure scenes; do not send them
          in the Geneva fax packet.</p>
    - name: The Case — Blood, Peace, and Custody
      type: text
      text:
        content: >-
          <h2>The Case — Blood, Peace, and Custody</h2><h3>The case in one paragraph</h3><p>The Vatican has
          lost twelve phials of undiluted blood. A fragile accommodation with vampire houses depends on their
          inability to expand without thinning their own power. The Church fears that this pure source could
          start new, potent lines outside that limit. The old houses fear a different possibility: Rome might
          forcibly “cure” them, ending the condition that keeps centuries of age at bay. Corvi steals the
          reserve to prevent its use as a weapon, then authorizes one reckless treatment to finance an escape
          and prove that the blood can heal. Hausmann’s transformation destroys that hope. Claudia, convinced
          she is preventing an outbreak, helps the investigators find Corvi while secretly arranging to
          deliver the blood to elders who intend to burn the threat to themselves.</p><h3>The name is the
          first invitation</h3><p><strong>San Greal:</strong> the expected Holy Grail reading. Church custody,
          ritual language, secrecy, and a missing sacred object all support the players’ assumption. Nobody
          needs to falsely confirm a cup. Sabbatini says “the entrusted contents”; Ghiberti says “the
          custody”; Claudia says “what was sealed.” Let the players supply the Grail.</p><p><strong>Sang
          Real:</strong> the blood reading—blood royal, treated by these custodians as holy blood. This is the
          mission’s play on words, not a language exam. Use the user’s intended “holy blood” sense as
          ecclesiastical meaning rather than claiming “real” literally translates as “holy.” A player who
          spots blood on the first morning is correct and gets useful traction. Neither the narrator nor a
          frightened NPC needs to withhold the word until a designated act.</p><blockquote><p>Corvi, if the
          players have not already made the connection: “You put the break after the saint. Put it after the
          blood. They let you look for a cup because a cup cannot breed.”</p></blockquote><h3>The peace is
          practical, not benevolent</h3><p>The houses police uncontrolled feeding and unauthorized turning;
          the Church refrains from a general hunt and conceals incidents it can contain. Ordinary people are
          not parties to the bargain. Each new turning divides an already diminished inheritance: expansion
          now costs a house strength it cannot readily replace. This arithmetic, more than friendship, makes
          coexistence preferable to war. The phials threaten the arithmetic. A new human recipient can become
          a powerful predator without drawing on an existing house’s depleted blood. Whether such a new line
          could be stabilized and propagated is unproven; the demonstrated conversion is already enough to
          make the Church fear a rebirth. Do not invent a safe way for elders to drink the source and become
          stronger: for an existing vampire, the same fluid is a
          purge.</p><table><thead><tr><th>Faction/person</th><th>Fear</th><th>What it does at the
          table</th><th>What can change its conduct</th></tr></thead><tbody><tr><td>Sabbatini / Holy
          Alliance</td><td>New potent predators make the current limits meaningless; a rival may force a
          general war</td><td>Demands sealed custody, tracks recipients, restricts transit, pressures
          witnesses</td><td>A credible joint containment plan, documented inventory, protection from public
          panic, independent witnesses to any transfer</td></tr><tr><td>Registry 16 / Basarab
          elders</td><td>Rome can end their condition by force; the theft looks like preparation for
          deployment</td><td>Uses mortal intermediaries, orders incineration, keeps bare skin away from the
          blood</td><td>Verified destruction or supervised neutral custody may buy a pause; no trust in Rome’s
          promise alone</td></tr><tr><td>Corvi</td><td>The reserve becomes a weapon; then his own attempted
          healing creates the threat he fled</td><td>Leaves a route to his research, lies about how certain he
          was, refuses an unaccountable return</td><td>Admit Hausmann matters, preserve records, propose
          independent custody</td></tr><tr><td>Claudia</td><td>A relapse into uncontrolled vampirism that her
          Order taught her to prevent</td><td>Opens doors, protects civilians, secretly reports and prepares
          extraction</td><td>Proof her handlers serve the threatened elders plus an alternative she can
          believe will contain the blood</td></tr><tr><td>Graf / Hausmann</td><td>Responsibility for the
          experiment / imminent death</td><td>Graf seeks safety and accountability; Hausmann first seeks help,
          then struggles with hunger</td><td>Specific protection and medical caution, not a sermon about
          monstrosity</td></tr></tbody></table><h3>What the blood does: three kinds of
          evidence</h3><table><thead><tr><th>Status</th><th>Truth</th></tr></thead><tbody><tr><td>Established
          in play by the clinic</td><td>One treated human loses his cancer and develops predatory physiology.
          This does not establish the origin of a religion or the outcome for every possible
          recipient.</td></tr><tr><td>Established by comparative evidence</td><td>The same vector attacks
          vampiric stasis. I09 supplies the human mechanism; I12 is a historical claim; I38 or direct
          observation supplies physical vampire evidence. Similar-looking ash alone is not a
          diagnosis.</td></tr><tr><td>Relic mechanics for the DA</td><td>CT1 activates through open tissue or
          mucous membranes; human conversion takes 24 elapsed hours. On the four-shift case board that is four
          shifts. Existing vampires use the artifact’s Endure Difficulty 5 outcome: failure brings ash in
          three rounds; success leaves a mortal with organ failure. CT2 operates within 100 m when unshielded.
          CT3 is darkness, lead-antimony, below 4°C, treated linen. Preserve the existing artifact bonuses and
          fracture table.</td></tr></tbody></table><p>The apocryphon attributes the source to Christ and
          speaks of unmaking a curse. It is evidence of what its author believed, not a laboratory proof of
          divine biography. Let the players debate theology. The operational discovery is sufficiently
          concrete: the danger depends on the recipient. The elders call forced mortality a killing; the
          Church calls keeping the reserve deterrence. Neither word settles the ethics.</p><h3>Before the
          investigators arrived</h3><ul><li>Months earlier, Corvi translated the suppressed text and found
          memoranda contemplating coercive use of the reserve. Sabbatini keeps contingency options open; he
          has not authorized the theft or the Swiss injection. Corvi knows those are not the same thing and
          fears the distinction will not last.</li><li>Corvi approached Hausmann’s representatives before the
          theft. The CHF 500,000 is a conditional escrow routed through a dormant ecclesiastical trust Corvi
          can access—not proof the whole Church commissioned an experiment. He promised one speculative
          treatment to buy protection and fund a remote refuge. It was a deliberate moral failure, not an
          innocent accident.</li><li>Claudia’s Registry assignment predates the breach. She searched Corvi’s
          room during his absence. Later, while sorting the recovered office papers, she used their
          UBS/Hausmann reference for a preliminary telephone inquiry from Rome before boarding. She volunteers
          that limited inquiry on the train; it was not a physical Geneva visit or knowledge of the treatment
          plan.</li><li>Corvi used the Lodestone to release the entire closed attaché. The vault held a case
          cradle, not eleven exposed phials. The Grey Watcher entered later to record the breach and confirm
          Corvi had succeeded; he did not help Corvi operate the cradle. Gerard’s actual testimony at your
          table remains authoritative.</li></ul><h3>Custody ledger — count physical vessels, not
          orders</h3><table><thead><tr><th>State</th><th>Intact vessels</th><th>Where the missing contents
          went</th></tr></thead><tbody><tr><td>Vault / theft</td><td>12</td><td>None</td></tr><tr><td>Hausmann
          treated</td><td>11</td><td>Phial 1 consumed in the treatment; Graf retained trace material on slides
          and in test apparatus</td></tr><tr><td>Turin negotiation</td><td>11</td><td>The proposed second sale
          fails. An offer or invoice is not delivery. Corvi refuses once Hausmann’s condition is
          known</td></tr><tr><td>Unopposed Novara breach</td><td>10</td><td>One of those eleven breaks during
          the struggle. Ten remain for the aircraft</td></tr><tr><td>After player intervention</td><td>Record
          the actual count</td><td>Any prevented injection, spill, seizure, or recovered vessel changes the
          ledger and supersedes a preprinted planned manifest</td></tr></tbody></table><p>Do not subtract
          another whole vessel for Graf’s daylight test; it uses residue from the clinical sample. The default
          Turin daylight scare is a threatened exposure or a failed latch, not a mandatory third lost phial.
          The 10/12 marking in I44 is the default post-Novara inventory. If players prevent events, describe a
          corrected manifest instead of presenting a contradictory photograph as current evidence.</p><h3>The
          default clock: what happens only if nobody changes it</h3><table><thead><tr><th>Day
          remaining</th><th>Attempt / condition</th><th>Useful
          signal</th></tr></thead><tbody><tr><td>14–13</td><td>Theft discovered; Corvi crosses into
          Switzerland; cell begins inquiry</td><td>Already played in this campaign: preserve the session
          record</td></tr><tr><td>11</td><td>Geneva escrow and onward travel</td><td>Bank can identify the
          intended clinic even before treatment</td></tr><tr><td>10</td><td>Hausmann receives first phial if
          no one intervenes</td><td>Graf can still be reached; an early cell can stop the
          procedure</td></tr><tr><td>9–8</td><td>Conversion completes after 24 hours; ward crisis deepens;
          Corvi heads to Turin</td><td>Calls for help, staff absences, intercept
          I08</td></tr><tr><td>7</td><td>Church attempts restrictive transit measures</td><td>Petra warns of
          checks before they cost the cell time</td></tr><tr><td>6</td><td>Broker attempts second purchase;
          Claudia receives extraction permission</td><td>Corvi refuses the sale; an intercepted message
          exposes the plan</td></tr><tr><td>4–3</td><td>Claudia attempts theft if free, equipped, and trusted;
          Church moves on clinic if evidence remains</td><td>Rosary/vehicle/route preparations, visit from
          security, warning call</td></tr><tr><td>2, late evening</td><td>If Claudia has delivered the case to
          the abbey, pack attacks at about 23:45</td><td>Gate watch, broker information, a rendezvous
          message</td></tr><tr><td>1, 01:15</td><td>If cargo and aircraft are ready, planned flight
          departs</td><td>I15 is filed intent, not immunity to intervention</td></tr></tbody></table><p>The
          22:15 toll stub and approximately 23:45 attack belong to the same final evening in the unattended
          branch. Claudia may have reached Novara earlier; that stub records her last local road movement, not
          necessarily a direct drive from Turin. The aircraft departs in the following early hours. Day boxes
          are planning markers; actual scene time controls a chase. Do not trigger this sequence twice because
          both a person track and faction track mention it.</p>
    - name: Rome — The Empty Plinth, Already Visited
      type: text
      text:
        content: >-
          <h2>Rome — The Empty Plinth, Already Visited</h2><figure><img
          src="modules/neon-relic-mission-sangreal/assets/art/scenes/totm/tm-vault-arrival.webp" alt="Vault IX
          — use only for a return visit" style="width:100%;height:auto"><figcaption>Vault IX — use only for a
          return visit</figcaption></figure><h3>Why this scene matters</h3><p>The vault establishes a theft,
          insider access, and an institution refusing to explain its own safety procedures. It does not need
          to solve the blood. In this campaign it has already been investigated. Use this chapter as a
          reference for follow-up questions, not an instruction to rediscover everything.</p><h3>Three
          questions the site can answer</h3><table><thead><tr><th>Question</th><th>Evidence</th><th>What it
          does not establish</th></tr></thead><tbody><tr><td>How was the case
          released?</td><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.9VyBQIhDJHgbR5PF]{I01
          — The Burnt Electromagnet Relay} and
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.Hx9jKUQtU1Jmwh2O]{I36 — Suppressed
          Index Card}: compare the damaged relay with the suppressed Lodestone handling record</td><td>A
          visual residue match is a lead; analysis and the custody register link the tool to Corvi’s access.
          No fingerprint of Sabbatini appears by implication.</td></tr><tr><td>Who carried it
          away?</td><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.MH3cXgf0hGIZzcO3]{I02
          — CCTV Reel #87-04} identifies Corvi and a rail lead; Gerard’s log and
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.gpEG58FggEY1toq2]{I18 — Second
          Descent} record a later visitor</td><td>A later visitor need not be an accomplice. A distant nun
          cannot be positively identified from a veil.</td></tr><tr><td>Why was it kept this
          way?</td><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.msJvTkZUJb1CBYqF]{I19
          — Plinth Detail, Brass Plate},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.1XbUUYGspeQ02iZH]{I03 — The Excised
          Codex Register},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.mD3LMAVAHB3FK3rL]{I43 — The Case,
          1964} show a named, purpose-built custody and an older documentary trail</td><td>Lead cannot be
          identified from the darkness of a shadow. A cold room does not prove its contents were
          harmless.</td></tr></tbody></table><h3>Play Ghiberti’s divided
          loyalty</h3><p>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-npcs.Actor.qTZgbWUDP7brGEJy]{Father
          Ghiberti} wants the archive intact and his years of custodianship to mean something. He fears that
          cooperating will be written up as negligence. Let an investigator label a copy, sign a receipt, or
          promise the original will remain in his care. He then helps because somebody is treating his work as
          evidence rather than loot.</p><blockquote><p>“I can tell you how it was kept. They never thought I
          needed to know why. Those are not the same assurance.”</p></blockquote><p>If asked for the contents,
          he admits the old workshop inventory describes vessels once he retrieves it. He cannot explain their
          biology. If asked why the Church kept a weapon, he can produce a record, not a speech about vampire
          policy. If the players already saw the word “phials” yesterday, do not try to restore the cup
          mystery. The question becomes what filled them.</p><h3>Gerard: use the man the players already
          met</h3><p>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-npcs.Actor.ufJyCkCXfjy64nCx]{Gerard,
          Vatican Gendarme Duty Officer} is a guard, not a secret supernatural expert. Preserve his answers,
          manner, and whatever he admitted. If they request a copy, he can arrange a signed transcription
          through normal authority. If the second descent remains undiscovered, a specific comparison of the
          lift time and gate record can reveal it now. Do not rewrite a previous truthful answer as a lie just
          to produce intrigue.</p><p>For unplayed details only: 03:14 is the camera’s Corvi exit time; 04:02
          is the later lift event. They are forty-eight minutes apart, not hours. The Watcher is the default
          later visitor. His record of events comes from the corridor camera and his own observations, not a
          photograph he impossibly took of himself from across the room.</p><h3>If the cell confronts
          Claudia</h3><p>She admits that her role includes reporting to her superiors. That is ordinary
          liaison work. Asked about the distant figure, she neither supplies a confident identification nor
          invents an alibi on the spot; she asks to see the complete reel. A map stamp
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.auf7Uqb4VPNc9Hp7]{I05 — Embossed
          Stamp, Map Casing} is a reason to investigate her affiliations, not an automatic confession. Present
          a documentary mismatch she must answer, then let the players decide what precautions to
          take.</p><h3>Costs and exits</h3><p>One focused archive search can recover the linked group of
          records. Do not charge a separate shift for every card. Forced access raises a complaint and may
          bring a guard; the records do not evaporate. A blocked archive request has a duplicate in Corvi’s
          papers or an official request through Petra. The apartment is the immediate lead; rail records
          provide a parallel route to Geneva. The later visitor is an optional surveillance lead, not a
          required second investigation before leaving Rome.</p><h3>When a player says “I take a
          picture”</h3><p>Offer
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.xbQZgy0hY46bSstX]{C01},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.i25Abf2EuijkRk8O]{C02},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.fSDtZMcDsd07gqaY]{C03},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.g5lsJIx2eJvMkI7v]{C22},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.SW0k0q32vBGhnPUB]{C24}.
          Match the subject, access, lighting, and current state. These ordinary snapshots contain no hidden
          puzzle. A photograph of damage records damage; it does not identify its cause. Use a clean NPC
          portrait for a simple introduction. F-series photographs contain additional evidence and need their
          own provenance.</p><p><strong>Maps:</strong>
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.FyPnU7Tmzk9RJebD]{BM01 — Vault
          and lift vestibule}. Use only if movement or access becomes tactically relevant.</p>
    - name: Corvi’s Rooms and Geneva — Follow the Bargain
      type: text
      text:
        content: >-
          <h2>Corvi’s Rooms and Geneva — Follow the Bargain</h2><p><strong>Current session:</strong> the party
          is aboard the train out of Rome. Start at <strong>The train out of Rome</strong> below. The
          apartment section remains as a reference to the earlier investigation; do not replay
          it.</p><figure><img
          src="modules/neon-relic-mission-sangreal/assets/art/scenes/totm/tm-quarters-arrival.webp"
          alt="Corvi’s quarters — earlier Rome investigation"
          style="width:100%;height:auto"><figcaption>Corvi’s quarters — earlier Rome
          investigation</figcaption></figure><h3>Scene 1 — A room searched for the wrong
          thing</h3><blockquote><p>The room is smaller than its reputation. There is a cup beside the window,
          a book left open, and a chair pushed back just far enough for a tired man to stand. Then you see the
          drawers. Each is open by the same careful amount. Behind the painting, the safe has a neat hole
          where its lock should be. Whoever did this was looking for something, and had time to put the
          valuables back.</p></blockquote><p><strong>Scene purpose:</strong> turn Corvi from a name into a
          person who made preparations, and turn “north” into a specific bank and account. Ask who inventories
          the room, who watches the corridor, and whether Claudia is left alone with any papers. Those answers
          establish later opportunities; no secret roll silently gives her the evidence.</p><h3>Search in
          three passes</h3><table><thead><tr><th>Place / action</th><th>Give</th><th>Why it
          matters</th></tr></thead><tbody><tr><td>Desk and open Vulgate; ordinary deliberate
