          <tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.TqsNZiq5wWnCyrO1]{I24 —
          Bank Staff Record}; Mercier voluntarily shows his retained staff-card photograph or the manager
          verifies it</td><td>Portrait, fingerprint, MERCIER / JEAN-PAUL, night desk, private banking, Geneva
          and vault-access stamp; transfer reference 4409-C and CHF 500,000 alongside.</td><td>The manager can
          authenticate the card. There is no printed employment date or full transaction history.</td></tr>
          <tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.NvsqxXBP29kM6SVV]{I25 —
