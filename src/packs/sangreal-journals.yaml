          corroboration of the bank
          records</h4><p>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.TqsNZiq5wWnCyrO1]{I24
          — Bank Staff Record} identifies Mercier, his night-desk/private-banking role and vault access. The
