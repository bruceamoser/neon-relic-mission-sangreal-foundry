    - name: 'Setup Checklist'
      type: text
      text:
        content: |
          <h2>Setup Checklist</h2>
          <ul>
            <li>Run the module Content Installer to import/update all eleven packs — clues, cast cards and photographic evidence land in their own folders — including the 27 scenes. See Scene Art — GM Index.</li>
            <li>Set the case clock to Day 14, Shift 1 — Morning.</li>
            <li>Start the cell at L1 (Vault IX) with Sister Claudia Vane attached; both L1 and L2 are open starting nodes.</li>
            <li>Corvi is already in Geneva with the attaché; I02/I04 unlock L3 when earned.</li>
            <li>Keep the fracture table open in a chat tab — any Gear Die 1 while handling the case earns a roll.</li>
            <li>Track O1/O2 countdowns on the organization items (or on paper) as the DA brief milestones fire.</li>
            <li>Between sessions: no resets needed; the clock persists. After the case, reset per-case-file talents via the system's session tools.</li>
          </ul>
          <p><em>Mission 2: Recover the Sangreal begins at the Novara-Cameri tarmac. See the bridge journal.</em></p>

    - name: 'Scene Art — GM Index'
      type: text
      text:
        content: |
          <h2>Scene Art — GM Index</h2><p>26 approved backgrounds: 16 theater-of-the-mind views and 10 gridless battle maps, plus the existing landing scene. Use Settings → Mission: Sangreal → Import / Update Content to install or refresh them. New scenes start hidden from navigation and inactive. Activate scenes deliberately at the correct reveal point.</p><p><strong>Revealing a scene at the table:</strong> open the installed world scene, frame the view you want, then click <em>Activate Scene</em> — every connected player is pulled to it automatically; no permission change is needed. Setting <em>Accessibility</em> to <em>All Players</em> and ticking <em>Show in Navigation</em> (Scene Configuration → Basics) is optional: it only lets players re-open the scene themselves from their own scene list. Players cannot browse this module's compendium packs (they are locked to the GM), so nothing in this index leaks early on its own.</p><p>Backgrounds are q85 WebP, 6.55 MB total. No generated masters ship. Each scene keeps its art on a single hidden Level named <em>Background</em> — that is Foundry v14's native storage for scene artwork, not a multi-floor setup, and it needs no upkeep. Maps use manual token placement; no walls, dynamic lights, automatic encounters or measured tactical scale are configured. The two Lingotto maps are separate floor/catwalk views. Location and walkthrough links open the compendium originals; use installed world scenes for play.</p><section class="sangreal-scene-links"><h3>Scene backgrounds</h3><ul><li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.e5iULuABev6xj4n0]{TM01 — Hydraulic lift vestibule and descent}</li><li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.fk4iveJh9oz2DMDa]{TM02 — Vault IX arrival}</li><li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.1xPFy0jFa4uqHScD]{TM03 — Corvi quarters arrival}</li><li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.WYkoHrGfng0UZ3lZ]{TM04 — Geneva bank exterior}</li><li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.w9Gp844xc19nFp0a]{TM05 — Private viewing room}</li><li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.kr4nu0sVNfrcGAJq]{TM06 — Sonnenberg forest approach}</li><li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.1HRljmcL11d0CPLS]{TM07 — Blacked-out third-floor ward}</li><li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.jP9jheucndZOEHLE]{TM08 — Surgical theatre refuge}</li><li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.n61lTAaEdGfuCmPZ]{TM09 — Lingotto assembly hall}</li><li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.eu4Vy9WBx8iGce1d]{TM10 — Lingotto rooftop in rain}</li><li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.EzLXgHrD8SOahA0Z]{TM11 — Breached abbey approach}</li><li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.URoAcs3MRSAqrakE]{TM12 — Abbey dining hall threshold}</li><li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.tlrpaGAGQo3Qhk98]{TM13 — Abandoned airfield hangar}</li><li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.c2expM3HLZD9xsBD]{TM14 — Council chamber}</li><li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.72tNLODObuOLLVyV]{TM15 — Claudia convent room}</li><li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.JdEbI0D8H7Vju6im]{TM16 — Night train compartment}</li><li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.FyPnU7Tmzk9RJebD]{BM01 — Vault and lift vestibule}</li><li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.KpUAj1DanbE4NuOW]{BM02 — Apartment and guarded corridor}</li><li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.b2nGfJTzx9PeMk09]{BM03 — Bank vault level}</li><li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.jpOPWY