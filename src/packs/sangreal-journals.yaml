# Revised cohesive mission — 2026-09-30. Preserve prior-session continuity.
---
- _id: sangreal-journal-start
  name: 'Mission: Sangreal — Start Here'
  type: journalEntry
  pages:
    - name: Overview
      type: text
      text:
        content: >-
          <h2>Mission: Sangreal — Revised Case File</h2><p>DA-only. The active campaign resumes after the
          investigators’ first Vatican night: Vault IX researched, Gerard questioned, Corvi’s rooms still
          unvisited. Open
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-journals.JournalEntry.1jFv8DVo6EW0AEkG]{SANGREAL-87-091
          — DA Walkthrough} and begin with <em>Start Here — Resume at the Vatican</em>. Do not reset the live
          board or replay established scenes.</p><p>The Grail assumption gives way to pure blood, a peace
          sustained by dilution, the Church’s fear of renewed proliferation, and the elders’ fear of an
          imposed cure. Evidence answers concrete questions; NPCs act on these fears. The ending follows
          actual custody and intervention.</p><p>The existing 27 scenes, detailed evidence photographs, clean
          portraits, F-series documentary images, C01–C24 investigator snapshots, and sound playlist remain
          available. C-series photographs are ordinary records without hidden puzzles. The new walkthrough
          embeds existing theatre-of-the-mind art and links the relevant cards and maps; no new
          high-resolution art is required.</p>
    - name: How to Run
      type: text
      text:
        content: >-
          <h2>How to Run the Revised Mission</h2><ul><li>Read the walkthrough’s first two pages; review the
          next location, not a prescribed day.</li><li>Preserve prior-session facts. Ask what the players
          already know; do not grant undiscovered evidence as a recap.</li><li>Give a core observation for an
          appropriate search. Use rolls for cost, safety, detail, and discretion.</li><li>Use the custody
          ledger: twelve initially, eleven after the clinical phial, still eleven after the refused second
          sale, ten after the conditional abbey break.</li><li>Show only images whose people, events and
          conditions actually exist. Keep DA notes and whole journals private.</li><li>A captured Claudia
          cannot automatically escape; a grounded aircraft cannot automatically take off. Change future
          attempts in response.</li><li>Use the Evidence appendix for what a card proves and what action it
          enables. It replaces the old image-easter-egg solution guide.</li></ul>
