          <tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.SI5TGjifT8qC6Epu]{I26 —
          Corvi at Cornavin}; only if a transport-security liaison obtains the platform photographer’s print
          and provenance</td><td>Corvi with the case at Genève-Cornavin, ZÜRICH HB on the departure board, a
          coach marked 2, trolley and newspaper reader.</td><td>This corroborates the Zurich rail leg, not a
          06:40 departure, first-class compartment or clinic arrival. The bank testimony and clinic callback
          still establish the Sonnenberg connection.</td></tr> <tr><td>F07; only if someone actually
          photographs the interview</td><td>Mercier seated with papers, brass lamp, UBS glass and a reference
          slip protruding from his pocket.</td><td>No guaranteed windowless booth, flat hands or secret text.
          Use the clean portrait for introduction; a pocket slip alone is not his confession.</td></tr>
          </tbody></table> <p>When players take ordinary pictures, offer C07 for the bank waiting area, C08
          for the open vault door only if admitted to that level, and C09 for the clerk at the counter only if
          that is what they actually photograph. These snapshots do not create bank access or replace a
          readable statement. Keep the source documents and who authenticated them with the evidence
          record.</p> <h3>Departure — the train toward Sonnenberg</h3><p><strong>DA scene:</strong>
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.JdEbI0D8H7Vju6im]{TM16 — Train
          compartment}. <strong>Player reference:</strong>
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.jkM2vcnrfoWRsfMI]{I48 — Petra Fax —
          Sonnenberg Contact and Route}, updated with the booked rail and car connection.</p><p><strong>DA
          sound cue — Geneva departure ambience:</strong> <audio controls preload="none"
          src="modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-rail-corridor.mp3"></audio> <a
          href="modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-rail-corridor.mp3">Open sound</a>.
          Optional; keep dialogue clear.</p> <p>Before buying tickets, state the current leads in the players’
          own terms. If something is missing, give the corresponding source a chance to answer; do not narrate
          an unearned conclusion.</p> <ul><li><strong>Why Hausmann?</strong> He is the paying principal for
          the proposed treatment, named by the authenticated bank statement.</li><li><strong>Why
          Sonnenberg?</strong> The escrow names it; the instruction sheet identifies it as the treatment
          location and Graf’s callback supplies a real contact.</li><li><strong>Why look for Corvi
          there?</strong> Mercier arranged his journey there with the case. State separately whether the
          clinic confirms expected arrival, current presence or departure.</li><li><strong>What will we do on
          arrival?</strong> Meet Graf, locate Corvi if still present, establish what was supplied and whether
          it was used, and protect the patient and remaining material as the evidence warrants.</li></ul>
          <p>Petra books <strong>Geneva-Cornavin → Zurich main station, then a car to Sonnenberg</strong>.
          There is no train platform inside the clinic. Use the next suitable service in the campaign
          timetable; as a table-planning allowance, reserve roughly four hours for the rail leg and under an
          hour for the road connection. These are fictional session allowances.
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.SI5TGjifT8qC6Epu]{I26 — Corvi at
          Cornavin} shows a Zurich destination, but supplies no reliable departure time or duration. Record
          departure and expected arrival before advancing the clock.</p> <p>Ask who carries the originals,
          whether HQ has a duplicate, what protection Mercier accepted, whether the agreed callback and fax
          copies arrived, and whether the clinic expects them. A concise answer to each is enough. If no
          appointment is confirmed, the next scene begins at reception with the bank evidence and a request
          for Graf; the door is not magically open.</p> <blockquote><p>The porter hands back the tickets.
          Zurich first; the clinic car will meet you there. As the train draws away from Geneva, the bank
          envelope lies between you. A payment, a patient, a doctor, and the journey Corvi asked a clerk to
          arrange. For the first time, the next stop has a person you can ask for.</p></blockquote>
          <p><strong>Stop this segment here.</strong> Carry the completed injection, what the players have
          actually confirmed about Corvi, the warning/appointment and witness protections into
          <strong>Sonnenberg — A Patient Before a Monster</strong>. Do not show a damaged ward, transformed
          patient or post-treatment file before those events exist.</p> <p><strong>Scene links:</strong>
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.JdEbI0D8H7Vju6im]{TM16 — Night
          train compartment};
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.WYkoHrGfng0UZ3lZ]{TM04 — Geneva
          bank exterior};
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.w9Gp844xc19nFp0a]{TM05 — Private
