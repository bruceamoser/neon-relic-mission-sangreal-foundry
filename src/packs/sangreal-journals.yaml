          Cornavin} · <a
          href="modules/neon-relic-mission-sangreal/assets/art/intel/i26-cornavin-platform-v2.webp">Geneva →
          Zurich photograph</a></td><td>Update I48 with the booked train, Zurich pickup and appointment
          status. I26 is optional and requires its own obtained print; it is not the earlier Rome
          photograph.</td></tr></tbody></table><p><strong>Keep for Sonnenberg:</strong> I50–I55, clinical
          images, the blood disclosure and organized-vampire testimony. An honest answer to a direct player
          question can change discovery timing, but the routine Geneva packet does not contain future
          evidence.</p><h4>Resolve only the gaps they actually have</h4> <table><thead><tr><th>What they
          know</th><th>Useful action</th><th>What it supplies</th></tr></thead><tbody> <tr><td>Geneva and
          probably UBS; no name or number</td><td>Give Petra Corvi’s full name, description and the actual
          travel/bank evidence. Ask for an introduction concerning a missing ecclesiastical
          custodian.</td><td>Petra verifies the Geneva private-banking desk through the bank switchboard and
          requests a callback. The desk checks its own visitor/duty log and names Mercier as the clerk who can
          receive the inquiry. It does not disclose account contents.</td></tr> <tr><td>The rag-paper cipher,
          incompletely decoded</td><td>Send a transcription through HQ or work on it in the
          compartment.</td><td>The existing square yields GENEUA / UBS / HAUSMANN / DDKI / C. Latin U/V gives
          GENEVA; ABCDEFGHIK = 1234567890 gives 4409. Give the indexing key openly when requested. This
          identifies a file, not permission to open it.</td></tr> <tr><td>Hausmann or 4409-C already
          established</td><td>Include that exact identifier in the appointment request.</td><td>The bank can
          find the right transaction without searching multiple departments. Keep the account contents for the
          interview.</td></tr> </tbody></table> <p>Use a station telephone at an established stop, an existing
          secure radio, or the telephone at Cornavin. A transcription can be read aloud; a photograph or fax
          requires an actual sending point. Petra gives the branch desk and a callback time, or leaves a
          message at the named station/hotel desk the agents chose. Do not make her return call appear on a
          nonexistent mobile telephone.</p> <blockquote><p>Petra: “I can get a request in front of the right
          person. Tell me whose name you have, what makes this urgent, and where you can take a call. An
          introduction will get you a conversation. The clerk will still need a reason to trust
          you.”</p></blockquote> <p>Claudia, if still accompanying them, offers to make the introduction
          herself. Accepting is useful; declining works equally well through Petra. She made a preliminary
          telephone inquiry from Rome after finding the UBS/Hausmann reference in Corvi’s office papers. She
          explains it openly in the scene below; it was not a prior physical visit to Geneva.</p> <h4>Claudia
          volunteers her preliminary call</h4><p><strong>Note supplied by Sister Claudia Vane aboard the
          Rome–Geneva train.</strong></p><blockquote><p>“There is one call I should put into the file. While
          sorting the papers from Corvi’s office, I found the UBS reference beside Hausmann’s name. Before we
          boarded, I telephoned the Geneva desk to check whether it was a live lead. Mercier would not discuss
          the account, but he said a verified inquiry should come through his duty manager. I was trying to
          get us past a closed door. Here are my notes.”</p></blockquote><p><strong>Source:</strong> the
          actual UBS/Hausmann reference in the recovered office papers.<br><strong>Contact:</strong> Jean-Paul
          Mercier, Geneva private-banking desk, through the duty manager.<br><strong>Result:</strong>
          interview route identified; no account papers or medical details released.<br><strong>Next
          step:</strong> verify the appointment and supporting documents through Petra or the bank
          desk.</p><p>Give
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.AHvJ7rboPnaNlsnN]{I56 — Claudia’s
          Train Brief — Preliminary UBS Inquiry}. Play this as a useful briefing from a trusted colleague,
          without hesitation cues, meaningful glances or a confession of wrongdoing. Mercier can corroborate
          the limited inquiry. She did not obtain treatment details. The Church was unaware of Corvi’s sale
          and injection; use of a trust account does not make it a sanctioned Church operation.</p><h4>DA
          truth and the live clock</h4> <p>Write the present state in your notes before the bank interview.
          Corvi’s route is <strong>Rome → UBS Geneva → Sonnenberg near Zurich → Turin after Hausmann’s
          deterioration</strong>. At Geneva he signs the conditional transaction and asks Mercier to arrange
          onward rail travel and a clinic car from Zurich. He takes the closed case with him. He goes to
          Sonnenberg to supervise the release of one specimen to Graf for Hausmann; he does not ship the whole
          case to the bank’s Vaduz account.</p> <p><strong>Current-session setup:</strong> Hausmann has
          already been injected before the current Geneva inquiry. By the cell’s arrival at Sonnenberg at
          least twenty-four hours will have elapsed, and Corvi has left with eleven intact phials. Record
          dates consistently; do not delay the party to force the treatment. A warning now prevents further
          administration and improves patient care. The bank’s old paperwork describes the proposal; it does
          not certify the completed injection or tell Mercier what the preparation was. The players still
          think they are pursuing the Grail.</p><h3>Geneva arrival — getting through the first
          door</h3><p><strong>DA scene:</strong>
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.WYkoHrGfng0UZ3lZ]{TM04 — Geneva
          bank exterior}.</p><p><strong>DA sound cue — rain outside the bank:</strong> <audio controls
          preload="none"
          src="modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-rain-street.mp3"></audio> <a
          href="modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-rain-street.mp3">Open sound</a>.
          Optional; keep dialogue clear.</p> <p>At Cornavin, give the agents time for the arranged callback, a
          cloakroom and a taxi. For the session, use the Geneva branch’s Rue du Rhône private-banking
          entrance. This is the fictional encounter location, not an instruction to research a modern branch.
          If no appointment was made, they can telephone the bank from the station or walk to reception.</p>
          <blockquote><p>At the bank, the rain stops at a strip of brass across the doorway. Beyond it are
          polished stone, a clock and a receptionist who leaves her pen poised over a visitors’ book. “The
          name of the person you wish to see?”</p></blockquote> <p><strong>Reception is a routing problem, not
          the main social challenge.</strong> Saying “We are following Monsignor Matteo Corvi’s movements; he
          visited your night desk with a metal case” is enough to ask the duty manager to identify the
          attending clerk. Petra’s appointment or the recovered file number speeds that check. Without either,
          the manager verifies their identity and checks the recent duty log: Jean-Paul Mercier handled the
          visit. Allow roughly thirty minutes for this local check, not a whole investigation shift.</p>
          <p>The receptionist will not disclose a balance, hand over a vault key or confirm a patient’s
          medical history. She can send a named, verified inquiry to an employee. If they merely demand “the
          stolen Grail,” ask whom they seek and what verifiable detail they can offer. State the missing
          requirement plainly.</p> <p><strong>If Mercier is off duty:</strong> the manager telephones him;
          Mercier agrees to return or speak at a nearby hotel lounge because Corvi’s name makes the impending
          inquiry real. Set a meeting within the hour. If the bank is closed, its night desk takes the
          callback request and Mercier meets off site with his own retained copies; internal originals await
          opening hours. No vault break-in is necessary.</p> <p><strong>If they want a formal route:</strong>
          Petra contacts the ecclesiastical trust’s authorized officer and asks that officer to request a
          limited transaction confirmation. Corvi’s access to the trust does not make the party account
          holders. The officer can authorize disclosure of the trust’s own transaction, not other clients’
          files or a patient chart. The duty manager verifies the request and releases the confirmation
          described below. Treat this as one substantial delay, up to one operational shift if it displaces
          other work; state the expected wait before the players choose it.</p> <h3>Scene 2 — Mercier’s
          problem</h3><p><strong>DA assets:</strong>
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.w9Gp844xc19nFp0a]{TM05 — Viewing
          room} · @UUID[Compendium.neon-relic-mission-sangreal.sangreal-npcs.Actor.nlfuIXX32doYRfx1]{Jean-Paul
          Mercier} ·
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-sfx.Playlist.wxpL4Q4Ozfnvh71z]{Sound
          playlist}</p><p><strong>Quiet desk clock</strong> <audio controls preload="none"
          src="modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-clock-tick.mp3"></audio> <a
          href="modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-clock-tick.mp3">Open sound</a>. Keep
          beds quiet; stings only when the described event occurs.</p> <figure><img
          src="modules/neon-relic-mission-sangreal/assets/art/scenes/totm/tm-viewing-room.webp" alt="The
          private viewing room for Mercier’s interview" style="width:100%;height:auto"><figcaption>Share TM05
          after the party obtains the meeting.</figcaption></figure> <blockquote><p>Mercier waits until the
          door closes. “You said Corvi. Tell me first: are you here for the man, his property, or the people
          who dealt with him?” He rests one hand on a thin envelope. “My initials are on a transaction whose
          purpose no one properly explained. I will not be the only person left to answer for
          it.”</p></blockquote> <p><strong>Play him as a witness with a specific exposure.</strong> Mercier
          processed the conditional escrow under Corvi’s signing authority and used the expedited route
          despite an incomplete explanation of the specimen. He retained the transaction carbon because he
          fears being blamed for the bank’s inadequate review. He wants an accurate statement, counsel and an
          independent duplicate. His problem concerns his handling of the transaction, not a bribe from
          Claudia. He knows the instructions and travel request, not blood, vampires or the clinical
          outcome.</p><h4>Run the negotiation in three steps</h4> <ol><li><strong>Establish why this is their
          inquiry.</strong> Let the players show one relevant recovered document, identify Corvi and the case,
          or use Petra’s verified introduction. Mercier confirms he dealt with Corvi. He asks what happened to
          the custodian. This confirmation requires no Manipulate roll.</li><li><strong>Make his request
          explicit.</strong> He asks for a private statement, a named person outside the bank to hold a
          duplicate, and a chance to contact counsel before his handling of the transaction is reported. He is
          asking for a record that protects him from being singled out, not a promise that his wrongdoing
          vanishes.</li><li><strong>Let the cell choose a workable safeguard.</strong> They can take a signed
          receipt listing the copies received and lodge his statement with Petra, arrange counsel and a later
          formal interview, or let the trust officer request the transaction confirmation through the manager.
          Once a reasonable safeguard is actually arranged, Mercier releases the core information. Do not
          require a roll after the players have solved his problem.</li></ol> <blockquote><p>Mercier: “Put
          down that I supplied the carbon voluntarily. Send a duplicate to someone who can answer for it. Then
          I will tell you who paid and where the priest asked me to send him.”</p></blockquote> <p><strong>If
          the players bluff, press or offer money without a safeguard:</strong> use the existing Manipulate
          Difficulty 2. Success secures immediate discreet cooperation. Failure means he asks for the manager
          or counsel and the formal route takes longer; it does not remove Sonnenberg from the records. Tell
          the players the cost before they commit. Money alone can persuade him but buys neither silence from
          every witness nor automatic future loyalty. Threats or violence bring security, end private access
          and put their names into the incident log. The trust confirmation and direct clinic research remain
          available through Petra.</p> <p><strong>What he gives first:</strong>
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.lOsCniEBTy2c974w]{I06 — The Escrow
          Transfer Slip} and the bank statement below, plus his account of Corvi’s travel. <strong>What needs
          a further request:</strong> the security still
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.6RWEHDPMeZJFj86J]{I23 — Night
          Deposit}, his staff record
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.TqsNZiq5wWnCyrO1]{I24 — Bank Staff
          Record}, the Geneva escrow request register
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.NvsqxXBP29kM6SVV]{I25 — Geneva
          Escrow Request Register}. These optional records require his consent or the manager’s cooperation;
          they are not prerequisites for the clinic lead. In an off-site meeting he has his retained
          transaction carbon, not the entire bank archive.</p> <h4>Put the evidence on the table in this
          order</h4> <p><strong>1. The photographed escrow carbon —
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.lOsCniEBTy2c974w]{I06 — The Escrow
          Transfer Slip}.</strong> Show
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.lOsCniEBTy2c974w]{I06 — The Escrow
          Transfer Slip}. Have the players read the visible fields: 4409-C; paying principal Kurt Hausmann;
          treatment location Sonnenberg Privatklinik, Zurich; supplier Monsignor Matteo Corvi; CHF 500,000;
          ecclesiastical escrow account, Vaduz; and “Acquisition of Primary Specimen (1 of 12) — Experimental
          Oncology Protocol.” Let them state what they think it means. The receipt explicitly says that it
          does not certify treatment. It identifies the bargain, not an injection or the specimen’s biological
          nature.</p> <p><strong>2. The accompanying bank statement.</strong> Mercier reads from the
          transaction instruction sheet and signs the following extract, or the duty manager supplies it
          through the trust request. Hand over this text with
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.lOsCniEBTy2c974w]{I06 — The Escrow
          Transfer Slip} as a separate document; it is not tiny lettering hidden in the photograph.</p>
          <blockquote><p>Transaction reference 4409-C. Paying principal: Kurt Hausmann. Treatment location:
          Sonnenberg Privatklinik, Zurich. Supplier and authorized representative of the receiving
          ecclesiastical trust: Monsignor Matteo Corvi. Amount lodged: CHF 500,000. Purpose: acquisition of
          one primary specimen from a group of twelve for an experimental oncology treatment. Release of
          escrow requires acknowledgment of receipt under the treatment agreement. This confirmation records
          the agreement and deposited funds; it does not certify medical administration.</p></blockquote>
          <p>Mercier has inspected the identity and instruction records, so the statement ties
          <strong>Hausmann → money → proposed treatment → Sonnenberg</strong> and <strong>Corvi →
          supply</strong>. A player asking “Where is Hausmann named?” can read the paying-principal field on
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.lOsCniEBTy2c974w]{I06 — The Escrow
          Transfer Slip}; the clerk authenticates it against the instruction sheet. A principal’s name on a
          transaction does not prove he personally attended the Geneva counter.</p> <p><strong>3. Mercier’s
          travel testimony.</strong> When asked whether Corvi also went to Sonnenberg, answer directly:</p>
          <blockquote><p>“Yes. He asked me to arrange the train to Zurich and to telephone Sonnenberg for a
          car to meet him there. I made that call. He said he needed to speak to Doctor Graf before anything
          was used. He left with the metal case. The papers stayed here.”</p></blockquote> <p>Mercier can sign
          that account and let the manager verify the outward booking request against the desk message book.
          That book records a booking and clinic pickup request, not a completed arrival. If the agents do not
          think to ask about Corvi’s movements, Mercier volunteers, “You said you were looking for him. Do you
          want the journey I arranged?” This gives them an obvious next question without delivering the
          clinic’s secrets.</p> <h4>Answers to likely questions</h4> <table><thead><tr><th>Player
          question</th><th>Mercier’s answer and boundary</th></tr></thead><tbody> <tr><td>Is the stolen case
