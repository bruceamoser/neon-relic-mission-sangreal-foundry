          leverage.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.gpEG58FggEY1toq2]{I18
          — Second Descent}</td><td>L1 / lift footage and established Gerard testimony</td><td>Optional:
