              <tr><td>Airfield (Novara-Cameri)</td><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.WvJ6ZeOsll96y9wc]{C19 — Empty hangar interior}</td><td>observation</td></tr>
