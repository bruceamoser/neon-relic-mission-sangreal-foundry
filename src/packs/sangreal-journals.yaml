          vampire identification; use the existing exposure
          rules.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.fnZm0Dl4nHlnas4G]{I39
          — Tarmac, 01:15}</td><td>Airfield / actual loading or sourced surveillance</td><td>Conditional:
          loading</td><td>Aircraft and cargo are visible at a particular moment; the photograph does not end
          the scenario.</td><td>Intervene while possible or document actual
          departure.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.phIsjPz5WHarCoVB]{I40
          — Her Effects, Laid Out}</td><td>Claudia’s recovered belongings</td><td>Support: affiliation and
          route</td><td>Her documents connect her to the Order and rendezvous. The 22:15 toll records the last
          local passage before the default 23:45 attack, not a guaranteed direct Turin trip.</td><td>Compare
          I14; protect her if alive. Do not lay out corpse evidence for a
          survivor.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.XWAylCZFSBMFiPpB]{I41
          — The Green Lamp}</td><td>L7 / earned surveillance</td><td>Optional: prepared response</td><td>A
          Registry dossier proves the office had intelligence, not that Sabbatini already identified Claudia.
          Waiting guards are a warning, not an unavoidable ambush.</td><td>Ask for the file and put external
          witnesses on the
          meeting.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.xOiejtMxuQ1Q4vDv]{I42
          — L'Entità Team, 1987}</td><td>Authenticated operational photos / L7 or broker</td><td>Support:
          enforcement capacity</td><td>Identified officers, vehicle and equipment tie a team to L’Entità.
          Procurement links are not proof Gerard is a killer.</td><td>Prepare protection and challenge or
          interrupt a specific
          order.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.mD3LMAVAHB3FK3rL]{I43
          — The Case, 1964}</td><td>L1 / workshop archive</td><td>Support: container history</td><td>The 1964
          container was commissioned for older vessels. The prelate appears in a separate later session from
          I22.</td><td>Ask for handling documentation. A workshop order does not establish the contents’
          theological
          origin.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.AwrHknjihUDqll80]{I44
          — Consignment Markings}</td><td>Hangar / default cargo consignment</td><td>Support:
          inventory</td><td>10/12 means one clinical vessel spent and one lost at the abbey in the default
          route. The second sale was refused. Reused Vatican packaging indicates a logistics lead, not
          universal Church complicity.</td><td>Check actual count and handler; record any player-caused
          changes.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.R4F2ocb2JCwwfKOB]{I45
          — Airfield Briefing Sheet}</td><td>Wayfinder or dispatch / sourced briefing</td><td>Support:
          airfield planning</td><td>The marked 01:15 slot is a planned clearance; a reconnaissance image can
          predate the intended flight. A crossed-out aircraft was excluded by analysis, not a compulsory decoy
          trap.</td><td>Confirm current tower status and choose an interception
          approach.</td></tr></tbody></table><h3>Persistent call records and current-session
          documents</h3><p>Share each at its actual release point; record who supplied it and what remains
          unverified.</p><ul><li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.K7J4ZglpZYcLZtlz]{I46
