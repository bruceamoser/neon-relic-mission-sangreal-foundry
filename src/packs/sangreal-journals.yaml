          <p><strong>Card codes are for your eyes.</strong> Players see a card and its name — never a code,
          and never a filename. Codes are zero-padded so folders sort in the order the case is meant to be
          found (<em>I01, I02, I03…</em>, not <em>I1, I10, I2</em>).</p>

          <p>Documents are cross-linked: cards link to the location they are found at and the NPC they belong
          to, NPCs link to their organizations and locations, and both the Information Web and the
          walkthrough's own links resolve to the world copies after import.</p>
