          destination before boarding another train</h3><p><strong>DA sound cue — one ring when Graf’s
          incoming callback arrives:</strong> <audio controls preload="none"
          src="modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-telephone-ring.mp3"></audio> <a
          href="modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-telephone-ring.mp3">Open sound</a>.
          Optional; keep dialogue clear.</p><p><strong>Written follow-up:</strong>
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.jCO2OHblFeteicpl]{I49 — Petra Fax —
          Graf’s Returned Call}. Petra records who answered and sends the summary only after the call; do not
          share this card for an unanswered message.</p> <p>Use the bank’s switchboard, a hotel telephone or
          Petra’s callback channel. The players now have Sonnenberg’s name, Hausmann’s name, Corvi’s role and
          Graf’s name. A sensible request is: “We have information about the preparation Monsignor Corvi is
          supplying for Herr Hausmann. Please ask Dr. Graf to call us urgently.” The receptionist forwards
          that safety message without disclosing patient records. The cell gives a real callback location and
          a detail Graf can verify, such as Corvi’s name and the transaction purpose.</p> <p>Graf returns a
          verified call during the planning scene when reachable: “Corvi came here concerning Herr Hausmann.
          The preparation has already been administered. Corvi has left. I need to speak to someone about what
          happened to the patient. Bring the supplier papers.” She offers a meeting and stops any further use
          after a credible warning. She does not identify the blood or give an entire chart over the initial
          call. If pressed for a specific danger, answer honestly from what she can observe; do not conceal an
          answer merely to protect a reveal.</p><p>Petra records the actual callback and faxes
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.jCO2OHblFeteicpl]{I49 — Petra Fax —
          Graf’s Returned Call} to the agreed bank/hotel desk. If Graf is unreachable, the desk confirms only
          receipt of the safety message; mark the callback pending and withhold
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.jCO2OHblFeteicpl]{I49 — Petra Fax —
          Graf’s Returned Call}. Arrival is still actionable from the bank evidence.</p><p><strong>Honest
