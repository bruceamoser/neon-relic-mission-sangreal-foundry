- _id: sangreal-journal-start
  name: 'Mission: Sangreal — Start Here'
  type: journalEntry
  pages:
    - name: Overview
      type: text
      text:
        content: >-
          <h2>Current session — Geneva completed</h2><p>The party is boarding Petra’s booked train to Zurich
          after the bank investigation. Open
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-journals.JournalEntry.1jFv8DVo6EW0AEkG]{DA
          Walkthrough}, first-page current-state note, then the Sonnenberg chapter. Petra’s sealed station
          packet precedes the clinic alarm, young-vampire battle, Graf’s blood disclosure and Claudia’s
          breakdown. Keep this journal private.</p><h3>Earlier session reference</h3><h2>Mission: Sangreal —
          Current Session</h2><p>DA-only. The investigators have left Rome and boarded the train toward
          Geneva. They have evidence of Corvi’s route and suspect UBS. Open
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-journals.JournalEntry.1jFv8DVo6EW0AEkG]{SANGREAL-87-091
          — DA Walkthrough}, begin with <em>Start Here — Aboard the Train to Geneva</em>, then run <em>The
          train out of Rome</em> in the Corvi’s Rooms and Geneva chapter. Preserve the live day, shifts,
          discoveries and relationships.</p><p>The Geneva sequence supplies reception access, Mercier’s
          concrete bargain, readable evidence with provenance, Corvi’s onward route, Petra’s Sonnenberg
          briefing and departure for Zurich. The clinical encounter follows in the next chapter. Share
          individual earned cards, not the DA walkthrough.</p>
    - name: How to Run
      type: text
      text:
        content: >-
          <h2>How to Run the Revised Mission</h2><ul><li>Read the train-resume page and the Geneva sequence;
          prepare the bank statement and Petra briefing. Review the clinic’s live treatment state before
          advancing travel.</li><li>Preserve prior-session facts. Ask what the players already know; do not
          grant undiscovered evidence as a recap.</li><li>Give a core observation for an appropriate search.
          Use rolls for cost, safety, detail, and discretion.</li><li>Use the custody ledger: twelve
          initially, eleven after the clinical phial, still eleven after the refused second sale, ten after
          the conditional abbey break.</li><li>Show only images whose people, events and conditions actually
          exist. Keep DA notes and whole journals private.</li><li>A captured Claudia cannot automatically
          escape; a grounded aircraft cannot automatically take off. Change future attempts in
          response.</li><li>Use the Evidence appendix for what a card proves and what action it enables. It
          replaces the old image-easter-egg solution guide.</li></ul>
