          samples</td><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.D18a1YRCEQu27KHw]{I09
          — Histopathology Log: Marrow Graft} and supporting notes, if samples exist; the supplied
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.9NpgA6XbC6AKGYEY]{I16 — The
          Quiescence Formula (CT3)} storage leaf</td><td>Changes observed in this patient and usable
          containment instructions. Ordinary photographs cannot establish all vector mechanics.</td></tr>
          <tr><td>Ward desk; staff release clinical
          documentation</td><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.1dPSK2h5z6DX5Eab]{I28
          — Photophobia Test 02:40}, or
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.QEO98GDqJtZlL08l]{I30 — Ward 3,
          Corridor Camera} from the retained recording, only after those events</td><td>Burns or a corridor
          breach that actually happened. Staff identify the patient and date; these are corroboration, not
          required keys to Turin.</td></tr> <tr><td>Lab test folder; Graf authenticates a completed
          test</td><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.F6S9nFRmRvOKLqLf]{I32
          — Daylight Test: Combustion} only if residue was already tested in daylight</td><td>Destruction of
          residue from the first administration. The visible 07:12 is a time of day, not a conversion
          deadline. No new experiment is required.</td></tr> </tbody></table> <p>A purposeful search of the
          right file finds the core record. Rolls can affect speed, discretion, damage avoidance or gaining
          guarded testimony. If Graf refuses custody of originals, she can authenticate copies; if
          incapacitated, the duty clinician opens the records for the safety response and distinguishes
          documented facts from unknowns. If records have actually been destroyed, reception’s visit and
          onward message still supply the pursuit lead. Do not make every alternate witness know Graf’s
          private thoughts.</p> <h3>Scene 5 — The onward message: why Turin follows Sonnenberg</h3>
          <p><strong>Default departed branch:</strong> before leaving, Corvi used the gate payphone to call
          his Turin intermediary. He then gave reception a forwarding contact for Graf’s medical update.
          Separately, the intermediary called the clinic switchboard, left extension 418 and directions for
          a clinical courier, and asked that a written summary be sent with anyone following Corvi.
          Reception retained the message with the car booking. These routine actions create S3; no secret
          recording is needed.</p> <div class="handout"><h4>S3 — Telephone message retained at
          reception</h4><p>Persistent clue card:
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.hnuSDQF9W6V31IPm]{I52 — Telephone
          message retained at reception}.</p><p><strong>For:</strong> Dr. Elizabeth
          Graf.<br><strong>Regarding:</strong> Monsignor Corvi / Hausmann follow-up.<br><strong>Forwarding
          contact left by Corvi:</strong> Lingotto freight-office switchboard, Torino; ask for extension
          418.<br><strong>Return call:</strong> a man identifying himself as Corvi’s intermediary confirmed
          that contact and asked for a written account of the treatment’s outcome.<br><strong>Directions
          supplied by caller:</strong> Lingotto works, Turin. Report to the leased freight-office entrance;
          ask for the supervisor’s booth meeting. Call extension 418 to confirm the
          appointment.<br><strong>Corvi’s stated intention:</strong> travel there with his case to seek
          protection.<br><strong>Received:</strong> [actual date/time]; copied by [reception
          witness].</p></div> <p><strong>What S3 proves:</strong> Corvi intended to meet a contact at
          Lingotto; the contact can be called. It does not prove he arrived, sold anything, or knows his
          patron’s full agenda. The clinic car booking independently places his next physical step at Zurich
          HB. A returned call on the next page tests whether the meeting is current.</p> <p><strong>Why the
          broker answers:</strong> he has promised his clients access to Corvi’s remaining reserve. He wants
          the medical report before committing more money, and thinks an approaching clinical courier or
          recovery team may make the deal possible. He offers a meeting, not ownership of the phials.
          Corvi’s later refusal of a second sale remains intact.</p> <p><strong>If Corvi is still
          here:</strong> S3 does not yet exist. He can disclose the contact in negotiation, or the cell can
          find his contact slip during an actually authorized search. Confront him about custody now; use
          the questions from the Lingotto chapter here if appropriate. If he surrenders the reserve, do not
          send the party to Turin to recover it again. The broker becomes an optional lead into who wanted
          it.</p> <p><strong>If the cell skips the ward:</strong> reception and Graf can give S1 and S3
          without requiring combat. State the unresolved patient emergency and arrange a separate medical
          response if requested. Pursuing Corvi early is a meaningful choice; it does not erase Hausmann or
          magically resolve his care.</p> <h3>Close the clinic investigation</h3> <p>Have the players
          distinguish three conclusions: <strong>Corvi brought the case here; the clinic used one phial; the
          remaining case left toward a reachable Turin contact and reception witnessed his
          departure.</strong> Ask what they want done for Hausmann and Graf while they pursue it. Continue
          with <strong>Leaving Sonnenberg — Corvi’s Contact and the Turin Train</strong> for the actual
          callback, handover and departure.</p> <p><strong>Scene links:</strong>
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.JdEbI0D8H7Vju6im]{TM16 — Night
          train compartment};
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.kr4nu0sVNfrcGAJq]{TM06 —
          Sonnenberg approach};
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.1HRljmcL11d0CPLS]{TM07 —
          Blacked-out ward};
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.jP9jheucndZOEHLE]{TM08 —
          Theatre refuge};
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.jpOPWYTG4Yqt6hk4]{BM04 — Ward,
          theatre and lab}. Use damaged interiors only when their condition matches play.</p> <h3>Open the
          earned evidence images</h3><p>Each card link above opens its reference text. Direct photographs:
          <a href="modules/neon-relic-mission-sangreal/assets/art/intel/i27-hausmann-intake.webp">I27
          image</a> · <a
          href="modules/neon-relic-mission-sangreal/assets/art/intel/i28-hausmann-burns.webp">I28 image</a>
          · <a href="modules/neon-relic-mission-sangreal/assets/art/intel/i29-injection-log.webp">I29
          image</a> · <a
          href="modules/neon-relic-mission-sangreal/assets/art/intel/i30-ward-hallway-cctv.webp">I30
          image</a> · <a
          href="modules/neon-relic-mission-sangreal/assets/art/intel/i31-sonnenberg-stakeout.webp">I31
          image</a> · <a
          href="modules/neon-relic-mission-sangreal/assets/art/intel/i32-daylight-test.webp">I32 image</a>.
          Share only after the described evidence exists and is obtained.</p>
    - name: "Leaving Sonnenberg — Corvi’s Contact and the Turin Train"
      type: text
      text:
        content: >-
          <h2>Leaving Sonnenberg — Corvi’s Contact and the Turin Train</h2> <p><strong>Start with the
          clinic’s actual outcome.</strong> For this session, Corvi has gone with eleven intact phials,
          Hausmann was killed, escaped through the ward window, or was contained according to the battle’s
          actual outcome, and the injured Graf can authenticate the clinical record. Keep actual containment
          and injuries from the previous scenes. If the cell prevented treatment, detained Corvi, recovered
          the case or lost control of the ward, change those facts before running this page. The next
          destination must follow the case’s real location.</p> <h3>Scene 6 — Call the contact, secure a
          reason to travel</h3><p><strong>DA assets:</strong>
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.jP9jheucndZOEHLE]{TM08 — Clinic
          refuge} · @UUID[Compendium.neon-relic-mission-sangreal.sangreal-npcs.Actor.1NyMTuAFNPtTOebK]{The
          Turin Intermediary} ·
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-sfx.Playlist.wxpL4Q4Ozfnvh71z]{Sound
          playlist}</p><p><strong>Telephone ring, only for an incoming call</strong> <audio controls
          preload="none"
          src="modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-telephone-ring.mp3"></audio> <a
          href="modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-telephone-ring.mp3">Open sound</a>.
          Keep beds quiet; stings only when the described event occurs.</p> <p>Use the clinic office
          telephone with Graf’s consent, a public telephone, or Petra’s established callback channel. S3
          provides a named switchboard and extension; an operator or Petra’s directory contact can connect
          the fictional Lingotto freight office. The number need not be guessed from a photograph. The cell
          decides whether to give its real identity, present itself as Graf’s courier, ask Graf to speak
          first, or have Petra make the inquiry.</p> <blockquote><p>The switchboard transfers the call. A
          man answers without giving his name. “If this concerns the doctor’s report, I can receive it. If
          it concerns Monsignor Corvi, tell me whether you bring protection or another claim on his
          property.”</p></blockquote> <p>The intermediary wants the condition report and a way to complete
          his promised access to the reserve. He is willing to meet a credible caller. Graf can identify the
          treatment and appointment; the cell’s account of the Geneva bargain also establishes a real
          connection. Do not require them to surrender originals, samples or the case to learn where the
          meeting is.</p> <table><thead><tr><th>The players’ question or approach</th><th>The broker’s
          answer</th><th>What the DA records</th></tr></thead><tbody> <tr><td>“Is Corvi there?”</td><td>If
          he has reached Turin: “He has agreed to a private meeting here.” If still travelling: “He is
          expected. I have not seen him yet.” He will carry a message to Corvi when physically
          able.</td><td>This is the broker’s report until corroborated. Never claim arrival before the
          travel time permits it.</td></tr> <tr><td>“Where do we meet?”</td><td>“Lingotto works, leased
          freight-office entrance. Extension 418 will have your name. The supervisor’s booth, once you have
          been admitted.” He supplies local directions and asks for their arrival estimate.</td><td>Enter
          the agreed meeting time and contact in the travel notes. Petra can arrange a Turin station pickup
          to that entrance.</td></tr> <tr><td>“Why do you need the report?”</td><td>“A great deal has been
          promised about what is in that case. I would prefer to hear what actually happened.” He admits
          representing a buyer seeking another purchase if asked directly.</td><td>An offer for a second
          vessel is not a completed sale. His patron’s identity remains a further question.</td></tr>
          <tr><td>“We need Corvi alive and the case sealed.”</td><td>He accepts a discussion under those
          terms. He asks the party to avoid bringing a conspicuous armed Church delegation. They may counter
          with neutral witnesses and independent custody.</td><td>No automatic surrender of weapons or
          evidence is required to continue. Negotiation sets the meeting conditions.</td></tr>
          <tr><td>Threats or an exposed bluff</td><td>He ends the call or insists on a supervised meeting.
          The switchboard contact and physical destination remain known.</td><td>Reduce cooperation and
          prepare guards or surveillance consistent with his resources. Do not erase the address.</td></tr>
          </tbody></table> <p><strong>A direct Corvi call is possible.</strong> If he is present with the
          broker and willing, let him speak. He can confirm his location and explain his fear. He may accept
          a neutral rendezvous or surrender arrangement instead of the supervisor’s booth. Follow that
          agreement; the Lingotto conversation is portable. If the cell has already secured him at
          Sonnenberg, this call is an inquiry into a prospective buyer, not a compulsory pursuit.</p>
          <h4>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.Uanb3MKR6vPcGHq5]{I08 — The
          Swiss PTT Intercept Tape} — Optional corroboration with a real source</h4> <p>The PTT recording is
          not a standard attachment to every HQ response. Use
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.Uanb3MKR6vPcGHq5]{I08 — The Swiss
          PTT Intercept Tape} only if the campaign has established a lawful/operationally authorized
          monitoring source that actually covered Corvi’s payphone call. The DA records who monitored which
          line, when, and how the retained copy reaches the cell. A request made after an unrecorded call
          cannot create an old recording.</p> <p>If such a retained recording exists, the cell gives Petra
          the clinic payphone location, Corvi’s departure window and the named operation/contact. Petra
          requests the relevant excerpt through that liaison. A transcript can be read over a verified
          callback or faxed to the clinic office with permission; a reel requires a courier. Give an ETA for
          that actual retrieval, normally an hour or more in this fictional session. The cell can depart
          using S3 while the copy follows to a named destination.</p> <p>The existing
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.Uanb3MKR6vPcGHq5]{I08 — The Swiss
          PTT Intercept Tape} image visibly quotes the broker’s offer for <em>eleven vessels</em> at
          Lingotto and marks “Torino — int. 418.” Corvi’s opening complaint is on the supplied
          transcript/audio, not visible in that picture. Use that version only after one phial was consumed
          and the severe human outcome was known to Corvi. If those conditions are absent, withhold the
          image and historical transcript; use the current live call. Emblems on the recording equipment do
          not identify an additional faction.</p> <p>After the call, give
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.tBZisHd3TtN3q961]{I53 — Petra Fax
          — Lingotto Callback} with the actual answer. A failed connection produces a pending update, not a
          fabricated successful transcript.</p><h3>Scene 7 — Leave a care plan, not an abandoned crisis</h3>
          <p>Petra asks for three things: <strong>patient condition, people needing protection, and
          hazardous material actually present</strong>. She contacts the Covenant medical coordinator,
          obtains a named receiving clinician and gives the clinic an ETA. For a playable default, allow
          ninety minutes from a complete request to a local response team reaching Sonnenberg, adjusted for
          established availability. This is a fictional operational allowance. A request placed on the train
          can shorten the remaining wait; the team still needs the updated hazard briefing.</p>
          <table><thead><tr><th>Loose end</th><th>Practical handover</th><th>If the party departs
          earlier</th></tr></thead><tbody> <tr><td>Hausmann killed, escaped or contained</td><td>If dead,
          secure the body as hazardous clinical evidence without further exposure. If escaped, report his
          description, last route and victims to Petra for a specialist search; no patient transport is
          booked for an absent man. If contained, evacuate bystanders and maintain controlled access and
          light precautions; brief the receiving team on actual capabilities and unknowns. If moving him is
          unsafe, the team takes over containment in place.</td><td>Graf and staff must explicitly accept
          the interim plan. If they cannot hold the situation, say so and let the party choose to stay,
          split, request more help or knowingly leave the risk.</td></tr> <tr><td>Graf, nurse and other
          witnesses</td><td>Medical treatment for injuries, a named protection contact and agreed transport.
          Graf can remain until the clinical handover, then move to an arranged safe address.</td><td>Give
          Petra their actual location and consent; keep a callback. A promise without a responsible person
          is still unresolved.</td></tr> <tr><td>Records, slides and residue</td><td>Photocopy the signed
          statement, treatment chart and onward message. Record which custodian holds originals. Graf packs
          any retained hazardous residue using
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.9NpgA6XbC6AKGYEY]{I16 — The
          Quiescence Formula (CT3)}; ordinary fixed slides are labeled separately.</td><td>A courier or
          medical team can take custody later if a responsible person secures the material. The party does
          not need to carry live residue on a passenger train to follow a lead.</td></tr> <tr><td>The full
          reserve, if recovered here</td><td>Count only through a protected, authorized inspection;
          otherwise preserve the seal and record the last witnessed count. Agree an accountable custody
          destination and the required shielding/cooling.</td><td>Change the travel objective. Turin is an
          optional buyer investigation; do not pretend Corvi still has the recovered case.</td></tr>
          </tbody></table> <p><strong>If the ward breaks during the handover:</strong> warn with a failing
          barrier and Hausmann’s actual movement. Resolve the rescue using the existing map and profile. He
          does not teleport into the forest; an escape requires a route past the people and barriers in
          play. No ghoul appears merely because someone was near the blood. A rupture that reaches dead
          tissue is a separate event governed by the relic’s existing rules, not a default complication.</p>
          <h3>Establish the other vampires — a verified authority call</h3> <p><strong>Run this discovery
          before departure even if no Church recovery team comes.</strong> After Graf identifies the blood
          and Hausmann’s condition, she asks the cell to notify its contracting authority: there is a living
          recipient and a dangerous remaining reserve. Petra connects the established Sabbatini office
          through the known callback procedure. Claudia assists with the introduction as part of her
          ordinary liaison work. The evidence that vampires are organized comes from the authority, not from
          suspicious conduct by her.</p> <blockquote><p>Sabbatini: “Corvi administered it to a man? We had
          no report of this transaction or this treatment. Keep Hausmann alive and isolated if you can.
          There were vampires long before Herr Hausmann. Some belong to houses with which we maintain
          agreements. What you have described creates a new one outside those agreements. That is why I need
          the reserve recovered unopened.”</p></blockquote> <p>Give answers to the obvious questions.
          <strong>“You knew?”</strong> “We knew what was in our custody. We did not know Corvi had arranged
          a sale or a human treatment.” <strong>“Is the Grail a cup?”</strong> “The stolen object is the
          sealed reserve. Corvi can tell you what he believes its origin to be.” <strong>“Who else wants
          it?”</strong> “The houses have reason to fear its uncontrolled use. Expect people acting for them
          to seek it.” He will confirm the existence of organized vampire interests and ask for a clinical
          report; he does not give a proven history of the blood, all exposure mechanics or a list of covert
          operatives.</p> <p>If the cell refuses Church contact, Petra can route the authenticated clinical
          observations to a Covenant occult-medical duty officer, who confirms from Covenant threat records
          that vampire communities predate this event and that recognized houses act through intermediaries.
          This requires the specialist callback, not Petra suddenly becoming an expert. If the party
          declines both contacts, the broker can explicitly acknowledge that his patrons are one such house
          when asked why they fear the reserve; label that as his claim until corroborated. Offer the
          discovery through these reachable people, without forcing a call or disclosing Claudia’s
          allegiance.</p> <p><strong>What the players should now understand:</strong> the case carries
          dangerous blood; it made Hausmann a vampire; established vampires have interests in the same
          reserve; a broker offering refuge and another purchase is therefore worth investigating. Which
          patron he serves, why the blood affects existing vampires differently, and what Claudia will do
          remain later discoveries.</p> <p>After the verified authority call, give
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.2Ai06nmzdOoBVUdV]{I55 — Authority
          Call — The Other Vampires}. Its timing is after the clinical discovery; the earlier fax packet
          contains no vampire disclosure.</p><h3>Optional pressure — the Church wants custody</h3> <p>Use
          this only if the Alliance track or established surveillance supports a team arriving. It is one
          negotiable pressure scene, not a second mandatory battle before the train. Telegraph the car or
          the receptionist’s announcement while the medical handover is being arranged. The default demand
          is custody of remaining clinical material, recipient names and Graf’s records.</p>
          <blockquote><p>“We understand a recipient survived. We need the material secured and the names of
          anyone exposed. Who is responsible for this ward?”</p></blockquote> <p>The team can verify its
          authority through Sabbatini’s established office. The cell can negotiate joint custody, retain
          authenticated duplicates, offer a sealed inventory and request an independent medical observer. If
          Church custody is unacceptable, call Petra and Sabbatini with a specific alternative. Sabbatini
          can authorize a stand-down or monitored quarantine. His concern is uncontrolled replication and
          the fragile settlement, not an automatic order to murder everyone who knows the secret.</p>
          <blockquote><p>Sabbatini, if directly asked why a surviving patient matters: “We have spent
          generations keeping the numbers steady. If one undivided dose creates another outside that
          agreement, we must know how many doses are still moving.”</p></blockquote> <p>This statement opens
          the political question. It does not prove a sacred origin or a cure. The broker’s fear of imposed
          “treatment” and Corvi’s historical claims can be explored later. Do not deliver the whole
          cosmology as a prerequisite to buying tickets.</p>
          <p>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.OvqUML75EHpXFQ0P]{I31 —
          Sonnenberg, Observed} shows a car with plate SCV 47 outside a blacked-out clinic; its camera and
          thermos are in the observer’s foreground. Show the photograph only if an established observer
          actually obtained and supplied it, and only when the blackout exists. Otherwise describe what the
          cell sees on the road. A plate warrants identification; it does not prove a murder order. The Grey
          Watcher is present only if his actual movements put him here. If caught, he can trade something he
          observed, not the entire unseen case history.</p> <h3>Scene 8 — Return to Zurich HB and board
          toward Turin</h3><p><strong>DA assets:</strong>
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.JdEbI0D8H7Vju6im]{TM16 — Train
          compartment} ·
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-sfx.Playlist.wxpL4Q4Ozfnvh71z]{Sound
          playlist}</p><p><strong>Departure ambience</strong> <audio controls preload="none"
          src="modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-rail-corridor.mp3"></audio> <a
          href="modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-rail-corridor.mp3">Open sound</a>.
          Keep beds quiet; stings only when the described event occurs.</p> <p>When the party chooses to
          pursue the lead, Petra books the next workable <strong>Zurich–Turin rail itinerary with any
          required connections</strong> and a Turin station pickup if requested. The clinic car or another
          booked vehicle returns them to Zurich HB. Do not invent a direct service or re-use the Rome–Geneva
          EC 30 ticket. Use the campaign timetable; reserve under an hour for the clinic-to-station road
          leg, then state the actual selected departure, connections and arrival estimate before advancing
          time.</p> <p>The intermediary confirms a meeting window that accommodates the agreed journey. If
          he can only hold Corvi until a particular time, tell the players before they choose between care
          and pursuit; they can call Corvi, negotiate a delay or change transport. Missing a connection
          changes time and contact arrangements. It does not make the entire Lingotto lead vanish.</p>
          <p><strong>Petra’s departure readback:</strong> “Car from the clinic to Zurich main station. Then
          your booked service toward Turin, with the connections on the itinerary. Your contact is the
          Lingotto freight office, extension 418, supervisor’s booth. I have [named person] responsible for
          the clinic and [named person] holding your duplicate records. Tell me which part is still
          unconfirmed.”</p> <p>If frontier scrutiny is already active, Petra warns of the specific document
          or custody problem before departure and helps seek clearance or another route. Do not spring an
          unavoidable border seizure merely because it is time for the next chapter. A cold shielded case or
          clinical sample needs its own confirmed transport plan; it is not ordinary hand luggage by
          default.</p> <p>Give
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.SQSfCR6mxHrJY1Kt]{I54 — Petra Fax
          — Clinic Handover and Rail Plan} as a dated record of the agreed handover and itinerary. This
          stays on the case board so the players can check who holds each responsibility.</p><h4>Departure
          check — what the players can now say</h4> <ul><li><strong>Why Sonnenberg mattered:</strong> it
          connects the paid proposal in Geneva to a named patient, physician and actual treatment
          state.</li><li><strong>Where Corvi went:</strong> S1 and the driver establish his departure with
          the case to Zurich HB; S3 establishes his intended Lingotto meeting; a live callback establishes
          whatever the broker or Corvi can currently confirm.</li><li><strong>What remains:</strong> eleven
          intact phials at Graf’s last witnessed count after one administration. Do not subtract trace
          samples or an unaccepted second sale.</li><li><strong>Why Turin:</strong> the reachable
          intermediary can bring them to Corvi or explain the proposed buyer, at a named meeting location
          with practical directions.</li><li><strong>Who remains responsible:</strong> name the patient’s
          clinician, witness protection contact and evidence custodian, or openly record what was left
          unresolved.</li></ul> <blockquote><p>The clinic road falls away behind the car. At Zurich station,
          the driver hands over the luggage and the platform instructions. Among your papers are a doctor’s
          signed account, the record of a man leaving with a metal case, and a contact who has agreed to
          speak in Turin. When the train moves, you know what you are following—and who is still waiting for
          help behind you.</p></blockquote> <p><strong>Stop here, aboard the booked train toward
          Turin.</strong> Continue with <strong>Lingotto — Hear Corvi, Decide Custody</strong> on arrival,
          carrying forward the agreed meeting, Corvi’s actual location, the count and Claudia’s actual
          freedom of action. If custody was settled at Sonnenberg, use the next chapter’s confrontation
          questions where that settlement occurs and follow the remaining buyer lead only if the players
          choose it.</p> <h3>If the sequence stalls</h3> <table><thead><tr><th>Problem</th><th>Available
          route forward</th><th>Consequence that remains</th></tr></thead><tbody> <tr><td>Graf will not
          release originals</td><td>Take her account and authenticated copies; reception’s S1/S3 still
          identify the movement and contact.</td><td>Physical clinical evidence remains with its named
          custodian.</td></tr> <tr><td>Graf is unavailable or dead through actual events</td><td>The duty
          clinician can interpret existing charts; reception can authenticate its own records. No witness
          invents Graf’s unrecorded thoughts.</td><td>Some causation or culpability remains uncertain; the
          destination does not depend on her survival.</td></tr> <tr><td>The telephone message was
          destroyed</td><td>If she survives, the receptionist recalls the forwarding contact she wrote;
          otherwise use Corvi’s contact slip if actually recovered or a real retained
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.Uanb3MKR6vPcGHq5]{I08 — The Swiss
          PTT Intercept Tape} intercept. A driver supplies only the station, then Petra can pursue a travel
          inquiry with a stated delay.</td><td>If all sources have been lost, do not conjure a perfect fax.
          State the remaining movement lead and run its investigation.</td></tr> <tr><td>The broker refuses
          the call</td><td>S3 already gives the Lingotto entrance and extension. Travel there to approach
          staff or observe, or ask Graf to send a limited clinical message inviting a callback.</td><td>The
          meeting is unconfirmed and the broker may be guarded.</td></tr> <tr><td>No PTT recording
          exists</td><td>Use S1, S3 and the live callback. They form the complete primary route.</td><td>No
          quoted historical call or extra proof of the eleven-vessel offer.</td></tr> <tr><td>The party
          keeps Corvi and the case at Sonnenberg</td><td>Resolve his explanation and custody here; use the
          broker contact as a voluntary investigation into the intended buyer.</td><td>The campaign changes
          because the recovery succeeded. No mandatory theft resets it.</td></tr> </tbody></table> <h3>DA
          pacing and photograph checks</h3> <p>Allow about ten minutes for travel preparation, fifteen for
          reception, twenty to forty for the ward choice, twenty for Graf’s evidence, and twenty to thirty
          for the callback, care plan and departure. These are table-time guides, not additional clock
          costs. The optional Church scene can replace another pressure scene; it need not lengthen every
          session.</p>
          <p>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.p51PQ2RP2raSDBHp]{I27 — Intake
          Photograph, 09-H} shows the intake baseline.
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.1dPSK2h5z6DX5Eab]{I28 —
          Photophobia Test 02:40} shows the later patient and a XII-1/12 tag; a still image alone cannot
          prove pupil response.
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.VMoT17MWZ543rWHe]{I29 — The
          Injection Log} visibly leaves patient and time fields blank, so always pair it with the separately
          signed S2. @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.QEO98GDqJtZlL08l]{I30
          — Ward 3, Corridor Camera} shows a ceiling figure, damaged lights and a wheelchair by the wall; do
          not call the chair overturned or use its 02:40 timestamp as elapsed time since injection.
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.F6S9nFRmRvOKLqLf]{I32 — Daylight
          Test: Combustion} shows the result of a residue test, not a second consumed vessel. The old
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.dypD1aQAOBWpTyg0]{I11 — The
          Resonance Field (CT2)} freezer illustration is removed from the card because its apparently intact
          bottle confuses the inventory; CT2 is shared as a supported textual synthesis.</p> <p>C10–C12 and
          C23 are ordinary investigator snapshots only when the players actually take matching photographs.
          They cannot establish an unseen event, provide private records or silently add a Watcher. The full
          DA walkthrough stays private; hand out only the earned records and player-facing card text.</p>
    - name: Lingotto — Hear Corvi, Decide Custody
      type: text
      text:
        content: >-
          <h2>Lingotto — Hear Corvi, Decide Custody</h2><figure><img
          src="modules/neon-relic-mission-sangreal/assets/art/scenes/totm/tm-factory-arrival.webp"
          alt="Lingotto — approach before choosing a route"
          style="width:100%;height:auto"><figcaption>Lingotto — approach before choosing a
          route</figcaption></figure><h3>The scene question</h3><p>Can the investigators take custody without
          becoming the next people to use the blood as a weapon? The factory is where motives become
          commitments. Corvi is frightened, culpable, and still capable of making a better choice. Give him
          enough time to answer.</p><blockquote><p>Rain falls through the skylights in separate silver
          columns. High above the floor, one office is lit. A man inside it watches you cross the open space.
          He lifts a telephone receiver, thinks better of it, and puts it down. When he opens the window his
          first question is not who you are. “Is the patient still alive?”</p></blockquote><h3>Establish the
          physical situation</h3><p>Corvi has the case and his notebook in the supervisor’s booth. The broker
          waits for a private audience; the cell may meet him first or avoid him. Claudia is wherever the
          players have actually allowed her to be. The original surveillance image
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.tkYtaX7GeNiTtUeg]{I33 — Lingotto,
          Rooftop, Rain} is appropriate only if its two-person situation occurs; it cannot place her in a
          booth while she stands beside the agents.
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.HprCCHuQXSASoSTQ]{I34 — Assembly
          Hall, Camera 6} can establish a prior crossing, not a missing shadow power.</p><p>Let the team
          choose stairs, cover, observation, or a spoken approach. A single negotiator with an agreed signal
          can succeed. Corvi carries a revolver but seeks an escape, not a firefight. Aggressive intrusion
          makes him withdraw with the notebook; it does not automatically destroy every copy of the
          research.</p><h3>Run the conversation in four exchanges</h3><table><thead><tr><th>The players’
          question</th><th>Corvi’s answer</th><th>What to put on the table</th></tr></thead><tbody><tr><td>Why
          steal it?</td><td>“They had started writing about recipients instead of custody. I thought if I took
          it away they could not turn a contingency into an order.”</td><td>His research and the custodial
          brief @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.WNTzWxpF2S7xU230]{I35 — Breve
          Apostolicum, 1582}. A fear of deployment, not proof that Sabbatini ordered a Swiss
          experiment.</td></tr><tr><td>Why give it to Hausmann?</td><td>“Because he was dying. Because he
          could pay for a place to hide the rest. Because I wanted a good use to excuse the theft. Choose the
          answer you find least forgivable.”</td><td>The escrow
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.lOsCniEBTy2c974w]{I06 — The Escrow
          Transfer Slip} and clinical record
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.VMoT17MWZ543rWHe]{I29 — The
          Injection Log} match his admission.</td></tr><tr><td>What is it?</td><td>“Blood. Kept whole while
          everything descended from it became thinner. In a man it builds a predator. In a predator it
          dismantles what keeps him
          alive.”</td><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.t9kMeFOoglJgJeno]{I12
          — Palimpsest Leaf, Codex} is his textual basis;
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.D18a1YRCEQu27KHw]{I09 —
          Histopathology Log: Marrow Graft} supports part of the mechanism. He distinguishes belief from
          demonstrated clinical fact.</td></tr><tr><td>What would make you surrender it?</td><td>“A count. A
          sealed transfer. Someone outside the Congregation with a copy of the record. And no more
          patients.”</td><td>A concrete custody agreement the players can accept, amend, or
          reject.</td></tr></tbody></table><h3>Corvi’s limits and concessions</h3><p>He initially minimizes
          how early he promised Hausmann a specimen. Confronted with the pre-theft escrow, he admits it
          without a second impossible hurdle. He did not know the human outcome; he did know he lacked a safe
          trial. He has refused the broker’s proposed second sale. That refusal keeps eleven in the case and
          leaves the broker with a paid promise he cannot fulfill.</p><blockquote><p>“If you take it back,
          make him sign for what he is taking. Not a relic. Not a sacred trust. Eleven vessels of blood, and a
          prohibition on putting them into anybody.”</p></blockquote><p>Do not make agreement contingent on
          the players reciting the correct theology. A credible plan and humane treatment move his existing
          guarded disposition. A failed social test can require a witness, more time, or disarming before he
          opens the door. The destination remains negotiable. If the cell has prevented the clinic tragedy, he
          is less desperate and more tempted to defend his experiment; they can confront its risks before
          bodies prove them.</p><h3>The broker gives the vampire fear a
          voice</h3><p>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-npcs.Actor.1NyMTuAFNPtTOebK]{The
          Turin Intermediary} is a mortal contractor. He has promised access to the Basarab house, not
          secretly transported a missing second phial. He thinks the old patrons want to survive a purge. He
          will sell the rendezvous information to save himself if the cell can show his buyers intend to
          remove witnesses.</p><blockquote><p>“You keep asking why they would pay for something that kills
          them. Do you leave a loaded gun in the hand of a man who calls your existence an
          illness?”</p></blockquote><p>He can provide a Novara contact, an airfield handling arrangement, or
          the house’s question about forced treatment. A dragon cufflink corroborates a relationship when
          paired with his records; jewelry alone is not proof of identity or species. If he leaves, his
          telephone contact and vehicle trail remain alternate routes. He does not retroactively sell a
          rendezvous six weeks before it was selected.</p><h3>Three legitimate
          outcomes</h3><ul><li>Independent custody: Corvi surrenders to the cell with conditions. They can
          leave the factory with him alive and the case secure.</li><li>Church return: Corvi can be persuaded
          if the cell secures auditable conditions. This moves the climax to the Council; Claudia and Registry
          must respond to the actual transfer.</li><li>Refusal or confrontation: Corvi retreats or negotiates
          from another position. The broker and surveillance pressure create urgency, but no scripted blast
          confiscates the case.</li></ul><h3>When a player says “I take a picture”</h3><p>Offer
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.0zKe76iE0e9VFppG]{C13},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.wHkKKUcyBof5CX06]{C14},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.E3dVclO0uZ3jyGye]{C15}.
          Match the subject, access, lighting, and current state. These ordinary snapshots contain no hidden
          puzzle. A photograph of damage records damage; it does not identify its cause. Use a clean NPC
          portrait for a simple introduction. F-series photographs contain additional evidence and need their
          own provenance.</p><p><strong>Scene options:</strong>
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.eu4Vy9WBx8iGce1d]{TM10 — Lingotto
          rooftop in rain},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.jqBp0bbZpuYJAVE1]{BM05 — Assembly
          floor}, @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.gAxI1cJhYftPzFGK]{BM06 —
          Supervisor booth and catwalk}. The map determines this encounter’s usable sightlines; a photographic
          impression is not a measurement.</p>
    - name: Claudia — The Choice Behind the Betrayal
      type: text
      text:
        content: >-
          <h2>Claudia — The Choice Behind the Betrayal</h2><figure><img
          src="modules/neon-relic-mission-sangreal/assets/art/scenes/totm/tm-rooftop.webp" alt="Lingotto — use
          for an actual pursuit or exposed conversation" style="width:100%;height:auto"><figcaption>Lingotto —
          use for an actual pursuit or exposed conversation</figcaption></figure><h3>Claudia is a person with
          a false account of the danger</h3><p>She believes Registry 16 protects people from a primordial
          contagion. The ward seems to confirm everything she was taught. She can comfort a frightened nurse,
          obtain a legal crossing, and share an accurate lead while still planning to steal the case. Play
          those actions sincerely. Her tragedy comes from the fact that her superiors mean “protect the
          bloodline” literally and have not told her whose bloodline it is.</p><h3>Before an extraction
          attempt, check all four conditions</h3><ul><li>She is free to act and has not already changed
          allegiance.</li><li>The Veronica Thread remains in her possession and usable.</li><li>She can reach
          the case without inventing an unobserved action.</li><li>She has transport or a reachable route and
          a reason to believe the rendezvous remains secure.</li></ul><p>If any condition is absent, she
          adapts: asks to handle the transfer, seeks an ally, proposes a route, or abandons the theft. She
          cannot teleport through restraints or an investigator’s declared watch. The existing relic controls
          the Thread’s effect; a flash does not automatically put the case in her hand.</p><h3>Give the
          players a warning and a response window</h3><p>She asks who will carry the attaché; moves her
          transport closer; or reaches for the rosary while offering to lead Corvi down. State the movement
          before resolving it. A player covering her can interrupt. If she triggers the relic, run the actual
          disorientation, movement, and pursuit using the system rules and map. Let their precautions matter.
          The factory’s daylight hazard is visible and avoidable; do not force a phial to burst just to cover
          her exit.</p><h3>If they expose her before she acts</h3><blockquote><p>“I saw what that dose did.
          You saw it. You are still talking about handing it to men who kept it for centuries. Tell me who
          will stop them opening it again.”</p></blockquote><p>She admits her Order’s destruction mandate when
          confronted with her later private Registry 16 communication or an observed extraction attempt. She
          initially believes a vampire-interest claim is Vatican disinformation. Presenting independent
          evidence of the purge, a Basarab connection, and orders to protect that house can break her
          certainty. One emblem is insufficient; a telex in her own chain of command is much stronger. If the
          cell offers accountable containment and protection from both factions, she can cooperate. Do not
          demand that she trust the Church to earn redemption.</p><h3>What she can give them</h3><p>A
          cooperative or searched Claudia supplies the rendezvous route, the identity of Registry 16, her
          handling orders, and the Thread if intact.
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.e7WrCS9xFqFcAJHF]{I14 — Telex
          Dispatch: Registry 16} is a standing extraction directive recoverable from her messages or folio; it
          need not wait beside a corpse. Its exact wording is what she received, even if she rationalized
          “bloodline” as a containment code.
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.jFJ2aF20hnTgr1Ul]{I37 — The Empty
          Needle} depicts a spent holder: use that image only after the Thread has been used. Before use,
          describe the intact concealed tool and let a search recover it without showing contradictory
          empty-needle evidence.</p><h3>Outcomes to carry
          forward</h3><table><thead><tr><th>Outcome</th><th>Next scene</th><th>What
          changes</th></tr></thead><tbody><tr><td>Claudia escapes with the case</td><td>Track a vehicle,
          message, or broker contact to Novara</td><td>The default abbey rendezvous can occur. Track actual
          departure time.</td></tr><tr><td>Claudia is captured</td><td>Interrogate, protect, or negotiate; use
          her orders to intercept the pack</td><td>No Claudia corpse at the abbey. The pack seeks the actual
          case location.</td></tr><tr><td>Claudia changes sides</td><td>She can arrange a controlled
          rendezvous or expose the command channel</td><td>Registry may notice missed reports. Give a response
          delay; do not grant it immediate omniscience.</td></tr><tr><td>Cell keeps the case but loses
          Claudia</td><td>Plan secure transport or call a custody conference</td><td>Novara is a planned enemy
          meeting, not a mandatory crime scene.</td></tr><tr><td>Cell returns the case to Rome</td><td>Run the
          Council with a real inventory and witnesses</td><td>A covert seizure becomes a political and
          security problem, not an inevitable road chase.</td></tr></tbody></table><h3>Do not make grief
          mandatory</h3><p>If she dies in play, use her earlier kindness and mistaken conviction to give the
          death weight. If she lives, let the harder work of responsibility continue. Her survival is not a
          failure to deliver the mission’s intended emotion.</p>
    - name: Novara — Intervene, Investigate, or Pursue
      type: text
      text:
        content: >-
          <h2>Novara — Intervene, Investigate, or Pursue</h2><figure><img
          src="modules/neon-relic-mission-sangreal/assets/art/scenes/totm/tm-abbey-arrival.webp" alt="Abbey
          approach — breached only after an attack" style="width:100%;height:auto"><figcaption>Abbey approach
          — breached only after an attack</figcaption></figure><h3>Choose the abbey state before revealing the
          art</h3><table><thead><tr><th>Party’s
          arrival</th><th>Situation</th><th>Use</th></tr></thead><tbody><tr><td>Before the pack, case at
          abbey</td><td>Claudia is alive, awaiting transfer; cell can warn, arrest, protect, or lay an
          ambush</td><td>Describe an intact approach. Do not show breached-gate/body
          images.</td></tr><tr><td>During the pack’s arrival</td><td>A contest over custody, with exits,
          frightened mortals, and sealed cargo</td><td>Use courtyard/interior maps and actual initiative;
          nobody dies offscreen because a clue card needs them dead.</td></tr><tr><td>After an unopposed
          attack</td><td>Default aftermath: Claudia dead, one broken phial, ten taken to the
          airfield</td><td>TM11 and TM12; I13, I38, I40 as earned evidence.</td></tr><tr><td>Case never
          reached abbey</td><td>Unused rendezvous, handlers, abandoned message, or a meeting the cell
          controls</td><td>No manufactured slaughter and no mandatory broken
          phial.</td></tr></tbody></table><h3>The pack’s demand</h3><blockquote><p>The leader stops outside
          the light. He looks at the container, not at the faces around it. “You call it recovery. Rome called
          it custody. Tell me what word you will use when you make us take it.”</p></blockquote><p>The pack
          wants the blood removed from potential deployment and destroyed under its own control. It fears a
          single contaminated wound and the political consequences of surrender. Its members use barriers and
          tools rather than bare hands. They are dangerous adversaries, not immune scenery. A credible
          neutral-custody offer can buy time; an imminent threat to dose them can provoke desperate violence.
          They will retreat if the alternative is certain exposure. Use their existing statistics.</p><h3>If
          the default attack happened</h3><blockquote><p>The gate has opened the wrong way. Brick dust lies
          inside the courtyard beneath the torn fittings. From the dining hall, a single lantern makes a small
          warm patch on the floor. Beyond it, the room is very still. Someone has left in a hurry, but someone
          else has been left behind.</p></blockquote><p>Pause before describing Claudia. Let the players
          approach and decide how to proceed. Show
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.URoAcs3MRSAqrakE]{TM12 — Abbey
          dining hall threshold} or the body evidence only after they enter. The corpse is evidence and a
          person, not a reward for missing an appointment.</p><table><thead><tr><th>Find</th><th>What it
          establishes</th><th>What it cannot establish
          alone</th></tr></thead><tbody><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.zCbHgDIvUDf0NQeB]{I13
          — The Novara Slaughter}</td><td>A violent killing and a breached vessel; compare bite pattern and
          other scene evidence</td><td>A named killer from tooth spacing
          alone</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.U2IpaLLta03yQl0w]{I38
          — Two Fingers, Calcified}</td><td>Rapidly altered tissue at the spill; vampire effect when compared
          with records and a reliable identification</td><td>Identical chemistry merely because two substances
          are white
          ash</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.phIsjPz5WHarCoVB]{I40
          — Her Effects, Laid Out} and
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.e7WrCS9xFqFcAJHF]{I14 — Telex
          Dispatch: Registry 16}</td><td>Claudia’s travel, possessions, affiliation, and extraction
          orders</td><td>A journey directly from Turin solely from one toll
          stub</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.GnEgQ3rUIxDi1GQo]{I15
          — Flight Clearance: YR-BAS}</td><td>Planned aircraft, destination, cargo, and departure
          time</td><td>The aircraft has already left or cannot be
          stopped</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.AwrHknjihUDqll80]{I44
          — Consignment Markings}</td><td>Default consignment inventory and a reused logistics
          crate</td><td>Church authorization of the entire theft just because the crate once belonged to
          it</td></tr></tbody></table><p>The damaged-finger photograph does not prove the injured operative
          survived exposure. If a later F09 image shows an injured operative alive, treat it as an earlier or
          separately documented injury unless actual play and the artifact’s resolution support that survivor.
          Do not invent immunity to preserve an asset. The default fatal purge can leave these fragments
          without leaving a living witness.</p><h3>The decision under time pressure</h3><p>As soon as an
          investigator makes a quick document sweep, give the filed flight plan and its time. Tell them the
          current local time and estimated journey. They can leave a forensic team, photograph in place,
          collect a few key items, or stay. A photograph does not cost an entire shift during a chase. Full
          reconstruction can take a shift after people are safe. Make the tradeoff explicit before time
          passes.</p><h3>Three ways onward</h3><ul><li>The flight clearance names the airfield and
          registration.</li><li>Claudia’s orders or the broker’s contact identifies the handling agent and
          rendezvous.</li><li>Petra/Stephan can query dispatch and radar once given a registration, route, or
          operator. Their answer has a stated delay and source.</li></ul><h3>When a player says “I take a
          picture”</h3><p>Offer
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.8PgGu8m7izwYBIO3]{C16},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.Laubhjg7TgqleOEw]{C17},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.D9UKW0SQBtFZSwzZ]{C18}.
          Match the subject, access, lighting, and current state. These ordinary snapshots contain no hidden
          puzzle. A photograph of damage records damage; it does not identify its cause. Use a clean NPC
          portrait for a simple introduction. F-series photographs contain additional evidence and need their
          own provenance.</p><h3>The airfield: an objective, not a cutscene</h3><p>Before showing
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.tlrpaGAGQo3Qhk98]{TM13 —
          Abandoned airfield hangar}, check whether the hangar is empty. If the aircraft is loading, describe
          it or use the apron map. State the obstacles: fence/gate, distance to the aircraft, ground crew,
          pack position, and time until clearance. Do not secretly advance the departure because the players
          found a shortcut.</p><table><thead><tr><th>Approach</th><th>Possible gain</th><th>Cost /
          risk</th></tr></thead><tbody><tr><td>Official hold through Covenant or airfield
          authority</td><td>Grounding delay, fuel access denied, gate opened</td><td>Authority must be
          verifiable; covert opposition may contest it</td></tr><tr><td>Speak to ground crew / handling
          agent</td><td>Locate cargo or interrupt loading</td><td>Workers need protection from the pack and a
          reason to risk their jobs</td></tr><tr><td>Interdict at the apron</td><td>Recover a case or disable
          transport before takeoff</td><td>Combat, bystander safety, and phial fracture risks use existing
          rules</td></tr><tr><td>Negotiate</td><td>Exchange safe passage for supervised neutral custody or a
          delay</td><td>The Elder demands evidence that Rome cannot deploy the
          reserve</td></tr><tr><td>Aircraft already gone</td><td>Identify destination and preserve chain of
          custody</td><td>A real failure of timing, not a predetermined ending; move to the conditional
          bridge</td></tr></tbody></table><p>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.fnZm0Dl4nHlnas4G]{I39
          — Tarmac, 01:15} records the default loading state at 01:15;
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.R4F2ocb2JCwwfKOB]{I45 — Airfield
          Briefing Sheet} is a reconnaissance sheet annotated with a filed/confirmed planned slot. It is not a
          prophecy of actual wheels-up. If the flight is held, annotate the record. The forty-minute window
          means forty minutes of opportunities; it is not “forty minutes early is still too late.”</p><h3>When
          a player says “I take a picture”</h3><p>Offer
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.WvJ6ZeOsll96y9wc]{C19},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.eyO4tcMIc2crn3hk]{C20}.
          Match the subject, access, lighting, and current state. These ordinary snapshots contain no hidden
          puzzle. A photograph of damage records damage; it does not identify its cause. Use a clean NPC
          portrait for a simple introduction. F-series photographs contain additional evidence and need their
          own provenance.</p><p><strong>Maps:</strong>
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.5UwVLTp8ofRAjQ9W]{BM07 — Abbey
          gate and courtyard},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.9wHAIjutxJqKmHqB]{BM08 — Abbey
          dining hall and cloister},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.lGukiMcNwlfc2Wh3]{BM09 — Hangar
          and apron}. Use full layouts when the tactical situation warrants them.</p>
    - name: The Accounting — What Kind of Peace Remains?
      type: text
      text:
        content: >-
          <h2>The Accounting — What Kind of Peace Remains?</h2><figure><img
          src="modules/neon-relic-mission-sangreal/assets/art/scenes/totm/tm-council.webp" alt="The council
          chamber — a negotiation that can happen before the ending"
          style="width:100%;height:auto"><figcaption>The council chamber — a negotiation that can happen
          before the ending</figcaption></figure><h3>The scene can happen early</h3><p>A call or meeting with
          Sabbatini is available whenever the cell brings a concrete risk, contradiction, or custody proposal.
          The complete archive is harder to obtain than a safety answer. Do not require Claudia’s death or the
          aircraft’s departure to unlock his ability to speak.</p><blockquote><p>Sabbatini leaves the report
          closed while you finish. Then he turns it so the case number faces you. “Before we discuss blame,”
          he says, “how many vessels, where are they, and who has been exposed?”</p></blockquote><h3>Play the
          argument, not a villain’s confession</h3><p>He fears a rebirth more than a scandal. He also prefers
          a policy he controls to one he must defend in public. Those motives can align, but not always. He
          admits the existing peace is based on the houses’ inability to increase their numbers without
          diminishing themselves. He will argue that keeping the pure reserve was responsible. The clinical
          evidence challenges his misleading assurances; the attempted purge challenges the cost of his
          secrecy.</p><blockquote><p>“If we had destroyed it, we would have lost the last restraint they
          believed in. If we used it, we would have broken the agreement ourselves. So we kept it. You may
          call that cowardice. For a long time it kept people alive.”</p></blockquote><p>Let the players ask
          who counted the victims of that agreement. He cannot supply an ethically clean answer. The meeting
          is stronger when he concedes a real wrong: the zero-risk statement was knowingly incomplete, and the
          recovery team should have received the handling protocol. He can authorize a written correction and
          witness protection without confessing crimes he did not order.</p><h3>Evidence that changes the
          negotiation</h3><table><thead><tr><th>Evidence / commitment</th><th>Leverage</th><th>Concession to
          offer</th></tr></thead><tbody><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.SilYzv6luOt5X6Am]{I07
          — Patient File 09-H} /
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.VMoT17MWZ543rWHe]{I29 — The
          Injection Log} with Graf’s testimony</td><td>Demonstrated danger to humans and the cost of withheld
          safety data</td><td>Clinical protection, full CT3 release, no further human
          use</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.e7WrCS9xFqFcAJHF]{I14
          — Telex Dispatch: Registry 16} /
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.NvsqxXBP29kM6SVV]{I25 — Geneva
          Escrow Request Register}</td><td>Registry infiltration and a documented betrayal of the liaison
          role</td><td>Independent oversight of clergy assigned to the
          recovery</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.t9kMeFOoglJgJeno]{I12
          — Palimpsest Leaf, Codex} /
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.U2IpaLLta03yQl0w]{I38 — Two
          Fingers, Calcified} or a witnessed purge</td><td>The elders have a rational fear of imposed
          mortality</td><td>Written non-deployment undertaking and monitored
          storage</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.bylOSJzw3hElf5Nb]{I17
          — Dispatch Box, Microfiche}</td><td>The historic deterrent policy and the population
          accommodation</td><td>A reviewable custody agreement rather than another oral
          promise</td></tr><tr><td>Accurate inventory plus neutral witnesses</td><td>The cell can actually
          prevent both proliferation and forced treatment</td><td>Funding, transport, safe housing, and
          reciprocal access</td></tr></tbody></table><h3>Terms the players can
          negotiate</h3><ul><li>Dual-signature storage and transfer, with the Covenant retaining copies of the
          ledger.</li><li>Protection for Graf, surviving staff, Corvi, and a cooperating Claudia;
          accountability does not require delivery to a disappearance squad.</li><li>No administration to
          humans or vampires without a separately agreed process. The case does not settle whether consent
          could ever make such use acceptable.</li><li>An independent count of remaining phials, clinical
          residue, destroyed material, and missing consignments.</li><li>Restrictions on public disclosure
          that preserve safety while allowing a record of institutional wrongdoing.</li></ul><p>The sanction
          squad is a credible risk if a hardliner orders it or an armed standoff escalates; it is not an
          automatic punishment for learning the truth. I41 and I42 can expose preparations and procurement
          links. Negotiation, external witnesses, leaving the building, or a command intervention can prevent
          an attack. Apply the same standards of causality to Church agents as to everyone
          else.</p><h3>Resolve the campaign the players actually
          made</h3><table><thead><tr><th>Outcome</th><th>End Mission 1 with</th><th>Possible Mission
          2</th></tr></thead><tbody><tr><td>Case secured; witnesses protected</td><td>A signed custody ledger
          and a fragile new agreement</td><td>Audit remaining networks, safeguard the reserve, pursue those
          who planned its use</td></tr><tr><td>All blood verifiably destroyed</td><td>A lost deterrent and a
          relieved but suspicious vampire leadership</td><td>Renegotiate peace without the reserve; trace
          independent research, not a magically restored case</td></tr><tr><td>Some or all phials flown
          east</td><td>Exact losses, destination evidence, and surviving allies</td><td>Recover only the
          vessels actually missing; the house intends incineration, creating a real
          deadline</td></tr><tr><td>A phial reaches another human</td><td>A new containment emergency with a
          named recipient</td><td>Protect communities and decide whether a sustainable new lineage is
          possible</td></tr><tr><td>Church receives unconditional custody</td><td>Recovery succeeds, oversight
          remains unresolved</td><td>Follow the consequences of the cell’s choice without declaring success
          meaningless</td></tr><tr><td>Cell keeps the reserve outside both institutions</td><td>A defended
          holding arrangement and pressure from both sides</td><td>Diplomacy and containment, with the cell
          responsible for its own promises</td></tr></tbody></table><h3>Closing image</h3><blockquote><p>The
          last question in the report is a box marked DISPOSITION. There is space for a signature beneath it.
          There is not enough space for everyone who has an opinion about what you should
          write.</p></blockquote><p>Ask each investigator what they write, whom they protect, and which fact
          they refuse to omit. Record the answer. That is the bridge to the next mission, whether or not a
          plane left Italy.</p><h3>When a player says “I take a picture”</h3><p>Offer
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.kBWFyXm1RLabkHBz]{C21}.
          Match the subject, access, lighting, and current state. These ordinary snapshots contain no hidden
          puzzle. A photograph of damage records damage; it does not identify its cause. Use a clean NPC
          portrait for a simple introduction. F-series photographs contain additional evidence and need their
          own provenance.</p><p>If Claudia’s room is searched,
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.72tNLODObuOLLVyV]{TM15 — Claudia
          convent room} shows a private life rather than a second compulsory confession. Her correspondence
          can corroborate motives; never conceal an essential final lead there after the cell has already
          resolved the case.</p>
    - name: Evidence — What Each Piece Actually Establishes
