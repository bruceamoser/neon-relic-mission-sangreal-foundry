e="height:1.6em;vertical-align:middle" src="modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-fire-alarm.mp3"></audio></td><td>Lingotto fire, abbey alarm</td></tr><tr><td><strong>Abbey bell toll</strong></td><td><audio controls preload="none" style="height:1.6em;vertical-align:middle" src="modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-church-bell.mp3"></audio></td><td>The “one at a time” line</td></tr><tr><td><strong>Period telephone ring</strong></td><td><audio controls preload="none" style="height:1.6em;vertical-align:middle" src="modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-telephone-ring.mp3"></audio></td><td>Covenant telephone calls</td></tr><tr><td><strong>Typewriter</strong></td><td><audio controls preload="none" style="height:1.6em;vertical-align:middle" src="modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-typewriter.mp3"></audio></td><td>Wayfinder analysis, office work, the archive</td></tr></tbody></table><p><em>These players play in your own client only (each person hears what their own page renders) — that is what the DA wants for a cue. When the art and the sound should hit the whole table together, run the track from the <strong>Sangreal Sound Effects</strong> playlist instead: that is shared, synchronised playback.</em></p><p><em>Licensing: every recording is public domain, CC0 or Creative Commons (BY/BY-SA) from Wikimedia Commons, or an ffmpeg-synthesized original. The shipped credit list is <strong>assets/audio/CREDITS.md</strong>; the working cue sheet lives in the repository at <strong>docs/sound-effects.md</strong>.</em></p>
