          approach; the latter is controlled, not a secret unlocked route.</td><td>Public listing and local
          driver; ready before departure. The published map gives the approach, not the tactical ward
          plan.</td></tr> <tr><td>Who are Hausmann and Graf?</td><td>Hausmann is the private banker named in
          the transaction. Graf is the treating physician to request for the specimen inquiry. His admission,
          diagnosis and present condition require a clinical source.</td><td>Bank confirmation, public
          professional listing and clinic switchboard; during the planning scene.</td></tr> <tr><td>How can we
          get admitted?</td><td>A verified introduction as investigators of a potentially unsafe supplied
          preparation, an appointment request for Graf, and a callback reference the front desk can check. The
          clinic may offer a consulting room first. Patient areas still require staff permission or an
          emergency.</td><td>Petra contacts administration with the cell’s stated purpose; one callback,
          normally within the planning scene. A forged identity is a separate player choice.</td></tr>
          <tr><td>What security should we expect?</td><td>Reception screens visitors; staff control clinical
          doors; patients and staff make open violence costly. A local driver knows the drop-off and service
          entrance. Guard numbers, cameras, current locks and the ward’s condition require
          reconnaissance.</td><td>Published visitor arrangements and driver’s ordinary observations. No remote
          floor-by-floor intelligence.</td></tr> <tr><td>Has Corvi arrived or left?</td><td>She relays the
          clinic’s actual answer and who gave it. If nobody will confirm, she says “unconfirmed” and preserves
