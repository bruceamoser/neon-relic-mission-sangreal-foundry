          <p><em>Rule of thumb: a photograph never explains itself. Hand over the card, read only what is visible, and let the cell argue about the watch, the ring, the missing fingers or the folded column. The DA truth on each card tells you what it is for, not what to say.</em></p>

    - name: 'Investigator Photos — GM Index'
      type: text
      text:
        content: |
          <h2>Investigator Photos — GM Index</h2>
          <p><strong>DA eyes only.</strong> Twenty-four optional snapshots the investigators may take while working the case: sixteen ordinary photographs and eight visible observations. They are records, not clues — none of them carries a hidden symbol, a message, or evidence the case depends on, and none replaces a detailed information card. Hand one over only when a player actually photographs that subject, with the access and timing its own GM note describes. The walkthrough's <em>If the investigators take photographs:</em> cues sit at the beats where each subject is reachable.</p>
          <p><strong>Mundane</strong> tells nothing beyond what is visible. <strong>Observation</strong> shows something worth noticing — damage, displacement, blackout, an empty hangar — but the photograph never establishes cause, perpetrator, timing or intent. The detailed cards keep their own examination requirements and deductions: I01 for the relay cradle, I15/I39/I45 for the aircraft, I20 for the drilled safe.</p>
