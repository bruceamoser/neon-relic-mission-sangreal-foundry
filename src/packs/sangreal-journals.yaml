    - name: Photographic Evidence — Cue Sheet
      type: text
      text:
        content: >-
          <h3>Photographic Evidence — Conditional Cue Sheet</h3><p>The F-series contains documentary images
          with additional details. It is separate from clean portraits and the ordinary C-series. Select only
          a frame supported by the current scene and a credible source. The player can notice a detail without
          automatically knowing its interpretation.</p><table><thead><tr><th>Photograph</th><th>Use / paired
          evidence</th></tr></thead><tbody><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.Pw2lfx84lXnwJ8dB]{F01
          — Night Desk, Archive}</td><td><p>Optional documentary photograph. Establish who took it, when, and
          how the investigators obtain it before sharing. Use only when the pictured subject and circumstances
          fit actual play. For a simple introduction use the clean NPC portrait; for a player-taken mundane
          snapshot use the C-series. No event is required to happen merely to produce this
          frame.</p><p><strong>Visible subject.</strong> One warm lamp, everything else cold shadow; paper and
          leather in stacks; his collar dark with sweat at the throat.</p><p>Compare
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.cs4mFCPQYvft88T1]{I22 — The
          Archive, 1962}. Its inference limits apply. Matching clothing, jewellery, or paperwork corroborates
          identity or access; it does not prove every claimed
          motive.</p></td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.ebgnd316nNZktyx0]{F02
          — Vault Corridor, Nun}</td><td><p>Optional documentary photograph. Establish who took it, when, and
          how the investigators obtain it before sharing. Use only when the pictured subject and circumstances
          fit actual play. For a simple introduction use the clean NPC portrait; for a player-taken mundane
          snapshot use the C-series. No event is required to happen merely to produce this
          frame.</p><p><strong>Visible subject.</strong> Cold fluorescent overhead, wet flagstones, heavy
          vignette; she does not look away and her hands are still.</p><p>Compare
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.NvsqxXBP29kM6SVV]{I25 — The Ledger
          Page}. Its inference limits apply. Matching clothing, jewellery, or paperwork corroborates identity
          or access; it does not prove every claimed
          motive.</p></td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.dS329Mdsggs302Nh]{F03
          — Council Desk, Green Lamp}</td><td><p>Optional documentary photograph. Establish who took it, when,
          and how the investigators obtain it before sharing. Use only when the pictured subject and
          circumstances fit actual play. For a simple introduction use the clean NPC portrait; for a
          player-taken mundane snapshot use the C-series. No event is required to happen merely to produce
          this frame.</p><p><strong>Visible subject.</strong> The lamp throws one green pool across the desk;
          marble and walnut; two rings, no crest.</p><p>Compare
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.XWAylCZFSBMFiPpB]{I41 — The Green
          Lamp}. Its inference limits apply. Matching clothing, jewellery, or paperwork corroborates identity
          or access; it does not prove every claimed
          motive.</p></td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.hOoHc9YSRE6Y3QnW]{F04
          — Ward Corridor, Torchlight}</td><td><p>Optional documentary photograph. Establish who took it,
          when, and how the investigators obtain it before sharing. Use only when the pictured subject and
          circumstances fit actual play. For a simple introduction use the clean NPC portrait; for a
          player-taken mundane snapshot use the C-series. No event is required to happen merely to produce
          this frame.</p><p><strong>Visible subject.</strong> Shattered tubes, taped windows, no ambient light
          at all; glasses pushed up into her hair and both hands steady on the box.</p><p>Compare
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.D18a1YRCEQu27KHw]{I09 —
          Histopathology Log: Marrow Graft}. Its inference limits apply. Matching clothing, jewellery, or
          paperwork corroborates identity or access; it does not prove every claimed
          motive.</p></td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.JYzBF0ioQJSIRWaF]{F05
          — Corner of a Dark Room}</td><td><p>Optional documentary photograph. Establish who took it, when,
          and how the investigators obtain it before sharing. Use only when the pictured subject and
          circumstances fit actual play. For a simple introduction use the clean NPC portrait; for a
          player-taken mundane snapshot use the C-series. No event is required to happen merely to produce
          this frame.</p><p><strong>Visible subject.</strong> No fill light, no flash; the room is clinically
          clean and he is not; he is posed as if mid-listen rather than mid-attack.</p><p>Compare
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.p51PQ2RP2raSDBHp]{I27 — Intake
          Photograph, 09-H}. Its inference limits apply. Matching clothing, jewellery, or paperwork
          corroborates identity or access; it does not prove every claimed
          motive.</p></td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.6WzjJmXcPCi5w9T8]{F06
          — Card Catalogue, Archive}</td><td><p>Optional documentary photograph. Establish who took it, when,
          and how the investigators obtain it before sharing. Use only when the pictured subject and
          circumstances fit actual play. For a simple introduction use the clean NPC portrait; for a
          player-taken mundane snapshot use the C-series. No event is required to happen merely to produce
          this frame.</p><p><strong>Visible subject.</strong> Dust in the lamp beam, ranks of labelled
          drawers, an interrupted gesture: the hand is on the drawer, not on the card.</p><p>Compare
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.1XbUUYGspeQ02iZH]{I03 — The Excised
          Codex Register}. Its inference limits apply. Matching clothing, jewellery, or paperwork corroborates
          identity or access; it does not prove every claimed
          motive.</p></td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.BCkW5MDhfvQIYzHk]{F07
          — Viewing Booth, Bank}</td><td><p>Optional documentary photograph. Establish who took it, when, and
          how the investigators obtain it before sharing. Use only when the pictured subject and circumstances
          fit actual play. For a simple introduction use the clean NPC portrait; for a player-taken mundane
          snapshot use the C-series. No event is required to happen merely to produce this
          frame.</p><p><strong>Visible subject.</strong> Brass lamp, no window, documents aligned to the table
          edge; his hands stay flat and open on the page.</p><p>Compare
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.TqsNZiq5wWnCyrO1]{I24 — Bank Staff
          Record}. Its inference limits apply. Matching clothing, jewellery, or paperwork corroborates
          identity or access; it does not prove every claimed
          motive.</p></td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.15mjJNhWmMEqMFWL]{F08
          — Vatican Corridor, Night}</td><td><p>Optional documentary photograph. Establish who took it, when,
          and how the investigators obtain it before sharing. Use only when the pictured subject and
          circumstances fit actual play. For a simple introduction use the clean NPC portrait; for a
          player-taken mundane snapshot use the C-series. No event is required to happen merely to produce
          this frame.</p><p><strong>Visible subject.</strong> One sconce, one side of the face; the coat is
          new and off-the-peg; he stands as if waiting for a door to open.</p><p>Compare
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.xOiejtMxuQ1Q4vDv]{I42 — L'Entità
          Team, 1987}. Its inference limits apply. Matching clothing, jewellery, or paperwork corroborates
          identity or access; it does not prove every claimed
          motive.</p></td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.EJeFCUWs9Sl7FBwR]{F09
          — Refectory, Candlelight}</td><td><p>Optional documentary photograph. Establish who took it, when,
          and how the investigators obtain it before sharing. Use only when the pictured subject and
          circumstances fit actual play. For a simple introduction use the clean NPC portrait; for a
          player-taken mundane snapshot use the C-series. No event is required to happen merely to produce
          this frame.</p><p><strong>Visible subject.</strong> A single flame, the edge of a long table, no
          other source; he stands beside the light rather than in it.</p><p>Compare
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.U2IpaLLta03yQl0w]{I38 — Two
          Fingers, Calcified}. Its inference limits apply. Matching clothing, jewellery, or paperwork
          corroborates identity or access; it does not prove every claimed motive.</p><p>The injured operative
          image cannot establish survival of the Novara exposure. Use only as a separately sourced prior
          injury or if actual exposure resolution leaves a survivor consistent with the image; otherwise omit
          it.</p></td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.RRTeKHxR8npSozTr]{F10
          — Mortuary Alcove, Flash}</td><td><p>Optional documentary photograph. Establish who took it, when,
          and how the investigators obtain it before sharing. Use only when the pictured subject and
          circumstances fit actual play. For a simple introduction use the clean NPC portrait; for a
          player-taken mundane snapshot use the C-series. No event is required to happen merely to produce
          this frame.</p><p><strong>Visible subject.</strong> Harsh direct flash, no ambient detail; the
          figure is off the ground and mid-motion; the room behind it is a working mortuary.</p><p>Compare
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.QEO98GDqJtZlL08l]{I30 — Ward 3,
          Corridor Camera}. Its inference limits apply. Matching clothing, jewellery, or paperwork
          corroborates identity or access; it does not prove every claimed motive.</p><p>Use only if a dark
          phial rupture actually reanimates dead tissue. No compulsory ghoul outbreak occurs from proximity
          alone.</p></td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.ylCBSiZxpA1wQbI1]{F11
          — Gate House, Logbook}</td><td><p>Optional documentary photograph. Establish who took it, when, and
          how the investigators obtain it before sharing. Use only when the pictured subject and circumstances
          fit actual play. For a simple introduction use the clean NPC portrait; for a player-taken mundane
          snapshot use the C-series. No event is required to happen merely to produce this
          frame.</p><p><strong>Visible subject.</strong> Ledgers squared to the desk edge, a coffee gone cold,
          a sidearm he has never drawn inside the cemetery in living memory.</p><p>Compare
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.gpEG58FggEY1toq2]{I18 — Second
          Descent}. Its inference limits apply. Matching clothing, jewellery, or paperwork corroborates
          identity or access; it does not prove every claimed motive.</p><p>Gerard’s already-played testimony
          takes precedence. Do not use the image to invent a contradiction in his
          account.</p></td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.cahL8FK5od7MSZsB]{F12
          — Map Table, Safehouse}</td><td><p>Optional documentary photograph. Establish who took it, when, and
          how the investigators obtain it before sharing. Use only when the pictured subject and circumstances
          fit actual play. For a simple introduction use the clean NPC portrait; for a player-taken mundane
          snapshot use the C-series. No event is required to happen merely to produce this
          frame.</p><p><strong>Visible subject.</strong> Working light, no daylight; crates stacked and
          labelled; she is mid-sentence and does not look up for the
          camera.</p></td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.ySbFGBbdVv8lE3Lr]{F13
          — Signals Room, Printouts}</td><td><p>Optional documentary photograph. Establish who took it, when,
          and how the investigators obtain it before sharing. Use only when the pictured subject and
          circumstances fit actual play. For a simple introduction use the clean NPC portrait; for a
          player-taken mundane snapshot use the C-series. No event is required to happen merely to produce
          this frame.</p><p><strong>Visible subject.</strong> Green glow against tungsten, paper everywhere, a
          machine wall doing work he is not describing to anyone.</p><p>Compare
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.gpEG58FggEY1toq2]{I18 — Second
          Descent}. Its inference limits apply. Matching clothing, jewellery, or paperwork corroborates
          identity or access; it does not prove every claimed
          motive.</p></td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.sc9lgM1tyAavOZ2O]{F14
          — Lingotto Works, Cigar}</td><td><p>Optional documentary photograph. Establish who took it, when,
          and how the investigators obtain it before sharing. Use only when the pictured subject and
          circumstances fit actual play. For a simple introduction use the clean NPC portrait; for a
          player-taken mundane snapshot use the C-series. No event is required to happen merely to produce
          this frame.</p><p><strong>Visible subject.</strong> Rain on glass, dark iron, one warm point of
          light at his hand; he never faces the lens, and that is the point of the frame.</p><p>Compare
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.Uanb3MKR6vPcGHq5]{I08 — The Swiss
          PTT Intercept Tape}. Its inference limits apply. Matching clothing, jewellery, or paperwork
          corroborates identity or access; it does not prove every claimed
          motive.</p></td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.hY4hWzAIiBwDEVFE]{F15
          — Café Table, Newspaper}</td><td><p>Optional documentary photograph. Establish who took it, when,
          and how the investigators obtain it before sharing. Use only when the pictured subject and
          circumstances fit actual play. For a simple introduction use the clean NPC portrait; for a
          player-taken mundane snapshot use the C-series. No event is required to happen merely to produce
          this frame.</p><p><strong>Visible subject.</strong> Flat overcast light, an empty second cup, no eye
          contact, nothing about him that asks to be looked at.</p><p>Compare
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.SI5TGjifT8qC6Epu]{I26 — The 06:40
          to Geneva}. Its inference limits apply. Matching clothing, jewellery, or paperwork corroborates
          identity or access; it does not prove every claimed
          motive.</p></td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.kXTU8r4ID6lRtJAt]{F16
          — Cellar, Candlelight}</td><td><p>Optional documentary photograph. Establish who took it, when, and
          how the investigators obtain it before sharing. Use only when the pictured subject and circumstances
          fit actual play. For a simple introduction use the clean NPC portrait; for a player-taken mundane
          snapshot use the C-series. No event is required to happen merely to produce this
          frame.</p><p><strong>Visible subject.</strong> A single candle, stone walls, shadow to the edges;
          his expression is mild and patient, as if he were examining furniture.</p><p>Compare
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.AwrHknjihUDqll80]{I44 — Consignment
