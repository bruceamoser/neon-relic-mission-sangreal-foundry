          <h2>The Tarmac — Conditional Outcome</h2><p>Use this page only after resolving the actual airfield
          situation. @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.GnEgQ3rUIxDi1GQo]{I15 —
          Flight Clearance: YR-BAS} is a flight plan, not proof of departure. If the cell arrives before
          loading or clearance is complete, use the walkthrough’s interception options and
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.lGukiMcNwlfc2Wh3]{BM09 — Hangar
          and apron}.</p><blockquote><p>The hangar light is still on. What it illuminates depends on what you
          managed to stop.</p></blockquote><p>If the flight left, establish the actual departure and cargo
          through tower records or surveillance. If the case was seized, record it. If the cargo split, follow
          each consignment separately. Do not remove recovered phials to restore the default ending.</p>
    - name: The Concordat Requisition
      type: text
      text:
        content: >-
          <h2>The Concordat Requisition</h2><p>Sabbatini can sign funding, transit protection, and a
          non-deployment undertaking when presented with a credible custody plan. A completed Novara slaughter
          is not a prerequisite. Terms should reflect the cell’s negotiated protections for people and
          evidence. Retain copies outside Church custody.</p><p>Record: remaining vessels and residue; named
          custodian; storage conditions; permitted movements; who must witness a transfer; no further
          administration without a separately agreed process; protection of surviving witnesses. The player
          who signs should know what obligation they are accepting.</p>
    - name: 'Mission 2: Recover the Sangreal'
      type: text
      text:
        content: >-
          <h2>Mission 2 — Follow the Consequences</h2><p>If vessels reached Romania, pursue the actual cargo
          before incineration. If the reserve is secured, the next mission may defend the arrangement,
          investigate other research, or renegotiate the peace. If everything was destroyed, do not restore it
          by fiat. If another person was exposed, their safety and the surrounding community become the urgent
          problem. The Basarab command’s motive remains fear of imposed mortality; a different faction needs
          actual evidence before you assign it a restoration scheme.</p>
- _id: sangreal-journal-walkthrough
  name: SANGREAL-87-091 — DA Walkthrough
  type: journalEntry
  pages:
    - name: Start Here — Resume at the Vatican
      type: text
      text:
        content: >-
          <h2>Start Here — Resume at the Vatican</h2><h3>Your next session starts
          here</h3><p><strong>Established continuity:</strong> the investigators arrived at the Vatican,
          researched Vault IX, questioned Gerard, and slept in Vatican guest rooms. They have not searched
          Corvi’s quarters. Those played scenes stand. Do not replay the arrival, erase their notes, or
          announce discoveries they never made. Keep the current world case-board day and filled shifts; this
          rewrite does not reset them.</p><h3>Five-minute preparation</h3><ul><li>Write down exactly what the
          table already knows from Gerard and the vault. Treat everything else as undiscovered, even if an old
          script said it was automatic.</li><li>Have
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.5DoANlYa53w4faSv]{I04 — Numerals on
          Rag Paper}, @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.EE4LDI5tCUb9YG9l]{I20 —
          Safe Dial, Drilled},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.WNTzWxpF2S7xU230]{I35 — Breve
          Apostolicum, 1582} and
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.Hx9jKUQtU1Jmwh2O]{I36 — Suppressed
          Index Card} ready for the apartment. Open
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.1xPFy0jFa4uqHScD]{TM03 — Corvi
          quarters arrival} only when they arrive.</li><li>Keep Claudia helpful. Give her one genuinely useful
          action before you give the players a reason to doubt her. Do not perform villainous stillness as a
          tell.</li><li>Choose the current custody state from the ledger on the next page. If your existing
          clock differs from the default route, move future NPC attempts forward coherently rather than
          retconning yesterday.</li><li>Ask each player for one observation from yesterday and one question
          they intend to answer today. Write their questions where you can see them.</li></ul><h3>Morning
          scene — coffee before the inquiry</h3><blockquote><p>The bells arrive before the knock. Someone has
          left coffee outside your door on a tray too small for all the cups. Beyond the guest-room shutters,
          the Vatican is already at work: shoes in the passage, a cart over the paving, a voice asking for a
          signature. Yesterday there was an empty space in a vault. This morning there is a key on the
          tray.</p></blockquote><p>Claudia brings authorized access to Corvi’s quarters and offers to arrange
          transport once the cell has a destination. This is a new offer, not a fact imposed on yesterday. If
          she has already been detained or excluded at your table, Ghiberti brings the key instead. Gerard
          remains available for clarification through the duty desk; do not add a new confession to his
          previous interview.</p><blockquote><p>Claudia: “His rooms are still sealed. They will want a list of
          what you remove. Would you prefer me to keep it, or one of your people?”</p></blockquote><p>Let them
          choose who controls the record. An agent who takes that job creates a real obstacle to Claudia’s
          later concealment. If asked about the Grail, she answers, “They have not given me permission to name
          what was kept there.” Her actual belief is that an old biological danger must be destroyed; she does
          not yet know the elders’ nature.</p><p>A request for a safety clarification reaches Sabbatini. His
          answer is cautious rather than a fresh supernatural reveal: “The assurance applies to sealed
          custody. Recovery comes first.” This admission matters: the original unqualified assurance was
          misleading. If pressed with a specific contradiction, he will arrange a private conversation; use
          the Council chapter early rather than refusing until the epilogue.</p><h3>Give three choices, not a
          destination order</h3><table><thead><tr><th>Choice</th><th>What it accomplishes</th><th>DA
          response</th></tr></thead><tbody><tr><td>Search the quarters</td><td>Find Corvi’s destination and
          why he left</td><td>Run the apartment chapter.</td></tr><tr><td>Return to Gerard/Ghiberti or examine
          existing samples</td><td>Resolve a question from yesterday</td><td>Answer from records and
          established testimony. This does not consume another whole shift for each
          question.</td></tr><tr><td>Challenge the Church before leaving</td><td>Test the recovery mandate and
          obtain safer handling instructions</td><td>Run an early Council conversation; preserve the unknown
          contents until a witness or record actually reveals them.</td></tr></tbody></table><h3>How to run
          the rest</h3><p>Each location below gives an arrival, a human problem, evidence with limits, likely
          questions, consequences, and exits. The suggested day ranges are the unattended route, not
          appointments the players must keep. Core evidence is found by a sensible search or a cooperative
          witness. Rolls decide time, discretion, collateral damage, and access to guarded extras—not whether
          the campaign can continue.</p><p>End each scene by asking “What does this make you want to do?” If
          the answer is unclear, restate one concrete lead they possess. Do not read the solution aloud. A
          missed lead returns through a credible source: a duplicate bank record, a returned laboratory call,
          or Corvi seeking contact—not an omniscient parcel of every clue.</p><h3>Sharing and
          images</h3><p>This entire walkthrough is DA-only. Read only the blockquotes aloud. Its pictures are
          selected views, not compulsory events. Share individual scenes and cards deliberately. A body
          photograph must not appear if that person survived. Do not share a tactical map merely to establish
          atmosphere. The scene and photograph appendices retain every existing asset.</p>
    - name: The Case — Blood, Peace, and Custody
      type: text
      text:
        content: >-
          <h2>The Case — Blood, Peace, and Custody</h2><h3>The case in one paragraph</h3><p>The Vatican has
          lost twelve phials of undiluted blood. A fragile accommodation with vampire houses depends on their
          inability to expand without thinning their own power. The Church fears that this pure source could
          start new, potent lines outside that limit. The old houses fear a different possibility: Rome might
          forcibly “cure” them, ending the condition that keeps centuries of age at bay. Corvi steals the
          reserve to prevent its use as a weapon, then authorizes one reckless treatment to finance an escape
          and prove that the blood can heal. Hausmann’s transformation destroys that hope. Claudia, convinced
          she is preventing an outbreak, helps the investigators find Corvi while secretly arranging to
          deliver the blood to elders who intend to burn the threat to themselves.</p><h3>The name is the
          first invitation</h3><p><strong>San Greal:</strong> the expected Holy Grail reading. Church custody,
          ritual language, secrecy, and a missing sacred object all support the players’ assumption. Nobody
          needs to falsely confirm a cup. Sabbatini says “the entrusted contents”; Ghiberti says “the
          custody”; Claudia says “what was sealed.” Let the players supply the Grail.</p><p><strong>Sang
          Real:</strong> the blood reading—blood royal, treated by these custodians as holy blood. This is the
          mission’s play on words, not a language exam. Use the user’s intended “holy blood” sense as
          ecclesiastical meaning rather than claiming “real” literally translates as “holy.” A player who
          spots blood on the first morning is correct and gets useful traction. Neither the narrator nor a
          frightened NPC needs to withhold the word until a designated act.</p><blockquote><p>Corvi, if the
          players have not already made the connection: “You put the break after the saint. Put it after the
          blood. They let you look for a cup because a cup cannot breed.”</p></blockquote><h3>The peace is
          practical, not benevolent</h3><p>The houses police uncontrolled feeding and unauthorized turning;
          the Church refrains from a general hunt and conceals incidents it can contain. Ordinary people are
          not parties to the bargain. Each new turning divides an already diminished inheritance: expansion
          now costs a house strength it cannot readily replace. This arithmetic, more than friendship, makes
          coexistence preferable to war. The phials threaten the arithmetic. A new human recipient can become
          a powerful predator without drawing on an existing house’s depleted blood. Whether such a new line
          could be stabilized and propagated is unproven; the demonstrated conversion is already enough to
          make the Church fear a rebirth. Do not invent a safe way for elders to drink the source and become
          stronger: for an existing vampire, the same fluid is a
          purge.</p><table><thead><tr><th>Faction/person</th><th>Fear</th><th>What it does at the
          table</th><th>What can change its conduct</th></tr></thead><tbody><tr><td>Sabbatini / Holy
          Alliance</td><td>New potent predators make the current limits meaningless; a rival may force a
          general war</td><td>Demands sealed custody, tracks recipients, restricts transit, pressures
          witnesses</td><td>A credible joint containment plan, documented inventory, protection from public
          panic, independent witnesses to any transfer</td></tr><tr><td>Registry 16 / Basarab
          elders</td><td>Rome can end their condition by force; the theft looks like preparation for
          deployment</td><td>Uses mortal intermediaries, orders incineration, keeps bare skin away from the
          blood</td><td>Verified destruction or supervised neutral custody may buy a pause; no trust in Rome’s
          promise alone</td></tr><tr><td>Corvi</td><td>The reserve becomes a weapon; then his own attempted
          healing creates the threat he fled</td><td>Leaves a route to his research, lies about how certain he
          was, refuses an unaccountable return</td><td>Admit Hausmann matters, preserve records, propose
          independent custody</td></tr><tr><td>Claudia</td><td>A relapse into uncontrolled vampirism that her
          Order taught her to prevent</td><td>Opens doors, protects civilians, secretly reports and prepares
          extraction</td><td>Proof her handlers serve the threatened elders plus an alternative she can
          believe will contain the blood</td></tr><tr><td>Graf / Hausmann</td><td>Responsibility for the
          experiment / imminent death</td><td>Graf seeks safety and accountability; Hausmann first seeks help,
          then struggles with hunger</td><td>Specific protection and medical caution, not a sermon about
          monstrosity</td></tr></tbody></table><h3>What the blood does: three kinds of
          evidence</h3><table><thead><tr><th>Status</th><th>Truth</th></tr></thead><tbody><tr><td>Established
          in play by the clinic</td><td>One treated human loses his cancer and develops predatory physiology.
          This does not establish the origin of a religion or the outcome for every possible
          recipient.</td></tr><tr><td>Established by comparative evidence</td><td>The same vector attacks
          vampiric stasis. I09 supplies the human mechanism; I12 is a historical claim; I38 or direct
          observation supplies physical vampire evidence. Similar-looking ash alone is not a
          diagnosis.</td></tr><tr><td>Relic mechanics for the DA</td><td>CT1 activates through open tissue or
          mucous membranes; human conversion takes 24 elapsed hours. On the four-shift case board that is four
          shifts. Existing vampires use the artifact’s Endure Difficulty 5 outcome: failure brings ash in
          three rounds; success leaves a mortal with organ failure. CT2 operates within 100 m when unshielded.
          CT3 is darkness, lead-antimony, below 4°C, treated linen. Preserve the existing artifact bonuses and
          fracture table.</td></tr></tbody></table><p>The apocryphon attributes the source to Christ and
          speaks of unmaking a curse. It is evidence of what its author believed, not a laboratory proof of
          divine biography. Let the players debate theology. The operational discovery is sufficiently
          concrete: the danger depends on the recipient. The elders call forced mortality a killing; the
          Church calls keeping the reserve deterrence. Neither word settles the ethics.</p><h3>Before the
          investigators arrived</h3><ul><li>Months earlier, Corvi translated the suppressed text and found
          memoranda contemplating coercive use of the reserve. Sabbatini keeps contingency options open; he
          has not authorized the theft or the Swiss injection. Corvi knows those are not the same thing and
          fears the distinction will not last.</li><li>Corvi approached Hausmann’s representatives before the
          theft. The CHF 500,000 is a conditional escrow routed through a dormant ecclesiastical trust Corvi
          can access—not proof the whole Church commissioned an experiment. He promised one speculative
          treatment to buy protection and fund a remote refuge. It was a deliberate moral failure, not an
          innocent accident.</li><li>Claudia’s Registry assignment predates the breach. She searched Corvi’s
          room for the research during his absence and arranged a Geneva records inquiry. Her current presence
          beside the cell does not require impossible simultaneous travel: the earlier bank visit preceded her
          liaison assignment.</li><li>Corvi used the Lodestone to release the entire closed attaché. The vault
          held a case cradle, not eleven exposed phials. The Grey Watcher entered later to record the breach
          and confirm Corvi had succeeded; he did not help Corvi operate the cradle. Gerard’s actual testimony
          at your table remains authoritative.</li></ul><h3>Custody ledger — count physical vessels, not
          orders</h3><table><thead><tr><th>State</th><th>Intact vessels</th><th>Where the missing contents
          went</th></tr></thead><tbody><tr><td>Vault / theft</td><td>12</td><td>None</td></tr><tr><td>Hausmann
          treated</td><td>11</td><td>Phial 1 consumed in the treatment; Graf retained trace material on slides
          and in test apparatus</td></tr><tr><td>Turin negotiation</td><td>11</td><td>The proposed second sale
          fails. An offer or invoice is not delivery. Corvi refuses once Hausmann’s condition is
          known</td></tr><tr><td>Unopposed Novara breach</td><td>10</td><td>One of those eleven breaks during
          the struggle. Ten remain for the aircraft</td></tr><tr><td>After player intervention</td><td>Record
          the actual count</td><td>Any prevented injection, spill, seizure, or recovered vessel changes the
          ledger and supersedes a preprinted planned manifest</td></tr></tbody></table><p>Do not subtract
          another whole vessel for Graf’s daylight test; it uses residue from the clinical sample. The default
          Turin daylight scare is a threatened exposure or a failed latch, not a mandatory third lost phial.
          The 10/12 marking in I44 is the default post-Novara inventory. If players prevent events, describe a
          corrected manifest instead of presenting a contradictory photograph as current evidence.</p><h3>The
          default clock: what happens only if nobody changes it</h3><table><thead><tr><th>Day
          remaining</th><th>Attempt / condition</th><th>Useful
          signal</th></tr></thead><tbody><tr><td>14–13</td><td>Theft discovered; Corvi crosses into
          Switzerland; cell begins inquiry</td><td>Already played in this campaign: preserve the session
          record</td></tr><tr><td>11</td><td>Geneva escrow and onward travel</td><td>Bank can identify the
          intended clinic even before treatment</td></tr><tr><td>10</td><td>Hausmann receives first phial if
          no one intervenes</td><td>Graf can still be reached; an early cell can stop the
          procedure</td></tr><tr><td>9–8</td><td>Conversion completes after 24 hours; ward crisis deepens;
          Corvi heads to Turin</td><td>Calls for help, staff absences, intercept
          I08</td></tr><tr><td>7</td><td>Church attempts restrictive transit measures</td><td>Petra warns of
          checks before they cost the cell time</td></tr><tr><td>6</td><td>Broker attempts second purchase;
          Claudia receives extraction permission</td><td>Corvi refuses the sale; an intercepted message
          exposes the plan</td></tr><tr><td>4–3</td><td>Claudia attempts theft if free, equipped, and trusted;
          Church moves on clinic if evidence remains</td><td>Rosary/vehicle/route preparations, visit from
          security, warning call</td></tr><tr><td>2, late evening</td><td>If Claudia has delivered the case to
          the abbey, pack attacks at about 23:45</td><td>Gate watch, broker information, a rendezvous
          message</td></tr><tr><td>1, 01:15</td><td>If cargo and aircraft are ready, planned flight
          departs</td><td>I15 is filed intent, not immunity to intervention</td></tr></tbody></table><p>The
          22:15 toll stub and approximately 23:45 attack belong to the same final evening in the unattended
          branch. Claudia may have reached Novara earlier; that stub records her last local road movement, not
          necessarily a direct drive from Turin. The aircraft departs in the following early hours. Day boxes
          are planning markers; actual scene time controls a chase. Do not trigger this sequence twice because
          both a person track and faction track mention it.</p>
    - name: Rome — The Empty Plinth, Already Visited
      type: text
      text:
        content: >-
          <h2>Rome — The Empty Plinth, Already Visited</h2><figure><img
          src="modules/neon-relic-mission-sangreal/assets/art/scenes/totm/tm-vault-arrival.webp" alt="Vault IX
          — use only for a return visit" style="width:100%;height:auto"><figcaption>Vault IX — use only for a
          return visit</figcaption></figure><h3>Why this scene matters</h3><p>The vault establishes a theft,
          insider access, and an institution refusing to explain its own safety procedures. It does not need
          to solve the blood. In this campaign it has already been investigated. Use this chapter as a
          reference for follow-up questions, not an instruction to rediscover everything.</p><h3>Three
          questions the site can answer</h3><table><thead><tr><th>Question</th><th>Evidence</th><th>What it
          does not establish</th></tr></thead><tbody><tr><td>How was the case
          released?</td><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.9VyBQIhDJHgbR5PF]{I01
          — The Burnt Electromagnet Relay} and
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.Hx9jKUQtU1Jmwh2O]{I36 — Suppressed
          Index Card}: compare the damaged relay with the suppressed Lodestone handling record</td><td>A
          visual residue match is a lead; analysis and the custody register link the tool to Corvi’s access.
          No fingerprint of Sabbatini appears by implication.</td></tr><tr><td>Who carried it
          away?</td><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.MH3cXgf0hGIZzcO3]{I02
          — CCTV Reel #87-04} identifies Corvi and a rail lead; Gerard’s log and
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.gpEG58FggEY1toq2]{I18 — Second
          Descent} record a later visitor</td><td>A later visitor need not be an accomplice. A distant nun
          cannot be positively identified from a veil.</td></tr><tr><td>Why was it kept this
          way?</td><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.msJvTkZUJb1CBYqF]{I19
          — Plinth Detail, Brass Plate},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.1XbUUYGspeQ02iZH]{I03 — The Excised
          Codex Register},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.mD3LMAVAHB3FK3rL]{I43 — The Case,
          1964} show a named, purpose-built custody and an older documentary trail</td><td>Lead cannot be
          identified from the darkness of a shadow. A cold room does not prove its contents were
          harmless.</td></tr></tbody></table><h3>Play Ghiberti’s divided
          loyalty</h3><p>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-npcs.Actor.qTZgbWUDP7brGEJy]{Father
          Ghiberti} wants the archive intact and his years of custodianship to mean something. He fears that
          cooperating will be written up as negligence. Let an investigator label a copy, sign a receipt, or
          promise the original will remain in his care. He then helps because somebody is treating his work as
          evidence rather than loot.</p><blockquote><p>“I can tell you how it was kept. They never thought I
          needed to know why. Those are not the same assurance.”</p></blockquote><p>If asked for the contents,
          he admits the old workshop inventory describes vessels once he retrieves it. He cannot explain their
          biology. If asked why the Church kept a weapon, he can produce a record, not a speech about vampire
          policy. If the players already saw the word “phials” yesterday, do not try to restore the cup
          mystery. The question becomes what filled them.</p><h3>Gerard: use the man the players already
          met</h3><p>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-npcs.Actor.ufJyCkCXfjy64nCx]{Gerard,
          Vatican Gendarme Duty Officer} is a guard, not a secret supernatural expert. Preserve his answers,
          manner, and whatever he admitted. If they request a copy, he can arrange a signed transcription
          through normal authority. If the second descent remains undiscovered, a specific comparison of the
          lift time and gate record can reveal it now. Do not rewrite a previous truthful answer as a lie just
          to produce intrigue.</p><p>For unplayed details only: 03:14 is the camera’s Corvi exit time; 04:02
          is the later lift event. They are forty-eight minutes apart, not hours. The Watcher is the default
          later visitor. His record of events comes from the corridor camera and his own observations, not a
          photograph he impossibly took of himself from across the room.</p><h3>If the cell confronts
          Claudia</h3><p>She admits that her role includes reporting to her superiors. That is ordinary
          liaison work. Asked about the distant figure, she neither supplies a confident identification nor
          invents an alibi on the spot; she asks to see the complete reel. A map stamp
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.auf7Uqb4VPNc9Hp7]{I05 — Embossed
          Stamp, Map Casing} is a reason to investigate her affiliations, not an automatic confession. Present
          a documentary mismatch she must answer, then let the players decide what precautions to
          take.</p><h3>Costs and exits</h3><p>One focused archive search can recover the linked group of
          records. Do not charge a separate shift for every card. Forced access raises a complaint and may
          bring a guard; the records do not evaporate. A blocked archive request has a duplicate in Corvi’s
          papers or an official request through Petra. The apartment is the immediate lead; rail records
          provide a parallel route to Geneva. The later visitor is an optional surveillance lead, not a
          required second investigation before leaving Rome.</p><h3>When a player says “I take a
          picture”</h3><p>Offer
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.xbQZgy0hY46bSstX]{C01},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.i25Abf2EuijkRk8O]{C02},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.fSDtZMcDsd07gqaY]{C03},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.g5lsJIx2eJvMkI7v]{C22},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.SW0k0q32vBGhnPUB]{C24}.
          Match the subject, access, lighting, and current state. These ordinary snapshots contain no hidden
          puzzle. A photograph of damage records damage; it does not identify its cause. Use a clean NPC
          portrait for a simple introduction. F-series photographs contain additional evidence and need their
          own provenance.</p><p><strong>Maps:</strong>
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.FyPnU7Tmzk9RJebD]{BM01 — Vault
          and lift vestibule}. Use only if movement or access becomes tactically relevant.</p>
    - name: Corvi’s Rooms and Geneva — Follow the Bargain
      type: text
      text:
        content: >-
          <h2>Corvi’s Rooms and Geneva — Follow the Bargain</h2><figure><img
          src="modules/neon-relic-mission-sangreal/assets/art/scenes/totm/tm-quarters-arrival.webp"
          alt="Corvi’s quarters — the next unplayed investigation"
          style="width:100%;height:auto"><figcaption>Corvi’s quarters — the next unplayed
          investigation</figcaption></figure><h3>Scene 1 — A room searched for the wrong
          thing</h3><blockquote><p>The room is smaller than its reputation. There is a cup beside the window,
          a book left open, and a chair pushed back just far enough for a tired man to stand. Then you see the
          drawers. Each is open by the same careful amount. Behind the painting, the safe has a neat hole
          where its lock should be. Whoever did this was looking for something, and had time to put the
          valuables back.</p></blockquote><p><strong>Scene purpose:</strong> turn Corvi from a name into a
          person who made preparations, and turn “north” into a specific bank and account. Ask who inventories
          the room, who watches the corridor, and whether Claudia is left alone with any papers. Those answers
          establish later opportunities; no secret roll silently gives her the evidence.</p><h3>Search in
          three passes</h3><table><thead><tr><th>Place / action</th><th>Give</th><th>Why it
          matters</th></tr></thead><tbody><tr><td>Desk and open Vulgate; ordinary deliberate
          search</td><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.5DoANlYa53w4faSv]{I04
          — Numerals on Rag Paper}; leave the exact printed cipher untouched</td><td>A destination and a name,
          not an occult trap. The worn blotter offers GENEVA and 4409 as partial
          corroboration.</td></tr><tr><td>Safe and displaced
          drawers</td><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.EE4LDI5tCUb9YG9l]{I20
          — Safe Dial, Drilled}; retained books and valuables</td><td>A search for information, not a burglary
          for money. Claudia conducted it before the liaison assignment; the photograph alone does not
          identify her.</td></tr><tr><td>Research file and personal
          effects</td><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.WNTzWxpF2S7xU230]{I35
          — Breve Apostolicum, 1582},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.Hx9jKUQtU1Jmwh2O]{I36 — Suppressed
          Index Card}, @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.yjSZ4jRoC9F50C62]{I21
          — Diplomatic Passport},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.cs4mFCPQYvft88T1]{I22 — The
          Archive, 1962}</td><td>Connects his current fear to custody records and a mentor. Portraits
          establish continuity of identity, not an immortal prelate. The passport image is a copy in his
          papers, not his only passport inexplicably left behind after using
          it.</td></tr></tbody></table><h3>The cipher: give help that actually works</h3><p>The I04 string
          uses a 5×5 square with I/J sharing a cell and U/V distinct: A B C D E / F G H I K / L M N O P / Q R
          S T U / V W X Y Z. Row first, column second. It reads <strong>GENEUA / UBS / HAUSMANN / DDKI /
          C</strong>. The old notes incorrectly claimed a normal letter square could directly yield the digits
          4409. Preserve the user-approved string and photograph. Corvi uses U for V in GENEVA. In the
          numerical group, his decimal indexing row is A B C D E F G H I K = 1 2 3 4 5 6 7 8 9 0, so D D K I
          is 4409. Ghiberti or HQ can explain this convention; the independently legible blotter impression
          corroborates it. Tell players who solve the square exactly what it yields. Do not pretend their
          correct decoding is wrong.</p><p>Ghiberti recognizes the square as an indexing convenience. A
          Research success saves time identifying the bank code and numerical cross-reference; a failure still
          yields the letters and the bank can search Hausmann’s escrow. Geneva/UBS/Hausmann is enough to
          proceed. A group uninterested in a cipher can ask HQ to transcribe it while they continue
          searching.</p><h3>What makes Corvi human</h3><p>The room contains ordinary reading and evidence of
          work, not a secret symbol in every object. If asked what he was like, Ghiberti recalls a scholar who
          recently began asking whether a custodian remained responsible for what someone else did with a
          collection. This new recollection is not proof of innocence. The financial lead will expose the cost
          of his answer.</p><h3>What Claudia does here</h3><blockquote><p>“If he meant to sell it, why leave a
          way to find him? Unless he wanted someone other than the buyer to know where he
          went.”</p></blockquote><p>It is a useful question, honestly asked. She wants the cell to find him.
          If confronted with the drilled safe, she initially calls it an earlier security search. Ask what
          record they request. There is no signed search inventory. She admits conducting an unauthorized
          search if the absence of a record and her access are established, while concealing Registry 16.
          Removing her from evidence handling now genuinely restricts her later options.</p><h3>Exit: a
          journey with a purpose</h3><p>The investigators should be able to say: “Corvi arranged something
          with Hausmann through UBS in Geneva, and someone else wanted his research.” If they cannot, give
          Ghiberti a concrete line from the indexing records rather than another riddle. The bank can be
          contacted before departure; Claudia offers introductions, Petra an independent channel. Use
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.JdEbI0D8H7Vju6im]{TM16 — Night
          train compartment} for the rail journey. Ask what the cell tells Claudia and what goes separately to
          HQ. A private call is a valid countermeasure, not magically intercepted by every
          faction.</p><h3>When a player says “I take a picture”</h3><p>Offer
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.uF1PuP1wOZLUKqfS]{C04},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.EJPrt7xGBfHvjKwF]{C05},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.5XvaBvFzINiSPrbH]{C06}.
          Match the subject, access, lighting, and current state. These ordinary snapshots contain no hidden
          puzzle. A photograph of damage records damage; it does not identify its cause. Use a clean NPC
          portrait for a simple introduction. F-series photographs contain additional evidence and need their
          own provenance.</p><figure><img
          src="modules/neon-relic-mission-sangreal/assets/art/scenes/totm/tm-viewing-room.webp" alt="Geneva —
          information changes hands in a private viewing room"
          style="width:100%;height:auto"><figcaption>Geneva — information changes hands in a private viewing
          room</figcaption></figure><h3>Scene 2 — Mercier’s problem</h3><blockquote><p>The clerk checks the
          door before he checks your papers. Inside the viewing room he places a cloth beneath the document
          box, smooths it twice, and asks whether you will need his name in the report. He has not yet asked
          what you
          want.</p></blockquote><p>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-npcs.Actor.nlfuIXX32doYRfx1]{Jean-Paul
          Mercier} wants protection from being made the only culpable person in a transaction arranged by
          powerful clients. He handled a conditional deposit; he did not understand the blood. Treating him as
          an accomplice to murder immediately makes him seek legal cover. Offering a recorded interview with
          limited circulation, counsel, or a safe contact makes cooperation
          rational.</p><table><thead><tr><th>Ask / approach</th><th>Answer / card</th><th>Inference
          limit</th></tr></thead><tbody><tr><td>Who paid and for
          what?</td><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.lOsCniEBTy2c974w]{I06
          — The Escrow Transfer Slip} names Hausmann, the clinic, and one specimen out of
          twelve</td><td>Escrow documents an agreement. Before Day 10 it does not prove treatment
          happened.</td></tr><tr><td>Who had
          access?</td><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.NvsqxXBP29kM6SVV]{I25
          — The Ledger Page} with
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.TqsNZiq5wWnCyrO1]{I24 — Bank Staff
          Record} authenticates the altered entry</td><td>Vane’s earlier independent visit contradicts a claim
          that she knew nothing of Corvi’s route. It does not by itself prove she serves
          vampires.</td></tr><tr><td>Show us the night
          deposit</td><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.6RWEHDPMeZJFj86J]{I23
          — Night Deposit} and
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.SI5TGjifT8qC6Epu]{I26 — The 06:40
          to Geneva} corroborate the case’s movement</td><td>Background observers warrant follow-up, not
          magical identification.</td></tr><tr><td>Why erase the entry?</td><td>Mercier was asked to protect a
          clerical client’s privacy, took a fee, then retained a carbon as insurance</td><td>A specific shame
          explains the lie; he need not know the whole
          conspiracy.</td></tr></tbody></table><blockquote><p>Mercier: “The money had a condition. A specimen,
          a treatment, an acknowledgment. I could tell you who signed. I could not tell you what was in the
          glass.”</p></blockquote><p>A credible inducement or a Manipulate test at the existing Difficulty 2
          gets the protected carbon discreetly. Failure means delay, an alarmed manager, or a copy routed
          through formal channels. It does not erase the clinic’s name. Violence brings bank security and
          costs the cell discretion. If denied the private box, the named patient and clinic remain an
          actionable lead.</p><h3>If the bank implicates the Church</h3><p>The trust is ecclesiastical in
          origin and Corvi had access to it. This is evidence worth taking to Sabbatini. It is not evidence
          that he personally ordered the injection. Distinguish permission to move money, permission to
          release a relic, and permission to conduct a human experiment. Mercier can document the first; Corvi
          must answer for the latter two.</p><h3>Exit choices</h3><p>The clinic is the fastest way to find the
          recipient and the transferred vessel. An early call can stop the treatment. Watching the bank can
          identify another interested party. Returning to Rome with the financial records is legitimate, but
          the unattended patient clock advances. Make the cost specific: travel time, a missed appointment, a
          returned call reporting deterioration—not a punishment for choosing the wrong chapter.</p><h3>When a
          player says “I take a picture”</h3><p>Offer
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.9ZDZIVJTYRghESz4]{C07},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.BjSIXo5B9PcT676P]{C08},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.9zv3BsynVg6pNjqk]{C09}.
          Match the subject, access, lighting, and current state. These ordinary snapshots contain no hidden
          puzzle. A photograph of damage records damage; it does not identify its cause. Use a clean NPC
          portrait for a simple introduction. F-series photographs contain additional evidence and need their
          own provenance.</p><p><strong>Scene options:</strong>
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.WYkoHrGfng0UZ3lZ]{TM04 — Geneva
          bank exterior},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.w9Gp844xc19nFp0a]{TM05 — Private
          viewing room},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.b2nGfJTzx9PeMk09]{BM03 — Bank
          vault level}.</p>
    - name: Sonnenberg — A Patient Before a Monster
      type: text
      text:
        content: >-
          <h2>Sonnenberg — A Patient Before a Monster</h2><figure><img
          src="modules/neon-relic-mission-sangreal/assets/art/scenes/totm/tm-clinic-arrival.webp" alt="The
          clinic approach" style="width:100%;height:auto"><figcaption>The clinic
          approach</figcaption></figure><h3>Before you describe the ward, check the
          clock</h3><table><thead><tr><th>State</th><th>Run this situation</th><th>Do not show
          yet</th></tr></thead><tbody><tr><td>Before the injection</td><td>Hausmann can speak and refuse or
          demand the proposed treatment. Graf has a consent problem and inadequate data</td><td>Post-treatment
          photographs, broken ward, or a completed patient history</td></tr><tr><td>First 24 hours after
          injection</td><td>Remission, worsening light sensitivity, cold skin, fear, periods of
          lucidity</td><td>A fully feral attack just because a page title says collapse</td></tr><tr><td>After
          conversion / staff crisis</td><td>Blacked-out ward; missing staff; Graf protecting survivors;
          Hausmann dangerous but still a person the table has met</td><td>Assume he is on the ceiling only if
          they actually encounter that state</td></tr></tbody></table><h3>Scene 1 — The receptionist’s
          impossible request</h3><blockquote><p>The front desk asks you to lower your voices. From upstairs
          comes a crash, then a patient’s bell that nobody answers. The receptionist keeps one finger on a
          telephone number written on the blotter. “Are you the people who can move him?” she asks. “Not the
          police. The other people.”</p></blockquote><p>If the cell is early, replace the crash with an
          orderly moving a trolley and the question with “Are you here about Herr Hausmann’s treatment?” The
          hospital must respond to the world state, not to an anticipated set piece. Staff want their patients
          safe. They can name Graf and Hausmann without a roll; entering a locked clinical wing may require
          identification, persuasion, or careful access.</p><h3>Scene 2 — Hausmann’s bargain</h3><p>Use
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.p51PQ2RP2raSDBHp]{I27 — Intake
          Photograph, 09-H} as a clinical record when obtained, or a clean portrait before the encounter.
          Hausmann bought a chance to live. Let him ask whether Corvi is coming back. He is not an excuse for
          a lecture about greed: a frightened man made a purchase that should never have been
          offered.</p><blockquote><p>Before treatment: “Would you refuse it if they told you there were three
          weeks left? Bring me a better chance and I will listen.”</p></blockquote><blockquote><p>After
          treatment, while lucid: “The pain stopped. I thought that meant it worked. Now I can hear the
          trolley in the next corridor, and I know which bag is blood.”</p></blockquote><p>Give the players a
          real choice: stop an untested procedure; stabilize and isolate him; protect staff while they seek
          help; or prepare force if he threatens someone. The mission offers no established reversal for a
          newly converted human. Do not invent one to make this easy, and do not require execution to obtain
          evidence. A sound containment plan can keep him alive and change the final accounting.</p><h3>Scene
          3 — Graf’s confession</h3><figure><img
          src="modules/neon-relic-mission-sangreal/assets/art/scenes/totm/tm-theatre.webp" alt="Graf’s refuge
          — show when the team reaches the theatre" style="width:100%;height:auto"><figcaption>Graf’s refuge —
          show when the team reaches the
          theatre</figcaption></figure><p>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-npcs.Actor.r5cnyNNmckVLRsOl]{Dr.
          Elizabeth Graf} wants survivors and a reliable record, but fears both prosecution and theft of the
          method. She has a slide box because she refuses to let the only explanation burn. First she asks the
          cell to move a nurse out of danger and stop anyone switching on the lights. Practical help earns
          more than a perfect speech.</p><blockquote><p>“I signed because the preparation came with a
          custodial protocol. That is not the same as a clinical trial. I know the difference. I signed
          anyway.”</p></blockquote><p>Asked who authorized the treatment, she names the funding arrangement
          and Corvi’s consent to release one phial. Her own signature matters. She will not pretend he
          injected Hausmann alone. Asked whether this proves the blood’s divine or demonic origin: “It proves
          what happened to this patient. I will not sign anything
          else.”</p><table><thead><tr><th>Evidence</th><th>What the players can responsibly
          conclude</th><th>Next
          question</th></tr></thead><tbody><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.SilYzv6luOt5X6Am]{I07
          — Patient File 09-H} /
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.VMoT17MWZ543rWHe]{I29 — The
          Injection Log}</td><td>Treatment and transformation have a documented sequence; batch XII-1 came
          from the reserve</td><td>Who supplied it and where is the
          remainder?</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.D18a1YRCEQu27KHw]{I09
          — Histopathology Log: Marrow Graft}</td><td>A foreign vector has aggressively replaced the patient’s
          marrow physiology</td><td>What happens in a body already sustaining vampiric
          stasis?</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.1dPSK2h5z6DX5Eab]{I28
          — Photophobia Test 02:40} /
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.QEO98GDqJtZlL08l]{I30 — Ward 3,
          Corridor Camera}</td><td>Severe light sensitivity and predatory movement are observable</td><td>How
          can staff be evacuated without provoking
          him?</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.dypD1aQAOBWpTyg0]{I11
          — The Resonance Field (CT2)}</td><td>Unshielded material worsens the vulnerability of sick or
          injured people nearby</td><td>How do we suppress it during
          transport?</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.F6S9nFRmRvOKLqLf]{I32
          — Daylight Test: Combustion} /
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.9NpgA6XbC6AKGYEY]{I16 — The
          Quiescence Formula (CT3)}</td><td>A trace sample combusted in direct daylight; the supplied storage
          protocol describes darkness, shielding, cold and treated linen</td><td>Who knew this before
          describing the case as harmless?</td></tr></tbody></table><h3>Let the false conclusion belong to the
          players</h3><p>They may conclude they have found vampire blood, a source of vampirism, or evidence
          for a monstrous Grail legend. Let each be a hypothesis. Do not order the table to conclude “Christ
          was the first vampire,” and never tell them the slides prove it. Graf’s restraint is the
          counterweight. Claudia calls the ward proof that destruction is necessary; that is her
          interpretation, and it should sound compassionate before it sounds convenient.</p><h3>Leave with
          three things</h3><p>The patient and witnesses have a disposition; the cell has a copy of the
          clinical record; and
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.Uanb3MKR6vPcGHq5]{I08 — The Swiss
          PTT Intercept Tape} or Graf’s account of Corvi’s frightened onward call points to Lingotto in Turin.
          The intercept says eleven remaining vessels because only the clinical phial has left the case. If
          the treatment was prevented, record twelve and treat the intercept image as inapplicable. Corvi can
          be reached through the broker without forcing the disaster to occur.</p><h3>When a player says “I
          take a picture”</h3><p>Offer
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.qMDeMM2EdpPQmIDq]{C10},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.6DUDWuZHCpcnYDYn]{C11},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.3aBVpBPzfa7Ex25i]{C12},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.28yDb0Z7eMSTfBQU]{C23}.
          Match the subject, access, lighting, and current state. These ordinary snapshots contain no hidden
          puzzle. A photograph of damage records damage; it does not identify its cause. Use a clean NPC
          portrait for a simple introduction. F-series photographs contain additional evidence and need their
          own provenance.</p><p><strong>Scenes:</strong>
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.1HRljmcL11d0CPLS]{TM07 —
          Blacked-out third-floor ward},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.jP9jheucndZOEHLE]{TM08 — Surgical
          theatre refuge},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.jpOPWYTG4Yqt6hk4]{BM04 — Ward,
          theatre and lab}.</p>
    - name: Zurich to Turin — Rescue, Pressure, and the Peace
      type: text
      text:
        content: >-
          <h2>Zurich to Turin — Rescue, Pressure, and the Peace</h2><h3>A bridge with decisions, not another
          compulsory fight</h3><p>This chapter covers what happens around the clinic and on the road. Use only
          pressures that follow from the cell’s actions. A secured patient does not escape because the
          calendar reaches Day 8. Records copied and witnesses moved cannot be burned in place
          later.</p><h3>If the ward breaks</h3><p>Give a warning: a door bends, a missing orderly’s radio
          opens, Graf reports that the patient has stopped answering his name. State where the civilians are
          and what routes remain. Ask the team who is moving people and who is containing Hausmann. Use the
          actor’s existing statistics and the ward map. Light is a dangerous tool with consequences for the
          patient; it is not a free method of gathering medical proof.</p><p>Failed containment can put
          Hausmann in the forest, cost a staff member, or leave an agent injured. Choose an outcome supported
          by the encounter, not all three automatically. Feral ghouls arise only from the established
          dark-rupture effect on dead tissue. Mere proximity to the case does not create a second population
          or make every injured nurse a vampire.</p><h3>Church pressure: make the stated motive
          audible</h3><p>SCV 47 and
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.OvqUML75EHpXFQ0P]{I31 — Sonnenberg,
          Observed} can warn of surveillance. The arriving team initially demands biological material and
          recipient names. They are not required to murder Graf on sight. Their orders can escalate to lethal
          evidence suppression under a hardliner or a reckless containment breach, but give the cell warning
          and an opportunity to protect people or call the chain of command.</p><blockquote><p>The team
          leader: “We have spent generations keeping the numbers steady. One man in that ward is already
          outside the count. How many doses left this building?”</p></blockquote><p>This is the first plain
          hint that the peace is about population. A careful cell can ask who is being counted and why. The
          operative knows the recovery mandate and the no-new-lines policy, not every archive secret. A
          verifiable call to Sabbatini can hold the team while the players propose independent quarantine.
          Threatening exposure may deter a covert killing but increases political pressure; it does not
          magically solve biological containment.</p><h3>A conversation that makes the accommodation
          real</h3><p>Arrange a private call with Sabbatini when the cell sends its medical findings, or let
          them request it. He fears they will use the sample, publicize it, or transfer it to a house. He can
          explain dilution without conceding every doctrinal file.</p><blockquote><p>“They cannot replenish
          themselves without dividing what remains. That is why an agreement became possible. You have seen
          what one undivided dose did to a dying man. I do not need you to approve our history. I need you not
          to repeat it.”</p></blockquote><p>Follow with a choice he can honor: joint custody of the samples,
          release of the handling protocol, safe evacuation of Graf, and a written ban on further human
          administration. If he refuses a reasonable safeguard, make that refusal a character decision with a
          reason—fear of losing authority—not an invisible plot gate.</p><h3>The other fear</h3><p>The broker
          can arrange an indirect message from the Basarab house once the cell is known to have the clinical
          evidence. The message asks whether the Covenant has authority to deploy the reserve against existing
          houses. This is not a confession of cure mechanics; it exposes the elders’
          anxiety.</p><blockquote><p>The broker, relaying a question: “My client wants to know whether your
          commission is recovery, or treatment. He regards the difference as a matter of
          survival.”</p></blockquote><p>Do not add an omniscient vampire to every photograph. The Watcher
          appears only in established evidence or a deliberately staged surveillance scene. If caught, he
          trades a verifiable movement, a buyer, or a telephone number; he cannot deliver a laboratory
          conclusion he has not obtained. His fear is losing his market and his independence.</p><h3>Travel
          with information</h3><figure><img
          src="modules/neon-relic-mission-sangreal/assets/art/scenes/totm/tm-rail.webp" alt="Night train — a
          place to decide whom to trust" style="width:100%;height:auto"><figcaption>Night train — a place to
          decide whom to trust</figcaption></figure><p>Use a journey to let the team compare the bank receipt,
          clinical batch, and archive references. Ask who gets copies. Petra can provide a cold, shielded
          transport plan and warn of border scrutiny. Telegraphy through a compromised office can leak a
          route; separate trusted communications can deny Registry 16 that information. Spend operational
          shifts on travel and substantial investigations, not on each sentence of conversation.</p><h3>If
          they are stuck</h3><ul><li>No Turin address: Graf recalls Corvi naming the works; the bank supplies
          the broker’s forwarding contact; a PTT request returns I08 after a stated delay.</li><li>No reason
          to distrust Claudia: no problem. Continue with her usefulness and actual opportunities. Do not
          manufacture a reveal.</li><li>No understanding of the peace: the next demand for a dose inventory
          gives Sabbatini a reason to explain why a new recipient is a crisis.</li><li>They want to return the
          case unopened: that is a valid goal. They still need to find it, protect witnesses, and decide what
          assurances make return responsible.</li></ul>
    - name: Lingotto — Hear Corvi, Decide Custody
      type: text
      text:
        content: >-
          <h2>Lingotto — Hear Corvi, Decide Custody</h2><figure><img
          src="modules/neon-relic-mission-sangreal/assets/art/scenes/totm/tm-factory-arrival.webp"
          alt="Lingotto — approach before choosing a route"
          style="width:100%;height:auto"><figcaption>Lingotto — approach before choosing a
          route</figcaption></figure><h3>The scene question</h3><p>Can the investigators take custody without
          becoming the next people to use the blood as a weapon? The factory is where motives become
          commitments. Corvi is frightened, culpable, and still capable of making a better choice. Give him
          enough time to answer.</p><blockquote><p>Rain falls through the skylights in separate silver
          columns. High above the floor, one office is lit. A man inside it watches you cross the open space.
          He lifts a telephone receiver, thinks better of it, and puts it down. When he opens the window his
          first question is not who you are. “Is the patient still alive?”</p></blockquote><h3>Establish the
          physical situation</h3><p>Corvi has the case and his notebook in the supervisor’s booth. The broker
          waits for a private audience; the cell may meet him first or avoid him. Claudia is wherever the
          players have actually allowed her to be. The original surveillance image
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.tkYtaX7GeNiTtUeg]{I33 — Lingotto,
          Rooftop, Rain} is appropriate only if its two-person situation occurs; it cannot place her in a
          booth while she stands beside the agents.
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.HprCCHuQXSASoSTQ]{I34 — Assembly
          Hall, Camera 6} can establish a prior crossing, not a missing shadow power.</p><p>Let the team
          choose stairs, cover, observation, or a spoken approach. A single negotiator with an agreed signal
          can succeed. Corvi carries a revolver but seeks an escape, not a firefight. Aggressive intrusion
          makes him withdraw with the notebook; it does not automatically destroy every copy of the
          research.</p><h3>Run the conversation in four exchanges</h3><table><thead><tr><th>The players’
          question</th><th>Corvi’s answer</th><th>What to put on the table</th></tr></thead><tbody><tr><td>Why
          steal it?</td><td>“They had started writing about recipients instead of custody. I thought if I took
          it away they could not turn a contingency into an order.”</td><td>His research and the custodial
          brief @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.WNTzWxpF2S7xU230]{I35 — Breve
          Apostolicum, 1582}. A fear of deployment, not proof that Sabbatini ordered a Swiss
          experiment.</td></tr><tr><td>Why give it to Hausmann?</td><td>“Because he was dying. Because he
          could pay for a place to hide the rest. Because I wanted a good use to excuse the theft. Choose the
          answer you find least forgivable.”</td><td>The escrow
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.lOsCniEBTy2c974w]{I06 — The Escrow
          Transfer Slip} and clinical record
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.VMoT17MWZ543rWHe]{I29 — The
          Injection Log} match his admission.</td></tr><tr><td>What is it?</td><td>“Blood. Kept whole while
          everything descended from it became thinner. In a man it builds a predator. In a predator it
          dismantles what keeps him
          alive.”</td><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.t9kMeFOoglJgJeno]{I12
          — Palimpsest Leaf, Codex} is his textual basis;
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.D18a1YRCEQu27KHw]{I09 —
          Histopathology Log: Marrow Graft} supports part of the mechanism. He distinguishes belief from
          demonstrated clinical fact.</td></tr><tr><td>What would make you surrender it?</td><td>“A count. A
          sealed transfer. Someone outside the Congregation with a copy of the record. And no more
          patients.”</td><td>A concrete custody agreement the players can accept, amend, or
          reject.</td></tr></tbody></table><h3>Corvi’s limits and concessions</h3><p>He initially minimizes
          how early he promised Hausmann a specimen. Confronted with the pre-theft escrow, he admits it
          without a second impossible hurdle. He did not know the human outcome; he did know he lacked a safe
          trial. He has refused the broker’s proposed second sale. That refusal keeps eleven in the case and
          leaves the broker with a paid promise he cannot fulfill.</p><blockquote><p>“If you take it back,
          make him sign for what he is taking. Not a relic. Not a sacred trust. Eleven vessels of blood, and a
          prohibition on putting them into anybody.”</p></blockquote><p>Do not make agreement contingent on
          the players reciting the correct theology. A credible plan and humane treatment move his existing
          guarded disposition. A failed social test can require a witness, more time, or disarming before he
          opens the door. The destination remains negotiable. If the cell has prevented the clinic tragedy, he
          is less desperate and more tempted to defend his experiment; they can confront its risks before
          bodies prove them.</p><h3>The broker gives the vampire fear a
          voice</h3><p>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-npcs.Actor.1NyMTuAFNPtTOebK]{The
          Turin Intermediary} is a mortal contractor. He has promised access to the Basarab house, not
          secretly transported a missing second phial. He thinks the old patrons want to survive a purge. He
          will sell the rendezvous information to save himself if the cell can show his buyers intend to
          remove witnesses.</p><blockquote><p>“You keep asking why they would pay for something that kills
          them. Do you leave a loaded gun in the hand of a man who calls your existence an
          illness?”</p></blockquote><p>He can provide a Novara contact, an airfield handling arrangement, or
          the house’s question about forced treatment. A dragon cufflink corroborates a relationship when
          paired with his records; jewelry alone is not proof of identity or species. If he leaves, his
          telephone contact and vehicle trail remain alternate routes. He does not retroactively sell a
          rendezvous six weeks before it was selected.</p><h3>Three legitimate
          outcomes</h3><ul><li>Independent custody: Corvi surrenders to the cell with conditions. They can
          leave the factory with him alive and the case secure.</li><li>Church return: Corvi can be persuaded
          if the cell secures auditable conditions. This moves the climax to the Council; Claudia and Registry
          must respond to the actual transfer.</li><li>Refusal or confrontation: Corvi retreats or negotiates
          from another position. The broker and surveillance pressure create urgency, but no scripted blast
          confiscates the case.</li></ul><h3>When a player says “I take a picture”</h3><p>Offer
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.0zKe76iE0e9VFppG]{C13},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.wHkKKUcyBof5CX06]{C14},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.E3dVclO0uZ3jyGye]{C15}.
          Match the subject, access, lighting, and current state. These ordinary snapshots contain no hidden
          puzzle. A photograph of damage records damage; it does not identify its cause. Use a clean NPC
          portrait for a simple introduction. F-series photographs contain additional evidence and need their
          own provenance.</p><p><strong>Scene options:</strong>
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.eu4Vy9WBx8iGce1d]{TM10 — Lingotto
          rooftop in rain},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.jqBp0bbZpuYJAVE1]{BM05 — Assembly
          floor}, @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.gAxI1cJhYftPzFGK]{BM06 —
          Supervisor booth and catwalk}. The map determines this encounter’s usable sightlines; a photographic
          impression is not a measurement.</p>
    - name: Claudia — The Choice Behind the Betrayal
      type: text
      text:
        content: >-
          <h2>Claudia — The Choice Behind the Betrayal</h2><figure><img
          src="modules/neon-relic-mission-sangreal/assets/art/scenes/totm/tm-rooftop.webp" alt="Lingotto — use
          for an actual pursuit or exposed conversation" style="width:100%;height:auto"><figcaption>Lingotto —
          use for an actual pursuit or exposed conversation</figcaption></figure><h3>Claudia is a person with
          a false account of the danger</h3><p>She believes Registry 16 protects people from a primordial
          contagion. The ward seems to confirm everything she was taught. She can comfort a frightened nurse,
          obtain a legal crossing, and share an accurate lead while still planning to steal the case. Play
          those actions sincerely. Her tragedy comes from the fact that her superiors mean “protect the
          bloodline” literally and have not told her whose bloodline it is.</p><h3>Before an extraction
          attempt, check all four conditions</h3><ul><li>She is free to act and has not already changed
          allegiance.</li><li>The Veronica Thread remains in her possession and usable.</li><li>She can reach
          the case without inventing an unobserved action.</li><li>She has transport or a reachable route and
          a reason to believe the rendezvous remains secure.</li></ul><p>If any condition is absent, she
          adapts: asks to handle the transfer, seeks an ally, proposes a route, or abandons the theft. She
          cannot teleport through restraints or an investigator’s declared watch. The existing relic controls
          the Thread’s effect; a flash does not automatically put the case in her hand.</p><h3>Give the
          players a warning and a response window</h3><p>She asks who will carry the attaché; moves her
          transport closer; or reaches for the rosary while offering to lead Corvi down. State the movement
          before resolving it. A player covering her can interrupt. If she triggers the relic, run the actual
          disorientation, movement, and pursuit using the system rules and map. Let their precautions matter.
          The factory’s daylight hazard is visible and avoidable; do not force a phial to burst just to cover
          her exit.</p><h3>If they expose her before she acts</h3><blockquote><p>“I saw what that dose did.
          You saw it. You are still talking about handing it to men who kept it for centuries. Tell me who
          will stop them opening it again.”</p></blockquote><p>She admits her Order’s destruction mandate when
          confronted with the ledger and her private communication. She initially believes a vampire-interest
          claim is Vatican disinformation. Presenting independent evidence of the purge, a Basarab connection,
          and orders to protect that house can break her certainty. One emblem is insufficient; a telex in her
          own chain of command is much stronger. If the cell offers accountable containment and protection
          from both factions, she can cooperate. Do not demand that she trust the Church to earn
          redemption.</p><h3>What she can give them</h3><p>A cooperative or searched Claudia supplies the
          rendezvous route, the identity of Registry 16, her handling orders, and the Thread if intact.
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.e7WrCS9xFqFcAJHF]{I14 — Telex
          Dispatch: Registry 16} is a standing extraction directive recoverable from her messages or folio; it
          need not wait beside a corpse. Its exact wording is what she received, even if she rationalized
          “bloodline” as a containment code.
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.jFJ2aF20hnTgr1Ul]{I37 — The Empty
          Needle} depicts a spent holder: use that image only after the Thread has been used. Before use,
          describe the intact concealed tool and let a search recover it without showing contradictory
          empty-needle evidence.</p><h3>Outcomes to carry
          forward</h3><table><thead><tr><th>Outcome</th><th>Next scene</th><th>What
          changes</th></tr></thead><tbody><tr><td>Claudia escapes with the case</td><td>Track a vehicle,
          message, or broker contact to Novara</td><td>The default abbey rendezvous can occur. Track actual
          departure time.</td></tr><tr><td>Claudia is captured</td><td>Interrogate, protect, or negotiate; use
          her orders to intercept the pack</td><td>No Claudia corpse at the abbey. The pack seeks the actual
          case location.</td></tr><tr><td>Claudia changes sides</td><td>She can arrange a controlled
          rendezvous or expose the command channel</td><td>Registry may notice missed reports. Give a response
          delay; do not grant it immediate omniscience.</td></tr><tr><td>Cell keeps the case but loses
          Claudia</td><td>Plan secure transport or call a custody conference</td><td>Novara is a planned enemy
          meeting, not a mandatory crime scene.</td></tr><tr><td>Cell returns the case to Rome</td><td>Run the
          Council with a real inventory and witnesses</td><td>A covert seizure becomes a political and
          security problem, not an inevitable road chase.</td></tr></tbody></table><h3>Do not make grief
          mandatory</h3><p>If she dies in play, use her earlier kindness and mistaken conviction to give the
          death weight. If she lives, let the harder work of responsibility continue. Her survival is not a
          failure to deliver the mission’s intended emotion.</p>
    - name: Novara — Intervene, Investigate, or Pursue
      type: text
      text:
        content: >-
          <h2>Novara — Intervene, Investigate, or Pursue</h2><figure><img
          src="modules/neon-relic-mission-sangreal/assets/art/scenes/totm/tm-abbey-arrival.webp" alt="Abbey
          approach — breached only after an attack" style="width:100%;height:auto"><figcaption>Abbey approach
          — breached only after an attack</figcaption></figure><h3>Choose the abbey state before revealing the
          art</h3><table><thead><tr><th>Party’s
          arrival</th><th>Situation</th><th>Use</th></tr></thead><tbody><tr><td>Before the pack, case at
          abbey</td><td>Claudia is alive, awaiting transfer; cell can warn, arrest, protect, or lay an
          ambush</td><td>Describe an intact approach. Do not show breached-gate/body
          images.</td></tr><tr><td>During the pack’s arrival</td><td>A contest over custody, with exits,
          frightened mortals, and sealed cargo</td><td>Use courtyard/interior maps and actual initiative;
          nobody dies offscreen because a clue card needs them dead.</td></tr><tr><td>After an unopposed
          attack</td><td>Default aftermath: Claudia dead, one broken phial, ten taken to the
          airfield</td><td>TM11 and TM12; I13, I38, I40 as earned evidence.</td></tr><tr><td>Case never
          reached abbey</td><td>Unused rendezvous, handlers, abandoned message, or a meeting the cell
          controls</td><td>No manufactured slaughter and no mandatory broken
          phial.</td></tr></tbody></table><h3>The pack’s demand</h3><blockquote><p>The leader stops outside
          the light. He looks at the container, not at the faces around it. “You call it recovery. Rome called
          it custody. Tell me what word you will use when you make us take it.”</p></blockquote><p>The pack
          wants the blood removed from potential deployment and destroyed under its own control. It fears a
          single contaminated wound and the political consequences of surrender. Its members use barriers and
          tools rather than bare hands. They are dangerous adversaries, not immune scenery. A credible
          neutral-custody offer can buy time; an imminent threat to dose them can provoke desperate violence.
          They will retreat if the alternative is certain exposure. Use their existing statistics.</p><h3>If
          the default attack happened</h3><blockquote><p>The gate has opened the wrong way. Brick dust lies
          inside the courtyard beneath the torn fittings. From the dining hall, a single lantern makes a small
          warm patch on the floor. Beyond it, the room is very still. Someone has left in a hurry, but someone
          else has been left behind.</p></blockquote><p>Pause before describing Claudia. Let the players
          approach and decide how to proceed. Show
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.URoAcs3MRSAqrakE]{TM12 — Abbey
          dining hall threshold} or the body evidence only after they enter. The corpse is evidence and a
          person, not a reward for missing an appointment.</p><table><thead><tr><th>Find</th><th>What it
          establishes</th><th>What it cannot establish
          alone</th></tr></thead><tbody><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.zCbHgDIvUDf0NQeB]{I13
          — The Novara Slaughter}</td><td>A violent killing and a breached vessel; compare bite pattern and
          other scene evidence</td><td>A named killer from tooth spacing
          alone</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.U2IpaLLta03yQl0w]{I38
          — Two Fingers, Calcified}</td><td>Rapidly altered tissue at the spill; vampire effect when compared
          with records and a reliable identification</td><td>Identical chemistry merely because two substances
          are white
          ash</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.phIsjPz5WHarCoVB]{I40
          — Her Effects, Laid Out} and
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.e7WrCS9xFqFcAJHF]{I14 — Telex
          Dispatch: Registry 16}</td><td>Claudia’s travel, possessions, affiliation, and extraction
          orders</td><td>A journey directly from Turin solely from one toll
          stub</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.GnEgQ3rUIxDi1GQo]{I15
          — Flight Clearance: YR-BAS}</td><td>Planned aircraft, destination, cargo, and departure
          time</td><td>The aircraft has already left or cannot be
          stopped</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.AwrHknjihUDqll80]{I44
          — Consignment Markings}</td><td>Default consignment inventory and a reused logistics
          crate</td><td>Church authorization of the entire theft just because the crate once belonged to
          it</td></tr></tbody></table><p>The damaged-finger photograph does not prove the injured operative
          survived exposure. If a later F09 image shows an injured operative alive, treat it as an earlier or
          separately documented injury unless actual play and the artifact’s resolution support that survivor.
          Do not invent immunity to preserve an asset. The default fatal purge can leave these fragments
          without leaving a living witness.</p><h3>The decision under time pressure</h3><p>As soon as an
          investigator makes a quick document sweep, give the filed flight plan and its time. Tell them the
          current local time and estimated journey. They can leave a forensic team, photograph in place,
          collect a few key items, or stay. A photograph does not cost an entire shift during a chase. Full
          reconstruction can take a shift after people are safe. Make the tradeoff explicit before time
          passes.</p><h3>Three ways onward</h3><ul><li>The flight clearance names the airfield and
          registration.</li><li>Claudia’s orders or the broker’s contact identifies the handling agent and
          rendezvous.</li><li>Petra/Stephan can query dispatch and radar once given a registration, route, or
          operator. Their answer has a stated delay and source.</li></ul><h3>When a player says “I take a
          picture”</h3><p>Offer
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.8PgGu8m7izwYBIO3]{C16},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.Laubhjg7TgqleOEw]{C17},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.D9UKW0SQBtFZSwzZ]{C18}.
          Match the subject, access, lighting, and current state. These ordinary snapshots contain no hidden
          puzzle. A photograph of damage records damage; it does not identify its cause. Use a clean NPC
          portrait for a simple introduction. F-series photographs contain additional evidence and need their
          own provenance.</p><h3>The airfield: an objective, not a cutscene</h3><p>Before showing
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.tlrpaGAGQo3Qhk98]{TM13 —
          Abandoned airfield hangar}, check whether the hangar is empty. If the aircraft is loading, describe
          it or use the apron map. State the obstacles: fence/gate, distance to the aircraft, ground crew,
          pack position, and time until clearance. Do not secretly advance the departure because the players
          found a shortcut.</p><table><thead><tr><th>Approach</th><th>Possible gain</th><th>Cost /
          risk</th></tr></thead><tbody><tr><td>Official hold through Covenant or airfield
          authority</td><td>Grounding delay, fuel access denied, gate opened</td><td>Authority must be
          verifiable; covert opposition may contest it</td></tr><tr><td>Speak to ground crew / handling
          agent</td><td>Locate cargo or interrupt loading</td><td>Workers need protection from the pack and a
          reason to risk their jobs</td></tr><tr><td>Interdict at the apron</td><td>Recover a case or disable
          transport before takeoff</td><td>Combat, bystander safety, and phial fracture risks use existing
          rules</td></tr><tr><td>Negotiate</td><td>Exchange safe passage for supervised neutral custody or a
          delay</td><td>The Elder demands evidence that Rome cannot deploy the
          reserve</td></tr><tr><td>Aircraft already gone</td><td>Identify destination and preserve chain of
          custody</td><td>A real failure of timing, not a predetermined ending; move to the conditional
          bridge</td></tr></tbody></table><p>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.fnZm0Dl4nHlnas4G]{I39
          — Tarmac, 01:15} records the default loading state at 01:15;
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.R4F2ocb2JCwwfKOB]{I45 — Airfield
          Briefing Sheet} is a reconnaissance sheet annotated with a filed/confirmed planned slot. It is not a
          prophecy of actual wheels-up. If the flight is held, annotate the record. The forty-minute window
          means forty minutes of opportunities; it is not “forty minutes early is still too late.”</p><h3>When
          a player says “I take a picture”</h3><p>Offer
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.WvJ6ZeOsll96y9wc]{C19},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.eyO4tcMIc2crn3hk]{C20}.
          Match the subject, access, lighting, and current state. These ordinary snapshots contain no hidden
          puzzle. A photograph of damage records damage; it does not identify its cause. Use a clean NPC
          portrait for a simple introduction. F-series photographs contain additional evidence and need their
          own provenance.</p><p><strong>Maps:</strong>
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.5UwVLTp8ofRAjQ9W]{BM07 — Abbey
          gate and courtyard},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.9wHAIjutxJqKmHqB]{BM08 — Abbey
          dining hall and cloister},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.lGukiMcNwlfc2Wh3]{BM09 — Hangar
          and apron}. Use full layouts when the tactical situation warrants them.</p>
    - name: The Accounting — What Kind of Peace Remains?
      type: text
      text:
        content: >-
          <h2>The Accounting — What Kind of Peace Remains?</h2><figure><img
          src="modules/neon-relic-mission-sangreal/assets/art/scenes/totm/tm-council.webp" alt="The council
          chamber — a negotiation that can happen before the ending"
          style="width:100%;height:auto"><figcaption>The council chamber — a negotiation that can happen
          before the ending</figcaption></figure><h3>The scene can happen early</h3><p>A call or meeting with
          Sabbatini is available whenever the cell brings a concrete risk, contradiction, or custody proposal.
          The complete archive is harder to obtain than a safety answer. Do not require Claudia’s death or the
          aircraft’s departure to unlock his ability to speak.</p><blockquote><p>Sabbatini leaves the report
          closed while you finish. Then he turns it so the case number faces you. “Before we discuss blame,”
          he says, “how many vessels, where are they, and who has been exposed?”</p></blockquote><h3>Play the
          argument, not a villain’s confession</h3><p>He fears a rebirth more than a scandal. He also prefers
          a policy he controls to one he must defend in public. Those motives can align, but not always. He
          admits the existing peace is based on the houses’ inability to increase their numbers without
          diminishing themselves. He will argue that keeping the pure reserve was responsible. The clinical
          evidence challenges his misleading assurances; the attempted purge challenges the cost of his
          secrecy.</p><blockquote><p>“If we had destroyed it, we would have lost the last restraint they
          believed in. If we used it, we would have broken the agreement ourselves. So we kept it. You may
          call that cowardice. For a long time it kept people alive.”</p></blockquote><p>Let the players ask
          who counted the victims of that agreement. He cannot supply an ethically clean answer. The meeting
          is stronger when he concedes a real wrong: the zero-risk statement was knowingly incomplete, and the
          recovery team should have received the handling protocol. He can authorize a written correction and
          witness protection without confessing crimes he did not order.</p><h3>Evidence that changes the
          negotiation</h3><table><thead><tr><th>Evidence / commitment</th><th>Leverage</th><th>Concession to
          offer</th></tr></thead><tbody><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.SilYzv6luOt5X6Am]{I07
          — Patient File 09-H} /
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.VMoT17MWZ543rWHe]{I29 — The
          Injection Log} with Graf’s testimony</td><td>Demonstrated danger to humans and the cost of withheld
          safety data</td><td>Clinical protection, full CT3 release, no further human
          use</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.e7WrCS9xFqFcAJHF]{I14
          — Telex Dispatch: Registry 16} /
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.NvsqxXBP29kM6SVV]{I25 — The Ledger
          Page}</td><td>Registry infiltration and a documented betrayal of the liaison
          role</td><td>Independent oversight of clergy assigned to the
          recovery</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.t9kMeFOoglJgJeno]{I12
          — Palimpsest Leaf, Codex} /
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.U2IpaLLta03yQl0w]{I38 — Two
          Fingers, Calcified} or a witnessed purge</td><td>The elders have a rational fear of imposed
          mortality</td><td>Written non-deployment undertaking and monitored
          storage</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.bylOSJzw3hElf5Nb]{I17
          — Dispatch Box, Microfiche}</td><td>The historic deterrent policy and the population
          accommodation</td><td>A reviewable custody agreement rather than another oral
          promise</td></tr><tr><td>Accurate inventory plus neutral witnesses</td><td>The cell can actually
          prevent both proliferation and forced treatment</td><td>Funding, transport, safe housing, and
          reciprocal access</td></tr></tbody></table><h3>Terms the players can
          negotiate</h3><ul><li>Dual-signature storage and transfer, with the Covenant retaining copies of the
          ledger.</li><li>Protection for Graf, surviving staff, Corvi, and a cooperating Claudia;
          accountability does not require delivery to a disappearance squad.</li><li>No administration to
          humans or vampires without a separately agreed process. The case does not settle whether consent
          could ever make such use acceptable.</li><li>An independent count of remaining phials, clinical
          residue, destroyed material, and missing consignments.</li><li>Restrictions on public disclosure
          that preserve safety while allowing a record of institutional wrongdoing.</li></ul><p>The sanction
          squad is a credible risk if a hardliner orders it or an armed standoff escalates; it is not an
          automatic punishment for learning the truth. I41 and I42 can expose preparations and procurement
          links. Negotiation, external witnesses, leaving the building, or a command intervention can prevent
          an attack. Apply the same standards of causality to Church agents as to everyone
          else.</p><h3>Resolve the campaign the players actually
          made</h3><table><thead><tr><th>Outcome</th><th>End Mission 1 with</th><th>Possible Mission
          2</th></tr></thead><tbody><tr><td>Case secured; witnesses protected</td><td>A signed custody ledger
          and a fragile new agreement</td><td>Audit remaining networks, safeguard the reserve, pursue those
          who planned its use</td></tr><tr><td>All blood verifiably destroyed</td><td>A lost deterrent and a
          relieved but suspicious vampire leadership</td><td>Renegotiate peace without the reserve; trace
          independent research, not a magically restored case</td></tr><tr><td>Some or all phials flown
          east</td><td>Exact losses, destination evidence, and surviving allies</td><td>Recover only the
          vessels actually missing; the house intends incineration, creating a real
          deadline</td></tr><tr><td>A phial reaches another human</td><td>A new containment emergency with a
          named recipient</td><td>Protect communities and decide whether a sustainable new lineage is
          possible</td></tr><tr><td>Church receives unconditional custody</td><td>Recovery succeeds, oversight
          remains unresolved</td><td>Follow the consequences of the cell’s choice without declaring success
          meaningless</td></tr><tr><td>Cell keeps the reserve outside both institutions</td><td>A defended
          holding arrangement and pressure from both sides</td><td>Diplomacy and containment, with the cell
          responsible for its own promises</td></tr></tbody></table><h3>Closing image</h3><blockquote><p>The
          last question in the report is a box marked DISPOSITION. There is space for a signature beneath it.
          There is not enough space for everyone who has an opinion about what you should
          write.</p></blockquote><p>Ask each investigator what they write, whom they protect, and which fact
          they refuse to omit. Record the answer. That is the bridge to the next mission, whether or not a
          plane left Italy.</p><h3>When a player says “I take a picture”</h3><p>Offer
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.kBWFyXm1RLabkHBz]{C21}.
          Match the subject, access, lighting, and current state. These ordinary snapshots contain no hidden
          puzzle. A photograph of damage records damage; it does not identify its cause. Use a clean NPC
          portrait for a simple introduction. F-series photographs contain additional evidence and need their
          own provenance.</p><p>If Claudia’s room is searched,
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.72tNLODObuOLLVyV]{TM15 — Claudia
          convent room} shows a private life rather than a second compulsory confession. Her correspondence
          can corroborate motives; never conceal an essential final lead there after the cell has already
          resolved the case.</p>
    - name: Evidence — What Each Piece Actually Establishes
      type: text
      text:
        content: >-
          <h2>Evidence — What Each Piece Actually Establishes</h2><p>DA reference. Core cards answer a
          question or provide an exit. Supporting cards corroborate or deepen it. Optional and conditional
          images are not a checklist the party must complete. If the source image’s scene never happened, do
          not fabricate it to use the
          asset.</p><table><thead><tr><th>Card</th><th>Source</th><th>Role</th><th>Inference
          limit</th><th>Action</th></tr></thead><tbody><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.9VyBQIhDJHgbR5PF]{I01
          — The Burnt Electromagnet Relay}</td><td>L1 / inspected relay</td><td>Core: breach
          method</td><td>Damage plus analyzed residue supports use of the Lodestone; a photograph alone does
          not identify chemistry.</td><td>Compare the suppressed handling entry I36; ask who could obtain the
          tool.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.MH3cXgf0hGIZzcO3]{I02
          — CCTV Reel #87-04}</td><td>L1 / security reel</td><td>Core: movement</td><td>Corvi carries the case
          out. A partial rail pass supplies a destination lead; a shadow does not reveal lead
          shielding.</td><td>Verify rail records or search L2; a distant veil is only an identification
          lead.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.1XbUUYGspeQ02iZH]{I03
          — The Excised Codex Register}</td><td>L1 / archive register</td><td>Support: preparation</td><td>An
          excised shelf entry connects Corvi’s research to XII-SANG custody. A recent charge card is not by
          itself proof of a centuries-long plot.</td><td>Find I35 and ask Ghiberti about
          access.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.5DoANlYa53w4faSv]{I04
          — Numerals on Rag Paper}</td><td>L2 / Vulgate and desk</td><td>Core: destination</td><td>The exact
          cipher yields GENEUA / UBS / HAUSMANN / DDKI / C with the Latin U/V spelling normalized in GENEVA.
          For the numeric group use A B C D E F G H I K = 1 2 3 4 5 6 7 8 9 0: D D K I = 4 4 0
          9.</td><td>Offer Ghiberti’s indexing convention or HQ decoding. The blotter corroborates 4409; bank
          lookup by Hausmann avoids a puzzle
          bottleneck.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.auf7Uqb4VPNc9Hp7]{I05
          — Embossed Stamp, Map Casing}</td><td>Claudia’s map casing / actual observation</td><td>Optional:
          affiliation</td><td>A reused Order stamp and marked cities suggest prior preparation; they do not
          prove vampire allegiance.</td><td>Compare the earlier bank visit I25 or ask about her
          employer.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.lOsCniEBTy2c974w]{I06
          — The Escrow Transfer Slip}</td><td>L3 / authenticated escrow carbon</td><td>Core:
          recipient</td><td>CHF 500,000 conditional payment identifies Hausmann and Sonnenberg. Corvi’s access
          to an ecclesiastical trust is not Church authorization of treatment.</td><td>Call the clinic;
          determine whether the proposed treatment has
          occurred.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.SilYzv6luOt5X6Am]{I07
          — Patient File 09-H}</td><td>L4 / Graf or clinical records</td><td>Core: human
          outcome</td><td>Documented remission followed by conversion. Date relative statements to the actual
          chart; before treatment this completed record does not exist.</td><td>Protect patient and staff;
          compare I29 and
          I09.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.Uanb3MKR6vPcGHq5]{I08
          — The Swiss PTT Intercept Tape}</td><td>PTT intercept / source verified</td><td>Core: Turin
          route</td><td>After the first treatment, Corvi’s call names Lingotto and eleven vessels. A buyer’s
          offer is not a completed second transfer.</td><td>Contact the broker or go to L5; adapt or omit if
          players prevented
          treatment.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.D18a1YRCEQu27KHw]{I09
          — Histopathology Log: Marrow Graft}</td><td>L4 / Graf’s slides and notes</td><td>Core:
          mechanism</td><td>The human marrow is being replaced by a foreign vector. This supports a biological
          explanation; it does not establish a divine origin or a safe cure.</td><td>Compare Corvi’s text and
          actual vampire-exposure
          evidence.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.FIvSwaxBVCP0etIQ]{I10
          — The Vector Mechanics (CT1)}</td><td>Analysis / Corvi plus clinical and exposure
          evidence</td><td>Synthesis: CT1</td><td>Recipient state changes the effect. Humans convert after 24
          elapsed hours; existing vampires resolve the artifact’s Endure Difficulty 5 test. Failure: ash in
          three rounds. Success: mortal with organ failure.</td><td>Use protected handling. Share only the
          supported parts until the combined truth is established; never require a deliberate exposure
          experiment.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.dypD1aQAOBWpTyg0]{I11
          — The Resonance Field (CT2)}</td><td>L4 or L5 / observed resonance and logs</td><td>Synthesis:
          CT2</td><td>Unshielded blood within 100 m worsens the sick and wounded and exerts a pull. This does
          not force a player to drink or create ghouls merely by proximity.</td><td>Apply shielding and
          separate injured people from the uncontained
          source.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.t9kMeFOoglJgJeno]{I12
          — Palimpsest Leaf, Codex}</td><td>Corvi’s papers / L5 or an earned earlier copy</td><td>Core:
          historical hypothesis</td><td>The apocryphon describes unmaking a predator’s curse. It supports
          Corvi’s interpretation; it is not scientific proof of Christian history.</td><td>Compare I09 and
          I38; ask Corvi what he knew before the
          experiment.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.zCbHgDIvUDf0NQeB]{I13
          — The Novara Slaughter}</td><td>L6 / only after the actual attack</td><td>Core:
          aftermath</td><td>Violent death, broken glass, spilled contents, and altered tissue establish an
          attack and a lost vessel. In the default branch eleven arrived, one broke, ten left.</td><td>Quick
          document sweep finds the flight lead; full forensics need not delay the
          pursuit.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.e7WrCS9xFqFcAJHF]{I14
          — Telex Dispatch: Registry 16}</td><td>Claudia’s folio/messages or abbey effects</td><td>Core:
          extraction order</td><td>The directive names Registry 16, the Thread, Novara, Basarab, and
          incineration. It links the extraction to bloodline protection.</td><td>Confront Claudia or intercept
          the planned transfer; death is not required to obtain
          this.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.GnEgQ3rUIxDi1GQo]{I15
          — Flight Clearance: YR-BAS}</td><td>Dispatch/handler/Claudia’s documents</td><td>Core: planned
          flight</td><td>YR-BAS, Cluj-Napoca, ten planned units, 01:15. It is a filed plan whose cargo and
          departure can change.</td><td>Call the airfield, seek a hold, reach the apron, or track an actual
          departure.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.9NpgA6XbC6AKGYEY]{I16
          — The Quiescence Formula (CT3)}</td><td>Ghiberti’s handling records; Graf’s supplied kit;
          L7</td><td>Synthesis: CT3</td><td>Darkness, shielding, cold, and treated linen define quiescence.
          Sunlight destroys exposed contents.</td><td>Make the instructions available before hazardous
          transfer; do not require the ending to obtain safety
          information.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.bylOSJzw3hElf5Nb]{I17
          — Dispatch Box, Microfiche}</td><td>L7 / documented request or negotiation</td><td>Core: political
          record</td><td>Rome retained the reserve as deterrent while a dilution-limited accommodation held.
          The memorandum proves policy, not authorization of every later crime.</td><td>Negotiate custody and
          non-deployment; available early with concrete
          leverage.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.gpEG58FggEY1toq2]{I18
          — Second Descent}</td><td>L1 / lift footage and established Gerard testimony</td><td>Optional:
          second visitor</td><td>04:02 is a later visit; default visitor is the Watcher. Do not alter anything
          Gerard already told this table.</td><td>Compare access records; distinguish observation after the
          theft from participation in
          it.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.msJvTkZUJb1CBYqF]{I19
          — Plinth Detail, Brass Plate}</td><td>L1 / plinth</td><td>Core: the name</td><td>SANGREAL supports
          the Grail assumption but does not name a cup. Wear records handling, not the identity or purpose of
          every handler.</td><td>Ask about workshop inventory or Corvi’s research; early blood interpretation
          is
          allowed.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.EE4LDI5tCUb9YG9l]{I20
          — Safe Dial, Drilled}</td><td>L2 / safe</td><td>Support: prior search</td><td>A drilled safe and
          untouched valuables show a targeted search. Claudia conducted it earlier; the photo alone does not
          identify her.</td><td>Request the missing search inventory and compare access
          testimony.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.yjSZ4jRoC9F50C62]{I21
          — Diplomatic Passport}</td><td>L2 copy / authenticated travel record</td><td>Support:
          route</td><td>A Chiasso stamp corroborates travel. Accompagné suggests a companion but does not name
          one.</td><td>Ask the carrier or Corvi. Do not assign a companion to Claudia when established
          movements rule it
          out.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.cs4mFCPQYvft88T1]{I22
          — The Archive, 1962}</td><td>L2 / historical photo</td><td>Optional: research
          history</td><td>Younger Corvi and an older mentor connect his work to the archives. A red cross is
          an annotation, not proof of execution or immortality.</td><td>Identify the folder and compare I35.
          Keep approved different-session ages and the matching
          tie.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.6RWEHDPMeZJFj86J]{I23
          — Night Deposit}</td><td>L3 / bank security</td><td>Support: custody</td><td>A case was brought to
          the counter at the recorded time. Observers in frame are leads, not identified conspirators without
          corroboration.</td><td>Compare the ledger and
          receipt.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.TqsNZiq5wWnCyrO1]{I24
          — Bank Staff Record}</td><td>L3 / bank personnel file</td><td>Support: source
          credibility</td><td>Mercier had vault access and retained a carbon. Neither a thumbprint nor a
          nervous portrait proves knowledge of the contents.</td><td>Offer a safe interview and request
          I25.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.NvsqxXBP29kM6SVV]{I25
          — The Ledger Page}</td><td>L3 / original ledger with carbon or testimony</td><td>Core: Claudia
          discrepancy</td><td>The altered Vane entry records her separate pre-assignment inquiry. It exposes a
          lie about prior involvement, not a simultaneous journey.</td><td>Ask her directly; preserve the
          record; restrict access if the cell
          chooses.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.SI5TGjifT8qC6Epu]{I26
          — The 06:40 to Geneva}</td><td>Station surveillance / dated negative</td><td>Support:
          route</td><td>Corvi’s train and a recurring observer corroborate movement. A distant watcher is not
          automatically identifiable.</td><td>Verify rail destination or identify the observer through another
          source.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.p51PQ2RP2raSDBHp]{I27
          — Intake Photograph, 09-H}</td><td>L4 / intake record</td><td>Support:
          before-and-after</td><td>Hausmann before treatment provides identity and baseline appearance. No
          black supernatural eyes before treatment.</td><td>Compare current patient, I28 and
          I29.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.1dPSK2h5z6DX5Eab]{I28
          — Photophobia Test 02:40}</td><td>L4 / clinical documentation</td><td>Support:
          symptoms</td><td>Photophobia and unreactive dilation are observable after administration. They do
          not explain the whole vector.</td><td>Use controlled light and examine the treatment
          log.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.VMoT17MWZ543rWHe]{I29
          — The Injection Log}</td><td>L4 / signed chart</td><td>Core: chain of custody</td><td>Batch XII-1/12
          documents one released phial and who administered it. Trace samples do not subtract another whole
          vessel.</td><td>Confront Corvi and the escrow arrangement; protect the chart and
          witnesses.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.QEO98GDqJtZlL08l]{I30
          — Ward 3, Corridor Camera}</td><td>L4 / corridor recording</td><td>Support: threat</td><td>A
          dangerous changed patient is recorded. Movement and identity require matching the full sequence, not
          a decorative anomaly.</td><td>Plan staff evacuation; do not force a repeat
          encounter.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.OvqUML75EHpXFQ0P]{I31
          — Sonnenberg, Observed}</td><td>L4 approach / actual surveillance</td><td>Optional: Church
          pressure</td><td>SCV 47 and repeated observers connect to surveillance once identified. A vehicle
          alone does not prove a murder order.</td><td>Verify plates, contact the command chain, or move
          witnesses.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.F6S9nFRmRvOKLqLf]{I32
          — Daylight Test: Combustion}</td><td>L4 / trace-sample test log</td><td>Support:
          CT3</td><td>Daylight destroyed clinical residue. White ash is not by itself proof of the same
          mechanism as vampire senescence.</td><td>Use I16 for storage; I38 for comparative biological
          evidence.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.tkYtaX7GeNiTtUeg]{I33
          — Lingotto, Rooftop, Rain}</td><td>L5 / stakeout if the pictured positions occur</td><td>Optional:
          tactical position</td><td>Two figures and a booth establish positions only. Do not put Claudia in
          two places or force betrayal to fit the image.</td><td>Plan approach and control the exit; omit if
          the scene state
          differs.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.HprCCHuQXSASoSTQ]{I34
          — Assembly Hall, Camera 6}</td><td>L5 / prior camera record</td><td>Support: location</td><td>Corvi
          carried the case through the works; damaged fittings warn of handling risk. Reflections prove no new
          supernatural ability.</td><td>Find the booth and inspect the container before moving
          it.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.WNTzWxpF2S7xU230]{I35
          — Breve Apostolicum, 1582}</td><td>L2 copy / Corvi’s research</td><td>Support: custodial
          history</td><td>The matching shelf mark connects the excised register to an old brief. A repaired
          seal alone does not prove which contents were opened.</td><td>Ask about the documented handling
          protocol and original
          text.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.Hx9jKUQtU1Jmwh2O]{I36
          — Suppressed Index Card}</td><td>L1 suppressed index / L2 carbon</td><td>Support: breach
          tool</td><td>The Lodestone is capable of disrupting the cradle; Corvi’s authorized archive access
          supplies opportunity.</td><td>Compare I01 and custodial issue records; do not infer Sabbatini
          ordered the
          theft.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.jFJ2aF20hnTgr1Ul]{I37
          — The Empty Needle}</td><td>Claudia’s kit after activation</td><td>Conditional: spent
          Thread</td><td>An empty holder and fibres support use of the relic. Before use, a search finds the
          intact tool instead; this spent image is not a pre-use photograph.</td><td>Secure the tool or
          reconstruct the escape actually
          played.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.U2IpaLLta03yQl0w]{I38
          — Two Fingers, Calcified}</td><td>L6 spill / after actual contact</td><td>Core: vampire
          response</td><td>Altered tissue supports rapid senescence when identified and compared with the
          vector evidence. No guaranteed surviving two-finger operative.</td><td>Combine I09/I12 or reliable
          vampire identification; use the existing exposure
          rules.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.fnZm0Dl4nHlnas4G]{I39
          — Tarmac, 01:15}</td><td>Airfield / actual loading or sourced surveillance</td><td>Conditional:
          loading</td><td>Aircraft and cargo are visible at a particular moment; the photograph does not end
          the scenario.</td><td>Intervene while possible or document actual
          departure.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.phIsjPz5WHarCoVB]{I40
          — Her Effects, Laid Out}</td><td>Claudia’s recovered belongings</td><td>Support: affiliation and
          route</td><td>Her documents connect her to the Order and rendezvous. The 22:15 toll records the last
          local passage before the default 23:45 attack, not a guaranteed direct Turin trip.</td><td>Compare
          I14; protect her if alive. Do not lay out corpse evidence for a
          survivor.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.XWAylCZFSBMFiPpB]{I41
          — The Green Lamp}</td><td>L7 / earned surveillance</td><td>Optional: prepared response</td><td>A
          Registry dossier proves the office had intelligence, not that Sabbatini already identified Claudia.
          Waiting guards are a warning, not an unavoidable ambush.</td><td>Ask for the file and put external
          witnesses on the
          meeting.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.xOiejtMxuQ1Q4vDv]{I42
          — L'Entità Team, 1987}</td><td>Authenticated operational photos / L7 or broker</td><td>Support:
          enforcement capacity</td><td>Identified officers, vehicle and equipment tie a team to L’Entità.
          Procurement links are not proof Gerard is a killer.</td><td>Prepare protection and challenge or
          interrupt a specific
          order.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.mD3LMAVAHB3FK3rL]{I43
          — The Case, 1964}</td><td>L1 / workshop archive</td><td>Support: container history</td><td>The 1964
          container was commissioned for older vessels. The prelate appears in a separate later session from
          I22.</td><td>Ask for handling documentation. A workshop order does not establish the contents’
          theological
          origin.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.AwrHknjihUDqll80]{I44
          — Consignment Markings}</td><td>Hangar / default cargo consignment</td><td>Support:
          inventory</td><td>10/12 means one clinical vessel spent and one lost at the abbey in the default
          route. The second sale was refused. Reused Vatican packaging indicates a logistics lead, not
          universal Church complicity.</td><td>Check actual count and handler; record any player-caused
          changes.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.R4F2ocb2JCwwfKOB]{I45
          — Airfield Briefing Sheet}</td><td>Wayfinder or dispatch / sourced briefing</td><td>Support:
          airfield planning</td><td>The marked 01:15 slot is a planned clearance; a reconnaissance image can
          predate the intended flight. A crossed-out aircraft was excluded by analysis, not a compulsory decoy
          trap.</td><td>Confirm current tower status and choose an interception
          approach.</td></tr></tbody></table>
    - name: Sound Effects — Cue Sheet
      type: text
      text:
        content: >
          <p><strong>Revised use:</strong> these are optional sound cues. Historical day labels describe the
          unattended route only. Play a cue only when the event occurs; never force a betrayal, death, ghoul
          outbreak or takeoff to justify a track. Keep ordinary conversation quiet enough to
          hear.</p><h2>Sound Effects — Cue Sheet</h2>

          <p><strong>DA eyes only.</strong> The module ships a Foundry playlist, <strong>Sangreal Sound
          Effects</strong> (compendium pack <em>Sound Effects</em>; the Content Installer imports it into a
          world folder of the same name). Ambience beds loop until you stop them; stings play once. Volumes
          are starting trims — ride them live.</p>

          <p>Playlist:
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-sfx.Playlist.wxpL4Q4Ozfnvh71z]{Sangreal Sound
          Effects}</p>

