          <h2>Image Egg Index — All 45 Cards</h2>
          <p>Quick reference for the DA: every information card and the hidden details in its artwork. Cards whose <em>fallback</em> day is mentioned in the day entries above can be delivered via HQ packet if the cell misses them on-site — the image is the reward either way. When a player examines a card's art, answer with the egg, not the summary.</p>
          <table>
            <tr><th>Card</th><th>Egg in the art</th></tr>
            <tr><td><strong>I1 — The Burnt Electromagnet Relay</strong></td><td>Sulfurous residue in the slag; the plinth is scorched from <em>beneath</em> — the failure came up through the cradle.</td></tr>
            <tr><td><strong>I2 — CCTV Reel #87-04</strong></td><td>Corvi casts a faint shadow but the case throws opaque black; a nun's veil at the frame edge, forty metres behind, in no report.</td></tr>
            <tr><td><strong>I3 — The Excised Codex Register</strong></td><td>Shelf-mark MS-Vat-Heb-418; the red card (1582, XII-SANG-00) has no dust — it was placed recently.</td></tr>
            <tr><td><strong>I4 — The Polybius Vulgate Cipher</strong></td><td>The blotter's mirror-writing already reads GENEVA and 4409; a Roma Termini ticket beneath it.</td></tr>
            <tr><td><strong>I5 — The Watcher's Hallmark</strong></td><td>Three cities circled in pencil before the case existed; the stamp's second impression shows long use.</td></tr>
            <tr><td><strong>I6 — The Escrow Transfer Slip</strong></td><td>"1 of 12" with a clerk's pencilled tick; the fold where it lived in a jacket.</td></tr>
            <tr><td><strong>I7 — Patient File 09-Hausmann</strong></td><td>The gold wristwatch and clinic logo are thread-ends to the feral predator and the escrow letterhead.</td></tr>
            <tr><td><strong>I8 — The Swiss PTT Intercept Tape</strong></td><td>A second tape box in the same neat hand as I3's red card; the final line circles a Turin extension.</td></tr>
            <tr><td><strong>I9 — Histopathology Log</strong></td><td>"Foreign graft — not infection"; a second polaroid intrudes — she kept one.</td></tr>
            <tr><td><strong>I10 — The Vector Mechanics (CT1)</strong></td><td>Batch numbers tie to 1 of 12; "six shifts" conversion window — the same clock the board counts down.</td></tr>
            <tr><td><strong>I11 — The Resonance Field (CT2)</strong></td><td>A blood bag swollen past bursting — proximity decay; the 02:40 sharps-bin line; the thermometer at I16's quiescence threshold.</td></tr>
            <tr><td><strong>I12 — The Ebionite Palimpsest</strong></td><td>The underlayer is the actual Gospel of the Twelve; <em>sanguis remedium, non sacramentum</em>; a Hotel Bristol matchbook pins his trail.</td></tr>
            <tr><td><strong>I13 — The Novara Slaughter</strong></td><td>White calcified metacarpals, one with a legible whorl; a broken phial in the tiles; the carry-strap cut; the unused second wine glass. Popout asset shows the carotid detail.</td></tr>
            <tr><td><strong>I14 — Telex Dispatch: Registry 16</strong></td><td>PROTECT THE BLOODLINE; Amsterdam perforations; one unburned line survives the melt: RENDEZVOUS "BASARAB".</td></tr>
            <tr><td><strong>I15 — Flight Clearance: YR-BAS</strong></td><td>Basarab Holdings; "Ten Consignment Units"; 01:15; the cancelled form beneath means the flight waited.</td></tr>
            <tr><td><strong>I16 — The Quiescence Formula (CT3)</strong></td><td>The kit in the photograph is already installed in Zurich — Rome's protocol precedes the crime.</td></tr>
            <tr><td><strong>I17 — The Basarab Extortion File</strong></td><td>The "iron nail" memo; an ouroboros-eye scorched into the tin's underside — someone else has read this file.</td></tr>
            <tr><td><strong>I18 — Second Descent</strong></td><td>The ouroboros-eye signet on the descending hand; the lift already called from below; 04:02 matches P7's pencil line.</td></tr>
            <tr><td><strong>I19 — The Name Below the Plinth</strong></td><td>The case's scrape outline: opened in situ more than once; the plaque predates the 1964 case.</td></tr>
            <tr><td><strong>I20 — The Clean Drill</strong></td><td>Professional swarf, not panic; the kneel used twice; Claudia's compact — she searched the room first.</td></tr>
            <tr><td><strong>I21 — Diplomatic Passport</strong></td><td>Chiasso stamp two hours after the gate film; <em>accompagné</em> — a companion the reports omit; same tie as 1962.</td></tr>
            <tr><td><strong>I22 — The Archive, 1962</strong></td><td>The mentor's ouroboros-eye ring; the XII-SANG folder between them; a red X recent enough to still matter.</td></tr>
            <tr><td><strong>I23 — Night Deposit</strong></td><td>The Watcher's reflection in the marble; the bank cloth under the case; the calendar reads 17 September 1987.</td></tr>
            <tr><td><strong>I24 — Bank Staff Record</strong></td><td>The access stamp that explains why Mercier was chosen; the transfer carbon (CHF 500,000, 4409-C) he copied for himself.</td></tr>
            <tr><td><strong>I25 — The Ledger Page</strong></td><td>Hausmann tried to buy more than one phial; under the correction fluid: "Vane, C." at 02:10.</td></tr>
            <tr><td><strong>I26 — The 06:40 to Geneva</strong></td><td>Same raincoat, same newspaper; EC 30 ROMULUS; the Vatican courier label on the luggage trolley.</td></tr>
            <tr><td><strong>I27 — Intake Photograph, 09-H</strong></td><td>The gold watch returns on the feral predator; the clinic logo matches the escrow letterhead.</td></tr>
            <tr><td><strong>I28 — Photophobia Test 02:40</strong></td><td>The XII-1/12 batch tag; the light switch taped over; the nurse's withdrawing hand.</td></tr>
            <tr><td><strong>I29 — The Injection Log</strong></td><td>Vaduz trust account equals the escrow account in I6; room 3.14 rhymes with the vault's 03:14.</td></tr>
            <tr><td><strong>I30 — Ward 3, Corridor Camera</strong></td><td>The ceiling silhouette; the spill trail ends under a service duct — ventilation, not doors; 02:40.</td></tr>
            <tr><td><strong>I31 — Sonnenberg, Observed</strong></td><td>SCV 47 beneath the clinic; the Watcher's newspaper under the camera; one window taped from the inside.</td></tr>
            <tr><td><strong>I32 — Daylight Test: Combustion</strong></td><td>The ash matches the Novara fingers; the quiescence kit already on the bench; 07:12 — twenty minutes after sunrise.</td></tr>
            <tr><td><strong>I33 — Lingotto, Rooftop, Rain</strong></td><td>Vane between Corvi and the booth's only door; the second case-sized rectangle (his papers); SCV 47 below.</td></tr>
            <tr><td><strong>I34 — Assembly Hall, Camera 6</strong></td><td>The deadbolt taped — the case has been forced or dropped; Corvi casts no shadow in the puddles.</td></tr>
            <tr><td><strong>I35 — Breve Apostolicum, 1582</strong></td><td>The shelf-mark ties to I3; the seal was cracked, opened, and repaired; the marginalia name XII-SANG-00.</td></tr>
            <tr><td><strong>I36 — Suppressed Index Card</strong></td><td>"Corrosive to ferrous circuitry" is the whole plan; the handling order came from the Prefect's office.</td></tr>
            <tr><td><strong>I37 — The Empty Needle</strong></td><td>A clean, deliberate cut; ochre sheath fibres inside; the scorch is fresh — snapped recently and near here.</td></tr>
            <tr><td><strong>I38 — Two Fingers, Calcified</strong></td><td>Fracture lines match I32's crucible ash; a printable whorl partial; the dragon-crest ring melted into the ash.</td></tr>
            <tr><td><strong>I39 — Tarmac, 01:15</strong></td><td>Tail reads YR-BAS; the crate carries the dragon crest; the Elder looks down the lens — the pack has stopped caring.</td></tr>
            <tr><td><strong>I40 — Her Effects, Laid Out</strong></td><td>The Talamasca card; the toll stub ninety minutes before death; grey animal hair around the trigger guard.</td></tr>
            <tr><td><strong>I41 — The Green Lamp</strong></td><td>REGISTRY 16 — AMSTERDAM already on Sabbatini's desk; the operative's grey coat; three figures in the reflections.</td></tr>
            <tr><td><strong>I42 — L'Entità Team, 1987</strong></td><td>A Vatican gendarme wristwatch; SCV 47 at the kerb; the phosphorus canister on the third man's belt.</td></tr>
            <tr><td><strong>I43 — The Case, 1964</strong></td><td>The plaque was stamped before the case was built; "destroyed if opened"; the supervisor is I22's prelate.</td></tr>
            <tr><td><strong>I44 — Consignment Markings</strong></td><td>Chalk tally 10/12; VATICAN MUSEUMS — STOREROOM 9 ghosted beneath the fresh paint.</td></tr>
            <tr><td><strong>I45 — Airfield Briefing Sheet</strong></td><td>The crossed-out decoy aircraft; the handwritten confirmation dated the same night as the clearance in I15.</td></tr>
          </table>
          <p><em>DA note: the egg index is deliberately shallow — one sentence per card. The full readings (retrieval, what the image shows, and how to use it) live in each card's own DA notes on the Information Web.</em></p>
