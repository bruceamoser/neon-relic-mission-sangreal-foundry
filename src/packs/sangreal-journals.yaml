          is no compulsory vault heist and no relic to recover from 4409-C.</td></tr> <tr><td>Who is
          Hausmann?</td><td>“Kurt Hausmann, a private banker. The paying principal. He wanted a treatment at
          Sonnenberg.” Mercier cannot diagnose his illness; Petra can establish his public occupation and Graf
