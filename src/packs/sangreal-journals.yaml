- _id: sangreal-journal-bridge
  name: 'The Tarmac at Novara-Cameri — Mission 2 Bridge'
  type: journalEntry
  pages:
    - name: 'The Tarmac'
      type: text
      text:
        content: |
          <h2>The Tarmac at Novara-Cameri</h2>
          <p>When the cell follows the flight manifest to the Novara-Cameri military airfield, they find an abandoned hangar. Rain beats against discarded fueling lines (bed: <audio controls preload="none" style="height:1.7em;vertical-align:middle" src="modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-storm-wind.mp3"></audio> <em>Storm wind</em>) — show it as they reach the doors (show scene @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.tlrpaGAGQo3Qhk98]{TM13 — Abandoned airfield hangar}).</p>
          <p>Then walk them out onto the apron and put the ground down for the last beat of the mission (show map @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.lGukiMcNwlfc2Wh3]{BM09 — Hangar and apron}): the hangar floor and the empty cradle, the dispatch annex, the fuel bowser under the floodlights, the fence line and the gatehouse at the far edge. The Cessna 421 Golden Eagle departed forty minutes earlier, climbing through storm clouds over the Alps into Eastern European airspace. Radar contact was lost as the aircraft crossed into Romanian territory under a falsified commercial corridor.</p>
          <p>Ten intact phials of the <em>Twelve Phials of Gethsemane</em> remain in the hands of an ancient vampire retrieval cell belonging to the Basarab dynasty — a foundational Wallachian bloodline that has influenced European statecraft for centuries.</p>
          <p>The shattered tenth phial at the Novara safehouse revealed their motive: the blood of Christ is an immediate biological execution order for active vampires. They do not seek to drink it; they intend to transport it to a private sanatorium in the Carpathian Mountains and incinerate every droplet in an industrial furnace, extinguishing their only natural predator forever.</p>

    - name: 'The Concordat Requisition'
      type: text
      text:
        content: |
          <h2>The Concordat Requisition</h2>
          <p>Returning to Rome, the agents enter the Palace of the Holy Office. The pretenses of the Holy See have collapsed. Cardinal Sabbatini stands before the open rain-streaked windows overlooking St. Peter's Basilica.</p>
          <blockquote>
          <p>"You have seen the ash upon the floor at Novara," the Cardinal states, placing a pouch of diplomatic passports upon the table. "You understand what lies within that steel case. For two thousand years, Rome has told the world that the blood was shed for their salvation. We never revealed whose death it was intended to buy."</p>
          </blockquote>
          <p>He signs and pushes forward the official <strong>Concordat Requisition Order</strong>:</p>
          <blockquote>
          <p>"The Basarab house believes they have won. They believe they can incinerate the Blood of Golgotha and rule the shadows of Europe without fear of the grave. The Holy See cannot deploy military divisions across the Iron Curtain. But your Covenant recognizes no borders. Requisition whatever equipment you require from our sub-vaults. Fly to Cluj-Napoca. Track that aircraft into the mountains. Recover the Sangreal... or ensure that every monster in that house drinks from the cup."</p>
          </blockquote>
    - name: 'Mission 2: Recover the Sangreal'
      type: text
      text:
        content: |
          <h2>Mission 2: Recover the Sangreal</h2>
          <p>The campaign shifts into <strong>Mission 2: Recover the Sangreal</strong>, transitioning from the urban investigative corridors of Western Europe into the Cold War espionage, fortified mountain keeps, and ancestral horrors of the Carpathian wilderness.</p>
          <ul>
            <li><strong>Theater:</strong> Romania — Cluj-Napoca, the Apuseni foothills, and a private Basarab sanatorium.</li>
            <li><strong>Opposition:</strong> the elder — an unidentified, unaging male — and its retrieval pack (see Cast &amp; Antagonists), plus whatever mortal authorities the dynasty owns.</li>
            <li><strong>Assets:</strong> the Concordat Requisition (diplomatic cover, weapons clearances, funding), the Lodestone of St. Jude if recovered, and the Covenant's own capabilities.</li>
            <li><strong>Stakes:</strong> ten phials. The cure is the only weapon that can end vampire elders — and the only thing they fear. Recover it, use it, or burn it: the choice belongs to the cell.</li>
          </ul>

- _id: sangreal-journal-walkthrough
  name: 'SANGREAL-87-091 — DA Walkthrough'
  type: journalEntry
  pages:
    - name: 'How to Use This Walkthrough'
      type: text
      text:
        content: |
          <h2>How to Use This Walkthrough</h2>
          <p><strong>This is a running script, not a story.</strong> Every beat is laid out the same way so you can run it straight from the page:</p>
          <p><strong>Start with the next page.</strong> <em>The Case — DA Background</em> is the whole truth of the mission in one place: what the blood really is, who wants what, the four facts the players have to assemble, the fixed dates, and the five habits the rest of this journal assumes. Read it once and you can run any act cold.</p>
          <ul>
            <li><strong>The act in one line</strong> — what the cell must achieve in these days, and what it costs if they drift.</li>
            <li><strong>While the cell works (off camera)</strong> — the timed events you read out as news, and the board tracks they advance.</li>
            <li><strong>Scene</strong> — what the place is, in plain words, with the art and map links and the sound bed to play.</li>
            <li><strong>Who is here</strong> — for every NPC: what they look like, what they want, how they answer the cell, and what they will never do. The cast cards (<em>N…</em>) carry the same material as hand-outs; the actor sheets carry their stats.</li>
            <li><strong>What is here</strong> — every clue, document and object at the scene, what it proves, and the condition for getting it (marked <em>Gate:</em>).</li>
            <li><strong>Tests</strong> — anything the cell has to roll for, the test to call (Skill, Attribute, Difficulty), and what a failure costs. If the beat does not list a test, do not invent one: the card is simply there.</li>
            <li><strong>What the cell learns</strong> — the plain-language payoff, so you know whether the scene landed.</li>
            <li><strong>Leads</strong> — where it sends them next, with the day each card arrives by HQ packet if the cell stalls.</li>
            <li><strong>The truth of this act</strong> — what is really happening behind the scenes in these two days, so you can improvise anything the players ask. Player knowledge and this paragraph are not the same thing.</li>
            <li><strong>Read aloud</strong> — one passage per act written to be spoken verbatim. Everything else on the page is yours to paraphrase; this is the only text the table is meant to hear word for word.</li>
          </ul>
          <p><strong>Reading the gates.</strong> Tests are written as <em>Skill (ATTRIBUTE) Difficulty N</em> — for example an <em>Investigate (WIT) Difficulty 2</em>, or a social push as <em>Manipulate (EMP) Difficulty 2</em>. Where a published card or NPC entry already fixes a Difficulty, that number is used; where it does not, a suggested number is given and you are free to move it. Failures always cost time, position or goodwill — never the clue itself, unless the beat says so.</p>
          <p><strong>Numbers, links and pictures.</strong> Card codes (<em>I…</em> clues, <em>N…</em> cast cards, <em>F…</em> photographic evidence, <em>NP…</em> portraits, <em>C…</em> investigator snapshots) are for your eyes; players see the card and its name. Scene links (<em>TM…</em> theatre-of-the-mind, <em>BM…</em> battle map) open the art. Sound links play a one-off cue on your machine; the <em>Sangreal Sound Effects</em> playlist is the whole-table version of the same material, and the cue sheets at the back of this journal list every track and every photograph against the beat it belongs to.</p>
          <p><strong>The two-stage twist — protect it.</strong> Zurich is the False Revelation: let the players conclude that communion was an unholy feast and Christ the First Vampire. Turin and Novara are the inversion: the histopathology (@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.D18a1YRCEQu27KHw]{I09 — Histopathology Log: Marrow Graft}), the Ebionite palimpsest (@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.t9kMeFOoglJgJeno]{I12 — Palimpsest Leaf, Codex}) and the ash-crumpled fingers at Novara (@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.U2IpaLLta03yQl0w]{I38 — Two Fingers, Calcified}) prove the blood is a cure, and its hunters are the ones afraid of it. Hold @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.t9kMeFOoglJgJeno]{I12 — Palimpsest Leaf, Codex} until the table has seen @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.D18a1YRCEQu27KHw]{I09 — Histopathology Log: Marrow Graft}, and never let an NPC say the word “cure” before the parley at the Lingotto.</p>
          <h3>The clock, the board and the fallbacks</h3>
          <p>Fourteen days, four shifts each (Morning, Day, Evening, Night) — fifty-six shifts from the opening to catastrophe. Day 14 starts the case; Day 1 is the terminal window. Relic milestones fire when the last quadrant of their keyed day is filled; the schedule lives in the DA Case Brief, and each act page repeats its own milestones under <em>While the cell works</em>.</p>
          <p>Every card carries an HQ fallback day. When the cell stalls, a Covenant packet delivers it at that day — listed at the end of each act as <em>If the cell stalls</em>. Use it: the case is not a puzzle they can fail, only one they can arrive at late and pay for.</p>
          <h3>Before the first session</h3>
          <ul>
            <li>Run the Content Installer once, then open the <strong>Compendium Map</strong> page in the Start Here journal to see where everything landed.</li>
            <li>Set the case clock to Day 14, Shift 1, and open the case board with the room.</li>
            <li>Read the act page you are about to run, and nothing more: each one is written to be run cold.</li>
          </ul>
    - name: 'The Case — DA Background'
      type: text
      text:
        content: |
          <h2>The Case — DA Background</h2>
          <p><strong>Read this page once, before Day 14, and then never open it at the table.</strong> Everything else in this journal is written for the moment of play; this page is the truth underneath it. If you know it by heart you can run any beat cold, because you will always know what is really going on while the players work out a fraction of it.</p>

          <h3>The truth, in plain words</h3>
          <p>In 1582 the Vatican took twelve phials of blood out of circulation and sealed them in a lead case named <em>Sangreal</em>, hidden in Vault IX beneath the Campo Santo Teutonico. The blood is not a relic and it is not a sacrament. It is a cure: a graft that rebuilds marrow, rebuilds tissue and rebuilds a dying body — and then keeps rebuilding it, in the dark, on a falling body temperature, with an appetite for plasma that nothing sates. The Church's own histopathology calls it <em>foreign graft — not infection</em>. The custodians of 1582 hid it rather than destroy it, because destroying it would have meant admitting what they had found.</p>
          <p>Monsignor Matteo Corvi, an ecclesiastical historian, translated the Ebionite fragments, understood what the blood was, and decided the Church should not keep it. On Day 14 he took the attaché out of the vault with a Lodestone of St. Jude and a Field Quiescence Kit, and went north to sell it to the only buyer who could pay for it — a dying man, Kurt Hausmann, through a Zurich clinic. He never got the money. What he got, in order, was: a bank escrow, a betrayal, a broker, a pack of Wallachian vampires who want the cure far more than they want the case, and fourteen days of a secret society's attention.</p>
          <p><strong>The horror, stated plainly.</strong> The cure works. That is the horror. Every person the cell watches get better is becoming a photophobic, sleepless, plasma-hungry thing in the same six shifts — and the ones hunting the cure across Europe are the ones who <em>know</em> it works, because a splash of it burned two of their fingers to white ash. The misdirection in this case is that the players will spend ten days certain the blood is a demonic plague. It is not. It is a medicine, and it is the medicine's price that ends the world, not the medicine's origin.</p>

          <h3>Who wants what</h3>
          <table>
            <thead><tr><th>Player</th><th>Wants</th><th>Will do</th></tr></thead>
            <tbody>
              <tr><td><strong>The Covenant (the cell's own HQ)</strong></td><td>The case recovered and the story contained.</td><td>Fund, equip, delay and then blame. Sabbatini is running the truth through the Council as a political weapon, not a recovery operation.</td></tr>
              <tr><td><strong>Monsignor Corvi</strong> — the thief</td><td>To hand the cure to someone who will use it, and to be understood.</td><td>Flee, hide, lecture, surrender to the right credentials. Never fights.</td></tr>
              <tr><td><strong>Sister Claudia Vane</strong> — the escort</td><td>The twelve phials burned, with her order's hands on the fire.</td><td>Lie continuously, stay attached to the case, snap the thread when the moment opens, then run.</td></tr>
              <tr><td><strong>Talamasca / Registry 16 (Amsterdam)</strong></td><td>The phials destroyed as a plague.</td><td>Read the Covenant's mail, run Claudia, green-light her on Day 6, sanitise the Zurich study on Day 4.</td></tr>
              <tr><td><strong>The Basarab dynasty</strong> — the buyers</td><td>The cure, in bulk, flown out of Europe.</td><td>Buy quietly, buy often, break off rather than die, and remember a face for Mission 2.</td></tr>
              <tr><td><strong>The Intermediary</strong> — Turin</td><td>Money, and to be somewhere else on Day 3.</td><td>Sell the same address twice, then take the night train to Milan.</td></tr>
              <tr><td><strong>The Grey Watcher</strong></td><td>One photograph of the case changing hands, and a buyer for it.</td><td>Never intervene, never be cornered, step off the train at Lausanne. His negatives are the case file's missing frames.</td></tr>
              <tr><td><strong>Kurt Hausmann</strong> — the first buyer</td><td>To understand what was done to him, and then to eat.</td><td>Talk lucidly in the dark, refuse to leave the ward, and hunt the Zurichberg after Day 8.</td></tr>
              <tr><td><strong>Dr. Elizabeth Graf</strong> — the clinician</td><td>Her slides destroyed, her family out of the country.</td><td>Administer, record, hide one slide, burn the rest, lie once.</td></tr>
            </tbody>
          </table>

          <h3>What the players must work out</h3>
          <p>Four facts, in this order, and each one costs them something:</p>
          <ol>
            <li><strong>The theft was an inside job with two people in it</strong> (Days 14–13): Corvi took the case out; someone with an ouroboros ring went in behind him; a nun was forty metres back in the corridor.</li>
            <li><strong>The case was bought before it was stolen</strong> (Days 12–9): a Church escrow account, a Vaduz trust, a Zurich clinic and a dying man — the money was arranged weeks ahead.</li>
            <li><strong>The blood is a cure, and the cure kills the cure's hunters</strong> (Days 8–5): histopathology, the calcified fingers, the daylight test, Corvi's own margin note.</li>
            <li><strong>The Covenant's own escort has been working for the Order the whole time</strong> (Days 4–1): the ledger page, the embossed stamp, the telex dispatch, the snapped thread — all of it on the table since Geneva for anyone who looked.</li>
          </ol>

          <h3>The clock you are running</h3>
          <p>Fourteen days, four shifts a day. The dates that cannot move:</p>
          <table>
            <thead><tr><th>Day</th><th>Fixed event</th></tr></thead>
            <tbody>
              <tr><td>14</td><td>The theft has already happened; the cell is called in.</td></tr>
              <tr><td>11</td><td>Corvi crosses at Chiasso and rides EC 30 to Geneva with the attaché on his knees.</td></tr>
              <tr><td>10</td><td>Hausmann is injected at 02:00. The first phial is spent.</td></tr>
              <tr><td>8</td><td>Hausmann wakes changed; the third-floor night staff are gone; Corvi walks the case out of Zurich.</td></tr>
              <tr><td>7</td><td>L'Entità closes the Swiss–Italian frontier.</td></tr>
              <tr><td>6</td><td>The case opens on the Lingotto floor; the second phial is bought; Talamasca green-lights Claudia.</td></tr>
              <tr><td>4</td><td>The flash. The daylight breach, the thread snapped, the case taken from under the cell's hands. Graf is marked.</td></tr>
              <tr><td>2</td><td>The pack hits the abbey; ten phials change hands; the eleventh shatters. Claudia is executed.</td></tr>
              <tr><td>1</td><td>Wheels up at 01:15. The operation ends whether or not the cell is at the fence.</td></tr>
            </tbody>
          </table>
          <p>Everything else is negotiable. If the cell is late, the packet arrives and the case still resolves — the mission fails on what they understood, never on whether they found the card.</p>

          <h3>Running it — the five habits this walkthrough assumes</h3>
          <ul>
            <li><strong>Say the plain thing.</strong> You are never protecting a riddle from the players: you are protecting it from the characters' absence. If the cell asks a question that any competent investigator would ask, answer it with the fact. The gates in this journal buy <em>detail</em>, not the existence of the clue.</li>
            <li><strong>Describe, then shut up.</strong> Scene blocks are sensor data — what the place smells like, what is nailed to the door, where the light comes from. Read them, then let the players fill the silence. <em>Read aloud</em> lines are written to be spoken verbatim; everything else is yours to paraphrase.</li>
            <li><strong>Play the NPC as a person with a job.</strong> Nobody in this case is a cultist for its own sake. Mercier is a clerk with a debt, Gerard is a sergeant on a stool, Graf is a pathologist with a mortgage. The mundane register is what makes the supernatural land.</li>
            <li><strong>Ten minutes of pleasure is worth a whole session of fear.</strong> When the players do something clever, let it work before you complicate it. When they do something cruel to an NPC who was merely inconvenient, do not punish them — log it and let the epilogue invoice them.</li>
            <li><strong>You decide where the material is open.</strong> Wherever a beat says <em>you decide</em>, the answer is not hidden in another chapter: invent it, write it down, keep it consistent, and treat the version you invent from then on as canon. This case is built to be run, not to be adjudicated.</li>
          </ul>
    - name: 'Days 14–13 — Rome: The Empty Plinth'
      type: text
      text:
        content: |
          <h2>Days 14–13 — Rome: The Empty Plinth</h2>
          <p><strong>The act in one line.</strong> They arrive after the theft and have to work a vault they never saw opened. By the end of these two days the cell should know what was taken, how it was taken, and that the thief had help from inside the Church — and they should be on the road north with the Church's own escort attached to them.</p>
          <p><strong>While the cell works (off camera).</strong> <em>Day 14:</em> the theft has already happened — Corvi crossed into Switzerland at Chiasso with the attaché and is registered under his own name in a Geneva pension; a grey raincoat reads the same newspaper in three cities this week. <em>Day 13:</em> the Congregation authorises the search of Corvi's apartment and attaches Sister Claudia Vane to the inquiry as ecclesiastical liaison.</p>
          <p><strong>If the cell stalls.</strong> I03 delivers Day 13; I01, I18 and I19 deliver Day 12.</p>
          <p><strong>The truth of this act.</strong> Two people emptied that vault, working for two different masters, and they do not know about each other. Corvi took the case; the Holy Alliance’s own operative — the one wearing the ouroboros ring, and the one the Church will never name — shut the containment down so the theft would succeed and then followed him out. Claudia Vane was in the corridor as a witness for the Talamasca, not as the Church’s escort. Nobody at this table is lying to the cell yet; they are simply not being told anything true.</p>
          <p><strong>Read aloud.</strong> <em>The doors open on a room that is exactly the temperature of a hospital fridge. Roman brick, faced in lead, sweating. Twelve moorings on the altar cradle. Eleven of them still hold their velvet. The twelfth is a clean unmarked ring in the dust, and the brass plate under it says SANGREAL in letters older than the case that used to sit there.</em></p>

          <h3>Beat 1 — The descent to Vault IX (L1)</h3>
          <p><strong>Scene.</strong> St. Peter's, and beneath it the Campo Santo Teutonico: a hydraulic cage dropping forty feet through rock into a room the Church has owned since 1582. Show @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.e5iULuABev6xj4n0]{TM01 — Hydraulic lift vestibule and descent} for the vestibule and the descent, and @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.fk4iveJh9oz2DMDa]{TM02 — Vault IX arrival} the moment the doors open — octagonal Roman brick faced in lead, refrigeration lines sweating at 2°C, a black granite altar, and an empty mooring plinth with a tarnished brass plaque below it reading <strong>SANGREAL</strong>. Play the lift on the way down: <audio controls preload="none" style="height:1.7em;vertical-align:middle" src="modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-vault-lift-descent.mp3"></audio> <em>Vault lift descent</em>. Let the players find the plaque themselves; nobody says the word for them.</p>
          <p><strong>Who is here.</strong> @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.AArBxHFCdC7qBCke]{N02 — Sister Claudia Vane} — Sister Claudia Vane, the cell's escort and the Congregation's liaison officer. Black habit over a grey under-layer, a scuffed leather folio held in both hands, completely still and never surprised; she badges them through the Longinus Crossing pier and answers questions about liturgy, access and procedure with professional warmth. What she wants: to stay attached to the cell and to be the one who decides when the case is handed to the Swiss. What she will not do: touch the case, discuss the vault's inventory beyond the official list, or leave the cell alone in the vault for the first visit. Play her as helpful and slightly too calm — the players should like her. <strong>What she knows:</strong> the vault manifest and the liturgical calendar, and she will recite both perfectly. She does not know what was in the case and will say so with a straight face that is, at this point, still true. Her tell, if anyone is watching for it: she answers questions about the Church instantly and questions about the theft half a beat late.</p>
          <p><strong>What is here.</strong></p>
          <ul>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.9VyBQIhDJHgbR5PF]{I01 — The Burnt Electromagnet Relay} — the burnt electromagnet relay from the altar cradle: sulfurous residue baked into slag, and scorching on the underside of the plinth. <em>Proves</em> an occult artefact was used and that the vault was never forced — it was coaxed open from below. <em>Gate:</em> none; the relay is lying on the altar.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.msJvTkZUJb1CBYqF]{I19 — Plinth Detail, Brass Plate} — the brass plaque and its case-shaped scratch outline in the granite. <em>Proves</em> the case was seated and removed repeatedly, and that the plaque predates the container by centuries. <em>Gate:</em> none if the cell examines the plinth closely; call for an Investigate (WIT) Difficulty 1 to notice the scratch outline.</li>
          </ul>
          <p><strong>Tests.</strong> One, and it is optional: <em>Investigate (WIT) Difficulty 1</em> for the scratch outline under the plinth. Failing it costs nothing but the detail — they can come back to the plinth at any point, and the card is theirs.</p>
          <p><strong>What the cell learns.</strong> The vault held something named SANGREAL, kept cold and seated on a plinth, and the theft was performed with a device that disables the Church's own containment machinery.</p>
          <p><strong>Leads.</strong> The room's records: the CCTV reel and the gate log, both held by the duty officer at the cemetery gate (next beat).</p>
          <p><strong>If the investigators take photographs:</strong> @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.xbQZgy0hY46bSstX]{C01 — Gate and wet paving} (the approach outside) and @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.SW0k0q32vBGhnPUB]{C24 — Escort at the lift gate} (the escort at the lift gate) — mundane records, offered only if a player actually shoots them.</p>

          <h3>Beat 2 — The sweep (Day 14, one shift)</h3>
          <p><strong>Scene.</strong> The same room, worked properly: the altar, the cradle, the plinth, and the corridors that feed them. Show @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.FyPnU7Tmzk9RJebD]{BM01 — Vault and lift vestibule} if the cell works it tactically — the lift vestibule is the south door, the altar dais sits at the centre of the octagon, and the scorched cradle and cable runs follow the east wall. The map is layout only: no walls, lights or tokens are placed for you.</p>
          <p><strong>Who is here.</strong> @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.FqVBUVA5DaDSClZ4]{N12 — Gerard, Vatican Gendarme Duty Officer} — <strong>Gerard</strong>, the Vatican gendarme on duty at the Campo Santo Teutonico gate house the night of the theft (photograph: @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.ylCBSiZxpA1wQbI1]{F11 — Gate House, Logbook}): a tired sergeant of the gate detail, twelve years on the same stool two metres from the logbook, sidearm never drawn inside the cemetery in living memory. He wants the shift to end without him becoming the story. He has the logbook on his desk and will not hand it over; he will read it out to anyone who treats the log as a serious record, offers a cigarette and asks plainly. Rank-pulling, threats or any suggestion that the inquiry is aimed at the gate detail close him for the rest of the case. <em>Gerard's social gate: Manipulate (EMP) or Command (EMP) Difficulty 2; respect for the log and one honest question succeed automatically. <strong>What he knows:</strong> who signed in and out of the cemetery that night, and that the lift ran twice. He volunteers the log, the logbook page and the reel if he is treated as a professional; he will not speculate about nuns, and asking him to will end the conversation.</em></p>
          <p><strong>What is here.</strong></p>
          <ul>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.MH3cXgf0hGIZzcO3]{I02 — CCTV Reel #87-04} — CCTV reel 87-04 of the vault corridor, handed over by Gerard with the gate log. <em>Proves</em> the theft's method: Corvi walks out with the case, the case throws a pitch-black shadow while Corvi casts a faint one, a green railway pass juts from his coat, and forty metres behind him in the frame's far left a nun's veil catches the lamps — a witness no report mentions. <em>Gate:</em> Gerard's cooperation (above); if it fails, the reel arrives in the Day 12 packet.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.gpEG58FggEY1toq2]{I18 — Second Descent} — the second descent at 04:02, from the same reel or the gate log. <em>Proves</em> someone was already inside the vault when Corvi left: a figure with a signet ring bearing an eye-in-ouroboros, descending after him. <em>Gate:</em> watch the tape or read the log (both free once Gerard cooperates); @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.fFnKTEu53aLjQVAF]{N14 — Stephan, Wayfinder Remote-Sensing Analyst} — <strong>Stephan</strong>, the Wayfinder remote-sensing analyst (photograph: @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.ySbFGBbdVv8lE3Lr]{F13 — Signals Room, Printouts}) — can confirm the timing independently if asked whether the vault was "disturbed twice".</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.1XbUUYGspeQ02iZH]{I03 — The Excised Codex Register} — the excised codex register, pressed out of Ghiberti. <em>Proves</em> the Church removed a card for shelf-mark MS-Vat-Heb-418 under a papal brief dated 1582, and that the red card was re-filed recently — someone alive still reads this file. <em>Gate:</em> see Beat 3.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.auf7Uqb4VPNc9Hp7]{I05 — Embossed Stamp, Map Casing} — the embossed stamp on the map casing, from the casing's paperwork trail. <em>Proves</em> three cities were ringed in pencil — Geneva, Zurich, Turin — before the cell had a case file at all. <em>Gate:</em> must be earned; there is no HQ fallback for this card.</li>
          </ul>
          <p><strong>Tests.</strong> Reading the reel frame-by-frame for the second descent is <em>Investigate (WIT) Difficulty 2</em>; a failure means they see the descent but miss the ring and the lift indicator, and I18 arrives by packet on Day 12. Working the room for the relay's residue is <em>Tech (WIT) Difficulty 1</em>, and failing only delays I01 to the next shift. <em>Layered success:</em> the first success gets the reel; a second lets them read the second descent off the lift indicator; a third gives them the nun’s veil in the far-left frame — the detail no report mentions.</p>
          <p><strong>What the cell learns.</strong> The theft was a two-person job: Corvi took the case out, and somebody with an ouroboros ring went in behind him. A nun was in the corridor forty metres back.</p>
          <p><strong>Leads.</strong> Gerard's log gives a second name and a second descent time. The archive card names the shelf it was pulled from — which means the archivist (next beat).</p>
          <p><strong>If the investigators take photographs:</strong> @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.i25Abf2EuijkRk8O]{C02 — Refrigeration pipes} (inside the vault, the refrigeration pipes) and @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.fSDtZMcDsd07gqaY]{C03 — Damaged copper coil} (the damaged cradle coil — visible heat damage only, no cause), plus @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.g5lsJIx2eJvMkI7v]{C22 — Priest in the passage} if Ghiberti is photographed during an encounter.</p>

          <h3>Beat 3 — Corvi's quarters and the archivist (L1 / L2)</h3>
          <p><strong>Scene.</strong> Two rooms in one beat, in whichever order the cell works them. <em>The apartment</em> (L2, Day 13): authorized by the Congregation, entered under Claudia's escort — drawers opened with academic precision and nothing taken, a safe behind the Saint Sebastian drilled cleanly through the spindle. Show @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.1xPFy0jFa4uqHScD]{TM03 — Corvi quarters arrival} on arrival and @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.KpUAj1DanbE4NuOW]{BM02 — Apartment and guarded corridor} if the search has to happen under pressure — guards in the corridor, a second team in the building; the stair lobby is the south-east entrance and the corridor runs west past the bedroom and library to the study at the far end. <em>The archive</em> (L1): a reading room off the Secret Archives, the suppressed-index drawer open, the archivist already standing.</p>
          <p><strong>Who is here.</strong> @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.ooO1Z311YRSrDjVf]{N06 — Father Ghiberti} — <strong>Father Ghiberti</strong>, archivist of the Secret Archives (photograph: @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.6WzjJmXcPCi5w9T8]{F06 — Card Catalogue, Archive}): small and precise, cassock and lanyard, reading glasses always to hand, thirty-one years in post and four Prefects served. He cannot be bought and cannot be hurried, and he wants the case recorded as a curatorial failure rather than a doctrinal one. Ask once, ask plainly, and he will hand over what he has already decided to give: the excised card and the workshop file. He will not open the 1582 brief, will not name the Prefect, and will not say the word Sangreal aloud in the stacks — press him on any of those and he simply stops answering. <strong>What he knows:</strong> that the register card was pulled by hand, that a supplier won a contract in 1964 to build a sealed container for shelf-mark XII-SANG, and that somebody has been re-reading the 1582 brief this year. He will trade all three for the cell showing him the vault evidence and agreeing, in writing, that this is a curatorial failure. He does not know the word Sangreal means blood, and the cell should hear that ignorance.</p>
          <p><strong>What is here.</strong></p>
          <ul>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.5DoANlYa53w4faSv]{I04 — Numerals on Rag Paper} — sheet music and rag-paper numerals on Corvi's desk: a Vigenère key and a blotter whose mirror-writing reads GENEVA and 4409. <em>Proves</em> Corvi had already worked out where the case was going, and gives the cell their first cipher to break. <em>Gate:</em> none; it is on the desk. <em>Breaking the cipher is Lore (WIT) Difficulty 2 — and if they fail, I04 still stands as evidence; they simply cannot read the blotter until the Day 12 packet.</em></li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.cs4mFCPQYvft88T1]{I22 — The Archive, 1962} — the 1962 archive photograph, in the drawer (photograph: @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.Pw2lfx84lXnwJ8dB]{F01 — Night Desk, Archive}): two men in cassocks at a card catalogue, a red grease-pencil X across the older man's face, the folder between them labelled XII-SANG. <em>Proves</em> the Sangreal case is a 1962 project with a face that somebody alive wanted forgotten. <em>Gate:</em> none in the drawer.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.1XbUUYGspeQ02iZH]{I03 — The Excised Codex Register} and the workshop file, from Ghiberti (above): the excised register card and the 1964 photograph of the case being built, with the pinned order <em>XII phials — Gethsemane lot — destroyed if opened</em>. <em>Proves</em> the container was built as a prison and that its name was stamped before the container was finished. <em>Gate:</em> Ghiberti's cooperation; free once the cell shows him the vault evidence.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.EE4LDI5tCUb9YG9l]{I20 — Safe Dial, Drilled} — the drilled safe, from the room search: fine bright swarf at the spindle, carpet scuffs showing someone knelt in the same spot twice, weeks apart, and a woman's compact mirror half-shadowed under the desk edge. <em>Proves</em> a professional drilled it — and that Claudia searched this room before the Covenant arrived. <em>Gate:</em> a patient search of the apartment; an hour of work, no roll.</li>
          </ul>
          <p><strong>Tests.</strong> Two, both optional: <em>Lore (WIT) Difficulty 2</em> for the cipher (I04 stands either way), and <em>Investigate (WIT) Difficulty 2</em> if the cell tries to beat the safe's drill marks for a timeline — a failure costs a shift, not the card.</p>
          <p><strong>What the cell learns.</strong> The case is a Church-built prison for twelve phials of something the 1582 custodians hid; Corvi had the destination worked out before he fled; and Claudia Vane was in his apartment before the cell was.</p>
          <p><strong>Leads.</strong> Geneva 4409, and a companion on the passport. Both point north — which is where this act's last beat sends them.</p>
          <p><strong>If the investigators take photographs:</strong> @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.uF1PuP1wOZLUKqfS]{C04 — Shelves beside the window} (shelves beside the window — ordinary books; no title is a clue), @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.EJPrt7xGBfHvjKwF]{C05 — Open desk drawers} (drawers standing open) and @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.5XvaBvFzINiSPrbH]{C06 — Drilled safe lock} (the drilled safe — only once the painting is off the wall).</p>

          <h3>Beat 4 — HQ channels and the road out</h3>
          <p><strong>Scene.</strong> A safehouse, or the cell's hotel, or the back of a car: wherever they sit down with the file. Petra runs the Region 04 desk out of a room of maps and a field telephone.</p>
          <p><strong>Who is here.</strong> @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.8rLcyDS8gPI8tCdO]{N13 — Petra, Covenant Logistics Officer} — <strong>Petra</strong>, Covenant logistics for the Italian–Swiss corridor (photograph: @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.cahL8FK5od7MSZsB]{F12 — Map Table, Safehouse}): olive field jacket, map table, crates packed behind her, unshakeable and slightly overworked. She wants a clear request packet and a straight answer about the case's risk level, and in return she moves any card's delivery forward by one day, once per act, and can expedite one request — gear, a vehicle swap, a safehouse. Vagueness gets her default answer: a two-shift delay and a lecture on requisition discipline. <strong>What she knows:</strong> every delivery, every vehicle and every safehouse in the Italian–Swiss corridor, and — if asked the right question — that the escort detail on this case was attached by the Congregation over HQ’s own objection. She will say that only once, and only if the cell asks why a nun was sent.</p>
          <p><strong>What is here.</strong> @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.SI5TGjifT8qC6Epu]{I26 — The 06:40 to Geneva} and @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.yjSZ4jRoC9F50C62]{I21 — Diplomatic Passport} if the cell asks for the paperwork on the crossing: the platform photograph and the diplomatic passport side by side — the two timestamps that prove the thief had a companion. If they have both, this is the act's closing image: put them on the table together.</p>
          <p><strong>What the cell learns.</strong> The Covenant is a bureaucracy as well as a society; it can move them, and it is watching how they spend the case's money.</p>
          <p><strong>Leads.</strong> North by rail. The cell should leave Rome with the reel, the register card and a name in a Geneva pension.</p>
          <p><strong>If the investigators take photographs:</strong> @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.0zKe76iE0e9VFppG]{C13 — Rain beneath a skylight} — the analyst's desk, if @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.fFnKTEu53aLjQVAF]{N14 — Stephan, Wayfinder Remote-Sensing Analyst} is worked over the household telephone or by packet. It is an ordinary record, not a clue, and it is not offered unless a player actually takes the shot.</p>
    - name: 'Days 12–11 — Rome Deep & The Geneva Thread'
      type: text
      text:
        content: |
          <h2>Days 12–11 — Rome Deep &amp; The Geneva Thread</h2>
          <p><strong>The act in one line.</strong> Close Rome's last room, then follow the money north. The cell should end this act inside a Geneva bank, holding the name on the account that bought a phial, and holding the first hard proof that Claudia Vane has been running her own game since before they arrived.</p>
          <p><strong>While the cell works (off camera).</strong> <em>Day 11:</em> escrow release — Corvi signs deposit box 4409-C into the bank's custody and rides the overnight express to Zurich first class with the attaché on his knees; the cell can follow on the same train or arrive a shift later. <em>Day 12:</em> the Talamasca begin reading the Covenant's Swiss mail — advance O2 one square the first time the cell uses the PTT or the diplomatic pouch.</p>
          <p><strong>If the cell stalls.</strong> I06, I21 and I23 deliver Day 9; I22 delivers Day 11; I04 and I20 deliver Day 10; I24, I25 and I07 deliver Day 8; I08 and I26 deliver Day 7.</p>
          <p><strong>The truth of this act.</strong> The case is not being stolen from the Church — it is being sold out of it, by a man who believes he is doing the right thing, to a man who is dying. The money was arranged before the theft: escrow in Vaduz, a clinic in Zurich, a buyer called Hausmann who has been paying for two years to live. Claudia Vane is not following Corvi — she has been running the search since Rome and using the cell as her hands, and her handler in Amsterdam is reading every packet the Covenant sends.</p>
          <p><strong>Read aloud.</strong> <em>The night train is warm and smells of diesel and other people’s coats. Somewhere behind you, three carriages back, a man folds a newspaper he has already read. He is not watching you. He is watching the case, and he has been paid by three different parties to do it.</em></p>

          <h3>Beat 1 — Ghiberti's second interview (L1, Rome)</h3>
          <p><strong>Scene.</strong> The same archive reading room as the first visit, this time with the workshop file, the suppressed-index drawer and the quiescence recipe on the table between you. Ghiberti has already decided to talk; the beat is about how much of it he puts in writing.</p>
          <p><strong>Who is here.</strong> @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.ooO1Z311YRSrDjVf]{N06 — Father Ghiberti} — <strong>Father Ghiberti</strong> (photograph: @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.6WzjJmXcPCi5w9T8]{F06 — Card Catalogue, Archive}): small and precise, cassock and lanyard, reading glasses always to hand, thirty-one years in the Secret Archives and four Prefects served. He wants the case recorded as a curatorial failure rather than a doctrinal one, and he wants the cell to leave with the file instead of coming back for it. He answers the question he was actually asked and no more, cannot be bought, and cannot be hurried — ask once, and ask plainly. He will not name the Prefect, will not open the 1582 brief, and will not say the word Sangreal aloud in the stacks; press him on any of those and he simply stops talking. <strong>What he knows:</strong> that the 1582 brief was opened and sealed again, that the red register card was re-filed within the last two years, and the name of the workshop that built the container. He will write all three down and will not say them aloud, even alone in the room with the cell — that is a piece of characterisation, not a puzzle to solve.</p>
          <p><strong>What is here.</strong></p>
          <ul>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.Hx9jKUQtU1Jmwh2O]{I36 — Suppressed Index Card} — the index card for the Lodestone of St. Jude, stamped SUPPRESSED and annotated <em>corrosive to ferrous circuitry — by order of the Prefect</em>. <em>Proves</em> the Church knew which object disables the vault's electromagnets, and that the suppression order came from inside the building that was robbed. <em>Gate:</em> the suppressed-index drawer with Ghiberti's help, or the carbon in Corvi's file; costs 1 shift.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.mD3LMAVAHB3FK3rL]{I43 — The Case, 1964} — the 1964 workshop photograph, with the pinned order <em>XII phials — Gethsemane lot — destroyed if opened</em>. <em>Proves</em> the case was built as a prison and that its name was stamped before the container was finished. <em>Gate:</em> the same scene as I03 and I36 — requires Ghiberti's help with the archival index, 1 shift.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.EE4LDI5tCUb9YG9l]{I20 — Safe Dial, Drilled} — the drilled safe behind the Saint Sebastian painting, from the room search at L2. Pair it with @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.5DoANlYa53w4faSv]{I04 — Numerals on Rag Paper} as the room's two findings: fine bright swarf at the spindle, scuffs showing someone knelt there twice, weeks apart. <em>Proves</em> professional work, and a second search before the Covenant's. <em>Gate:</em> a patient search, no roll.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.yjSZ4jRoC9F50C62]{I21 — Diplomatic Passport} — Corvi's diplomatic passport, from the desk effects at L2 (no roll if the room is searched patiently). <em>Proves</em> he crossed at Chiasso with a companion the reports omit: a second hand has written <em>accompagné</em> in the margin.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.9NpgA6XbC6AKGYEY]{I16 — The Quiescence Formula (CT3)} — the quiescence formula, from the L2 kit or, if the cell misses it, from the Council Chamber in the epilogue. The mechanical recipe for moving or neutralising the blood: linen, gall, vinegar, myrrh, absolute darkness.</li>
          </ul>
          <p><strong>Tests.</strong> Nothing here is gated except the two archive items, and those need Ghiberti's cooperation rather than a roll — he gives it freely once the cell shows him I03 and the workshop file. If the cell tries to take the suppressed drawer without him: <em>Deft Hands (AGI) Difficulty 2</em>; a failure costs a shift, the drawer is re-keyed, and the card is then only available through the Council Chamber route in the epilogue.</p>
          <p><strong>What the cell learns.</strong> The case is a container the Church built for something it refuses to describe; the Church knew how to stop the vault's machinery; and the whole operation has been banked, insured and paid for — not improvised.</p>
          <p><strong>Leads.</strong> The <em>accompagné</em> entry and the escrow paperwork point at Geneva (L3). If the cell stalls, I03 delivers Day 13 and I01, I18 and I19 deliver Day 12.</p>

          <h3>Beat 2 — The night train, EC 30 (Rome Termini → Geneva)</h3>
          <p><strong>Scene.</strong> The <strong>EC 30 Romulus</strong> is the overnight express from Rome Termini to Geneva — first class with sleeper carriages, the train Corvi took on Day 11 with the attaché on his knees. Two things already point at it: the green railway pass in @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.MH3cXgf0hGIZzcO3]{I02 — CCTV Reel #87-04}, and the <em>accompagné</em> margin note on @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.yjSZ4jRoC9F50C62]{I21 — Diplomatic Passport}. Put the cell aboard whether or not they have worked that out — a compartment is where this act's atmosphere lives and where they first see the watcher. Show @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.JdEbI0D8H7Vju6im]{TM16 — Night train compartment} for the carriage interior and run the journey as one scene with three things to notice.</p>
          <p><strong>Who is here.</strong> The <strong>Grey Watcher</strong> (@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.Jwy5L06PAZfMm881]{N16 — The Grey Watcher}) rides three carriages back: a middle-aged man in a grey raincoat with a folded newspaper and a small leather bag, entirely unmemorable — the sort of man a porter forgets inside a minute. He documents and sells; the same file has been sold to more than one buyer and he is on the trail because the market is. He wants one photograph of the case changing hands and nothing else. He will not approach the cell, will not be cornered in a corridor, and will step off at Lausanne if threatened. <strong>What he knows:</strong> who has bought his photographs and when. He will sell that information for cash, honestly and in full, including the fact that one buyer is a religious order operating out of Amsterdam and that the other paid in Bucharest gold. He is the only person in the case who tells the truth on the first ask, and that should unsettle the table.</p>
          <p><strong>What is here.</strong> @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.SI5TGjifT8qC6Epu]{I26 — The 06:40 to Geneva} — a long-lens platform photograph someone misfiled in the bank's parcel room: a priest climbing into a first-class coach with the attaché case, and near the platform's far end a man in a grey raincoat with a folded newspaper (photograph: @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.hY4hWzAIiBwDEVFE]{F15 — Café Table, Newspaper} once he has been spotted in two frames). <em>Proves</em> the case left Rome by rail under diplomatic cover, and dates the watcher's interest to that same night. <em>Gate:</em> the unattributed surveillance prints in the bank's parcel room (L3), or bought from the Turin Intermediary later. This is the first of the frames the players can use to build a face out of the watcher.</p>
          <p><strong>Tests.</strong> The watcher is only <em>noticed</em> if somebody looks. Call for <em>Investigate (WIT) Opposition</em> against his Sneak 3, or <em>Lore (WIT) Difficulty 2</em> for a player who reasons from @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.MH3cXgf0hGIZzcO3]{I02 — CCTV Reel #87-04}'s pass and the train's timetable. Success: they clock the raincoat and can follow him as far as Lausanne. Failure: he is part of the carriage furniture. Either way he is not catchable and no card depends on it.</p>
          <p><strong>What the cell learns.</strong> They are not the only people following this case, and the other follower is more interested in photographs than in the case — which is exactly what makes his frames useful later.</p>
          <p><strong>Leads.</strong> Geneva, Lausanne and Zurich all sit on this line; the bank is the next real scene.</p>

          <h3>Beat 3 — The Geneva bank (L3)</h3>
          <p><strong>Scene.</strong> The Union de Banques Suisses on the Rue du Rhône: grey alpine granite, brass fittings, rain on the steps, a marble lobby with a night counter, and three private viewing booths off it. Show @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.WYkoHrGfng0UZ3lZ]{TM04 — Geneva bank exterior} outside and @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.w9Gp844xc19nFp0a]{TM05 — Private viewing room} for the booth where the transfer happened; if the cell reaches the vault level, run it on @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.b2nGfJTzx9PeMk09]{BM03 — Bank vault level} — entrance and grand stair on the south side, the three viewing booths along the north-west wall, the wheel door in the east wing behind the deposit-box hall. The bank is a normal institution having a normal day; nobody here is a cultist, and that is what makes it work.</p>
          <p><strong>Who is here.</strong> @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.FkHZCtF2IzBAAt3z]{N07 — Jean-Paul Mercier} — <strong>Jean-Paul Mercier</strong> (photograph: @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.BCkW5MDhfvQIYzHk]{F07 — Viewing Booth, Bank}), the only clerk with both vault access and a debt: wood-panelled booth, three-piece suit, ironed shirt, warm lamp, slight sweat — professionally pleasant, privately terrified. He wants the transaction to stay buried and his own name out of it. Money moves him, and so does a credible threat of exposure or an audit; threats of violence do not — they close him and trip the alarm beneath the counter. <strong>What he knows:</strong> the account that paid, the box number, the date and the fact that a nun came in alone afterwards and asked for the same box. He will give the escrow carbon for money and the ledger page only under real pressure, and he will lie once — claiming he never saw the woman — in a way a good reader of people can hear. He will never admit that he erased a ledger line at the buyer's request.</p>
          <p><strong>What is here.</strong></p>
          <ul>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.lOsCniEBTy2c974w]{I06 — The Escrow Transfer Slip} — the escrow carbon: 500,000 Swiss francs from <em>Kurt Hausmann — Sonnenberg Privatklinik, Zurich</em> into an ecclesiastical escrow account in Vaduz, memo <em>Acquisition of Primary Specimen (1 of 12) — Experimental Oncology Protocol</em>. <em>Proves</em> a phial was bought as a specimen, and gives the clinic name that carries the case to Zurich. <em>Gate:</em> Mercier surrenders it under payment or pressure — <em>Manipulate (EMP) or Command (EMP) Difficulty 2</em>.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.6RWEHDPMeZJFj86J]{I23 — Night Deposit} — the lobby camera frame of the night deposit: a priest at the counter with a locked case, a bank cloth laid precisely beneath it, and the watcher's reflection in the polished marble. <em>Proves</em> the transaction was handled like irregular cargo, and that Claudia's watcher was already inside the building. <em>Gate:</em> the security office — Mercier's cooperation, a bribe, or a discreet break-in arranged through Petra.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.TqsNZiq5wWnCyrO1]{I24 — Bank Staff Record} — Mercier's staff record with the vault-access stamp and the carbon edge of the transfer beneath it: CHF 500,000 and box 4409-C. <em>Proves</em> why the buyer chose this clerk — the only man with both access and debt — and that Mercier photographed the transfer too. <em>Gate:</em> personnel records through a bureaucratic ask (suggest <em>Manipulate (EMP) Difficulty 2</em>, or <em>Tech (WIT) Difficulty 2</em> for the archive), or his desk during the interrogation.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.NvsqxXBP29kM6SVV]{I25 — The Ledger Page} — the deposit-box ledger, its middle entry struck through with correction fluid; beneath it, <em>VANE, C.</em> at 02:10, and above it Hausmann's second access, refused (photograph: @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.ebgnd316nNZktyx0]{F02 — Vault Corridor, Nun}). <em>Proves</em> Claudia entered the vault alone and Mercier was paid to erase it — the proof her own handler has been chasing. <em>Gate:</em> vault access — Mercier's cooperation under payment or pressure, or a night visit through the Geneva corridor.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.SilYzv6luOt5X6Am]{I07 — Patient File 09-H} — Hausmann's clinical dossier: end-stage lymphoma, an undocumented injection four days before admission, total remission in forty-eight hours, then hypothermia, unreactive pupils and burns wherever fluorescent light touched him. <em>Proves</em> the phial is a cure and that the cure is worse. <em>Gate:</em> forwarded from the booth records, or taken at the clinic (L4) by calming Graf.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.Uanb3MKR6vPcGHq5]{I08 — The Swiss PTT Intercept Tape} — a wiretap tape of a payphone call: one voice describing what the blood has done to Hausmann; a second, calm and cultured, ordering the eleven remaining vessels brought across the border to the Lingotto works in Turin. <em>Proves</em> the destination city and the second faction's voice. <em>Gate:</em> the bank mail, or the PTT intercept.</li>
          </ul>
          <p><strong>Tests.</strong> Mercier is the gate for four of the five bank items, so run him as one conversation. Open with <em>Manipulate (EMP) or Command (EMP) Difficulty 2</em> for the escrow carbon; a second convincing — payment, the strongbox number, or the promise of an audit — buys vault access. Failing the first does not lock the act: I23 and I24 are reachable through the security office and personnel records, and I25 through the night corridor. If the cell forces the vault with violence, the cantonal police close the bank for two shifts and I25 has to be retrieved later from the Council Chamber file. <em>Layered success:</em> one success buys vault access; two gets the ledger page before Mercier can re-file it; three turns him and he volunteers the account and the woman, unprompted, in the same conversation.</p>
          <p><strong>What the cell learns.</strong> The phial was bought, not stolen, by a clinic director treating it as an experimental specimen; Claudia Vane was inside the vault alone before the Covenant arrived; and the money behind the sale sits in a Vaduz trust account belonging to a Zurich oncologist.</p>
          <p><strong>Leads.</strong> The clinic name in @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.lOsCniEBTy2c974w]{I06 — The Escrow Transfer Slip} and the destination in @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.Uanb3MKR6vPcGHq5]{I08 — The Swiss PTT Intercept Tape} split the case in two: Zurich (L4) for the specimen and the files, the Lingotto (L5) for the buyer. Both sit on the same railway corridor.</p>
          <p><strong>If the investigators take photographs:</strong> @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.9ZDZIVJTYRghESz4]{C07 — Bank waiting area} (the waiting area), @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.BjSIXo5B9PcT676P]{C08 — Vault door} (the vault door — only if the cell is admitted to the vault level) and @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.9zv3BsynVg6pNjqk]{C09 — Clerk at the counter} (the clerk at the counter — only during an encounter with Mercier where a photograph is possible). None of them is a clue.</p>
    - name: 'Days 10–9 — Zurich: The First Sale'
      type: text
      text:
        content: |
          <h2>Days 10–9 — Zurich: The First Sale</h2>
          <p><strong>The act in one line.</strong> Find the man who bought the first phial and the doctor who injected it. The cell should leave Zurich holding the medical evidence of what the blood does to a body — the False Revelation — and the certainty that the same account paid for both the specimen and the study.</p>
          <p><strong>While the cell works (off camera).</strong> <em>Day 10:</em> the attaché surfaces in Zurich, Corvi cuts the seal in a Bahnhofstrasse vault, and Kurt Hausmann takes delivery of the first phial; at 02:00 that night the injection goes into him (advance P3). <em>Day 9:</em> the Talamasca decrypt the Covenant's Swiss PTT traffic (O2); Graf files the histopathology under a dead trial code and hides one slide (P4); the Turin Intermediary takes the second buyer's deposit in an envelope bearing a Wallachian dragon crest (P5); the Basarab pack crosses into Italy on a freight express and settles under the Lingotto without moving (P6); the Watcher photographs Bahnhofstrasse from a café (P7).</p>
          <p><strong>If the cell stalls.</strong> I04 and I20 deliver Day 10; I27 delivers Day 8; I28, I29, I31, I09 and I36 deliver Day 6; I30, I32, I10 and I35 deliver Day 5; I11 and I12 deliver Day 4.</p>
          <p><strong>The truth of this act.</strong> The cure is real, it works, and it is paid for by the same institution that built the prison the phials were kept in. Hausmann is not a victim and not a monster yet — he is a dying man who bought a cure and got exactly what he paid for, and the thing crossing his ceiling on the fourth night is the price. Graf is the only honest witness in the case and she is about to burn the evidence to stay alive. Nobody has told the cell the word “cure” yet, and no NPC in the case will say it before the Lingotto.</p>
          <p><strong>Read aloud.</strong> <em>Under the sheets, the corridor is utterly silent except for the hum of a strip light nobody has managed to kill. Every window on the floor has been taped over from the inside, in black, in neat width-matched strips — the work of a man who could not have done it if he had not known what was coming. Something considerably heavier than a man shifts sideways in the ceiling conduit above you, and stops.</em></p>

          <h3>Beat 1 — The forest approach (L4)</h3>
          <p><strong>Scene.</strong> Bring them up the Zurichberg in bad weather: white concrete and glass between the trees, and one floor of it gone wrong — third-floor windows taped over in black polyethylene. Show @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.kr4nu0sVNfrcGAJq]{TM06 — Sonnenberg forest approach} on the drive up. The clinic is a fortress of paperwork, so let the players choose their door: auditors, visiting clergy, a courier with a delivery, or Dr. Graf's own name used as cover.</p>
          <p><strong>Who is here.</strong> The clinic's night staff — a duty nurse, a porter, a records clerk. Establish them now, by name or at least by face, because they are the first witnesses to disappear and their absence on Day 8 only lands if the table has met them. They are ordinary people working a night shift and they will answer ordinary questions: who is on the third floor, who signs for deliveries, who has been in the records room this week. They know nothing supernatural and nothing worth a roll; if the cell leans on them, they call the day manager and the cell loses a shift of access. <strong>What they know:</strong> who is on three, who signs for deliveries, and that Dr. Graf has been sleeping in her office. They volunteer all of it for a polite question and a shift-appropriate reason to be asked; none of them knows anything is wrong upstairs.</p>
          <p><strong>What is here.</strong> @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.qMDeMM2EdpPQmIDq]{C10 — Covered ward window} (the taped ward window), @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.6DUDWuZHCpcnYDYn]{C11 — Broken fluorescent fitting} (a smashed fluorescent fitting) and @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.3aBVpBPzfa7Ex25i]{C12 — Utility trolley} (a utility trolley) are available as optional snapshots on the way through — plain records of the ward as found. Nothing here proves who broke what.</p>
          <p><strong>Tests.</strong> Getting in as anything other than intruders is <em>Manipulate (EMP) Difficulty 1-2</em>, depending on the cover story; a failure costs one shift and a second attempt with a worse story. Breaking in is <em>Sneak (AGI) Difficulty 2</em> and puts a guard on the third-floor stair for the rest of the act.</p>
          <p><strong>What the cell learns.</strong> The clinic is a real institution with a real night shift, and its third floor has been sealed from the inside by someone with hospital authority.</p>
          <p><strong>Leads.</strong> Graf's name on the trials register; the ward on the third floor.</p>

          <h3>Beat 2 — The third floor (L4)</h3>
          <p><strong>Scene.</strong> Play the corridor before the room. Start the bed <audio controls preload="none" style="height:1.7em;vertical-align:middle" src="modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-corridor-hum.mp3"></audio> <em>Fluorescent corridor hum</em> (it loops) and stop it the moment they open a door. Show @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.1HRljmcL11d0CPLS]{TM07 — Blacked-out third-floor ward}: tubes smashed, wind moving under sheeting, the air thick with bleach and something older — and something moving in the ceiling conduits overhead (sting: <audio controls preload="none" style="height:1.7em;vertical-align:middle" src="modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-conduit-scrape.mp3"></audio> <em>Something in the ceiling conduits</em>). This is Hausmann's floor.</p>
          <p><strong>Who is here.</strong> @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.pJw1z2zM3rWxMe80]{N05 — Kurt Hausmann} — <strong>Kurt Hausmann</strong>, the feral banker, before the break (photograph: @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.JYzBF0ioQJSIRWaF]{F05 — Corner of a Dark Room}): a sixty-two-year-old man in an expensive suit that no longer fits, in a room with the lights killed, still lucid, radiant and wrong — his tumours gone in two days, his temperature falling, and he has not slept since the injection. He wants to understand what was done to him and will talk about it freely: the protocol was paid for by a Church account, and the man who paid came with a case. He will not leave the ward, cannot explain where the protocol came from, and becomes dangerous only if the lights come on in force. Walk him as a man who has been cured and has quietly understood what the cure costs. <strong>What he knows:</strong> that the injection was arranged by a Church account, that the man who paid brought the case himself and would not open it, and that he has not slept since. He will not admit what he has begun to want at night, and if the cell presses him on it he answers with perfect courtesy and moves to the far side of the room.</p>
          <p><strong>What is here.</strong></p>
          <ul>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.p51PQ2RP2raSDBHp]{I27 — Intake Photograph, 09-H} — the intake photograph from the ward wall or the records room: a gaunt elderly man with an identification board, and the gold wristwatch still on his wrist (pair it with @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.JYzBF0ioQJSIRWaF]{F05 — Corner of a Dark Room} — the horror is the pairing, never the picture alone). <em>Proves</em> the thing in the corridor was a patient of this clinic. <em>Gate:</em> the ward wall (free) or the records room (<em>Tech (WIT) Difficulty 2</em>).</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.D18a1YRCEQu27KHw]{I09 — Histopathology Log: Marrow Graft} — the histopathology log, from Graf. Filament structures in no known tissue, annotated <em>foreign graft — not infection</em>, and the edge of a second polaroid in the frame. <em>Proves</em> the graft is real, deliberate and measurable — and that Graf kept a copy. <em>Gate:</em> Graf's cooperation (Beat 3).</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.FIvSwaxBVCP0etIQ]{I10 — The Vector Mechanics (CT1)} — the vector mechanics, from the L4/L5 laboratory material. <em>Proves</em> the six-shift conversion window and ties the clinical batch numbers to the phial count <em>1 of 12</em>. <em>Gate:</em> the lab bench, 1 shift, no roll.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.dypD1aQAOBWpTyg0]{I11 — The Resonance Field (CT2)} — the resonance field records, from the lab freezers: blood bags spoiled by proximity, and a chart whose last line reads <em>subject 09-H attempted to drink from the sharps bin, 02:40</em>. <em>Proves</em> the phial's contents decay in the presence of each other — the reason they must travel in one case. <em>Gate:</em> the freezer room; <em>Tech (WIT) Difficulty 2</em> to read the chart, and the card is theirs either way by Day 4.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.1dPSK2h5z6DX5Eab]{I28 — Photophobia Test 02:40} — Graf's clinical photographs, including the photophobia test at 02:40: burns outlining a strip light's footprint, pupils that do not react, an IV batch tag reading <em>XII-1/12</em>, and a light switch taped over by staff who had learned what light does to him. <em>Proves</em> the cure's price is measured in the patient's own skin. <em>Gate:</em> Graf's cooperation, or the day office on Day 9.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.VMoT17MWZ543rWHe]{I29 — The Injection Log} — the injection log, from Graf's study: the sponsor's Vaduz trust account, the same account as @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.lOsCniEBTy2c974w]{I06 — The Escrow Transfer Slip}'s escrow, and room 3.14 echoing the vault timestamp 03:14. <em>Proves</em> one institution paid for both the phial and the study. <em>Gate:</em> the study; <em>Investigate (WIT) Difficulty 2</em>, or a shift with the paperwork.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.QEO98GDqJtZlL08l]{I30 — Ward 3, Corridor Camera} — the corridor camera tape, from the security room (and if the cell misses it, the Swiss police will read it into the record on Day 8). The ceiling silhouette at the top of the frame, the spill trail stopping under a service duct, the clock at 02:40 (photograph: @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.RRTeKHxR8npSozTr]{F10 — Mortuary Alcove, Flash} — the payoff of the False Revelation, never its setup). <em>Proves</em> the thing on the third floor is not human violence and not a patient loose in the hall. <em>Gate:</em> the security room — <em>Tech (WIT) Difficulty 2</em> or the night porter's keys.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.OvqUML75EHpXFQ0P]{I31 — Sonnenberg, Observed} — the perimeter observation photographs from the night shift: a grey Vatican-plated Lancia (SCV 47), a long-lens camera with the Watcher's newspaper under it, and one blacked-out window whose tape has been pulled <em>inward</em>. <em>Proves</em> both factions were watching the clinic — and that someone inside was watching back. <em>Gate:</em> the night shift, 1 shift.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.t9kMeFOoglJgJeno]{I12 — Palimpsest Leaf, Codex} — the palimpsest leaf, on the L4 desk or later at L5: the actual Gospel of the Twelve under a later hand, and Corvi's own margin line, <em>sanguis remedium, non sacramentum</em>. <em>Proves</em> the paradigm inversion — but hold it until the table has seen @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.D18a1YRCEQu27KHw]{I09 — Histopathology Log: Marrow Graft}. <em>Gate:</em> the desk; free if Graf is cooperating, otherwise a shift with the books.</li>
          </ul>
          <p><strong>Tests.</strong> The ward yields its physical evidence without rolls; the gated items are the records (I27, I29, I30) at <em>Tech (WIT)</em> or <em>Investigate (WIT) Difficulty 2</em> and the two Graf items, which need her trust rather than a d20. Failure on any records roll costs a shift and the card arrives by packet on the day listed above; nothing here is missable. <em>Layered success:</em> the first success finds the records, a second reads the batch numbers against the phial count, a third ties the sponsor account to the Geneva escrow — the moment the case becomes one conspiracy rather than two.</p>
          <p><strong>What the cell learns.</strong> The blood is a cure that works — and it makes the patient photophobic, hypothermic, sleepless and hungry for plasma inside six shifts. This is the False Revelation: a dead man walking around with his cancer gone.</p>
          <p><strong>Leads.</strong> Graf's study holds the account number; the corridor tape holds the shape. Both point at the same conclusion, and the account number points back to Geneva and forward to Turin.</p>

          <h3>Beat 3 — The theatre, and Graf (L4)</h3>
          <p><strong>Scene.</strong> The clinic's one lit room: a surgical theatre with the door chained from inside. Show @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.jP9jheucndZOEHLE]{TM08 — Surgical theatre refuge} as the refuge it is, and @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.jpOPWYTG4Yqt6hk4]{BM04 — Ward, theatre and lab} if the floor goes loud — the three patient rooms and the stairwell run along the top of the map, the lab with its freezers bottom-left, the operating theatre bottom-right, and the balcony doors are the only quiet way off the floor. Hausmann hunts from the conduits, and nothing on the map is lit or walled for you.</p>
          <p><strong>Who is here.</strong> @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.oNX7pUS8iM6yiENH]{N04 — Dr. Elizabeth Graf} — <strong>Dr. Elizabeth Graf</strong> (photograph: @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.hOoHc9YSRE6Y3QnW]{F04 — Ward Corridor, Torchlight}): chief pathologist, no sleep, glasses pushed up into her hair, a slide box held against her chest like a shield, and a box of matches she keeps moving further from the slides. She administered the injection believing it was an unlicensed gene therapy funded by an overseas trust, and she has spent two weeks deciding to burn her own research. She wants to destroy the work and get her family out of the country before the clinic's owners find her. She responds to first aid, light discipline and psychiatric intervention — in that order of practicality — and to nothing else. She will not leave without her slides, and if cornered she will burn them rather than hand them over. <strong>What she knows:</strong> the batch numbers, the sponsor account, the six-shift conversion window and the exact composition of the quiescence kit on her bench. She will trade the medicine for the cell’s help getting out of the country, and she will lie once: that she has only the slides in her hands. The hidden slide is the hook into Mission 2.</p>
          <p><strong>What is here.</strong> Graf is the gate for @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.D18a1YRCEQu27KHw]{I09 — Histopathology Log: Marrow Graft}, @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.1dPSK2h5z6DX5Eab]{I28 — Photophobia Test 02:40} and, if the cell is patient, @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.t9kMeFOoglJgJeno]{I12 — Palimpsest Leaf, Codex}. She also holds the only surviving slide of the vector outside the phials — a fact she will not volunteer, and which is the hook into Mission 2.</p>
          <p><strong>Tests.</strong> Stabilising her is one test, and any of three approaches work: <em>Heal Physical (WIT) Difficulty 2</em> for first aid and light discipline, <em>Psychoanalyze (EMP) Difficulty 2</em> to talk her down, or <em>Command (EMP) Difficulty 3</em> to take charge of the room — the last shifts her disposition without earning it, and she will hand over the slides but never the slide. A failure costs two shifts and the histopathology drops to the Day 6 packet.</p>
          <p><strong>What the cell learns.</strong> A real clinician did this deliberately, on real evidence, for money — and she is more afraid of the men who paid than of the thing on the ceiling.</p>
          <p><strong>Leads.</strong> O1M2 marks her for liquidation on Day 4, whether or not the cell takes her; the freezer records and the account number carry the case to Turin and back to Geneva.</p>
          <p><strong>If the investigators take photographs:</strong> @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.28yDb0Z7eMSTfBQU]{C23 — Woman in a white coat by a doorway} — Graf in the doorway, only after she is found and the room is stabilised.</p>

          <h3>Beat 4 — The hand-off, reconstructed (set-piece)</h3>
          <p><strong>Scene.</strong> End Day 10's session on the reconstruction rather than on a fight: the seal cut in a Bahnhofstrasse vault, the phial passed across a counter, the room empty afterwards — three pieces of evidence the cell already holds, played back as a sequence while you let the players believe the clock is still theirs. Use @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.QEO98GDqJtZlL08l]{I30 — Ward 3, Corridor Camera} and @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.p51PQ2RP2raSDBHp]{I27 — Intake Photograph, 09-H} as the images for it if they have them, and the clinic's own ward as the setting.</p>
          <p><strong>What the cell learns.</strong> The sale was arranged weeks before the theft, by people who knew exactly what they were buying.</p>
          <p><strong>Leads.</strong> Day 8 is the break: Hausmann wakes changed, the night staff are missing by morning, and the case leaves Zurich for the coast road south.</p>
    - name: 'Days 8–7 — Zurich Collapse & The Corridor'
      type: text
      text:
        content: |
          <h2>Days 8–7 — Zurich Collapse &amp; The Corridor</h2>
          <p><strong>The act in one line.</strong> The clinic comes apart. The cell should leave Zurich with the medical evidence in hand, Graf's fate decided one way or another, and the case on its way south to Turin — and they should feel the frontier closing behind them.</p>
          <p><strong>While the cell works (off camera).</strong> <em>Day 8:</em> Hausmann wakes changed, the third floor's night staff are missing by morning, and Corvi walks the attaché out of the city in the confusion and takes the coast road south. Custody of the case goes dark until Turin. <em>Day 7:</em> L'Entità locks the Swiss–Italian frontier (O1M1) — crossings fall under paramilitary watch, and Graf sits with the matches and the research log and then puts them away.</p>
          <p><strong>If the cell stalls.</strong> I08 and I26 deliver Day 7; I31, I28, I29, I09 and I36 deliver Day 6.</p>
          <p><strong>The truth of this act.</strong> The clinic is being closed by the people who closed the vault: the same Order, in the same grey coats, on the same paperwork. Hausmann survived the change and is now feral in the forest above the city; Graf survives only because she is useful and then only until Day 4. The case itself has left Zurich on the southbound coast road, in Corvi’s hands, in a diplomatic bag, with Claudia somewhere behind it. The cell is no longer ahead of anything.</p>
          <p><strong>Read aloud.</strong> <em>The police tape is not the frightening part. The frightening part is that everyone at the tape is doing their job — cordoning, cataloguing, taking statements in three languages — and the paperwork they are generating will be read all over Europe long before the cell gets back to Rome.</em></p>

          <h3>Beat 1 — The morning after (L4)</h3>
          <p><strong>Scene.</strong> Walk the same two rooms, changed. The blacked-out ward (@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.1HRljmcL11d0CPLS]{TM07 — Blacked-out third-floor ward}) is now a police scene with the trail gone cold, and the clinic runs on the institution's plan (@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.jpOPWYTG4Yqt6hk4]{BM04 — Ward, theatre and lab}) — patient rooms and stairwell along the top, lab bottom-left, theatre bottom-right — while Swiss detectives take statements in the wrong language.</p>
          <p><strong>Who is here.</strong> The detectives are ordinary, competent and slow; they are not a threat, they are a clock. They will not let the cell past the tape without credentials, and they will read two cards into the official record if the cell is not there to take them first: <strong>What they know:</strong> the timeline of the night shift and, within a day, the names of the staff who did not come in. They are a clock and an index, not opposition — treating them as a threat costs the cell a shift and a card. @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.QEO98GDqJtZlL08l]{I30 — Ward 3, Corridor Camera} (the corridor tape) and @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.OvqUML75EHpXFQ0P]{I31 — Sonnenberg, Observed} (the perimeter photographs) fall to the first investigators on scene.</p>
          <p><strong>What is here.</strong> Whichever of the ward items the cell did not take on Days 10–9 is still physically present but now photographed, bagged and logged; recovering it means either working through the police report (<em>Manipulate (EMP) Difficulty 2</em>, 1 shift) or taking it before they do.</p>
          <p><strong>What the cell learns.</strong> Whatever happened on the third floor happened to the staff too — and institutional consequences arrive faster than supernatural ones.</p>
          <p><strong>Leads.</strong> Graf, if she is still on the property; the frontier, either way.</p>

          <h3>Beat 2 — Graf, cornered (L4)</h3>
          <p><strong>Scene.</strong> Put her back in the theatre for this beat (@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.jP9jheucndZOEHLE]{TM08 — Surgical theatre refuge}), with the men in grey coats already in the car park and the slides in her hands. This is a scene about what the table chooses, not a chase.</p>
          <p><strong>Who is here.</strong> @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.oNX7pUS8iM6yiENH]{N04 — Dr. Elizabeth Graf} — <strong>Dr. Graf</strong> (photograph: @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.hOoHc9YSRE6Y3QnW]{F04 — Ward Corridor, Torchlight}), cornered: same slide box, same matches, less patience. O1M2 arrives Day 4 whether or not the cell acts, so her options are the ones the players give her: stay and testify, run with the cell, or burn the ward and disappear. She wants to keep one slide and her family alive. <strong>What she knows:</strong> that the same account paid for the injection and for the container, and that the men arriving in the car park are the people who closed Vault IX. She is the only NPC who will say the word <em>cure</em> out loud before the Lingotto — and only if the cell has already put the histopathology on the table.</p>
          <p><strong>What is here.</strong> If the cell works the pathology lab before leaving (1 shift):</p>
          <ul>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.F06S9nFRmRvOKLqLf]{I32 — Daylight Test: Combustion} — the daylight test: white ash in the fume hood identical to the calcified fingers that will end the case, the quiescence kit of linen, gall, vinegar and myrrh already installed on the bench, and a log stamp twenty minutes after sunrise. <em>Proves</em> the vector can be destroyed by daylight and neutralised by the kit in @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.9NpgA6XbC6AKGYEY]{I16 — The Quiescence Formula (CT3)} — CT3 in physical form. <em>Gate:</em> one shift in the pathology lab, no roll.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.WNTzWxpF2S7xU230]{I35 — Breve Apostolicum, 1582} — the <em>Breve Apostolicum</em> of 1582, from the L2 or L5 research kit if it was missed in Rome: shelf-mark tied to @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.1XbUUYGspeQ02iZH]{I03 — The Excised Codex Register}, a papal seal cracked and repaired with red wax, and marginalia naming the case itself, XII-SANG-00. <em>Proves</em> the 1582 custodians broke protocol to hide the object rather than destroy it. <em>Gate:</em> the kit, or the Day 6 packet.</li>
          </ul>
          <p><strong>Tests.</strong> Getting her out is <em>Command (EMP) or Psychoanalyze (EMP) Difficulty 2</em> if she has already been stabilised, <em>Difficulty 3</em> if she has not; keeping the slide secret from the cell requires her to be pushed hard, and she will lie about it once. Nothing here is a failure state — she can be left behind, and then the epilogue charges the cell for it.</p>
          <p><strong>What the cell learns.</strong> The cure has an off switch, and it is written on the same 1582 paperwork as the case itself.</p>
          <p><strong>Leads.</strong> Turin — the destination on the wiretap tape — and the frontier in between.</p>

          <h3>Beat 3 — The corridor south (Swiss–Italian frontier)</h3>
          <p><strong>Scene.</strong> The frontier is a scene now, not a transit: a man in grey who never introduces himself at the checkpoint, and the Vatican-plated Lancia (SCV 47) idling at the border café from here to Turin. Take the last leg by rail and use the carriage again (@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.JdEbI0D8H7Vju6im]{TM16 — Night train compartment}) — the same raincoat, three carriages back.</p>
          <p><strong>Who is here.</strong> L'Entità's frontier men: polite, unhurried, wearing civilian coats over issue boots, checking papers that the cell's papers do not quite answer. They are not looking for the cell specifically — they are looking for the case — and they will detain anyone whose luggage is interesting for six hours, which is the whole of their function here. <strong>What they know:</strong> that a vehicle with Vatican plates crossed ahead of the cell and was waved through. They will not say so unless asked directly, and they will deny being able to remember the number.</p>
          <p><strong>Tests.</strong> Crossing cleanly is <em>Manipulate (EMP) Difficulty 2</em> with the Covenant's diplomatic cover, or <em>Sneak (AGI) Difficulty 2</em> on a back road; a failure costs a day and a search, and the cell arrives in Turin after the buyer has already moved. Advance the checkpoints sharply here: if the frontier costs the cell more than a day, hold the Turin material until Day 5 and let the table feel the case cooling.</p>
          <p><strong>What the cell learns.</strong> Someone with paramilitary reach has decided the border matters, and the case is now worth a government's attention.</p>
          <p><strong>Leads.</strong> Turin, the Lingotto works, and a broker who takes deposits in envelopes with a Wallachian crest on them.</p>
    - name: 'Days 6–5 — Turin: The Lingotto'
      type: text
      text:
        content: |
          <h2>Days 6–5 — Turin: The Lingotto</h2>
          <p><strong>The act in one line.</strong> Find Corvi in his glass box, get the case, and get the truth out of him — and decide, before Claudia does it for them, whether the Covenant's escort has been working for someone else the entire time.</p>
          <p><strong>While the cell works (off camera).</strong> <em>Day 6:</em> the case opens on the Lingotto floor and the Turin Intermediary buys the second phial, tripling his offer for the remaining eleven (P5); the Talamasca green-light Claudia to take the case the moment Corvi is isolated (O2, P2) — she repacks her kit in order and argues, hard, for moving on Lingotto tonight. <em>Day 5:</em> Corvi retreats into the supervisor's booth (P1 sequence); Hausmann is hunted into the Zurichberg forest edge and learns to stay out of the light (P3).</p>
          <p><strong>If the cell stalls.</strong> I30, I32, I10 and I35 deliver Day 5; I11, I12, I33, I34 and I37 deliver Day 4 — in practice these land as the raid goes wrong.</p>
          <p><strong>The truth of this act.</strong> Corvi is not a thief in the ordinary sense: he is a historian who understood what the Gospel of the Twelve actually describes and decided the Church should not be the one holding it. He is also, right now, a man with a fever, no money, no transport and the case on his knees, hiding in a glass box in an empty car factory, waiting for the right people to find him. Claudia intends to take the case tonight or tomorrow and her kit is already packed for it. The Intermediary has already sold the rendezvous once and has a train to catch.</p>
          <p><strong>Read aloud.</strong> <em>The assembly hall is four hundred metres of concrete and iron and broken glass, and rain coming through the skylights in ropes. On the far side of it, high up, one glass box is lit. Inside it, a man in a priest’s coat has been praying out loud for two days and has stopped being sure anyone is listening.</em></p>

          <h3>Beat 1 — Into the plant (L5)</h3>
          <p><strong>Scene.</strong> Bring them in through the ramps at dusk: a third of a mile of concrete spiral and rooftop test track, rain falling through broken skylights into abandoned assembly halls. Show @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.n61lTAaEdGfuCmPZ]{TM09 — Lingotto assembly hall} on entry. Read the space aloud — four assembly stations, machine lines, stair heads at the corners, and somewhere above it all one lit glass box. That box is where this act ends.</p>
          <p><strong>Who is here.</strong></p>
          <ul>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.PYFCZ12Z05zvH46l]{N01 — Monsignor Matteo Corvi} — <strong>Monsignor Matteo Corvi</strong> (the frame the cell already has of him: @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.Pw2lfx84lXnwJ8dB]{F01 — Night Desk, Archive}): barricaded in the supervisor's booth with the case, praying in Latin, refusing food, unshaven, wrapped in a coat he has not taken off in three days, and running a fever from sleeping beside the case. He is an ecclesiastical historian who translated the Ebionite fragments and understood what the Eucharist actually was; he stole the case to keep it from being used, and he is now convinced he has started the end of days. He wants to be found by the right people and to explain himself to someone who will understand the theology. He responds to custodial credentials and Ebionite citations (his disposition shifts to Open, +1) and to nothing else; a hostile approach from anyone claiming to represent the Holy Alliance makes him destroy his notebook.</li> <strong>What he knows:</strong> the whole of it — the Ebionite fragments, the translation, what the twelve phials are, and why the Church built a prison rather than a reliquary. He will lecture for an hour if let; every fact the walkthrough calls the paradigm inversion comes out of his mouth if the cell can sound like custodians rather than enforcers.
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.AArBxHFCdC7qBCke]{N02 — Sister Claudia Vane} — <strong>Sister Claudia Vane</strong> (photograph: @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.ebgnd316nNZktyx0]{F02 — Vault Corridor, Nun}): at Corvi's back, diplomatic, precisely where she wants to be, and arguing hard that they should move on Lingotto tonight. She is a Talamasca Registry 16 asset who believes the phials hold a demonic plague and must be burned — she has been using the cell as muscle to find Corvi since Rome. Her tells are stillness, not nerves: she is never surprised, only delayed. She handles border guards and churchmen with poise and redirects inquiries toward criminal syndicates and rogue Soviet labs. She will not touch the case in front of witnesses, will not be separated from it, and will not fight to win — only to escape with it.</li> <strong>What she knows:</strong> the Talamasca’s position, her own orders and the fact that the phials hold a plague. Every word of that is sincerely believed. What she will never say is her handler’s name, and if the cell mentions Amsterdam in front of Corvi she will interrupt, compliment the cell’s research and change the subject — the single most visible thing she does all case.
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.IWiyCfB84HvDbIYT]{N15 — The Turin Intermediary} — <strong>the Turin Intermediary</strong> (photograph: @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.sc9lgM1tyAavOZ2O]{F14 — Lingotto Works, Cigar}): a heavy-set broker in a good coat with a cigar, at the works by appointment, never facing a camera. He is not a believer and not a servant of anyone; he sells addresses. He will sell the buyer's crest, the pack's profile and the shape of the rendezvous for a price, and he has already sold the rendezvous address once today. Threats do not move him; money does, and he will be gone by Day 3.</li> <strong>What he knows:</strong> who is buying, roughly how many of them there are, what they arrived on, and that they asked for the phials rather than the case. He does not know they are not human and does not care; his price reflects that.
          </ul>
          <p><strong>What is here.</strong></p>
          <ul>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.HprCCHuQXSASoSTQ]{I34 — Assembly Hall, Camera 6} — assembly hall camera 6, still spooling in the control room: the case's deadbolt taped over — a field repair on a cracked latch — and in the puddles the lights reflect while Corvi casts no shadow. <em>Proves</em> the relic's active state has changed since the vault, and that Corvi had to buy a second lock in Turin. <em>Gate:</em> the control room, 1 shift.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.jFJ2aF20hnTgr1Ul]{I37 — The Empty Needle} — the empty needle, found by searching @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.AArBxHFCdC7qBCke]{N02 — Sister Claudia Vane}'s kit here (or as evidence at Novara): a split rosary bead with a clean deliberate cut, ochre fibres inside, and a fresh scorch on the outside. <em>Proves</em> the Veronica Thread's sheath has already been used, recently and near here. This is the mission's best early-warning prop: a cell that finds it in Turin can pre-empt the betrayal entirely. Do not protect Claudia. <em>Gate:</em> searching her kit — <em>Sneak (AGI) Difficulty 2</em> or a scene where she leaves it unattended; she notices a clumsy attempt and repacks it out of reach.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.FIvSwaxBVCP0etIQ]{I10 — The Vector Mechanics (CT1)} — the vector mechanics, if missed in Zurich: the six-shift window and the batch numbers tying the clinical trail to the twelve phials. <em>Gate:</em> the L5 laboratory material or the Day 5 packet.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.dypD1aQAOBWpTyg0]{I11 — The Resonance Field (CT2)} — the resonance field records, if missed in Zurich: proximity decay between phials, and the chart line about subject 09-H drinking from the sharps bin. <em>Gate:</em> the Day 4 packet.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.t9kMeFOoglJgJeno]{I12 — Palimpsest Leaf, Codex} — the palimpsest leaf, if the cell did not take it in Zurich: the Gospel of the Twelve under a later hand and Corvi's margin, <em>sanguis remedium, non sacramentum</em>. <em>Gate:</em> Corvi's own papers, or his surrender.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.tkYtaX7GeNiTtUeg]{I33 — Lingotto, Rooftop, Rain} — the rooftop photograph (see Beat 3), which the cell can take themselves with a camera and a vantage point on the test track.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.WNTzWxpF2S7xU230]{I35 — Breve Apostolicum, 1582} and @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.Hx9jKUQtU1Jmwh2O]{I36 — Suppressed Index Card}, if missed in Rome — the seal opened after sealing, and the Lodestone's order from inside the building it robbed.</li>
          </ul>
          <p><strong>Tests.</strong> Working the floor is free. The two real gates are the control room (<em>Tech (WIT) Difficulty 2</em> to get the tape spooling, 1 shift) and Claudia's kit (<em>Sneak (AGI) Difficulty 2</em>, above). If the floor goes tactical, put down @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.jqBp0bbZpuYJAVE1]{BM05 — Assembly floor} — the spiral ramp curves in at the west edge, the assembly and machine lines fill the floor in four blocks, stairs at the two top corners, main doors bottom centre — and use @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.gAxI1cJhYftPzFGK]{BM06 — Supervisor booth and catwalk} for the booth: glass box top centre, catwalk behind it with stairs at both ends, access bridge dropping to the floor. That catwalk is the only way to reach Corvi without crossing open ground, and it is also how Claudia intends to leave with the case. <em>Layered success:</em> one success gets the tape spooling; two reads the field repair on the deadbolt; three finds Claudia in a frame she did not know was running — walking the catwalk alone, an hour before the cell arrived.</p>
          <p><strong>What the cell learns.</strong> The thief is in the building, the case is with him, and there is a second person in that glass box whose story does not add up.</p>
          <p><strong>Leads.</strong> The parley on the roof, and the broker inside the plant.</p>
          <p><strong>If the investigators take photographs:</strong> @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.0zKe76iE0e9VFppG]{C13 — Rain beneath a skylight} (rain beneath a skylight), @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.wHkKKUcyBof5CX06]{C14 — Concrete vehicle ramp} (the vehicle ramp) and @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.E3dVclO0uZ3jyGye]{C15 — Supervisor booth from below} (the booth seen from the floor, before they climb to it). None of them is a clue.</p>

          <h3>Beat 3 — The rooftop parley (set-piece)</h3>
          <p><strong>Scene.</strong> Stage it in the rain: Corvi at the glass, Vane silent at the door, the cell deciding whether to take the case by force. Show @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.eu4Vy9WBx8iGce1d]{TM10 — Lingotto rooftop in rain} for the rooftop. The photograph the players will eventually match to this moment is @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.tkYtaX7GeNiTtUeg]{I33 — Lingotto, Rooftop, Rain} — Vane standing precisely between Corvi and the booth's only door, a second case-sized rectangle beside the attaché, and the Lancia waiting below.</p>
          <p><strong>Who is here.</strong> Corvi talks if the cell lets him, and what he offers is the case's thesis: the vector mechanics (@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.FIvSwaxBVCP0etIQ]{I10 — The Vector Mechanics (CT1)}), the resonance field (@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.dypD1aQAOBWpTyg0]{I11 — The Resonance Field (CT2)}) and his own translation of the Gospel of the Twelve (@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.t9kMeFOoglJgJeno]{I12 — Palimpsest Leaf, Codex}). He surrenders the attaché to a cell that demonstrates independent custodial credentials and cites Ebionite theology; anything that sounds like the Holy Alliance makes him destroy his notebook and try to run deeper into the works. <strong>What he knows:</strong> that the buyers are a dynasty rather than a cult, because he read their crest before he agreed to the sale, and that he has understood since Zurich that he is not the only person hunting the case. He will trade that for one thing only: being believed about why he took it. Claudia says almost nothing, stays between Corvi and the door, and — if the case changes hands without her — the room goes quiet enough to hear the thread snap. Whatever the cell chooses here, the board keeps ticking (bed: <audio controls preload="none" style="height:1.7em;vertical-align:middle" src="modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-clock-tick.mp3"></audio> <em>Clock ticking</em>): M4 fires next session.</p>
          <p><strong>Tests.</strong> The parley is a social scene, not a roll: give the players their evidence and let them argue. Two things are worth rolling. Reading Claudia's position from the doorway is <em>Investigate (WIT) Difficulty 2</em> — success tells them she is guarding the exit, not the man. Snatching the case out of the booth by force is <em>Deft Hands (AGI) Difficulty 3</em> against her, and a failure ends with the case in her hands and the cell on the wrong side of the catwalk.</p>
          <p><strong>What the cell learns.</strong> Corvi is not the antagonist: he is a scholar who tried to bury a weapon. The Covenant's own escort has been working for the Order that wants it burned — and the cell has been the muscle she needed.</p>
          <p><strong>Leads.</strong> The case's contents and Corvi's papers point forward to the flash on Day 4; the buyer's crest points at the Basarab pack.</p>
          <p><strong>Photographs.</strong> @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.tkYtaX7GeNiTtUeg]{I33 — Lingotto, Rooftop, Rain} is the frame the cell can take from the test track; @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.sc9lgM1tyAavOZ2O]{F14 — Lingotto Works, Cigar} records the broker if they photograph him in the works.</p>

          <h3>Beat 4 — The broker</h3>
          <p><strong>Scene.</strong> The Intermediary's café, or a corner of the works with the rain outside: a conversation with a man who sells geography.</p>
          <p><strong>What is here.</strong> He gives up, for money: the buyer's Wallachian crest, the shape of the pack (six men, freight express, no interest in the case beyond the phials), and the rendezvous <em>in outline</em> — a fortified retreat outside Novara. He keeps the address itself, because he has already sold it once today, and he takes the night train to Milan with his fee whatever the cell offers. <strong>What he knows:</strong> the rendezvous in full, the pack’s arrival route and the fact that he has already sold the address to someone else. Every one of those facts is for sale; none of them is a lie. He is the case’s one clean transaction and the cell can feel it.</p>
          <p><strong>Tests.</strong> <em>Manipulate (EMP) Difficulty 2</em> for the outline, with a bribe or a credible threat of the pack's attention; <em>Difficulty 3</em> to get the address itself before he leaves, and even then it is two days early.</p>
          <p><strong>What the cell learns.</strong> Someone has bought the phials who is not the Church and not the Talamasca — and that buyer is already at the rendezvous.</p>
          <p><strong>Leads.</strong> Novara, and the trap that springs on Day 4.</p>
    - name: 'Days 4–3 — The Trap Springs'
      type: text
      text:
        content: |
          <h2>Days 4–3 — The Trap Springs</h2>
          <p><strong>The act in one line.</strong> The case destroys itself in daylight and Claudia takes it. This act is about triage — what the cell saves, whom they drag out, and what they finally understand about the person who has been standing beside them since Rome.</p>
          <p><strong>While the cell works (off camera).</strong> <em>Day 4:</em> the daylight breach. A droplet from the open case spills during handling on the Lingotto floor and ignites — a flash seen across the district (M4). The Carabinieri flood the site and the case has been seen. Claudia snaps the Veronica Thread on the factory floor during the fire and takes the attaché; by the time the flash clears she is out of the building and the cell's transport is gone (P2M3). Corvi, barricaded in his booth since the same day, is left without it, waiting to be found by the right people (P1M4). In Zurich, the men in grey arrive at Sonnenberg to collect the study, and Graf barricades herself in Theatre 2 with the slides (P4M3, O1M4). <em>Day 3:</em> Claudia takes the extraction green-light from Amsterdam and drives alone to Novara to wait (P2M4); the Intermediary sells the rendezvous address to the Basarab pack and takes the night train to Milan with his fee (P5M3); a priest in the Novara diocese reports three parishioners who never blink, and by evening the abbey's lamps go out one at a time (P6M2).</p>
          <p><strong>If the cell stalls.</strong> I33, I34 and I37 deliver Day 4; I41 delivers Day 3.</p>
          <p><strong>The truth of this act.</strong> The case ends in daylight because the case was always going to end in daylight: the amount of it one drop can burn through steel, and Claudia has been waiting since Rome for a moment when the cell’s hands are full. Graf is alive because she hid a slide and dead by Day 4 whether or not the cell ever came for her. The pack is on Italian soil, has the rendezvous address, and does not care about the case — only about what is in it. From here on the cell is doing triage, not investigation.</p>
          <p><strong>Read aloud.</strong> <em>The light is the first thing and it has no colour in it. It comes up through every broken skylight at once, and for a moment the whole hall is a white page with the catwalk drawn on it in black. Then the sirens start, from more than one direction, and somebody on the far side of the floor is already running.</em></p>

          <h3>Beat 1 — The flash (L5)</h3>
          <p><strong>Scene.</strong> Open on the factory floor mid-handling with no warning: the drop, the ignition, white light through every broken skylight. Show @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.n61lTAaEdGfuCmPZ]{TM09 — Lingotto assembly hall}; if the table plays it out square by square, show @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.jqBp0bbZpuYJAVE1]{BM05 — Assembly floor} — spiral ramp west, assembly lines in four blocks, stairs top corners, main doors bottom centre. Then the noise: sirens, the Carabinieri, a fire chief who cannot explain what burned a hole through steel plate. Play the sting <audio controls preload="none" style="height:1.7em;vertical-align:middle" src="modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-flash-ring.mp3"></audio> <em>The daylight flash at the parley</em> when the light goes up. If the cell were in the booth, they instead hear the thread snap, see the room flash-blind, and find the case gone and Corvi alone at the glass — run that on @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.gAxI1cJhYftPzFGK]{BM06 — Supervisor booth and catwalk} (booth top centre, catwalk behind, access bridge to the floor).</p>
          <p><strong>Who is here.</strong> If the cell rescued Corvi from the booth, this is where he turns: a feverish scholar with nothing left to trade but the truth — what the cure actually is, why the Church built the box, and why he did none of it for money. He wants an audience, and he will talk until the police take him. Claudia is gone; if the cell has @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.jFJ2aF20hnTgr1Ul]{I37 — The Empty Needle}, they now know exactly what the snapped thread was for.</p>
          <p><strong>What is here.</strong></p>
          <ul>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.jFJ2aF20hnTgr1Ul]{I37 — The Empty Needle} — the empty needle, if the kit was never searched: the split bead with its clean cut, the ochre fibres of the Thread's sheath, the fresh scorch. <em>Proves</em> the thread was snapped recently and near here — and on Day 4 “here” is the crime scene itself. <em>Gate:</em> the kit, which has to be recovered from the burned floor or from Claudia's abandoned luggage — <em>Investigate (WIT) Difficulty 2</em> in the debris, 1 shift.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.tkYtaX7GeNiTtUeg]{I33 — Lingotto, Rooftop, Rain} and @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.HprCCHuQXSASoSTQ]{I34 — Assembly Hall, Camera 6}, if missed on Days 6–5 — both surface in the aftermath; the “no shadow” frame in @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.HprCCHuQXSASoSTQ]{I34 — Assembly Hall, Camera 6} reads differently now that the cell has seen the case ignite.</li>
          </ul>
          <p><strong>Tests.</strong> Recovering anything from the floor is one shift and an <em>Investigate (WIT) Difficulty 2</em>; every hour spent here is an hour Claudia gains on the road. If the cell instead extricates Corvi: <em>Force (STR) or Command (EMP) Difficulty 2</em> to move a feverish man through a burning building, and a failure costs him the notebook.</p>
          <p><strong>What the cell learns.</strong> The case is now genuinely dangerous in daylight, someone in the cell's own party has been waiting for exactly this moment, and the Covenant's escort was an operative of the Order the case is meant to be kept from.</p>
          <p><strong>Leads.</strong> Toll stubs, teleprinter logs and Corvi's papers all point at Novara. Claudia's destination is the abbey; the case's destination is the airfield beside it.</p>
          <p><strong>Set-piece.</strong> Stage the fire as a catastrophe nobody can prevent, only triage: what to save, whom to drag out, which evidence burns. End the session on the empty mooring where the case was last seen, the cordon's lights swinging through the rain (bed: <audio controls preload="none" style="height:1.7em;vertical-align:middle" src="modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-sirens-distant.mp3"></audio> <em>Distant civil-defence siren</em>), and one nun's absence nobody can yet explain. The theft should never feel arbitrary: the evidence was on the table since Geneva — @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.auf7Uqb4VPNc9Hp7]{I05 — Embossed Stamp, Map Casing}, @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.e7WrCS9xFqFcAJHF]{I14 — Telex Dispatch: Registry 16} and @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.NvsqxXBP29kM6SVV]{I25 — The Ledger Page} all said she was her own agent. Cells that found it earned this; cells that did not are paying tuition.</p>

          <h3>Beat 2 — Zurich, if they left her behind (L4)</h3>
          <p><strong>Scene.</strong> If Graf was left in the clinic, pull the cell back one last time — the sanitization sweep is a live scene, not a rumour. Put her behind the chained theatre door with the slides (@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.jP9jheucndZOEHLE]{TM08 — Surgical theatre refuge}), run the floor on @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.jpOPWYTG4Yqt6hk4]{BM04 — Ward, theatre and lab} if it goes loud, and let the men in grey coats refuse to introduce themselves.</p>
          <p><strong>Who is here.</strong> @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.oNX7pUS8iM6yiENH]{N04 — Dr. Elizabeth Graf} — <strong>Dr. Graf</strong> (photograph: @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.hOoHc9YSRE6Y3QnW]{F04 — Ward Corridor, Torchlight}), barricaded, out of time, with O1M2 arriving whether or not the cell comes. The extract-or-leave dilemma is hers to force, not yours.</p>
          <p><strong>What is here.</strong> Nothing new: @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.F06S9nFRmRvOKLqLf]{I32 — Daylight Test: Combustion} and @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.WNTzWxpF2S7xU230]{I35 — Breve Apostolicum, 1582} are still available if the cell did not take them, and the clinic's records are already ash or impounded.</p>
          <p><strong>Tests.</strong> Getting her out against a swept floor is <em>Force (STR) or Sneak (AGI) Difficulty 3</em> and costs a shift; leaving her is a decision the epilogue will price.</p>
          <p><strong>What the cell learns.</strong> The Covenant is not the only organisation that cleans up after itself, and it does not outrank this one.</p>
          <p><strong>Leads.</strong> The road south, whichever way they choose.</p>
          <p><strong>If the investigators take photographs:</strong> none new here — the ward frames were shot on Days 10–9.</p>

          <h3>Beat 3 — The road south (Day 3)</h3>
          <p><strong>Scene.</strong> The trail leaves Turin the way the case did: toll stubs, teleprinter logs and Corvi's own papers, all pointing at Novara. L6 exists as a location only once the cell is tracking Claudia — if they are not yet, the priest's report is the hook.</p>
          <p><strong>Who is here.</strong> The Intermediary, briefly, if the cell catches his café before he leaves: flushed out, he gives up the buyer's Wallachian crest, the pack's profile and the rendezvous in outline, and keeps the address he has already sold once today.</p>
          <p><strong>What is here.</strong> @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.XWAylCZFSBMFiPpB]{I41 — The Green Lamp} — the Day 3 HQ packet: a surveillance frame of the Council Chamber with the dossier stamped REGISTRY 16 — AMSTERDAM, the operative's grey coat in the waiting silhouette, and three more standing figures in the window reflections. <em>Proves</em> Sabbatini already holds the Talamasca file the cell is still assembling, and that the sanitization squad is in the antechamber. <em>Gate:</em> the HQ packet, or approach surveillance in the epilogue.</p>
          <p><strong>Tests.</strong> None. The packet arrives; the drive is the scene.</p>
          <p><strong>What the cell learns.</strong> Rome has been reading the same file all along, and there is a squad in the building that will arrive before the cell can report.</p>
          <p><strong>Leads.</strong> Novara, and the last two days.</p>
    - name: 'Days 2–1 — San Nazzaro: The Slaughter & The Tarmac'
      type: text
      text:
        content: |
          <h2>Days 2–1 — San Nazzaro: The Slaughter &amp; The Tarmac</h2>
          <p><strong>The act in one line.</strong> Claudia dies, the phials are loaded, and the cell gets one photograph of the thing that owns them. This act is the mission's floor and its ceiling at once: the quietest scene in the case, then the loudest.</p>
          <p><strong>While the cell works (off camera).</strong> <em>Day 2:</em> the retrieval pack hits the fortified retreat (M5). Ten phials change hands and the eleventh shatters — a single drop burns two of their fingers to white ash (P6M3). The pack executes Claudia to keep the cure from their bloodlines (O2M3). The Watcher reaches Novara before the pack and leaves before the police, adding one pencil line to the gatehouse ledger: <em>second descent, 04:02</em> (P7M3). <em>Day 1:</em> the consignments are loaded aboard the Cessna 421 and the Elder stands at the fence line looking directly at the watchers (P6M4). Wheels-up at 01:15 ends the operation and leaves the emptied case behind. The Intermediary wires congratulations to Bucharest and closes the account (P5M4).</p>
          <p><strong>If the cell stalls.</strong> I38, I42 and I44 deliver Day 2; I39 and I45 deliver Day 1 — and if the cell arrives late, the priest, the ledger and the photographs still deliver every card. The story survives without a single roll.</p>
          <p><strong>The truth of this act.</strong> The pack does not want the case; it wants the cure, and it will carry it out of Europe by air whether or not anyone is watching. Claudia was killed because she was the only person on the road who understood the cure well enough to burn it — and she was waiting for a second person when they came, which is the detail that should keep the table up at night. The Watcher gets his photograph and leaves; the Elder gets his ten vessels and leaves; the case stays behind, empty, as the game’s only real trophy.</p>
          <p><strong>Read aloud.</strong> <em>Lantern light on a long table, and on the table, laid out with the care of someone who has set a table before, is the woman who has been standing at your side since Rome. Nothing has been taken from her except time. The room smells of kerosene, and the only sound in the abbey is the wind going through a gate that has been torn out of the wall from the outside.</em></p>

          <h3>Beat 1 — The abbey approach (L6)</h3>
          <p><strong>Scene.</strong> Bring them along the Sesia at dusk: moat water, brick walls, and carriage doors already open — broken inward, iron hinges torn out of the masonry. Show @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.EzLXgHrD8SOahA0Z]{TM11 — Breached abbey approach} on the approach. If they case the perimeter or the loading yard first, put down @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.5UwVLTp8ofRAjQ9W]{BM07 — Abbey gate and courtyard}: broken bridge and gate south, fountain and four garden plots in the courtyard, cloister arcade north, stores and cells along the wings. Layout only.</p>
          <p><strong>Who is here.</strong> Nobody living. What the cell can see from the outside is that the breach came from the pack's side of the wall, that it happened hours ago, and that no one has come out. Optionally, the local priest is on the road with his bicycle and his three parishioners who never blink — he is the act's only living witness and he will talk to anyone who treats him as a person rather than a source.</p>
          <p><strong>What is here.</strong></p>
          <ul>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.8PgGu8m7izwYBIO3]{C16 — Torn gate hinge} and @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.Laubhjg7TgqleOEw]{C17 — Moat and brickwork} — optional snapshots of the torn gate hinge and the moat, if the players photograph the approach. Neither frame identifies who forced the gate.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.AwrHknjihUDqll80]{I44 — Consignment Markings} — consignment markings in the service hangar (Beat 4), which is where the empty cradle and the chalk tally are.</li>
          </ul>
          <p><strong>Tests.</strong> Reading the breach is <em>Investigate (WIT) Difficulty 1</em> — inward damage, iron hinges torn out, no blood at the gate. A failure costs nothing; the details are visible from the road.</p>
          <p><strong>What the cell learns.</strong> Someone with strength well past human forced this gate from outside, and the abbey has been quiet ever since.</p>
          <p><strong>Leads.</strong> The dining hall, and the smell of kerosene.</p>

          <h3>Beat 2 — The dining hall (L6)</h3>
          <p><strong>Scene.</strong> Hold the lantern light at the door before they see the table. Sister Claudia Vane is dead on it, pinned like a specimen. Render the body and the room in total quiet — no music, no ambience, kill the beds before you read it — and show @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.URoAcs3MRSAqrakE]{TM12 — Abbey dining hall threshold} only after the moment has landed. If the hall is run as a scene, use @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.9wHAIjutxJqKmHqB]{BM08 — Abbey dining hall and cloister}: long table and banners filling the hall, cloister arcade along the south edge to the courtyard, kitchen and cellar rooms either side. This is the emotional floor of the mission: give the players the moment without commentary.</p>
          <p><strong>Who is here.</strong> Nobody. @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.AArBxHFCdC7qBCke]{N02 — Sister Claudia Vane} is a body on a table now, and the cell may have spent fourteen days deciding what she was. Let them discuss it — she is a Talamasca operative, the Covenant's liaison, and the only person in the case who never once told the truth; the players get to decide which of those she is buried as.</p>
          <p><strong>What is here.</strong> The forensics read in three passes: autopsy, satchel, telegraph desk.</p>
          <ul>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.zCbHgDIvUDf0NQeB]{I13 — The Novara Slaughter} — the autopsy of Claudia: two severed metacarpals reduced to white calcified ash, one still showing a legible whorl ridge; a broken phial soaked into the tiles; the attaché gone but its leather carry-strap cut on the table edge; and an unused second wine glass at the head of the table. <em>Proves</em> she was waiting for someone who was not the pack — and that the cure destroys a vampire on contact. <em>Gate:</em> one shift of forensic work; show <em>i13-carotid-detail.webp</em> via Image Popout when the wounds are measured with calipers.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.phIsjPz5WHarCoVB]{I40 — Her Effects, Laid Out} — her effects, laid out from her satchel (1 shift): a Talamasca Registry 16 card, a toll stub time-stamped ninety minutes before death — she drove straight here from Turin — and grey animal hair wound around the Beretta's trigger guard. <em>Proves</em> her order, her route and that something checked her weapon before she reached it. <em>Gate:</em> one shift with the satchel.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.e7WrCS9xFqFcAJHF]{I14 — Telex Dispatch: Registry 16} — the telex dispatch from her satchel or the telegraph desk: an order to fly the specimen to a Carpathian facility, PROTECT THE BLOODLINE, perforated by Amsterdam's machine, with a second melted strip preserving the line <em>RENDEZVOUS “BASARAB”</em>. <em>Proves</em> Amsterdam has been running her, and gives the aircraft's owner a name. <em>Gate:</em> the satchel or the desk, free.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.GnEgQ3rUIxDi1GQo]{I15 — Flight Clearance: YR-BAS} — the flight clearance from the telegraph desk: owner Basarab Holdings S.A. (Bucharest), cargo “Ecclesiastical Medical Supplies — Ten Consignment Units”, departure 01:15, with a cancelled form beneath it proving the flight waited. <em>Proves</em> the airfield departure is a plan, not a diversion. <em>Gate:</em> the desk, free.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.D9UKW0SQBtFZSwzZ]{C18 — Kerosene lantern} — optional snapshot: the kerosene lantern by the brickwork. It is ordinary abbey lighting and dates nothing.</li>
          </ul>
          <p><strong>Tests.</strong> The autopsy is 1 shift and an <em>Investigate (WIT) or Heal Physical (WIT) Difficulty 2</em>; a failure still gives @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.zCbHgDIvUDf0NQeB]{I13 — The Novara Slaughter} — the cell simply cannot read the whorl ridge, and that detail drops to the Day 2 packet. Nothing else here needs a roll.</p>
          <p><strong>What the cell learns.</strong> Claudia was executed by the pack, she was waiting for a second person when they came, and the cure destroys the thing it was made from — while a Church-built container is on its way to a Bucharest holding company by air tonight.</p>
          <p><strong>Leads.</strong> The airfield at Novara-Cameri, and the priest who saw the lamps go out.</p>

          <h3>Beat 3 — Full forensics and the living witnesses (L6)</h3>
          <p><strong>Scene.</strong> The abbey by lantern and torchlight: cells, cloister, kitchen, cellar. This beat is where the case turns from horror into physics — and where the cell first realises the pack has casualties of its own.</p>
          <p><strong>Who is here.</strong> The local priest, the day's only living witness: three parishioners who never blink, confessed to him and then gone. If the cell arrives after dark, he is the one who says the abbey's lamps went out one at a time (sting: <audio controls preload="none" style="height:1.7em;vertical-align:middle" src="modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-power-down.mp3"></audio> <em>Power down — lamps going out</em>). He is frightened, cooperative, and useless as a fighter; his value is that he can describe the pack’s arrival hour by hour — the vehicles, the language, the fact that they came in through the gate rather than over it, and that they carried something long and wrapped that they did not take in with them. the pack's arrival hour by hour.</p>
          <p><strong>What is here.</strong></p>
          <ul>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.U2IpaLLta03yQl0w]{I38 — Two Fingers, Calcified} — two calcified fingers, from the full forensic work (photograph: @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.EJeFCUWs9Sl7FBwR]{F09 — Refectory, Candlelight}): radial fracture lines in which the bone aged a century in seconds, a surviving whorl ridge that is a printable partial for Mission 2, and a melted ring fused into the ash carrying the Basarab dragon crest. <em>Proves</em> one of the pack touched the spill and died for it — the cure kills them, and they know it. <em>Gate:</em> 1 shift of full forensic work; the card lands on Day 2 either way.</li>
          </ul>
          <p><strong>Tests.</strong> The full forensics are one shift; call for <em>Heal Physical (WIT) Difficulty 2</em> to get the fracture-line reading, otherwise the cell has the fingers and the crest but not the interpretation.</p>
          <p><strong>What the cell learns.</strong> The hunters are afraid of the thing they are buying, and they have already paid in fingers for it.</p>
          <p><strong>Leads.</strong> The airfield, the crate, and the aircraft's tail number.</p>

          <h3>Beat 4 — The hangar and the apron (airfield)</h3>
          <p><strong>Scene.</strong> Take them through the abandoned hangar — rain on discarded fuelling lines, and the empty cradle where a crate stood — and out onto the apron. Show @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.tlrpaGAGQo3Qhk98]{TM13 — Abandoned airfield hangar} for the hangar; run the ground on @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.lGukiMcNwlfc2Wh3]{BM09 — Hangar and apron}: hangar floor top-left, dispatch and office annex right, fuel bowser on the right-hand apron, perimeter fence and gatehouse at the far edge. The clock is the enemy here: past the first shift, Novara-Cameri empties onto the road and the scene becomes an armed standoff, costing two shifts and impounding evidence.</p>
          <p><strong>Who is here.</strong> Ground crew and a duty dispatcher, ordinary and bribable, and — after dark — the pack's own people at the fence line. The Elder arrives with the aircraft.</p>
          <p><strong>What is here.</strong></p>
          <ul>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.AwrHknjihUDqll80]{I44 — Consignment Markings} — consignment markings in the service hangar: a chalk tally reading 10/12, an older mark ghosted under the fresh Basarab stencil reading VATICAN MUSEUMS — STOREROOM 9. <em>Proves</em> two phials were unaccounted for before the aircraft left Europe, and that the crate carrying the cure out of Italy was Vatican property. <em>Gate:</em> the service hangar, free.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.R4F2ocb2JCwwfKOB]{I45 — Airfield Briefing Sheet} — the airfield briefing sheet from the dispatch desk or the Wayfinder packet: a crossed-out second aircraft (decoy traffic — chasing it costs the forty minutes that matter) and a handwritten confirmation dated the same night as the flight clearance. <em>Proves</em> the plan was locked before the slaughter, not after. <em>Gate:</em> the dispatch desk; the Wayfinder packet delivers it on Day 1 if the cell never gets there.</li>
          </ul>
          <p><strong>Tests.</strong> Getting the papers is <em>Manipulate (EMP) Difficulty 2</em> with a dispatcher, or <em>Sneak (AGI) Difficulty 3</em> on the office annex. Racing the clock is not a roll: it is a choice about how much noise they are willing to make.</p>
          <p><strong>What the cell learns.</strong> The flight was scheduled before Claudia was killed, the crate is Church property, and two phials have been missing from the count for days.</p>
          <p><strong>Leads.</strong> The tarmac, and the last frame of the case.</p>
          <p><strong>If the investigators take photographs:</strong> @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.WvJ6ZeOsll96y9wc]{C19 — Empty hangar interior} (the empty hangar — only once the aircraft has gone; the hangar is empty at photography time) and @UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.eyO4tcMIc2crn3hk]{C20 — Fuel hose on the apron} (the fuel hose on the apron). Neither is evidence of a particular aircraft.</p>

          <h3>Beat 5 — The tarmac (set-piece)</h3>
          <p><strong>Scene.</strong> Rain on the perimeter fence, props turning (bed: <audio controls preload="none" style="height:1.7em;vertical-align:middle" src="modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-prop-plane.mp3"></audio> <em>Airfield prop plane at night</em>), a crate that once belonged to the Vatican Museum, and an ancient thing in a long coat that turns and looks at the cell like it owns the night. Show @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.lGukiMcNwlfc2Wh3]{BM09 — Hangar and apron} for the ground and @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.fnZm0Dl4nHlnas4G]{I39 — Tarmac, 01:15} for the moment — one photograph, then the lights lift, and the case is over.</p>
          <p><strong>Who is here.</strong></p>
          <ul>
            <li>The <strong>Basarab Elder</strong> (@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.lslbLO2q9JAIkH5p]{N11 — Unidentified Male, Unaged}): an old man in a long black coat with the collar up and a fur collar under it three centuries out of date, standing apart from the loading, entirely calm about being photographed, wearing a dragon-wolf signet ring worn smooth (photograph: @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.kXTU8r4ID6lRtJAt]{F16 — Cellar, Candlelight} when the cell asks who owns the aircraft). He wants the ten phials aboard and nothing else and will not fight over them — if the cell intervenes, he lets the aircraft go and leaves on foot, and Mission 2 is about him.</li> <strong>What he knows:</strong> ten vessels are in the crate and two are not; that the cure kills his own people on contact; that he has been buying the stuff in Europe for two years. He says none of it. He answers a direct question politely, in Romanian-accented French, with a true sentence that reveals nothing — and he looks directly into the lens when he does it.
            <li>The pack's loaders: two men working the case through the cabin door, and a third at the fence line watching for exactly the interference the cell is considering.</li>
            <li>The <strong>Grey Watcher</strong> (@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.Jwy5L06PAZfMm881]{N16 — The Grey Watcher}), somewhere at the fence with a camera: he is here for the photograph the cell is about to take, he will not intervene in anything, and if the cell catches him his negatives are the case file's missing photographs — the unshot frames behind @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.gpEG58FggEY1toq2]{I18 — Second Descent}, @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.SI5TGjifT8qC6Epu]{I26 — The 06:40 to Geneva}, @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.OvqUML75EHpXFQ0P]{I31 — Sonnenberg, Observed} and @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.tkYtaX7GeNiTtUeg]{I33 — Lingotto, Rooftop, Rain}.</li>
          </ul>
          <p><strong>What is here.</strong></p>
          <ul>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.fnZm0Dl4nHlnas4G]{I39 — Tarmac, 01:15} — the tarmac photograph, taken by the cell or by the watcher: tail number YR-BAS, the dragon crest on the crate, and the Elder looking down the lens. <em>Proves</em> the pack knows it is being watched and has stopped caring. <em>Gate:</em> be at the fence with a camera; taking this photograph spends the window.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.xOiejtMxuQ1Q4vDv]{I42 — L'Entità Team, 1987} — the L'Entità team photograph, if the cell arrived with the final HQ packet: SCV 47 at the kerb, an operative wearing an issue Vatican gendarme wristwatch, and a phosphorus canister on the third man's belt. <em>Proves</em> the sanitation squad is armed and on the same road. <em>Gate:</em> the Day 1 packet, or recovered prints later.</li>
          </ul>
          <p><strong>Tests.</strong> None that decide the outcome. Intervening is a combat scene on @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.lGukiMcNwlfc2Wh3]{BM09 — Hangar and apron} with a pack that will break off rather than die; documenting is <em>Deft Hands (AGI) Difficulty 1</em> with a camera in the rain; watching is free, and the mission's canonical close is exactly that — one photograph, then the lights lift. If the cell blundered through the abbey instead, close on the military police cordon and let the cost be counted in shifts and impounded evidence: the mission ends either way, only its price differs.</p>
          <p><strong>What the cell learns.</strong> The buyers are a dynasty, not a cult, and they are carrying a cure out of Europe with the Church's own crate. Whether that is a catastrophe or a mercy depends on what the cell has understood by now — and what they write in the report.</p>
          <p><strong>Leads.</strong> The epilogue: the accounting in Rome, and the road to Mission 2.</p>
    - name: 'Epilogue — The Accounting & The Road to Mission 2'
      type: text
      text:
        content: |
          <h2>Epilogue — The Accounting &amp; The Road to Mission 2</h2>
          <p><strong>The act in one line.</strong> Close the file. The mission ends on the empty tarmac with the emptied attaché left behind: the phials are gone, the cure is in vampire hands, and the Covenant is holding the blame for a fire it did not start.</p>
          <p><strong>The truth of the epilogue.</strong> Nothing the cell did changed the outcome of the case; everything they did changed the price of it. If the phials left, the epilogue is a political scene about a report — who reads it, who is named in it, and what the Covenant does with a mistake it can now blame on Rome. If the cell stopped the flight, the epilogue is an ethical scene about ten vessels of a cure sitting in a Covenant vault, and the fact that the Order, the Church and Amsterdam all now know it exists. Play whichever happened straight: no epilogue is a consolation prize.</p>
          <p><strong>How it ends — choose one and play it straight.</strong></p>
          <p><strong>You decide.</strong> Who survives, which cards the players end up holding, and what the Covenant writes in the report are yours. Wherever this page is silent, invent it with the table, write it down, and treat the version you invented as canon on the road to Mission 2 — the players will remember it as though you had planned it.</p>
          <ul>
            <li><strong>If the phials left (canonical):</strong> feral carriers multiply across Northern Italy as the vector's market spreads; the Holy Alliance launches its sanitization campaign; the Covenant's report becomes a political weapon in the wrong hands. The board's worst-case resolution becomes Mission 2's problem.</li>
            <li><strong>If the cell stopped the flight:</strong> the Covenant holds ten vessels of a cure it finally understands. The ethical question is the players', not yours: use it as a weapon (Sabbatini's “iron nail” argument, @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.bylOSJzw3hElf5Nb]{I17 — Dispatch Box, Microfiche}), study it, or destroy it. Either way the Talamasca know the cure exists — and so does the Prefect.</li>
            <li><strong>Partial outcomes:</strong> one canister, one witness, one photograph is enough for Mission 2. The cell should leave the table with exactly one unanswered question.</li>
          </ul>

          <h3>Beat 1 — The green-lamp meeting (L7, Vatican City)</h3><p><strong>Read aloud.</strong> <em>The office is cold because the building is cold. On the desk between you is your own report, already typed, already read by somebody who was not in the room when it happened — and a dossier with a stamp on it that has nothing to do with your case and everything to do with the fourteen days you have just spent.</em></p>
          
          <p><strong>Scene.</strong> If the cell brings the file back to the Palace of the Congregation, stage the accounting as a scene, not a summary. Take them through the antechamber first — green carpet, benches, busts, and the particular quiet of a waiting room outside a Prefect's door — then into the Council Chamber: oval table, Renaissance frescoes, banker's lamps over the dossiers. Show @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.ODBMpIkV30orwoGM]{BM10 — Council chamber and antechamber} for the pair of rooms and @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.c2expM3HLZD9xsBD]{TM14 — Council chamber} for the chamber itself.</p>
          <p><strong>Who is here.</strong> @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.1KoM7ttJRrUuP7nr]{N03 — Cardinal Enrico Sabbatini} — <strong>Cardinal Enrico Sabbatini</strong> (photograph: @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.dS329Mdsggs302Nh]{F03 — Council Desk, Green Lamp}): a statesman in his own building, at his desk, no longer pretending otherwise, with a dossier in front of him already stamped REGISTRY 16 — AMSTERDAM. He treats the vampire dynasties as a biological reality held in check by deterrence, and the Covenant as an external tool to be hired, used and discarded. His default register is imperious and hostile — <em>Difficulty 4</em> — and it drops to cynical cooperation the moment the cell puts indisputable forensic proof on the table: the corpse, the telex, the flight manifest, and the fact that his own file on the Talamasca is further along than theirs. He will not apologise, will not admit the Church banked the sale, and will not discuss the 1582 order in front of a witness.</p>
          <p><strong>What is here.</strong> Confronting him with the corpse, the telex and the manifest unlocks the containment protocols:</p>
          <ul>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.9NpgA6XbC6AKGYEY]{I16 — The Quiescence Formula (CT3)} — the quiescence formula, if the cell missed the L2 kit: the recipe for moving or neutralising the blood, and now signed for by the Church itself. <em>Gate:</em> the confrontation; free once he pivots.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.XWAylCZFSBMFiPpB]{I41 — The Green Lamp} — the green-lamp surveillance frame, from the approach, if the Day 3 packet was missed: the reflections showing three more standing figures — and this time they are in the room with the cell. <em>Gate:</em> approach surveillance, or the packet.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.xOiejtMxuQ1Q4vDv]{I42 — L'Entità Team, 1987} — the L'Entità team photograph, from recovered prints (photograph: @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.15mjJNhWmMEqMFWL]{F08 — Vatican Corridor, Night}): SCV 47 at the kerb again, and a phosphorus canister on a belt. <em>Proves</em> the squad the cell has been one step ahead of is now one step behind them. <em>Gate:</em> recovered prints, or the Day 1 packet.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.bylOSJzw3hElf5Nb]{I17 — Dispatch Box, Microfiche} — the dispatch box, if it surfaced at HQ: on the lid's underside an ouroboros-eye has been scorched into the tin — someone else has read this file. Let the players ask who. <em>Gate:</em> the HQ file; no roll.</li>
            <li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.kBWFyXm1RLabkHBz]{C21 — Council table lamps} — optional snapshot: the council table lamps. Only if the cell is admitted to the chamber and allowed to photograph it.</li>
          </ul>
          <p><strong>Tests.</strong> The meeting is a negotiation, not a fight: open at <em>Difficulty 4</em> and lower it by one for each of the corpse, the telex, the manifest and @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.XWAylCZFSBMFiPpB]{I41 — The Green Lamp} that the cell lays on the table. A failure is not a dead end — he simply signs nothing, and the Covenant's operations continue without the Church's cover into Mission 2.</p>
          <p><strong>What the cell learns.</strong> Rome has been managing the bloodlines for four centuries and considers the cure a leash, not a blessing. The Covenant's report is going to be read by the people it accuses.</p>
          <p><strong>Leads.</strong> The Requisition (its own page: <em>The Concordat Requisition</em>), the road to Romania, and Mission 2.</p>

          <h3>Beat 2 — Claudia's room</h3>
          <p><strong>Scene.</strong> If the cell asks where Claudia lived, give them the room and nothing else: a convent cell, packed, in order, waiting for its owner. Show @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.72tNLODObuOLLVyV]{TM15 — Claudia convent room}.</p>
          <p><strong>Who is here.</strong> Nobody. This is the right place for the burial debate — Talamasca agent, Covenant operative, or a woman whose handwriting never trembled once in a year of deceiving everyone she met. Her last message home is with Amsterdam now, and nobody in the room is going to get it back.</p>
          <p><strong>What is here.</strong> Nothing mechanical. If the cell searched her effects at the abbey, they have already had the last word on her; if they did not, this is where her absence is felt.</p>
          <p><strong>What the cell learns.</strong> Nothing new — and that is the point. Let the players argue it out in character.</p>

          <h3>Beat 3 — What becomes of the cast</h3>
          <ul>
            <li><strong>Monsignor Corvi</strong> — if he lives, he gets what he wanted: Rome on record, and a Church that now knows what the cure actually is. Whether that saves or damns him is the cell's report to write.</li>
            <li><strong>Sister Claudia Vane</strong> — buried under one of two names, or neither.</li>
            <li><strong>Dr. Graf</strong> — the liquidation order stands. If the cell left her behind, O1M4's fallout lands here: a burned clinic wing and a name to be answered for. If they took her, she and her one slide are Mission 2's opening exhibit.</li>
            <li><strong>Kurt Hausmann</strong> — still out there, a hunter who has learned to stay out of the light. He does not appear in the epilogue unless you want a haunting: livestock, disturbed graves, cold cases along the forest edge.</li>
            <li><strong>The Grey Watcher</strong> — leaves the card and the negatives and is never unmasked. He is the campaign's promise that someone has been reading the same files all along.</li>
            <li><strong>The Turin Intermediary</strong> — wires congratulations to Bucharest and closes the account. Profit, not pride, was always the point.</li>
            <li><strong>The Basarab Elder</strong> — ten phials aboard, a dynasty on the road to its own furnace, and a face the cell has now photographed twice.</li>
          </ul>

          <h3>Beat 4 — The hand-off</h3>
          <p><strong>Scene.</strong> End on the empty tarmac and the rain, then hand the table the <em>Concordat Requisition</em> page and the road to Romania: Cluj-Napoca, the Apuseni foothills, a private Basarab sanatorium, and ten phials that must never be used.</p>
          <p><strong>What the cell learns.</strong> The case they just closed is the first move in someone else's game, and the Covenant has been invited to keep playing.</p>
          <p><strong>Leads.</strong> Mission 2: Recover the Sangreal — and the board's remaining days belong to it.</p>
          <p><strong>DA checklist.</strong> Log the final board state: which milestones fired, which tracks advanced. Record which cards the cell found on site and which arrived by packet. Note every unanswered question the players voiced — each one is a Mission 2 thread. Then file the case.</p>
    - name: 'Image Egg Index — I01–I45'
      type: text
      text:
        content: |
          <h2>Image Egg Index — I01–I45</h2>
          <p>Quick reference for the DA: every information card and the hidden details in its artwork. Cards whose <em>fallback</em> day is mentioned in the day entries above can be delivered via HQ packet if the cell misses them on-site — the image is the reward either way. When a player examines a card's art, answer with the egg, not the summary.</p>
          <table>
            <tr><th>Card</th><th>Egg in the art</th></tr>
            <tr><td><strong>I01 — The Burnt Electromagnet Relay</strong></td><td>Sulfurous residue in the slag; the plinth is scorched from <em>beneath</em> — the failure came up through the cradle.</td></tr>
            <tr><td><strong>I02 — CCTV Reel #87-04</strong></td><td>Corvi casts a faint shadow but the case throws opaque black; a nun's veil at the frame edge, forty metres behind, in no report.</td></tr>
            <tr><td><strong>I03 — The Excised Codex Register</strong></td><td>Shelf-mark MS-Vat-Heb-418; the red card (1582, XII-SANG-00) has no dust — it was placed recently.</td></tr>
            <tr><td><strong>I04 — Numerals on Rag Paper</strong></td><td>The blotter's mirror-writing already reads GENEVA and 4409; a Roma Termini ticket beneath it.</td></tr>
            <tr><td><strong>I05 — Embossed Stamp, Map Casing</strong></td><td>Three cities circled in pencil before the case existed; the stamp's second impression shows long use.</td></tr>
            <tr><td><strong>I06 — The Escrow Transfer Slip</strong></td><td>"1 of 12" with a clerk's pencilled tick; the fold where it lived in a jacket.</td></tr>
            <tr><td><strong>I07 — Patient File 09-H</strong></td><td>The gold wristwatch and clinic logo are thread-ends to the feral predator and the escrow letterhead.</td></tr>
            <tr><td><strong>I08 — The Swiss PTT Intercept Tape</strong></td><td>A second tape box in the same neat hand as I03's red card; the final line circles a Turin extension.</td></tr>
            <tr><td><strong>I09 — Histopathology Log</strong></td><td>"Foreign graft — not infection"; a second polaroid intrudes — she kept one.</td></tr>
            <tr><td><strong>I10 — The Vector Mechanics (CT1)</strong></td><td>Batch numbers tie to 1 of 12; "six shifts" conversion window — the same clock the board counts down.</td></tr>
            <tr><td><strong>I11 — The Resonance Field (CT2)</strong></td><td>A blood bag swollen past bursting — proximity decay; the 02:40 sharps-bin line; the thermometer at I16's quiescence threshold.</td></tr>
            <tr><td><strong>I12 — Palimpsest Leaf, Codex</strong></td><td>The underlayer is the actual Gospel of the Twelve; <em>sanguis remedium, non sacramentum</em>; a Hotel Bristol matchbook pins his trail.</td></tr>
            <tr><td><strong>I13 — The Novara Slaughter</strong></td><td>White calcified metacarpals, one with a legible whorl; a broken phial in the tiles; the carry-strap cut; the unused second wine glass. Popout asset shows the carotid detail.</td></tr>
            <tr><td><strong>I14 — Telex Dispatch: Registry 16</strong></td><td>PROTECT THE BLOODLINE; Amsterdam perforations; one unburned line survives the melt: RENDEZVOUS "BASARAB".</td></tr>
            <tr><td><strong>I15 — Flight Clearance: YR-BAS</strong></td><td>Basarab Holdings; "Ten Consignment Units"; 01:15; the cancelled form beneath means the flight waited.</td></tr>
            <tr><td><strong>I16 — The Quiescence Formula (CT3)</strong></td><td>The kit in the photograph is already installed in Zurich — Rome's protocol precedes the crime.</td></tr>
            <tr><td><strong>I17 — Dispatch Box, Microfiche</strong></td><td>The "iron nail" memo; an ouroboros-eye scorched into the tin's underside — someone else has read this file.</td></tr>
            <tr><td><strong>I18 — Second Descent</strong></td><td>The ouroboros-eye signet on the descending hand; the lift already called from below; 04:02 matches P7's pencil line.</td></tr>
            <tr><td><strong>I19 — Plinth Detail, Brass Plate</strong></td><td>The case's scrape outline: opened in situ more than once; the plaque predates the 1964 case.</td></tr>
            <tr><td><strong>I20 — Safe Dial, Drilled</strong></td><td>Professional swarf, not panic; the kneel used twice; Claudia's compact — she searched the room first.</td></tr>
            <tr><td><strong>I21 — Diplomatic Passport</strong></td><td>Chiasso stamp two hours after the gate film; <em>accompagné</em> — a companion the reports omit; same tie as 1962.</td></tr>
            <tr><td><strong>I22 — The Archive, 1962</strong></td><td>The mentor's ouroboros-eye ring; the XII-SANG folder between them; a red X recent enough to still matter.</td></tr>
            <tr><td><strong>I23 — Night Deposit</strong></td><td>The Watcher's reflection in the marble; the bank cloth under the case; the calendar reads 17 September 1987.</td></tr>
            <tr><td><strong>I24 — Bank Staff Record</strong></td><td>The access stamp that explains why Mercier was chosen; the transfer carbon (CHF 500,000, 4409-C) he copied for himself.</td></tr>
            <tr><td><strong>I25 — The Ledger Page</strong></td><td>Hausmann tried to buy more than one phial; under the correction fluid: "Vane, C." at 02:10.</td></tr>
            <tr><td><strong>I26 — The 06:40 to Geneva</strong></td><td>Same raincoat, same newspaper; EC 30 ROMULUS; the Vatican courier label on the luggage trolley.</td></tr>
            <tr><td><strong>I27 — Intake Photograph, 09-H</strong></td><td>The gold watch returns on the feral predator; the clinic logo matches the escrow letterhead.</td></tr>
            <tr><td><strong>I28 — Photophobia Test 02:40</strong></td><td>The XII-1/12 batch tag; the light switch taped over; the nurse's withdrawing hand.</td></tr>
            <tr><td><strong>I29 — The Injection Log</strong></td><td>Vaduz trust account equals the escrow account in I06; room 3.14 rhymes with the vault's 03:14.</td></tr>
            <tr><td><strong>I30 — Ward 3, Corridor Camera</strong></td><td>The ceiling silhouette; the spill trail ends under a service duct — ventilation, not doors; 02:40.</td></tr>
            <tr><td><strong>I31 — Sonnenberg, Observed</strong></td><td>SCV 47 beneath the clinic; the Watcher's newspaper under the camera; one window taped from the inside.</td></tr>
            <tr><td><strong>I32 — Daylight Test: Combustion</strong></td><td>The ash matches the Novara fingers; the quiescence kit already on the bench; 07:12 — twenty minutes after sunrise.</td></tr>
            <tr><td><strong>I33 — Lingotto, Rooftop, Rain</strong></td><td>Vane between Corvi and the booth's only door; the second case-sized rectangle (his papers); SCV 47 below.</td></tr>
            <tr><td><strong>I34 — Assembly Hall, Camera 6</strong></td><td>The deadbolt taped — the case has been forced or dropped; Corvi casts no shadow in the puddles.</td></tr>
            <tr><td><strong>I35 — Breve Apostolicum, 1582</strong></td><td>The shelf-mark ties to I03; the seal was cracked, opened, and repaired; the marginalia name XII-SANG-00.</td></tr>
            <tr><td><strong>I36 — Suppressed Index Card</strong></td><td>"Corrosive to ferrous circuitry" is the whole plan; the handling order came from the Prefect's office.</td></tr>
            <tr><td><strong>I37 — The Empty Needle</strong></td><td>A clean, deliberate cut; ochre sheath fibres inside; the scorch is fresh — snapped recently and near here.</td></tr>
            <tr><td><strong>I38 — Two Fingers, Calcified</strong></td><td>Fracture lines match I32's crucible ash; a printable whorl partial; the dragon-crest ring melted into the ash.</td></tr>
            <tr><td><strong>I39 — Tarmac, 01:15</strong></td><td>Tail reads YR-BAS; the crate carries the dragon crest; the Elder looks down the lens — the pack has stopped caring.</td></tr>
            <tr><td><strong>I40 — Her Effects, Laid Out</strong></td><td>The Talamasca card; the toll stub ninety minutes before death; grey animal hair around the trigger guard.</td></tr>
            <tr><td><strong>I41 — The Green Lamp</strong></td><td>REGISTRY 16 — AMSTERDAM already on Sabbatini's desk; the operative's grey coat; three figures in the reflections.</td></tr>
            <tr><td><strong>I42 — L'Entità Team, 1987</strong></td><td>A Vatican gendarme wristwatch; SCV 47 at the kerb; the phosphorus canister on the third man's belt.</td></tr>
            <tr><td><strong>I43 — The Case, 1964</strong></td><td>The plaque was stamped before the case was built; "destroyed if opened"; the supervisor is I22's prelate.</td></tr>
            <tr><td><strong>I44 — Consignment Markings</strong></td><td>Chalk tally 10/12; VATICAN MUSEUMS — STOREROOM 9 ghosted beneath the fresh paint.</td></tr>
            <tr><td><strong>I45 — Airfield Briefing Sheet</strong></td><td>The crossed-out decoy aircraft; the handwritten confirmation dated the same night as the clearance in I15.</td></tr>
          </table>
          <p><em>DA note: the egg index is deliberately shallow — one sentence per card. The full readings (retrieval, what the image shows, and how to use it) live in each card's own DA notes on the Information Web.</em></p>

