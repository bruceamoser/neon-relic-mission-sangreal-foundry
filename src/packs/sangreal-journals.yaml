          — The Quiescence Formula (CT3)}</td><td>Ghiberti’s handling records; Graf’s supplied kit;
          L7</td><td>Synthesis: CT3</td><td>Darkness, shielding, cold, and treated linen define quiescence.
          Sunlight destroys exposed contents.</td><td>Make the instructions available before hazardous
