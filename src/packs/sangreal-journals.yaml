          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.cs4mFCPQYvft88T1]{I22 — The
          Archive, 1962}</td><td>Connects his current fear to custody records and a mentor. Portraits
          establish continuity of identity, not an immortal prelate. The passport image is a copy in his
          papers, not his only passport inexplicably left behind after using
          it.</td></tr></tbody></table><h3>The cipher: give help that actually works</h3><p>The
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.5DoANlYa53w4faSv]{I04 — Numerals on
          Rag Paper} string uses a 5×5 square with I/J sharing a cell and U/V distinct: A B C D E / F G H I K
          / L M N O P / Q R S T U / V W X Y Z. Row first, column second. It reads <strong>GENEUA / UBS /
          HAUSMANN / DDKI / C</strong>. The old notes incorrectly claimed a normal letter square could
          directly yield the digits 4409. Preserve the user-approved string and photograph. Corvi uses U for V
          in GENEVA. In the numerical group, his decimal indexing row is A B C D E F G H I K = 1 2 3 4 5 6 7 8
          9 0, so D D K I is 4409. Ghiberti or HQ can explain this convention; the independently legible
          blotter impression corroborates it. Tell players who solve the square exactly what it yields. Do not
          pretend their correct decoding is wrong.</p><p>Ghiberti recognizes the square as an indexing
          convenience. A Research success saves time identifying the bank code and numerical cross-reference;
          a failure still yields the letters and the bank can search Hausmann’s escrow. Geneva/UBS/Hausmann is
          enough to proceed. A group uninterested in a cipher can ask HQ to transcribe it while they continue
          searching.</p><h3>What makes Corvi human</h3><p>The room contains ordinary reading and evidence of
          work, not a secret symbol in every object. If asked what he was like, Ghiberti recalls a scholar who
          recently began asking whether a custodian remained responsible for what someone else did with a
          collection. This new recollection is not proof of innocence. The financial lead will expose the cost
          of his answer.</p><h3>What Claudia does here</h3><blockquote><p>“If he meant to sell it, why leave a
          way to find him? Unless he wanted someone other than the buyer to know where he
          went.”</p></blockquote><p>It is a useful question, honestly asked. She wants the cell to find him.
          If confronted with the drilled safe, she initially calls it an earlier security search. Ask what
          record they request. There is no signed search inventory. She admits conducting an unauthorized
          search if the absence of a record and her access are established, while concealing Registry 16.
          Removing her from evidence handling now genuinely restricts her later options.</p><h3>The train out
          of Rome</h3><p><strong>DA assets:</strong>
