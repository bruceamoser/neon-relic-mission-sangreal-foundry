          A directory cannot answer this.</td></tr> <tr><td>Transport and supplies?</td><td>Seats on the next
          suitable Geneva–Zurich train; car onward to the clinic; gloves, sealed evidence bags, basic first
          aid and witness transport on request. Specialized shielding or cold storage must be requested from
          an acquired protocol, with availability confirmed.</td><td>Rail/driver contacts and stores. Ordinary
          bookings during planning; uncommon kit may require a later delivery and does not silently appear in
