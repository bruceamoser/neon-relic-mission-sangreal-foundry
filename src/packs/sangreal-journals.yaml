          information.</td></tr><tr><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.bylOSJzw3hElf5Nb]{I17
          — Dispatch Box, Microfiche}</td><td>L7 / documented request or negotiation</td><td>Core: political
          record</td><td>Rome retained the reserve as deterrent while a dilution-limited accommodation held.
          The memorandum proves policy, not authorization of every later crime.</td><td>Negotiate custody and
