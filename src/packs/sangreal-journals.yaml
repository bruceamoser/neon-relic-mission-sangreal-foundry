      text:
        content: >-
          <h2>Sonnenberg — A Patient Before a Monster</h2> <p><strong>Start aboard the train from Geneva.
          End this page when the cell knows what happened at the clinic and has Corvi’s onward
          contact.</strong> The next page handles patient protection, the return to Zurich station and
          boarding toward Turin. Sonnenberg is the fictional private clinic on a wooded hillside outside
          Zurich. The route is <strong>Geneva → Zurich HB → car to Sonnenberg → car back to Zurich HB → rail
          toward Turin</strong>. There is no separate Sonnenberg railway station in this mission.</p> <h3>DA
          preparation — this session begins after the injection</h3> <p><strong>Use this campaign
          state:</strong> Corvi has already delivered one phial of blood to Graf; she has injected Hausmann;
          Corvi has left with the other eleven after seeing the deterioration. Set the administration before
          the cell’s first current clinic call, with at least twenty-four elapsed hours completed by their
          arrival at Sonnenberg. Enter the actual calendar date/time in the chart and use it consistently.
          Conversion takes twenty-four elapsed hours, equivalent to four six-hour operational shifts. Do not
          impose extra delays on the players to manufacture this starting state.</p> <p>The party still
          believes it is pursuing the Holy Grail. On the train and at reception, say <em>case, stolen
          object, supplied preparation</em>. The receipt’s “one of twelve” is an unanswered question. Run
          the red alert and Hausmann encounter first. Only once the wing is safe does Graf reveal what was
          in the case; Claudia then supplies the devastating sacred interpretation. The authenticated
          authority call follows afterward. Do not start with an out-of-character lecture that the Grail is
          blood.</p> <p>A warning from Geneva now stops further use and improves patient precautions; it
          cannot undo the completed injection. Any already established patient protection remains effective.
          The default encounter is a violent breach: Hausmann has clawed Graf and killed an intern. If
          earlier play actually secured the ward, preserve that success and adapt the emergency rather than
          reversing it. If previous play actually established a prevented injection, reconcile that with the
          table openly before using this revised setup; do not secretly reverse a successful action.</p>
          <p><strong>Prepare three records.</strong> S1 is the reception movement extract; S2 is Graf’s
          signed treatment account; S3 is the onward telephone message. Their complete player-facing text
          appears below. Fill the bracketed dates and witness names from the actual campaign before sharing.
          These are separate readable records, not writing hidden in a photograph. Put
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.p51PQ2RP2raSDBHp]{I27 — Intake
          Photograph, 09-H},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.VMoT17MWZ543rWHe]{I29 — The
          Injection Log} and
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.lOsCniEBTy2c974w]{I06 — The
          Escrow Transfer Slip} beside S2. Keep
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.SilYzv6luOt5X6Am]{I07 — Patient
          File 09-H}–@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.D18a1YRCEQu27KHw]{I09
          — Histopathology Log: Marrow Graft},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.1dPSK2h5z6DX5Eab]{I28 —
          Photophobia Test 02:40},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.QEO98GDqJtZlL08l]{I30 — Ward 3,
          Corridor Camera} and
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.F6S9nFRmRvOKLqLf]{I32 — Daylight
          Test: Combustion} hidden until their sources are obtained; show a breach or daylight test only if
          it occurred.</p> <p><strong>The causal chain:</strong> Hausmann paid for a speculative treatment →
          Corvi delivered the preparation to Graf → Graf administered one phial → Hausmann deteriorated →
          Corvi sought protection through his Turin broker and took the remaining case → the clinic retained
          his forwarding contact because Graf needed to report the patient’s condition. Players can
          establish every arrow through a witness or document.</p> <p><strong>Persistent handouts:</strong>
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.jkM2vcnrfoWRsfMI]{I48 — Petra Fax
          — Sonnenberg Contact and Route},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.jCO2OHblFeteicpl]{I49 — Petra Fax
          — Graf’s Returned Call},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.S4tdujDWKjlTTBAJ]{I50 —
          Sonnenberg reception movement extract},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.8SS0DFQjCYTpMvCF]{I51 — Graf’s
          treatment and custody statement},
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.hnuSDQF9W6V31IPm]{I52 — Telephone
          message retained at reception}. Each becomes available at its stated source, not all at
          arrival.</p><h3>Scene 1 — Geneva to Zurich: use the journey to prepare</h3><p><strong>DA
          assets:</strong>
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.JdEbI0D8H7Vju6im]{TM16 — Train
          compartment} ·
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-sfx.Playlist.wxpL4Q4Ozfnvh71z]{Sound
          playlist}</p><p><strong>Train ambience</strong> <audio controls preload="none"
          src="modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-rail-corridor.mp3"></audio> <a
          href="modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-rail-corridor.mp3">Open sound</a>.
          Keep beds quiet; stings only when the described event occurs.</p> <blockquote><p>The bank envelope
          rides between you on the compartment table. Its receipt names the patient and the clinic. Beyond
          the window, the lake gives way to hills. Zurich is the rail connection; someone still has to get
          you up the clinic road and through its front door.</p></blockquote> <p>Let the players compare the
          escrow and Graf’s actual reply. State their immediate aim: <strong>meet Graf, establish whether
          Corvi delivered the stolen material, and determine who or what needs protection.</strong> Do not
          recap Rome unless they ask. Allow roughly four hours for this fictional rail leg and under an hour
          for the road connection, honoring any timetable already used in Geneva.</p> <p>Petra’s itinerary
          names the clinic, the Zurich station pickup and the agreed callback point. On arrival, the driver
          gives the booking reference Petra supplied; the cell can verify it through her desk. If no car was
          arranged, the station taxi rank can take them to the clinic’s public address. An absent
          introduction complicates reception, not the geography.</p> <table><thead><tr><th>Request to
          Petra</th><th>Useful answer or action</th><th>Limit</th></tr></thead><tbody> <tr><td>“Confirm the
          appointment and prevent any further treatment.”</td><td>She calls the public switchboard and
          relays the named staff member’s reply at Zurich station or the clinic desk. Graf confirms the
          injection already happened, stops any repeat administration and records the safety
          warning.</td><td>No automatic telephone aboard the train. Use an established radio or the agreed
          stop/arrival telephone.</td></tr> <tr><td>“What can we bring?”</td><td>Gloves, eye protection,
          sealed evidence bags and first-aid supplies from available stores; a car that can remain available
          for witnesses. If the cell already has
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.9NpgA6XbC6AKGYEY]{I16 — The
          Quiescence Formula (CT3)}, request the specified shielding and cold storage.</td><td>A normal
          medical cooler is not lead-antimony containment. Petra confirms what she can actually
          deliver.</td></tr> <tr><td>“Can you arrange medical support?”</td><td>She contacts a Covenant
          medical coordinator and asks for an assessment/transport team. Before arrival the brief is
          “suspected unsafe preparation,” not an invented vampire diagnosis.</td><td>The clinic must report
          its actual hazard. Petra gives an ETA and a callback, not a promise of an instant cure.</td></tr>
          <tr><td>“What is the way in?”</td><td>Main reception for the Graf appointment. A staff-controlled
          service entrance serves the theatre and stores. A driver can identify the road
          approach.</td><td>Public information does not reveal ward locks, camera coverage or private
          records.</td></tr> </tbody></table> <p>Use the journey to decide who carries originals and how
          duplicates will reach Petra. Claudia helps translate, organize papers and obtain the appointment;
          play her as the useful liaison the party trusts. Her preliminary UBS call was openly explained on
          the Rome–Geneva train
          (@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.AHvJ7rboPnaNlsnN]{I56 —
          Claudia’s Train Brief — Preliminary UBS Inquiry}). A railway delay is only useful if it changes a
          decision; the injection already happened before this journey.</p> <h4>Petra’s answer — a sealed
          envelope at Zurich HB</h4><p><strong>Default delivery:</strong> Petra has arranged the train and
          station car. While the party travels, her desk completes the inquiries, faxes a summary to the
          contracted car office, and instructs its dispatcher to seal the printout for the named
          investigators. The driver carries the envelope at Zurich HB and gives Petra’s previously agreed
          booking reference; verify through the station telephone if needed. He knows the destination and
          booking, not the medical contents. No mobile telephone or compartment fax is
          assumed.</p><blockquote><p>The driver checks the name on his booking sheet, then offers a plain
          envelope. “From the office that arranged your car. They said you were expecting answers. The
          clinic is less than an hour from here.”</p></blockquote><p>Share I57 and I58 below, plus I48 and
          I49 only if their inquiries actually returned. If the cell uses an established secure radio or
          calls from a scheduled stop, Petra can read the same limited briefing earlier; the driver still
          brings the durable copy. Date the packet at compilation and note any pending callback. It contains
          no blood, vampire, ward-breach or private-chart
          disclosure.</p><p><strong>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.30gAYHDHqRjKT8wR]{I57
          — Petra Brief — Hausmann Background}:</strong> public business references identify Kurt Hausmann
          as the financier named in the supplied escrow; bank testimony identifies him as the intended
          treatment recipient. The clinic confirms his admission and Graf as the attending physician only
          through its authorized callback. His prognosis and response remain private.
          <strong>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.jfC3dEXDlEKob6xB]{I58 —
          Zurich Pickup — Sealed Clinic Brief}:</strong> route, booking reference, Graf request, last
          confirmed callback and collection instructions. These are source-attributed notes, not
          intelligence obtained from unseen records.</p><h3>Scene 2 — Reception: earn access with the actual
          problem</h3><p><strong>DA assets:</strong>
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.kr4nu0sVNfrcGAJq]{TM06 — Clinic
          approach} ·
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-sfx.Playlist.wxpL4Q4Ozfnvh71z]{Sound
          playlist}</p><p><strong>Exterior rain</strong> <audio controls preload="none"
          src="modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-rain-street.mp3"></audio> <a
          href="modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-rain-street.mp3">Open sound</a>.
          Keep beds quiet; stings only when the described event occurs.</p> <figure><img
          src="modules/neon-relic-mission-sangreal/assets/art/scenes/totm/tm-clinic-arrival.webp" alt="The
          road approach to Sonnenberg" style="width:100%;height:auto"><figcaption>Use the approach as
          atmosphere. Any visible damage or blackout belongs only to a branch in which it has
          happened.</figcaption></figure> <blockquote><p>The road climbs through wet trees to a discreet
          entrance. At reception, a woman has an appointment book open beside the telephone. “Your names,
          please. Are you here for Dr. Graf?” Behind her, the door to the clinical wing opens only when a
          member of staff releases it.</p></blockquote> <p><strong>Reception’s job:</strong> protect
          patients and get a credible safety concern to the physician. The receptionist checks the
          appointment or the bank reference and calls Graf. A plain explanation works: “We are tracing
          material supplied by Monsignor Corvi for Kurt Hausmann. It may be unsafe. We need the treating
          doctor.” Identification plus the named supplier/patient and a verifiable document is sufficient
          for a consulting-room interview. No social roll is required for ordinary competent
          cooperation.</p> <p>Without papers, the desk offers to verify the cell through Petra’s known
          office or take a safety message to Graf. Bluffing may require a roll; failure means a supervised
          meeting and verification delay, not destruction of the lead. Loud demands for private charts bring
          the administrator into the room. The players can still explain the danger.</p> <p><strong>Default
          arrival — red alert:</strong> the investigators state that they are here to speak with Dr. Graf.
          Reception calls upstairs and asks them to wait. Before Graf can come down, the red alarm flashes
          and the telephone erupts. The desk guard listens, then says: “Disturbance on Ward Three. That is
          Dr. Graf’s floor.” He releases the clinical door and leads them toward the stairs; the lift can be
          held by staff for evacuation. Ask who goes first and what they have ready. The guard knows there
          is an assault, not what Hausmann has become.</p><p>Use the fire-alarm sound as the clinic’s
          emergency alarm, then fade it under speech. Reception moves visitors away from the clinical wing
          and calls emergency medical help. If the party refuses to go up, the response proceeds without
          them; the records and onward lead remain obtainable after the emergency. Graf does not give her
          full explanation downstairs before the fight.</p><h4>Reception answers</h4>
          <table><thead><tr><th>Players ask</th><th>Answer and source</th></tr></thead><tbody> <tr><td>“Was
          Corvi really here?”</td><td>The receptionist identifies him from the name and, if available, a
          portrait. The visitor book records his arrival for Graf and Hausmann. She saw him carrying the
          metal case. Give the completed S1 departure extract.</td></tr> <tr><td>“Where is
          Hausmann?”</td><td>Graf confirms patient 09-H in Ward 3 and explains the current access
          restriction. Reception does not release his full diagnosis.</td></tr> <tr><td>“Did Corvi leave the
          case?”</td><td>In the departed branch, reception saw him carry it into the station car. She cannot
          say how many vessels were inside. Graf supplies the treatment accounting.</td></tr> <tr><td>“Which
          way did he go?”</td><td>The car booking was to Zurich HB. His retained callback message names
          Lingotto in Turin. The driver can confirm the station drop-off, not that he boarded a particular
          train.</td></tr> <tr><td>“Can we get the records?”</td><td>Graf authorizes a limited copy for the
          supplier investigation. Reception retains the visitor-book original; the copied extract identifies
          who made it. Full clinical access follows Graf’s discussion and the cell’s safeguarding
          arrangements.</td></tr> </tbody></table> <div class="handout"><h4>S1 — Sonnenberg reception
          movement extract</h4><p>Persistent clue card:
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.S4tdujDWKjlTTBAJ]{I50 —
          Sonnenberg reception movement extract}.</p><p><strong>Supplier visit: Monsignor Matteo
          Corvi</strong><br>Appointment: Dr. Elizabeth Graf, concerning Herr Kurt Hausmann.<br>Arrival:
          [actual arrival date and time].<br>Observed item: one closed metal attaché case.<br>Current
          status: departed at [actual departure time].<br>Departure booking: car to Zürich Hauptbahnhof;
          visitor carried the same case when leaving.<br>Onward contact: retained telephone message
          S3.<br>Extract checked against the reception book by: [reception witness and date].</p></div>
          <p>Reception authenticates this copy and the witnessed case departure. She does not know the
          contents; leave that discovery to Graf.</p> <h3>Scene 3 — Graf’s first request: make the ward safe
          enough to talk</h3><p><strong>DA assets:</strong>
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.jpOPWYTG4Yqt6hk4]{BM04 — Ward,
          theatre and lab} ·
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-npcs.Actor.nvLAec98ATgolJA9]{Kurt Hausmann
          (The Feral Banker)} ·
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-sfx.Playlist.wxpL4Q4Ozfnvh71z]{Sound
          playlist}</p><p><strong>Blacked-out ward ambience</strong> <audio controls preload="none"
          src="modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-wind-sheeting.mp3"></audio> <a
          href="modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-wind-sheeting.mp3">Open sound</a>.
          Keep beds quiet; stings only when the described event occurs.</p> <h4>Ward Three — blood in the
          flickering light</h4><p>Use BM04 for movement. TM07 shows the intact, empty corridor: it can
          establish the wing before the alarm, but does not depict the bloody aftermath. During the reveal,
          use BM04 with tokens and describe Graf, the intern, blood and flickering lights aloud. I30 is the
          separately obtained breach record. Use the northwest stairwell or northeast lift according to the
          party’s approach; both open onto the mapped corridor. Graf is against the corridor wall near the
          southeast theatre, bleeding from deep claw marks across her shoulder and upper arm. A dead medical
          intern lies farther along the hall between the theatre approach and room 3.14; blood streaks the
          floor and wall. A surviving nurse has locked herself inside the theatre. Hausmann is in the dark
          corridor near room 3.14, hiding above the normal sightline against a wall/ceiling junction. Mark
          his actual position privately before initiative; he never teleports between
          shadows.</p><blockquote><p>The light comes back for half a second. A white coat lies in the middle
          of the corridor, one arm folded underneath it. There is blood on the wall above it. Dr. Graf
          presses a sodden dressing against her shoulder. “Do not come closer. He is still here.” The tubes
          buzz, fail, and something scrapes overhead.</p></blockquote><p><strong>Graf’s first words are
          practical:</strong> “Hausmann. He attacked us. The young man is dead. Help me get her out.” She
          can point to the theatre and his last seen position. Her wounds require immediate aid but she is
          conscious and can be moved; do not make her survival depend on winning an undisclosed countdown.
          The intern died before the party reached the floor. He carries no indispensable
          clue.</p><p><strong>Playable cues:</strong> red alert <audio controls preload="none"
          src="modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-fire-alarm.mp3"></audio> · failing
          power <audio controls preload="none"
          src="modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-power-down.mp3"></audio> · broken
          window <audio controls preload="none"
          src="modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-glass-break.mp3"></audio>. Trigger
          each only at its actual event; fade the alarm for dialogue.</p><h4>Run a young vampire, not an
          invincible elder</h4><p>Use the existing Hausmann actor: STR 5, AGI 4, Brawl 4, Sneak 3, Force 3,
          Armor 2, Fear 2. Blood Frenzy adds +2 dice against wounded targets. Ballistic weapons inflict half
          damage unless targeting the brainstem under the system’s normal targeting rules. Direct sunlight
          or focused UV inflicts 2 unsoakable Physical Damage each round. Resolve armor and damage using the
          system; do not silently add regeneration, immunity, contagious claw wounds or a new infection
          rule. Ordinary flickering fluorescent light provides visibility and discomfort, not UV damage. It
          is night, so opening the curtains admits no sunlight.</p><p><strong>Before the first
          strike:</strong> give the scrape and a glimpse of his shape; allow the system’s normal awareness,
          fear and initiative procedures. Darkness affects perception by normal rules, without automatic
          surprise. In the first exchange he drops toward the nearest exposed wounded person, including
          Graf; an investigator who interposes becomes the immediate obstacle. He claws, grapples and tries
          to get blood. Describe the first ineffective bullet or impossible burst of strength clearly so the
          players can change tactics. He is newly transformed, frightened and ravenous; he has no elder
          discipline or tactical omniscience.</p><p><strong>Useful actions:</strong> drag Graf into the
          theatre and secure its door; cover the surviving nurse’s exit east toward the lift; illuminate a
          specific hiding position; interpose a trolley as an obstacle; concentrate force; or fall back
          behind a door while calling support. Use the visible BM04 doors and corridor. Do not require
          vampire weapons the cell never had a chance to acquire. The guard has ordinary equipment and
          follows their practical instructions; he does not solve the battle.</p><p><strong>Pressure and
          exit:</strong> at the first serious wound, or when the party holds the corridor and denies access
          to victims, Hausmann switches from feeding to flight. Telegraph his glance toward the exterior
          window in room 3.14. He must cross the mapped corridor, enter that room, break its window and
          climb/drop toward the wooded slope. Moving there and breaking glass use normal actions;
          investigators may intercept, shoot, obstruct or pursue. Use the glass-break sting only when it
          happens. If the map does not mark a window, identify this room’s exterior-wall window aloud before
          play; it is an environmental feature, not a secret passage.</p><p><strong>End states:</strong> if
          killed by resolved damage, he stays dead; if he reaches the window and gets clear, record an
          escaped vampire, last sighting and a separate containment request to Petra. He leaves no automatic
          ash pile. Do not force escape when the party blocks it or keep him alive after a legitimate kill.
          A clever successful restraint is also honored. If the cell retreats, he seeks the night through
          that same route rather than pursuing a compulsory total-party kill. Injuries carry forward;
          stabilize the living before the explanation. No extra vampire arrives.</p><p>Share
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.6unFKeGTeIyiNa9Q]{I59 — Ward
          Three — Incident Record} only after the participants’ observations are compiled. I30 is an
          obtainable retained security frame after the breach, not a live omniscient view or a photo of
          every casualty. If prior precautions prevented this attack, document that branch and retain a
          contained encounter instead of manufacturing the dead intern.</p><h3>Scene 4 — Graf’s account:
          connect the payment to the treatment</h3><p><strong>DA assets:</strong>
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.jP9jheucndZOEHLE]{TM08 —
          Theatre refuge} ·
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-npcs.Actor.r5cnyNNmckVLRsOl]{Dr. Elizabeth
          Graf} · @UUID[Compendium.neon-relic-mission-sangreal.sangreal-sfx.Playlist.wxpL4Q4Ozfnvh71z]{Sound
          playlist}</p><p><strong>Powered clinical area hum</strong> <audio controls preload="none"
          src="modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-corridor-hum.mp3"></audio> <a
          href="modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-corridor-hum.mp3">Open sound</a>.
          Keep beds quiet; stings only when the described event occurs.</p> <p>Once there is a safe place to
          speak, Graf opens the clinical folder in her office or the theatre refuge. She wants two
          assurances: staff and patient will have a named care plan, and a duplicate record will survive
          outside the clinic under an accountable custodian. “We will have Petra arrange medical support,
          leave a named person covering the ward, and lodge a copy with the Covenant medical coordinator” is
          a concrete answer. A verified callback makes the promise credible. She accepts another comparably
          practical arrangement.</p> <blockquote><p>“At first the pain stopped. His cancer findings receded
          faster than anything I have seen. I thought we had saved him. Then his temperature fell. Light
          injured his skin. He began asking for blood. Today he tore into us. Corvi opened the case in front
          of me. Twelve small vessels in fitted recesses. No cup, no chalice. The one he handed me contained
          blood. Hausmann had paid for a chance, and I wanted to believe we could give him one. The
          instructions told me how to preserve it. They did not establish that it was safe to inject. I
          signed anyway.”</p></blockquote> <p>She provides the essential treatment facts in conversation
          before negotiating custody of physical slides. Show the existing
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.VMoT17MWZ543rWHe]{I29 — The
          Injection Log} chart, then give S2 as her separate, signed clarification. The photograph visibly
          provides the batch, sponsor, room 3.14, witness signature and initial G; its patient and time
          boxes are blank. It cannot, by itself, prove whose injection occurred when.</p> <div
          class="handout"><h4>S2 — Graf’s treatment and custody statement</h4><p>Persistent clue card:
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.8SS0DFQjCYTpMvCF]{I51 — Graf’s
          treatment and custody statement}.</p><p><strong>Patient:</strong> Kurt Hausmann, file 09-H, room
          3.14.<br><strong>Supplier:</strong> Monsignor Matteo Corvi, who brought a closed metal case to
          Sonnenberg.<br><strong>Funding reference:</strong> the Hausmann arrangement described in the
          supplied Geneva escrow papers; clinic sponsorship references the Vaduz
          trust.<br><strong>Procedure:</strong> one phial of blood administered intravenously at [actual
          date and time].<br><strong>Preparation label:</strong> PROGENITOR VECTOR — BATCH
          XII-1/12.<br><strong>Custody:</strong> Corvi released one vessel for this procedure and retained
          the other eleven.<br><strong>Clinical material retained:</strong> patient samples and residue from
          the used vessel and apparatus; no second intact phial retained.<br><strong>Outcome observed to
          date:</strong> [only the findings that have occurred].<br><strong>Supplier’s last known
          position:</strong> departed with case; reception holds his forwarding contact.<br>Elizabeth Graf —
          [signature, date and time].</p></div> <p>Graf personally saw the inventory when Corvi released one
          vessel. She can testify to eleven remaining at that moment; she cannot guarantee he has not
          changed it since departure. A later case inspection is the stronger current count. All slides,
          residue tests and clinical samples come from the same first administration. They do not consume a
          second phial.</p> <h4>The Grail assumption breaks here</h4><p>If the party asks “Where is the
          Grail?”, Graf answers: “If you mean a vessel to drink from, I never saw one. I saw twelve sealed
          portions of blood. Corvi called that the reserve. Ask him why Rome calls it Sangreal.” She shows
          the used vessel and apparatus only under the acquired handling precautions, or their documented
          record if the material has already been secured. The physical object they were chasing was a case
          of blood, and its use made this man a vampire. That establishes the practical truth without
          declaring Christ’s biography or the blood’s ultimate origin proved.</p><p><h4>Claudia’s breakdown
          — Sang real</h4><p>Let the table absorb Graf’s account before Claudia speaks. She sits abruptly,
          misses the chair arm with one hand, and grips her rosary so tightly that the beads press into her
          palm. Her voice almost fails on the familiar words. Play this as a convincing crisis of faith from
          their trusted companion, without winks or suspicious emphasis.</p><blockquote><p>“No. We were
          looking for a cup. San greal. But sang real… royal blood. His blood.” She looks toward the closed
          ward door. “The blood of Christ. And that man became… Dear God. ‘This is my blood. Take and
          drink.’ What have we been saying all these centuries?”</p></blockquote><p>She cannot finish the
          prayer. Give the investigators space to comfort her, challenge the conclusion or say it
          themselves: Christ carried vampiric blood; the Eucharist now sounds horrifyingly literal. Claudia
          finally says, “Then we have to find the rest. Before anyone else opens it. We must take it home.”
          She supports sealed recovery to the Vatican under the authority already employing the
          cell.</p><p><strong>DA only:</strong> this is an excellent performance that directs their fear
          toward recovering the reserve; her hidden loyalties and later choice remain private. Her claim is
          the intended revelation the party now believes, not laboratory proof of Christ’s biology or a
          premature disclosure of the later inversion. Do not call the wordplay a verified historical
          etymology. Graf answers, “I can tell you what it did to Hausmann. I cannot tell you whose blood it
          was.” If asked directly about Claudia’s sincerity, use normal social procedures and her
          established knowledge; no automatic allegiance disclosure or immunity to scrutiny.</p><p>Give
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.RTpfAUySCSTXB4G0]{I60 —
          Sonnenberg Debrief — Blood and the Remaining Case} after the discussion, clearly attributing
          clinical facts to Graf and the sacred interpretation to Claudia. Graf then points to reception’s
          retained Lingotto message: Corvi took the remaining eleven phials toward Turin. Recovering them
          sealed and returning them to the Vatican is the immediate proposed mission; the cell may insist on
          accountable custody and copies of the clinical record.</p></p><h4>Questions Graf can actually
          answer</h4> <table><thead><tr><th>Question</th><th>Answer</th><th>Evidence or next
          action</th></tr></thead><tbody> <tr><td>“Why was Corvi here?”</td><td>To supply blood for
          Hausmann’s experimental treatment, whose funding was arranged through Geneva. Graf knowingly
          accepted inadequate evidence of safety.</td><td>S1, S2,
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.lOsCniEBTy2c974w]{I06 — The
          Escrow Transfer Slip} and
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.VMoT17MWZ543rWHe]{I29 — The
          Injection Log} connect visitor, patient, money and batch.</td></tr> <tr><td>“Did it
          work?”</td><td>After treatment, the cancer findings rapidly improved while physiology
          deteriorated. She dates each observation and relates it to the
          injection.</td><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.SilYzv6luOt5X6Am]{I07
          — Patient File 09-H}’s existing entries,
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.p51PQ2RP2raSDBHp]{I27 — Intake
          Photograph, 09-H} baseline and
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.1dPSK2h5z6DX5Eab]{I28 —
          Photophobia Test 02:40} only if the documented light injury occurred.</td></tr> <tr><td>“What is
          it doing?”</td><td>Her slides suggest an invasive process replacing normal marrow. She calls it a
          foreign graft as a working description. She cannot identify its ancient origin from a
          microscope.</td><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.D18a1YRCEQu27KHw]{I09
          — Histopathology Log: Marrow Graft} photograph and her accompanying analysis. Keep observed
          changes distinct from her hypothesis.</td></tr> <tr><td>“Why did Corvi leave?”</td><td>The
          deterioration frightened him. He said he needed someone who could protect the remaining case from
          Rome and took a call to his Turin contact. Graf told him she needed a way to report Hausmann’s
          condition.</td><td>She directs them to S3 at reception. Reception retained the contact for a
          medical update.</td></tr> <tr><td>“Can we reverse it? What happens to a vampire?”</td><td>She has
          no demonstrated reversal and no verified vampire recipient in this clinic. She will preserve
          findings for specialist review.</td><td>The complete CT1 account requires Corvi’s historical
          material and later exposure evidence. Do not hand over an omniscient diagnosis.</td></tr>
          <tr><td>“How do we handle the remaining material?”</td><td>She retained the supplier’s storage
          instructions: darkness, treated linen, lead-antimony shielding, below 4°C. This is a handling
          protocol, not proof of treatment safety.</td><td>Give
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.9NpgA6XbC6AKGYEY]{I16 — The
          Quiescence Formula (CT3)} through Graf’s supplied instruction leaf. Petra can now request the
          specified kit.</td></tr> <tr><td>“Does it affect people nearby?”</td><td>Only if logged or
          witnessed: sick people worsened or felt drawn toward the unshielded preparation; shielding ended
          the episode. Graf cannot infer an exact radius from that observation.</td><td>Record the actual
          observation. Reveal the full
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.dypD1aQAOBWpTyg0]{I11 — The
          Resonance Field (CT2)} synthesis only after corroboration; no nearby person is forced to
          drink.</td></tr> </tbody></table> <h4>Searchable evidence: where it is and how it helps</h4>
          <table><thead><tr><th>Place and access</th><th>Give</th><th>What it
