          href="modules/neon-relic-mission-sangreal/assets/audio/sfx/sfx-rail-corridor.mp3">Open sound</a>.
          Keep beds quiet; stings only when the described event occurs.</p> <figure><img
          src="modules/neon-relic-mission-sangreal/assets/art/scenes/totm/tm-rail.webp" alt="The
          investigators’ train compartment" style="width:100%;height:auto"><figcaption>Leaving Rome — use TM16
          for the journey.</figcaption></figure> <blockquote><p>The rhythm changes as the train clears the
          city. Reflections replace the lights outside. On the small compartment table lie the papers you
          brought out of Rome; whenever the carriage moves, someone has to put a hand on them. Geneva is
          ahead. What you still need is a person there who will answer you.</p></blockquote> <p><strong>Start
          at the table’s present position.</strong> The train has already departed. Ask each investigator
