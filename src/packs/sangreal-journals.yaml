          duplicate records, a counsel contact and a hotel or transport arrangement if he accepts. She records
          exactly what protection was promised.</td><td>Covenant witness support. A duplicate can be
          read/telexed now; physical originals need a courier or remain with the cell.</td></tr>
          </tbody></table> <p><strong>Petra cannot supply:</strong> a patient chart, an injection time, an
          exact remaining-phial count, vampire mechanics, clandestine surveillance photos or proof of current
          occupancy merely because the players ask HQ. Those answers belong to named witnesses, obtained
          records or direct observation. She can make the request and report its result. Public background,
          routing and an introduction do not consume separate shifts.</p> <p>Send
          @UUID[Compendium.neon-relic-mission-sangreal.sangreal-clues.Item.jkM2vcnrfoWRsfMI]{I48 — Petra Fax —
          Sonnenberg Contact and Route} after the directory/visitor inquiry, with the actual appointment and
