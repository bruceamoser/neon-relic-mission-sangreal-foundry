    - name: Investigator Photos — GM Index
      type: text
      text:
        content: >
          <h2>Investigator Photos — GM Index</h2>

          <p><strong>DA eyes only.</strong> Twenty-four optional snapshots the investigators may take while
          working the case: sixteen ordinary photographs and eight visible observations. They are records, not
          clues — none of them carries a hidden symbol, a message, or evidence the case depends on, and none
          replaces a detailed information card. Hand one over only when a player actually photographs that
          subject, with the access and timing its own GM note describes. The walkthrough's <em>If the
          investigators take photographs:</em> cues sit at the beats where each subject is reachable.</p>

          <p><strong>Mundane</strong> tells nothing beyond what is visible. <strong>Observation</strong> shows
          something worth noticing — damage, displacement, blackout, an empty hangar — but the photograph
          never establishes cause, perpetrator, timing or intent. The detailed cards keep their own
          examination requirements and deductions: I01 for the relay cradle, I15/I39/I45 for the aircraft, I20
          for the drilled safe.</p>

          <table>
            <thead><tr><th style="width:28%">Location</th><th>Photograph</th><th style="width:14%">Type</th></tr></thead>
            <tbody>
              <tr><td>Vatican / Vault IX (L1)</td><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.xbQZgy0hY46bSstX]{C01 — Gate and wet paving}</td><td>mundane</td></tr>
              <tr><td></td><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.i25Abf2EuijkRk8O]{C02 — Refrigeration pipes}</td><td>mundane</td></tr>
              <tr><td></td><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.fSDtZMcDsd07gqaY]{C03 — Damaged copper coil}</td><td>observation</td></tr>
              <tr><td></td><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.g5lsJIx2eJvMkI7v]{C22 — Priest in the passage} (Ghiberti)</td><td>mundane</td></tr>
              <tr><td></td><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.SW0k0q32vBGhnPUB]{C24 — Escort at the lift gate} (Claudia)</td><td>mundane</td></tr>
              <tr><td>Corvi's quarters (L2)</td><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.uF1PuP1wOZLUKqfS]{C04 — Shelves beside the window}</td><td>mundane</td></tr>
              <tr><td></td><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.EJPrt7xGBfHvjKwF]{C05 — Open desk drawers}</td><td>observation</td></tr>
              <tr><td></td><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.5XvaBvFzINiSPrbH]{C06 — Drilled safe lock}</td><td>observation</td></tr>
              <tr><td>Geneva bank (L3)</td><td>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-investigator-photos.Item.9ZDZIVJTYRghESz4]{C07 — Bank waiting area}</td><td>mundane</td></tr>
