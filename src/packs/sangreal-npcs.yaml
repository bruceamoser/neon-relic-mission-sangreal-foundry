      <h3>At the table</h3><p><strong>Look.</strong> Exhausted physician holding a slide box; first asks who
      will move the remaining staff.</p><p><strong>Wants.</strong> Protect survivors and keep an accountable
      medical record without enabling another experiment.</p><p><strong>Knows.</strong> She can document the
      human outcome and hypothesize the mechanism. She cannot prove ancient theology or guarantee a safe
      reversal.</p><blockquote><p>“It proves what happened to this patient. I will not sign anything
      else.”</p></blockquote><h3>When the cell changes the situation</h3><p>Concrete evacuation and
      independent custody of her record earn cooperation. She may keep a backup slide, but she does not demand
      that every useful record be burned.</p><p>She hides or seeks another protector. A successful rescue
      prevents her later death in a scheduled raid.</p><h3>Existing combat profile</h3> <p>Non-combatant.
      Threatens to burn the lab records if cornered; she means it.</p>
