# Mission: Sangreal — Cast & Antagonists (Actor pack)
# Actors: npc, mob
# Source: docs/mission-sangreal-design-guide.md §8
---

- _id: sangreal-npc-corvi
  name: 'Monsignor Matteo Corvi'
  type: npc
  img: modules/neon-relic-mission-sangreal/assets/art/portraits-clean/np01.webp
  prototypeToken:
    texture:
      src: modules/neon-relic-mission-sangreal/assets/art/npc-corvi.webp
  system:
    tier: 2
    description: >
      <h3>Psychological Profile</h3>
      <p>An ecclesiastical historian consumed by religious dread. Translating the Ebionite
      fragments revealed that the Eucharist was a biological deterrent rather than
      spiritual grace. He stole the case to prevent its weaponization — and is wracked by
      hematological fevers from sleeping near it, convinced he has triggered the end of
      days.</p>
      <h3>Social Mechanics</h3>
      <p>Guarded (Difficulty 2). Hostile approaches or claims of representing the Holy
      Alliance cause him to destroy his notes. Demonstrating independent custodial
      credentials and citing Ebionite theology shifts his disposition to Open (+1),
      prompting him to surrender his research and the attaché.</p>
      <h3>Combat Profile</h3>
      <p>Non-combatant. Carries an antique .32 caliber revolver with five rounds,
      suffering a -2 penalty on all firearms checks.</p>
    attributes:
      str: 2
      agi: 2
      wit: 5
      emp: 4
    skills:
      lore: 5
      investigate: 4
      firearms: 1
    armorRating: 0
    fearRating: 0
    disposition: 2
    corruptionStage: 2
    tags:
      - sangreal
    secret: 'He knows the blood is a cure, not a sacrament — and that both institutions would kill to control it.'
    goal: 'Bury the phials where no institution can ever reach them.'
    positiveResult: 'Talks: I10, I11, I12. Surrenders the steel attaché.'
    negativeResult: 'Destroys his notebook and flees deeper into the Lingotto works.'

- _id: sangreal-npc-vane
  name: 'Sister Claudia Vane'
  type: npc
  img: modules/neon-relic-mission-sangreal/assets/art/portraits-clean/np02.webp
  prototypeToken:
    texture:
      src: modules/neon-relic-mission-sangreal/assets/art/npc-vane.webp
  system:
    tier: 3
    description: >
      <h3>Psychological Profile</h3>
      <p>Outwardly a devout scholar of early Christian art; inwardly an intelligence
      asset trained by the Talamasca Motherhouse in Amsterdam. She believes the phials
      contain a demonic plague that must be destroyed to safeguard humanity. She views the
      Covenant cell as expendable muscle to locate Corvi — before extracting the case for
      incineration.</p>
      <h3>Social Mechanics</h3>
      <p>Deceptive / Professional. Handles border guards and ecclesiastical authorities
      with diplomatic poise. Divers inquiries toward mundane criminal syndicates or rogue
      Soviet laboratories to obscure preternatural activity. Her tells are stillness, not
      nerves — she is never surprised, only delayed.</p>
      <h3>Combat Profile</h3>
      <p>Trained in defensive hand-to-hand combat (AGI 3, brawl 2). Carries The Veil of
      Veronica's Thread and a concealed Beretta 70. Will not fight to win — only to
      escape with the case.</p>
    attributes:
      str: 2
      agi: 3
      wit: 4
      emp: 4
    skills:
      brawl: 2
      firearms: 3
      lore: 4
      manipulate: 4
      investigate: 2
    armorRating: 0
    fearRating: 0
    disposition: 3
    corruptionStage: 1
    tags:
      - sangreal
    secret: 'Deep-cover operative of Talamasca Registry 16 — and her Order''s hidden elders are vampires.'
    goal: 'Deliver the steel attaché to the Novara airstrip for transport and incineration.'
    positiveResult: 'Believed, trusted, and followed — until the Thread snaps.'
    negativeResult: 'Exposed early: she burns her cover, then the case, then the bridges.'

- _id: sangreal-npc-sabbatini
  name: 'Cardinal Enrico Sabbatini'
  type: npc
  img: modules/neon-relic-mission-sangreal/assets/art/portraits-clean/np03.webp
  prototypeToken:
    texture:
      src: modules/neon-relic-mission-sangreal/assets/art/npc-sabbatini.webp
  system:
    tier: 3
    description: >
      <h3>Psychological Profile</h3>
      <p>A ruthless ecclesiastical statesman shaped by Cold War intelligence operations.
      He treats the vampire dynasties as a biological reality held in check through
      deterrence. He views the Covenant as an external tool to be hired, manipulated, and
      discarded if it uncovers the truth.</p>
      <h3>Social Mechanics</h3>
      <p>Imperious / Hostile (Difficulty 4). Treats investigators with condescending
      authority until confronted with undeniable forensic proof of the Talamasca
      infiltration and Claudia's death — at which point he pivots to cynical cooperation
      and the Concordat Requisition.</p>
      <h3>Combat Profile</h3>
      <p>Non-combatant. Protected by a personal security detail of three plainclothes
      Swiss Guard officers equipped with submachine guns and phosphorus munitions.</p>
    attributes:
      str: 2
      agi: 2
      wit: 5
      emp: 3
    skills:
      command: 5
      manipulate: 4
      lore: 3
      investigate: 2
    armorRating: 0
    fearRating: 0
    disposition: 4
    corruptionStage: 0
    tags:
      - sangreal
    secret: 'The Vatican has blackmailed the vampire houses for centuries — the cure is the leash.'
    goal: 'Retain the deterrent, or ensure no one else can ever hold it.'
    positiveResult: 'Signs the Concordat Requisition Order: diplomatic cover, weapons clearances, funding.'
    negativeResult: 'Disposes of the Covenant as a loose end and calls in the sanitization squad.'

- _id: sangreal-npc-graf
  name: 'Dr. Elizabeth Graf'
  type: npc
  img: modules/neon-relic-mission-sangreal/assets/art/portraits-clean/np04.webp
  prototypeToken:
    texture:
      src: modules/neon-relic-mission-sangreal/assets/art/npc-graf.webp
  system:
    tier: 1
    description: >
      <h3>Psychological Profile</h3>
      <p>Chief Pathologist at Privatklinik Sonnenberg. She administered the injection to
      Hausmann believing it was an unlicensed gene-therapy protocol funded by an overseas
      trust. She is traumatized, barricaded in an operating theater, and determined to
      destroy her own research before it kills anyone else.</p>
      <h3>Social Mechanics</h3>
      <p>Hysterical / Panicked (Difficulty 2). Shifting her disposition to Open requires
      first-aid treatment, light discipline, or calming psychiatric intervention — in that
      order of practicality. She will not leave without her slides.</p>
      <h3>Combat Profile</h3>
      <p>Non-combatant. Threatens to burn the lab records if cornered; she means it.</p>
    attributes:
      str: 2
      agi: 2
      wit: 4
      emp: 3
    skills:
      healPhysical: 3
      investigate: 3
      psychoanalyze: 1
    armorRating: 0
    fearRating: 1
    disposition: 2
    corruptionStage: 0
    tags:
      - sangreal
    secret: 'She kept one slide — the only surviving sample of the vector outside the phials.'
    goal: 'Burn her research, then disappear with her family before the clinic''s owners find her.'
    positiveResult: 'Calmed and rescued: I7, I9, I10 — and a witness who can testify to the False Revelation.'
    negativeResult: 'Panics and destroys the histopathology log; the vector remains unproven.'

- _id: sangreal-npc-hausmann
  name: 'Kurt Hausmann (The Feral Banker)'
  type: npc
  img: modules/neon-relic-mission-sangreal/assets/art/portraits-clean/np05.webp
  prototypeToken:
    texture:
      src: modules/neon-relic-mission-sangreal/assets/art/npc-hausmann.webp
  system:
    tier: 4
    description: >
      <h3>Psychological Profile</h3>
      <p>Formerly an elderly Swiss private banker suffering from terminal lymphoma.
      Ingesting the blood cured his cancer within forty-eight hours, but his ordinary
      marrow could not regulate the progenitor counter-agent. The resulting mutation
      destroyed his higher reasoning, leaving a feral predator driven by hematological
      hunger and photophobic agony.</p>
      <h3>Tactical Profile</h3>
      <p>STR 5, AGI 4, WIT 2, EMP 1; Armor Rating 2 (mutated somatic tissue — ballistic
      weapons inflict half damage unless targeting the brainstem). <strong>Blood
      Frenzy</strong> grants +2 dice on close-combat attacks against wounded targets.
      Direct sunlight or focused ultraviolet light inflicts 2 unsoakable Physical Damage
      per round. Fear Rating 2.</p>
      <h3>Director Notes</h3>
      <p>He hunts from the shadows and speaks in fragments of banking German. He is the
      False Revelation made flesh — the walking proof that the blood creates predators
      when the body cannot process it. Killing him is a mercy the cell will not believe
      until the histopathology slides.</p>
    attributes:
      str: 5
      agi: 4
      wit: 2
      emp: 1
    skills:
      brawl: 4
      sneak: 3
      force: 3
    armorRating: 2
    fearRating: 2
    escalatedFearRating: 3
    disposition: 5
    corruptionStage: 3
    tags:
      - sangreal
    secret: 'His altered marrow is itself a vector — any blood contact spreads CT1.'
    goal: 'Feed. Hide from the light. Feed again.'
    positiveResult: 'Subdued or destroyed: the Sonnenberg ward is secured and the medical sequence recovered.'
    negativeResult: 'Escapes into the Zurichberg forest — a new predator loose above a city of four hundred thousand.'

- _id: sangreal-npc-ghiberti
  name: 'Father Ghiberti'
  type: npc
  img: modules/neon-relic-mission-sangreal/assets/art/portraits-clean/np06.webp
  prototypeToken:
    texture:
      src: modules/neon-relic-mission-sangreal/assets/art/npc-ghiberti.webp
  system:
    tier: 1
    description: >
      <h3>Psychological Profile</h3>
      <p>Nervous Curial archivist and keeper of the Vault IX register. Precise to the
      point of ritual, and currently terrified: he knows the register was doctored in the
      weeks before the theft and cannot prove by whom. He wants this inquiry to end
      before it reaches his desk.</p>
      <h3>Social Mechanics</h3>
      <p>Anxious / Cooperative (Difficulty 2). Reassurance and respect for the archive
      open him up; pressure makes him hide behind procedure. He is the doorway to I1, I3,
      and I16 — and to the fact that Corvi requested the Lodestone's index card nine days
      before the breach.</p>
      <h3>Combat Profile</h3>
      <p>Non-combatant. Will not fight. Will absolutely relock a door behind himself.</p>
    attributes:
      str: 2
      agi: 2
      wit: 4
      emp: 3
    skills:
      lore: 4
      investigate: 3
    armorRating: 0
    fearRating: 1
    disposition: 2
    corruptionStage: 0
    tags:
      - sangreal
    secret: 'The vault register has two pages missing — removed before the theft, not after.'
    goal: 'Survive the inquiry without being blamed for the breach.'
    positiveResult: 'Speaks freely: I1 and I3, and permission for a supervised vault inspection.'
    negativeResult: 'Retreats into procedure; the register is "under review" for the rest of the case.'

- _id: sangreal-npc-mercier
  name: 'Jean-Paul Mercier'
  type: npc
  img: modules/neon-relic-mission-sangreal/assets/art/portraits-clean/np07.webp
  prototypeToken:
    texture:
      src: modules/neon-relic-mission-sangreal/assets/art/npc-mercier.webp
  system:
    tier: 1
    description: >
      <h3>Psychological Profile</h3>
      <p>Senior vault clerk at Union de Banques Suisses, Geneva. Immaculate suit, manicured
      hands, and the specific pallor of a man who has read transaction memos he was never
      supposed to understand. He has a family, a mortgage on the Rue du Rhône, and no
      appetite for martyrdom on behalf of clients he despises.</p>
      <h3>Social Mechanics</h3>
      <p>Anxious / Bribable (Difficulty 2). Money works; so does a credible threat of
      Swiss banking regulators. Violence closes him completely — and trips the silent
      alarm under his desk.</p>
      <h3>Combat Profile</h3>
      <p>Non-combatant. One punch will produce a lawsuit, not a fight.</p>
    attributes:
      str: 1
      agi: 2
      wit: 3
      emp: 2
    skills:
      lore: 3
      investigate: 2
    armorRating: 0
    fearRating: 0
    disposition: 2
    corruptionStage: 0
    tags:
      - sangreal
    secret: 'He kept a carbon of the transfer memo — the only copy outside the bank archive.'
    goal: 'Keep his job, his pension, and his kneecaps.'
    positiveResult: 'Yields I6 and booth 4409-C access; unlocks the Zurich corridor.'
    negativeResult: 'Calls bank security; the locker is resealed under judicial order.'

- _id: sangreal-npc-entita-operative
  name: "L'Entità Sanitization Operative"
  type: npc
  img: modules/neon-relic-mission-sangreal/assets/art/portraits-clean/np08.webp
  prototypeToken:
    texture:
      src: modules/neon-relic-mission-sangreal/assets/art/npc-entita-operative.webp
  system:
    tier: 4
    description: >
      <h3>Psychological Profile</h3>
      <p>Plainclothes Swiss Guard commando, detailed to <em>L'Entità</em> for operations
      the Vatican will never acknowledge. Professional, silent, clinical. Calls the
      Covenant cell "the consultants" and treats their deaths as administrative
      housekeeping.</p>
      <h3>Combat Profile</h3>
      <p>Equipped with a compact submachine gun, phosphorus grenades, and concealed
      body armor (AR 2). Operates in a three-officer team with practiced crossfire
      discipline. They are not here to arrest anyone.</p>
      <h3>Director Notes</h3>
      <p>Deploys at O1 Milestone 3 (Holy Crusade). The sanctimony is the point: they
      believe they are protecting the world from the truth. Give the cell one warning
      — in impeccable German — before the first grenade.</p>
    attributes:
      str: 3
      agi: 4
      wit: 3
      emp: 1
    skills:
      firearms: 4
      brawl: 3
      sneak: 3
      command: 2
    armorRating: 2
    fearRating: 0
    disposition: 5
    corruptionStage: 0
    tags:
      - sangreal
    secret: 'Under orders to sanitize any witnesses — including clergy.'
    goal: 'Recover or destroy the phials. Leave no trace that the Vatican was involved.'
    positiveResult: 'Repelled: the squad withdraws to report the cell to L''Entità as a confirmed liability.'
    negativeResult: 'The cell is captured, debriefed, and quietly discredited.'

- _id: sangreal-npc-basarab-operative
  name: 'Basarab Retrieval Operative'
  type: npc
  img: modules/neon-relic-mission-sangreal/assets/art/portraits-clean/np09.webp
  prototypeToken:
    texture:
      src: modules/neon-relic-mission-sangreal/assets/art/npc-basarab-operative.webp
  system:
    tier: 4
    description: >
      <h3>Psychological Profile</h3>
      <p>An ancient vampire of the Basarab retrieval pack — not feral, not starving, and
      entirely certain of its own superiority. It speaks three dead languages and treats
      mortals the way old money treats furniture. It has waited four centuries for a
      reason to visit Italy; this is the errand that finally mattered.</p>
      <h3>Tactical Profile</h3>
      <p>Controlled predator: STR 4, AGI 4, WIT 4, EMP 2; Armor Rating 2 (half damage
      from ballistics unless the brainstem is targeted); Fear Rating 3. Moves silently on
      vertical surfaces. Suffers no agitation in darkness and no resistance to fire.</p>
      <h3>The One Fear</h3>
      <p><strong>CT1.</strong> Contact with phial blood is final death — necrotic stasis
      breaks and centuries of senescence arrive in seconds, leaving calcified ash. This
      is why the pack executes Claudia and takes the case by hand at a distance, and why
      one operative's dropped guard at Novara left two fingers on the tiles.</p>
    attributes:
      str: 4
      agi: 4
      wit: 4
      emp: 2
    skills:
      brawl: 4
      sneak: 3
      command: 2
      firearms: 2
    armorRating: 2
    fearRating: 3
    disposition: 5
    corruptionStage: 3
    tags:
      - sangreal
    secret: 'The cure is the only thing their bloodline has ever feared — and they will incinerate it to stay unafraid.'
    goal: 'Take the vessels to the Carpathian facility and burn the cure.'
    positiveResult: 'Killed or turned: the Novara timeline breaks — Mission 2 becomes a recovery instead of a chase.'
    negativeResult: 'Reaches the aircraft. Ten phials leave Italy and the campaign detonates.'

- _id: sangreal-mob-feralghouls
  name: 'Feral Ghouls'
  type: mob
  img: modules/neon-relic-mission-sangreal/assets/art/npc-feral-ghoul.webp
  prototypeToken:
    texture:
      src: modules/neon-relic-mission-sangreal/assets/art/npc-feral-ghoul.webp
  system:
    memberCount: 3
    memberHP: 3
    bestPool: 6
    templateNPC: 'Feral Ghoul'
    description: >
      <p><strong>Origin.</strong> When a phial fractures in darkness (Phial Fracture
      table, result 5), dead tissue within Short range reanimates. The husks last 1d6
      hours — long enough to be someone's problem — and move in twitching, jointless
      lunges toward warmth and blood.</p>
      <p><strong>Behavior.</strong> Mindless, predatory, and attracted to open wounds.
      They do not flee fire, but they recoil from the phosphorus-bright light that killed
      them once already: focused UV and direct sunlight scorch them at the same rate as
      the vector's living cousins (2 unsoakable Physical per round).</p>
      <p><strong>Mob rules.</strong> Treat the pack as a single shared-pool opponent
      (3 members, Best Pool 6, +2 bonus dice). Every member destroyed reduces the pool;
      the last one standing still lunges.</p>

- _id: sangreal-npc-basarab-elder
  name: 'Basarab Elder'
  type: npc
  img: modules/neon-relic-mission-sangreal/assets/art/portraits-clean/np10.webp
  prototypeToken:
    texture:
      src: modules/neon-relic-mission-sangreal/assets/art/npc-basarab-elder.webp
  system:
    tier: 4
    description: >
      <h3>Psychological Profile</h3>
      <p>The retrieval pack's leader, and the reason the Novara strike was over in
      minutes. Ancient, patient, physically overwhelming — it has outlived dynasties and
      treats the Covenant as a curiosity it may inspect once the cure is ash. It does not
      monologue; it does not need to.</p>
      <h3>Tactical Profile</h3>
      <p>STR 5, AGI 4, WIT 5, EMP 3; Armor Rating 3 (half damage from ballistics unless
      the brainstem is targeted); Fear Rating 3. Moves unscented and silent. Direct
      sunlight inflicts 3 unsoakable Physical per round; it will never be caught in it
      willingly.</p>
      <h3>The Cure</h3>
      <p><strong>CT1 is the elder's only exit.</strong> A single drop of phial blood in
      an open wound ends it: Endure Difficulty 5, and on failure centuries of senescence
      arrive at once, leaving calcified ash and a settlement's worth of questions. It
      knows this. It will not touch the vessels — which is exactly why Mission 2 depends
      on the agents finding a way to make it.</p>
    attributes:
      str: 5
      agi: 4
      wit: 5
      emp: 3
    skills:
      brawl: 5
      sneak: 4
      command: 4
      firearms: 3
      lore: 3
    armorRating: 3
    fearRating: 3
    disposition: 5
    corruptionStage: 3
    tags:
      - sangreal
    secret: 'It remembers the crucifixion as a business dispute — and the cure as a debt it intends to burn.'
    goal: 'Deliver ten intact phials to the Carpathian furnace and end the only threat to its line.'
    positiveResult: 'Destroyed or cured: the Basarab line loses its head and Mission 2 becomes salvage.'
    negativeResult: 'It reaches the Carpathians unopposed — and the feral lineage erupts across Northern Italy.'

- _id: sangreal-npc-gendarme-officer
  name: 'Vatican Gendarme Duty Officer'
  type: npc
  img: modules/neon-relic-mission-sangreal/assets/art/portraits-clean/np11.webp
  prototypeToken:
    texture:
      src: modules/neon-relic-mission-sangreal/assets/art/npc-gendarme-officer.webp
  system:
    tier: 1
    description: >
      <h3>Psychological Profile</h3>
      <p>Sergeant of the Campo Santo Teutonico gate detail — twelve years on the same
      stool, two metres from the logbook. He is not corrupt; he is tired. The night of
      the theft is the first night in years when something did not fit the log.</p>
      <h3>Social Mechanics</h3>
      <p>Guarded / Procedure-bound (Difficulty 2). Respect for the log, an offered
      cigarette, and a promise that the inquiry is aimed at the thieves — not the guard —
      open him. Rank-pulling and threats close him for the rest of the case.</p>
      <h3>Combat Profile</h3>
      <p>Non-combatant in practice. Sidearm on the belt, never drawn inside the cemetery
      in living memory.</p>
    attributes:
      str: 2
      agi: 2
      wit: 3
      emp: 3
    skills:
      investigate: 2
      command: 1
    armorRating: 0
    fearRating: 1
    disposition: 2
    corruptionStage: 0
    tags:
      - sangreal
    secret: 'He logged a second entry at 04:02 — a figure in a raincoat with no name — and said nothing. The last guard who reported an irregularity was reassigned to the warehouse apostolate.'
    goal: 'Finish the shift, keep the log tidy, avoid becoming the story.'
    positiveResult: 'Shows the gate log: two descents that night — Corvi at 03:14, an unnamed visitor at 04:02.'
    negativeResult: 'Repeats only the official version and points the cell at the Swiss Guard archive like everyone else does.'

