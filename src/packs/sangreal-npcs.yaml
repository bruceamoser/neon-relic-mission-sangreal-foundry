    description: >-
      <h3>At the table</h3><p>A cautious clerk worried that his initials will bear sole blame for an
      inadequately reviewed transaction. He knows the escrow, Hausmann, Sonnenberg, Graf’s contact and Corvi’s
      rail/car request. He saw the closed case, never its contents.</p><h3>His bargain</h3><p>Verify the
      inquiry, arrange an independent duplicate of his voluntary account and access to counsel. A concrete
      safeguard wins cooperation without a roll; bluff or pressure uses Manipulate Difficulty 2. Failure adds
      formal verification and delay; the trust officer’s limited-disclosure route remains
      available.</p><blockquote><p>“Record that I supplied the carbon voluntarily. Then I will tell you who
      paid and where the priest asked me to send him.”</p></blockquote><p>Release I06 with the signed bank
      statement, his booking testimony, and I25 on request. Security prints require the manager’s release. If
      asked about Claudia, corroborate the preliminary telephone inquiry she already disclosed on the train:
      no records or medical details were released. There was no physical Geneva visit or concealed
      entry.</p><h3>Existing combat profile</h3><p>Non-combatant. Violence brings bank security and an
      incident report.</p>
