      <h3>Psychological Profile</h3>
      <p>A signals-room lifer who reads magnetometers the way other men read newspapers.
      Precise, dry, and quietly appalled by what the Vault IX readings keep telling him.
      He does not leave his room; there is no need to.</p>
      <h3>Social Mechanics</h3>
      <p>Cooperative / Technical (Difficulty 2). Ask the right question — "was there more
      than one descent that night?" — and he answers it. Ask for "everything" and he sends
      sixty pages and a reading list.</p>
      <h3>Combat Profile</h3>
      <p>Non-combatant. Owns no weapon and would be a hazard with one.</p>
    attributes:
      str: 1
      agi: 2
