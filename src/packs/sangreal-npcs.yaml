# Mission: Sangreal — Cast & Antagonists (Actor pack)
# Actors: npc, mob
# Source: docs/mission-sangreal-design-guide.md §8
---

- _id: sangreal-npc-corvi
  name: 'Monsignor Matteo Corvi'
  type: npc
  img: modules/neon-relic-mission-sangreal/assets/art/portraits-clean/np01.webp
  prototypeToken:
    texture:
      src: modules/neon-relic-mission-sangreal/assets/art/portraits-clean/np01.webp
  system:
    tier: 2
    description: >
      <h3>At the table</h3>
      <p><strong>Look.</strong> Unshaven, three days in the same coat, fever-flushed, praying in Latin under his breath; the closed case within arm's reach.</p>
      <p><strong>Wants.</strong> To be found by the right people and to explain himself to somebody who understands the theology — and to bury the phials where no institution can reach them.</p>
      <p><strong>Will not.</strong> Yield to authority alone. Anything that sounds like the Holy Alliance and he destroys his notebook and runs deeper into the works.</p>
      <p><strong>Knows.</strong> The whole truth of the blood: the Ebionite fragments, the translation, what the twelve phials are, and why the Church built a prison rather than a reliquary. He owns the word as well — <em>San Greal</em> is the Grail everyone knows, <em>Sang real</em> is royal blood, one space moved — and he will say so flatly, without drama, the first time anyone asks him what the case is called. He lectures for an hour if the cell sounds like custodians rather than enforcers — every fact the walkthrough calls the paradigm inversion comes out of his mouth.</p>
      <h3>Psychological Profile</h3>
      <p>An ecclesiastical historian consumed by religious dread. Translating the Ebionite
      fragments revealed that the Eucharist was a biological deterrent rather than
      spiritual grace. He stole the case to prevent its weaponization — and is wracked by
      hematological fevers from sleeping near it, convinced he has triggered the end of
      days.</p>
      <h3>Social Mechanics</h3>
      <p>Guarded (Difficulty 2). Hostile approaches or claims of representing the Holy
      Alliance cause him to destroy his notes. Demonstrating independent custodial
      credentials and citing Ebionite theology shifts his disposition to Open (+1),
      prompting him to surrender his research and the attaché.</p>
      <h3>Combat Profile</h3>
      <p>Non-combatant. Carries an antique .32 caliber revolver with five rounds,
      suffering a -2 penalty on all firearms checks.</p>
    attributes:
      str: 2
      agi: 2
      wit: 5
      emp: 4
    skills:
      lore: 5
      investigate: 4
      firearms: 1
    armorRating: 0
    fearRating: 0
    disposition: 2
    corruptionStage: 2
    tags:
      - sangreal
    secret: 'He knows the blood is a cure, not a sacrament — and that both institutions would kill to control it.'
    goal: 'Bury the phials where no institution can ever reach them.'
    positiveResult: 'Talks: I10, I11, I12. Surrenders the steel attaché.'
    negativeResult: 'Destroys his notebook and flees deeper into the Lingotto works.'

- _id: sangreal-npc-vane
  name: 'Sister Claudia Vane'
  type: npc
  img: modules/neon-relic-mission-sangreal/assets/art/portraits-clean/np02.webp
  prototypeToken:
    texture:
      src: modules/neon-relic-mission-sangreal/assets/art/portraits-clean/np02.webp
  system:
    tier: 3
    description: >
      <h3>At the table</h3>
      <p><strong>Look.</strong> Black habit over a grey under-layer, scuffed leather folio held in both hands, completely still, never surprised.</p>
      <p><strong>Wants.</strong> The case in her hands, and the cell used up getting it there.</p>
      <p><strong>Will not.</strong> Touch the case in front of witnesses, be separated from it, or fight to win — she fights only to escape with it.</p>
      <p><strong>Knows.</strong> Her own orders and the Talamasca's position, sincerely believed. She answers questions about Church procedure instantly and questions about the theft half a beat late, and she never says her handler's name — if the cell mentions Amsterdam in front of Corvi she interrupts, compliments the research and changes the subject.</p>
      <h3>Psychological Profile</h3>
      <p>Outwardly a devout scholar of early Christian art; inwardly an intelligence
      asset trained by the Talamasca Motherhouse in Amsterdam. She believes the phials
      contain a demonic plague that must be destroyed to safeguard humanity. She views the
      Covenant cell as expendable muscle to locate Corvi — before extracting the case for
      incineration.</p>
      <h3>Social Mechanics</h3>
      <p>Deceptive / Professional. Handles border guards and ecclesiastical authorities
      with diplomatic poise. Divers inquiries toward mundane criminal syndicates or rogue
      Soviet laboratories to obscure preternatural activity. Her tells are stillness, not
      nerves — she is never surprised, only delayed.</p>
      <h3>Combat Profile</h3>
      <p>Trained in defensive hand-to-hand combat (AGI 3, brawl 2). Carries The Veil of
      Veronica's Thread and a concealed Beretta 70. Will not fight to win — only to
      escape with the case.</p>
    attributes:
      str: 2
      agi: 3
      wit: 4
      emp: 4
    skills:
      brawl: 2
      firearms: 3
      lore: 4
      manipulate: 4
      investigate: 2
    armorRating: 0
    fearRating: 0
    disposition: 3
    corruptionStage: 1
    tags:
      - sangreal
    secret: 'Deep-cover operative of Talamasca Registry 16 — and her Order''s hidden elders are vampires.'
    goal: 'Deliver the steel attaché to the Novara airstrip for transport and incineration.'
    positiveResult: 'Believed, trusted, and followed — until the Thread snaps.'
    negativeResult: 'Exposed early: she burns her cover, then the case, then the bridges.'

- _id: sangreal-npc-sabbatini
  name: 'Cardinal Enrico Sabbatini'
  type: npc
  img: modules/neon-relic-mission-sangreal/assets/art/portraits-clean/np03.webp
  prototypeToken:
    texture:
      src: modules/neon-relic-mission-sangreal/assets/art/portraits-clean/np03.webp
  system:
    tier: 3
    description: >
      <h3>At the table</h3>
      <p><strong>Look.</strong> A statesman in his own building: heavy, immaculate, at his desk with a dossier in front of him already stamped REGISTRY 16 — AMSTERDAM.</p>
      <p><strong>Wants.</strong> The phials back, the breach unrecorded, and the cure retained as an institutional deterrent.</p>
      <p><strong>Will not.</strong> Apologise, admit the Church banked the sale, or discuss the 1582 order in front of a witness.</p>
      <p><strong>Knows.</strong> Everything the cell has just learned, and more — including that his file on the Talamasca is further along than theirs. He gives it up freely once indisputable forensic proof is on his desk; before that, his register is imperious and hostile (Difficulty 4).</p>
      <h3>Psychological Profile</h3>
      <p>A ruthless ecclesiastical statesman shaped by Cold War intelligence operations.
      He treats the vampire dynasties as a biological reality held in check through
      deterrence. He views the Covenant as an external tool to be hired, manipulated, and
      discarded if it uncovers the truth.</p>
      <h3>Social Mechanics</h3>
      <p>Imperious / Hostile (Difficulty 4). Treats investigators with condescending
      authority until confronted with undeniable forensic proof of the Talamasca
      infiltration and Claudia's death — at which point he pivots to cynical cooperation
      and the Concordat Requisition.</p>
      <h3>Combat Profile</h3>
      <p>Non-combatant. Protected by a personal security detail of three plainclothes
      Swiss Guard officers equipped with submachine guns and phosphorus munitions.</p>
    attributes:
      str: 2
      agi: 2
      wit: 5
      emp: 3
    skills:
      command: 5
      manipulate: 4
      lore: 3
      investigate: 2
    armorRating: 0
    fearRating: 0
    disposition: 4
    corruptionStage: 0
    tags:
      - sangreal
    secret: 'The Vatican has blackmailed the vampire houses for centuries — the cure is the leash.'
    goal: 'Retain the deterrent, or ensure no one else can ever hold it.'
    positiveResult: 'Signs the Concordat Requisition Order: diplomatic cover, weapons clearances, funding.'
    negativeResult: 'Disposes of the Covenant as a loose end and calls in the sanitization squad.'

- _id: sangreal-npc-graf
  name: 'Dr. Elizabeth Graf'
  type: npc
  img: modules/neon-relic-mission-sangreal/assets/art/portraits-clean/np04.webp
  prototypeToken:
    texture:
      src: modules/neon-relic-mission-sangreal/assets/art/portraits-clean/np04.webp
  system:
    tier: 1
    description: >
      <h3>At the table</h3>
      <p><strong>Look.</strong> No sleep, glasses pushed up into her hair, a slide box held against her chest like a shield, and a box of matches she keeps moving further from the slides.</p>
      <p><strong>Wants.</strong> Her research destroyed and her family out of the country.</p>
      <p><strong>Will not.</strong> Leave without her slides — she will burn them rather than hand them over — and she lies once: that she has only the slides in her hands.</p>
      <p><strong>Knows.</strong> The batch numbers, the sponsor account, the six-shift conversion window, and the composition of the quiescence kit on her bench. She is the only NPC who will say the word <em>cure</em> before the Lingotto, and only if the histopathology is already on the table.</p>
      <h3>Psychological Profile</h3>
      <p>Chief Pathologist at Privatklinik Sonnenberg. She administered the injection to
      Hausmann believing it was an unlicensed gene-therapy protocol funded by an overseas
      trust. She is traumatized, barricaded in an operating theater, and determined to
      destroy her own research before it kills anyone else.</p>
      <h3>Social Mechanics</h3>
      <p>Hysterical / Panicked (Difficulty 2). Shifting her disposition to Open requires
      first-aid treatment, light discipline, or calming psychiatric intervention — in that
      order of practicality. She will not leave without her slides.</p>
      <h3>Combat Profile</h3>
      <p>Non-combatant. Threatens to burn the lab records if cornered; she means it.</p>
    attributes:
      str: 2
      agi: 2
      wit: 4
      emp: 3
    skills:
      healPhysical: 3
      investigate: 3
      psychoanalyze: 1
    armorRating: 0
    fearRating: 1
    disposition: 2
    corruptionStage: 0
    tags:
      - sangreal
    secret: 'She kept one slide — the only surviving sample of the vector outside the phials.'
    goal: 'Burn her research, then disappear with her family before the clinic''s owners find her.'
    positiveResult: 'Calmed and rescued: I07, I09, I10 — and a witness who can testify to the False Revelation.'
    negativeResult: 'Panics and destroys the histopathology log; the vector remains unproven.'

- _id: sangreal-npc-hausmann
  name: 'Kurt Hausmann (The Feral Banker)'
  type: npc
  img: modules/neon-relic-mission-sangreal/assets/art/portraits-clean/np05.webp
  prototypeToken:
    texture:
      src: modules/neon-relic-mission-sangreal/assets/art/portraits-clean/np05.webp
  system:
    tier: 4
    description: >
      <h3>At the table</h3>
      <p><strong>Look.</strong> An expensive suit that no longer fits, in a room with the lights killed; still lucid, radiant, and wrong — and he has not slept since the injection.</p>
      <p><strong>Wants.</strong> To understand exactly what was done to him — and then, later, to eat.</p>
      <p><strong>Will not.</strong> Leave the ward, or admit what he has begun to want at night. Press him on it and he answers with perfect courtesy and moves to the far side of the room.</p>
      <p><strong>Knows.</strong> That a Church account arranged the injection, that the man who paid brought the case himself and would not open it, and that the tumours were gone in two days. He volunteers all of it; he cannot explain where the protocol came from.</p>
      <h3>Psychological Profile</h3>
      <p>Formerly an elderly Swiss private banker suffering from terminal lymphoma.
      Ingesting the blood cured his cancer within forty-eight hours, but his ordinary
      marrow could not regulate the progenitor counter-agent. The resulting mutation
      destroyed his higher reasoning, leaving a feral predator driven by hematological
      hunger and photophobic agony.</p>
      <h3>Tactical Profile</h3>
      <p>STR 5, AGI 4, WIT 2, EMP 1; Armor Rating 2 (mutated somatic tissue — ballistic
      weapons inflict half damage unless targeting the brainstem). <strong>Blood
      Frenzy</strong> grants +2 dice on close-combat attacks against wounded targets.
      Direct sunlight or focused ultraviolet light inflicts 2 unsoakable Physical Damage
      per round. Fear Rating 2.</p>
      <h3>Director Notes</h3>
      <p>He hunts from the shadows and speaks in fragments of banking German. He is the
      False Revelation made flesh — the walking proof that the blood creates predators
      when the body cannot process it. Killing him is a mercy the cell will not believe
      until the histopathology slides.</p>
    attributes:
      str: 5
      agi: 4
      wit: 2
      emp: 1
    skills:
      brawl: 4
      sneak: 3
      force: 3
    armorRating: 2
    fearRating: 2
    escalatedFearRating: 3
    disposition: 5
    corruptionStage: 3
    tags:
      - sangreal
    secret: 'His altered marrow is itself a vector — any blood contact spreads CT1.'
    goal: 'Feed. Hide from the light. Feed again.'
    positiveResult: 'Subdued or destroyed: the Sonnenberg ward is secured and the medical sequence recovered.'
    negativeResult: 'Escapes into the Zurichberg forest — a new predator loose above a city of four hundred thousand.'

- _id: sangreal-npc-ghiberti
  name: 'Father Ghiberti'
  type: npc
  img: modules/neon-relic-mission-sangreal/assets/art/portraits-clean/np06.webp
  prototypeToken:
    texture:
      src: modules/neon-relic-mission-sangreal/assets/art/portraits-clean/np06.webp
  system:
    tier: 1
    description: >
      <h3>At the table</h3>
      <p><strong>Look.</strong> Small and precise, cassock and lanyard, reading glasses always to hand; thirty-one years in the same archive.</p>
      <p><strong>Wants.</strong> The breach recorded as a curatorial failure rather than a doctrinal one — and the cell to leave with the file instead of coming back for it.</p>
      <p><strong>Will not.</strong> Open the 1582 brief, name the Prefect, or say the word Sangreal aloud in the stacks. Press him on any of those and he simply stops answering.</p>
      <p><strong>Knows.</strong> That the register card was pulled by hand, that a workshop won a contract in 1964 to build a sealed container for shelf-mark XII-SANG, and that somebody has been re-reading the 1582 file this year. All three for the vault evidence and a written admission.</p>
      <h3>Psychological Profile</h3>
      <p>Nervous Curial archivist and keeper of the Vault IX register. Precise to the
      point of ritual, and currently terrified: he knows the register was doctored in the
      weeks before the theft and cannot prove by whom. He wants this inquiry to end
      before it reaches his desk.</p>
      <h3>Social Mechanics</h3>
      <p>Anxious / Cooperative (Difficulty 2). Reassurance and respect for the archive
      open him up; pressure makes him hide behind procedure. He is the doorway to I01, I03,
      and I16 — and to the fact that Corvi requested the Lodestone's index card nine days
      before the breach.</p>
      <h3>Combat Profile</h3>
      <p>Non-combatant. Will not fight. Will absolutely relock a door behind himself.</p>
    attributes:
      str: 2
      agi: 2
      wit: 4
      emp: 3
    skills:
      lore: 4
      investigate: 3
    armorRating: 0
    fearRating: 1
    disposition: 2
    corruptionStage: 0
    tags:
      - sangreal
    secret: 'The vault register has two pages missing — removed before the theft, not after.'
    goal: 'Survive the inquiry without being blamed for the breach.'
    positiveResult: 'Speaks freely: I01 and I03, and permission for a supervised vault inspection.'
    negativeResult: 'Retreats into procedure; the register is "under review" for the rest of the case.'

- _id: sangreal-npc-mercier
  name: 'Jean-Paul Mercier'
  type: npc
  img: modules/neon-relic-mission-sangreal/assets/art/portraits-clean/np07.webp
  prototypeToken:
    texture:
      src: modules/neon-relic-mission-sangreal/assets/art/portraits-clean/np07.webp
  system:
    tier: 1
    description: >
      <h3>At the table</h3>
      <p><strong>Look.</strong> A wood-panelled viewing booth, three-piece suit, ironed shirt, warm lamp — and a sheen of sweat he cannot control.</p>
      <p><strong>Wants.</strong> The transaction buried, and his own name out of it.</p>
      <p><strong>Will not.</strong> Admit that he erased a ledger line at the buyer's request. Threats of violence close him entirely and trip the alarm beneath the counter.</p>
      <p><strong>Knows.</strong> The account that paid, box 4409-C, the date — and that a nun came in alone afterwards and asked for the same box. He sells the escrow carbon for money, gives up the ledger only under real pressure, and lies once: that he never saw the woman.</p>
      <h3>Psychological Profile</h3>
      <p>Senior vault clerk at Union de Banques Suisses, Geneva. Immaculate suit, manicured
      hands, and the specific pallor of a man who has read transaction memos he was never
      supposed to understand. He has a family, a mortgage on the Rue du Rhône, and no
      appetite for martyrdom on behalf of clients he despises.</p>
      <h3>Social Mechanics</h3>
      <p>Anxious / Bribable (Difficulty 2). Money works; so does a credible threat of
      Swiss banking regulators. Violence closes him completely — and trips the silent
      alarm under his desk.</p>
      <h3>Combat Profile</h3>
      <p>Non-combatant. One punch will produce a lawsuit, not a fight.</p>
    attributes:
      str: 1
      agi: 2
      wit: 3
      emp: 2
    skills:
      lore: 3
      investigate: 2
    armorRating: 0
    fearRating: 0
    disposition: 2
    corruptionStage: 0
    tags:
