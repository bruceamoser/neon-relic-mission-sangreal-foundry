- _id: sangreal-npc-vane
  name: Sister Claudia Vane
  type: npc
  img: modules/neon-relic-mission-sangreal/assets/art/portraits-clean/np02.webp
  prototypeToken:
    texture:
      src: modules/neon-relic-mission-sangreal/assets/art/portraits-clean/np02.webp
  system:
    tier: 3
    description: >-
      <h3>At the table</h3><p><strong>Look.</strong> Practical, attentive liaison; remembers who has not
      eaten and obtains the papers the cell needs.</p><p><strong>Wants.</strong> Destroy what she
      believes will cause renewed predation; initially trusts Registry 16 to do
      it.</p><p><strong>Knows.</strong> She knows her route and orders, not the whole vector. She
      rationalizes “protect the bloodline” as a containment code until independent evidence makes that
      untenable.</p><blockquote><p>“Tell me who will stop them opening it
      again.”</p></blockquote><h3>When the cell changes the situation</h3><p>Proof of her handlers’
      interests plus a credible containment alternative can turn her. Capturing her prevents the
      scripted theft; search can secure her Thread.</p><p>She attempts escape only with opportunity, a
      usable relic, access to the case, and a route. Her survival or death is resolved in
      play.</p><h3>Existing combat profile</h3> <p>Trained in defensive hand-to-hand combat (AGI 3,
      brawl 2). Carries The Veil of Veronica's Thread and a concealed Beretta 70. Will not fight to win
      — only to escape with the case.</p> <h3>Train, Geneva and Sonnenberg</h3><p>Volunteer I56 on the
      train: she noticed the UBS/Hausmann reference in Corvi’s office papers and called the desk from
      Rome before boarding. She shares her complete limited result without being challenged; Mercier
      confirms it. This was her own initiative, not a Church instruction or prior knowledge of the
      injection. She translates, obtains appointments and helps staff. Her covert interest remains in DA
      knowledge; no erased bank signature, suspicious look or unexplained absence telegraphs it. The
      later Registry 16 evidence and actual extraction attempt carry the twist.</p><h3>Sonnenberg
      performance — DA only</h3><p>After the fight and Graf’s disclosure, deliver a convincing
      breakdown: shaking hands, a failed prayer, “Sang real — royal blood,” then the blood of Christ and
      the Eucharist’s terrifying new meaning. She urges recovery of the remaining blood to the Vatican.
      Preserve her hidden allegiance and later betrayal; no knowing glances announce the performance.
      Graf establishes the clinical facts, while Claudia voices the interpretation.</p>
    attributes:
      str: 2
      agi: 3
      wit: 4
      emp: 4
    skills:
      brawl: 2
      firearms: 3
      lore: 4
      manipulate: 4
