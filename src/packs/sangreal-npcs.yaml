      through two coups and one conclave and considers this case merely "busy".</p>
      <h3>Social Mechanics</h3>
      <p>Cooperative / Practical (Difficulty 1). A clear request packet and a straight
      answer about the case's risk level get results. Vagueness gets her default answer:
      a two-shift delay and a lecture on requisition discipline.</p>
      <h3>Combat Profile</h3>
