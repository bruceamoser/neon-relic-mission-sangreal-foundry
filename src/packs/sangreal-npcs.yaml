      <p><strong>Knows.</strong> The Lingotto meeting, the purchase price, and the "remaining eleven" inventory. He has already sold the Novara rendezvous address once today and keeps the rest for the next buyer. Only hard proof of the Basarab involvement cracks the mask.</p>
      <h3>Psychological Profile</h3>
      <p>Immaculate, late fifties, never photographed head-on. The "cultured voice" on
      the PTT intercept: collector, broker, and — as of this case — a man who has already
      promised the same briefcase to two buyers, one of whom does not haggle. He treats
      the Covenant as potential inventory. He has never raised his voice in his life.</p>
      <h3>Social Mechanics</h3>
      <p>Deceptive / Commercial (Difficulty 3). He buys and sells real information
      (meeting times, the Lingotto floor plan) and lies by omission as a matter of
      hygiene. Only hard proof of the Basarab involvement cracks the mask.</p>
      <h3>Combat Profile</h3>
      <p>Non-combatant; two bodyguards wait outside every room he is in.</p>
