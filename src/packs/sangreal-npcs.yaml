      investigate: 3
      lore: 2
    armorRating: 0
    fearRating: 0
    disposition: 1
    corruptionStage: 0
    tags:
      - sangreal
    secret: 'The last stable Vault IX reading shows two descents that night — and a second magnetic signature that is neither the Lodestone nor the case.'
    goal: 'Understand the anomaly without ever standing near it.'
    positiveResult: 'Confirms the 04:02 descent and flags the unidentified second signature (the Watcher''s device).'
    negativeResult: 'Buries the cell in telemetry, interference plots, and a per-diem form they will never get signed.'

- _id: sangreal-npc-turin-intermediary
  name: 'The Turin Intermediary'
  type: npc
  img: modules/neon-relic-mission-sangreal/assets/art/portraits-clean/np14.webp
  prototypeToken:
    texture:
      src: modules/neon-relic-mission-sangreal/assets/art/npc-turin-intermediary.webp
  system:
    tier: 3
    description: >
      <h3>Psychological Profile</h3>
      <p>Immaculate, late fifties, never photographed head-on. The "cultured voice" on
      the PTT intercept: collector, broker, and — as of this case — a man who has already
      promised the same briefcase to two buyers, one of whom does not haggle. He treats
      the Covenant as potential inventory. He has never raised his voice in his life.</p>
