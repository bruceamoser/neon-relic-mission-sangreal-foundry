      the theft.”</p></blockquote><h3>When the cell changes the situation</h3><p>A credible non-deployment
      agreement, recorded inventory, and witnesses persuade him. He can surrender the case
      alive.</p><p>Threats make him withdraw or demand safeguards. He does not automatically destroy every
      route to the truth.</p><h3>Existing combat profile</h3> <p>Non-combatant. Carries an antique .32 caliber
      revolver with five rounds, suffering a -2 penalty on all firearms checks.</p>
