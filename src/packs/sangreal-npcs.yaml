      <h3>At the table</h3>
      <p><strong>Look.</strong> A tired sergeant of the gate detail, twelve years on the same stool two metres from the logbook; sidearm never drawn inside the cemetery in living memory.</p>
      <p><strong>Wants.</strong> His shift to end without him becoming the story.</p>
      <p><strong>Will not.</strong> Hand the logbook over, or be ranked, threatened, or told the inquiry is aimed at the gate detail. Any of those closes him for the rest of the case.</p>
      <p><strong>Knows.</strong> Who signed in and out of the cemetery that night, and that the lift ran twice. He reads the log aloud to anyone who offers a cigarette and asks plainly — respect for the log succeeds automatically.</p>
      <h3>Psychological Profile</h3>
      <p>Sergeant of the Campo Santo Teutonico gate detail — twelve years on the same
      stool, two metres from the logbook. He is not corrupt; he is tired. The night of
      the theft is the first night in years when something did not fit the log.</p>
      <h3>Social Mechanics</h3>
      <p>Guarded / Procedure-bound (Difficulty 2). Respect for the log, an offered
      cigarette, and a promise that the inquiry is aimed at the thieves — not the guard —
      open him. Rank-pulling and threats close him for the rest of the case.</p>
      <h3>Combat Profile</h3>
      <p>Non-combatant in practice. Sidearm on the belt, never drawn inside the cemetery
      in living memory.</p>
