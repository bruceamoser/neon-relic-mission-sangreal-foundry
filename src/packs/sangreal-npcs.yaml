      can cooperate before any death.</p><p>He restricts access or mobilizes recovery officers. Lethal
      suppression is a contingent hardline decision, with warning and a chance to countermand it, not an
      automatic reward for learning the truth.</p><h3>Existing combat profile</h3> <p>Non-combatant. Protected
      by a personal security detail of three plainclothes Swiss Guard officers equipped with submachine guns
