- _id: sangreal-npc-graf
  name: Dr. Elizabeth Graf
  type: npc
  img: modules/neon-relic-mission-sangreal/assets/art/portraits-clean/np04.webp
  prototypeToken:
    texture:
      src: modules/neon-relic-mission-sangreal/assets/art/portraits-clean/np04.webp
  system:
    tier: 1
    description: >-
      <h3>At the table</h3><p><strong>Look.</strong> Exhausted physician holding a slide box; first asks
      who will move the remaining staff.</p><p><strong>Wants.</strong> Protect survivors and keep an
      accountable medical record without enabling another experiment.</p><p><strong>Knows.</strong> She
      can document the human outcome and hypothesize the mechanism. She cannot prove ancient theology or
      guarantee a safe reversal.</p><blockquote><p>“It proves what happened to this patient. I will not
      sign anything else.”</p></blockquote><h3>When the cell changes the situation</h3><p>Concrete
      evacuation and independent custody of her record earn cooperation. She may keep a backup slide,
      but she does not demand that every useful record be burned.</p><p>She hides or seeks another
      protector. A successful rescue prevents her later death in a scheduled raid.</p><h3>Existing
      combat profile</h3> <p>Non-combatant. Threatens to burn the lab records if cornered; she means
      it.</p> <h3>Current Sonnenberg session</h3><p>She has already administered one phial and witnessed
      the changed Hausmann. She saw twelve phials of blood inside Corvi’s case, accepted one and saw him
      retain eleven. I51 dates and signs this account; I29’s photographed patient/time fields are blank.
      Reception’s I50 and I52 establish Corvi’s departure and onward contact independently of her
      survival. She provides the treatment facts even if the cell declines rescue; original clinical
      material requires accountable custody.</p><h3>Revised arrival</h3><p>The default red alert finds
      her upstairs, alive with deep claw wounds, beside a dead intern. Stabilize and move her before the
      full interview. Her testimony follows the young-vampire battle: she administered blood, witnessed
      initial cancer remission and subsequent transformation, and saw eleven phials leave with Corvi.
      The reception message supplies Lingotto independently of her survival.</p>
    attributes:
      str: 2
      agi: 2
      wit: 4
      emp: 3
    skills:
      healPhysical: 3
      investigate: 3
      psychoanalyze: 1
    armorRating: 0
    fearRating: 1
    disposition: 2
    corruptionStage: 0
