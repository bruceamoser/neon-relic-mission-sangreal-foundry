- _id: sangreal-npc-watcher
  name: 'The Grey Watcher'
  type: npc
  img: modules/neon-relic-mission-sangreal/assets/art/portraits-clean/np15.webp
  prototypeToken:
    texture:
      src: modules/neon-relic-mission-sangreal/assets/art/portraits-clean/np15.webp
  system:
    tier: 2
    description: >
      <h3>At the table</h3>
      <p><strong>Look.</strong> A middle-aged man in a grey raincoat with a folded newspaper and a small leather bag — the sort of man a porter forgets inside a minute.</p>
      <p><strong>Wants.</strong> One photograph of the case changing hands, and a buyer for it.</p>
      <p><strong>Will not.</strong> Approach the cell, be cornered in a corridor, or be caught in the room when it happens. He steps off at Lausanne if threatened.</p>
      <p><strong>Knows.</strong> Who has bought his negatives and when — one buyer a religious order operating out of Amsterdam, the other paid in Bucharest gold. He does not lie; if paid he sells that in full, and then walks.</p>
      <h3>Psychological Profile</h3>
      <p>There is nothing memorable about him. That is the entire skill. He reads
      newspapers in the rooms where the case changes hands, rides the same carriages,
      parks one street over, and writes all of it down. He is Talamasca — older than
      Registry 16, quieter than Claudia, and on no organizational chart.</p>
      <h3>Social Mechanics</h3>
      <p>Unreadable / Evasive (Difficulty 4). He does not lie; he simply is not the person
      the cell is looking for, and says so with perfect politeness. Cornered with evidence,
      he trades one verifiable fact and walks.</p>
      <h3>Combat Profile</h3>
      <p>Non-combatant. Four decades of fieldwork survived by never being in the room when
      it happens.</p>
      <h3>Director Notes</h3>
      <p>The Watcher is the case's recurring easter egg: he appears in the background of
      the intel photographs (the F-series photographs, the I18 descent frames, and any street scene the cell shoots).
      Reward players who notice him with a real advantage — he has the only independent
      photographic record of the case, including the 04:02 descent (I18).</p>
    attributes:
      str: 2
      agi: 3
      wit: 4
      emp: 3
    skills:
      investigate: 4
      sneak: 3
      lore: 3
    armorRating: 0
    fearRating: 0
    disposition: 3
    corruptionStage: 0
    tags:
      - sangreal
    secret: 'He kept the only independent photographic record of the case — ten years of negatives, including the vault''s second descent.'
    goal: 'Observe. Record. Remain a footnote.'
    positiveResult: 'If caught, leaves a plain card — "We watch, and we are always there." — and one useful, verifiable fact.'
    negativeResult: 'Continues to appear in every surveillance photograph the cell takes, smiling very slightly.'
