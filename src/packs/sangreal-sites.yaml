- _id: sangreal-l6
  name: 'L6 — The Fortified Retreat of San Nazzaro (Novara)'
  type: location
  system:
    locationId: L6
    caseId: SANGREAL-87-091
    informationCardSlugs: [sangreal-ic13, sangreal-ic14, sangreal-ic15, sangreal-ic38, sangreal-ic39, sangreal-ic40, sangreal-ic44, sangreal-ic45]
    npcSlugs: [sangreal-npc-vane]
    availability: clue
    availabilityCondition: 'Requires tracking Claudia — toll stubs, teleprinter logs, or Corvi''s papers.'
    description: >
      <p><strong>Read aloud.</strong> <em>Lantern light on a long table, and on the table, laid out with the care of someone who has set a table before, is the woman who has been standing at your side since Rome. Nothing has been taken from her except time. The room smells of kerosene and the only sound in the abbey is the wind going through a gate that has been torn out of the wall from the outside.</em></p>
      <p><strong>The place.</strong> An eleventh-century fortified brick
      abbey along the Sesia river plains near Novara. The perimeter features defensive
      moats and brick walls. The heavy oak carriage doors have been broken inward, their
      iron hinges torn from the masonry. A single kerosene lantern illuminates the
      stone-flagged dining hall.</p>
      <p><img src="modules/neon-relic-mission-sangreal/assets/art/scenes/totm/tm-abbey-arrival.webp" alt="Breached abbey approach" style="width:100%;height:auto"></p>
      <p><strong>Who is here.</strong></p>
      <ul>
      <li><strong>Sister Claudia Vane, dead on the table.</strong> Two severed metacarpals reduced to white calcified ash, one still showing a legible whorl ridge; an unused second wine glass at the head of the table. She was waiting for somebody who was not the pack. The players get to decide what she is buried as — Talamasca operative, Covenant liaison, or a woman whose handwriting never trembled. Give them the argument without commentary.</li>
      <li><strong>The local priest</strong> — frightened, cooperative, useless as a fighter, on the road with his bicycle and three parishioners who never blink. <em>Knows:</em> the pack's arrival hour by hour — the vehicles, the language, the fact that they came in through the gate rather than over it. He volunteers all of it to anyone who treats him as a person rather than a source.</li>
      <li><strong>Nobody else living.</strong> The breach came from the pack's side of the wall, hours ago, and no one has come out — including the abbey's own people, whose lamps went out one at a time.</li>
      </ul>
      <p><strong>What is here.</strong></p>
      <ul>
      <li>I13 — The Novara Slaughter: the autopsy, with the calcified fingers, the broken phial soaked into the tiles, and the second glass. Proves the cure destroys a vampire on contact. <em>Gate:</em> 1 shift of forensic work, <em>Investigate (WIT) or Heal Physical (WIT) Difficulty 2</em>; the card lands on Day 2 either way.</li>
      <li>I40 — Her Effects, Laid Out and I14 — Telex Dispatch: Registry 16: her order, her route, the grey animal hair on the Beretta's trigger guard, and the order to fly the specimen out. <em>Gate:</em> 1 shift with the satchel; the telex from the satchel or the telegraph desk, free.</li>
      <li>I15 — Flight Clearance: YR-BAS: Basarab Holdings S.A. (Bucharest), departure 01:15, with a cancelled form beneath it proving the flight waited. <em>Gate:</em> the telegraph desk, free.</li>
      <li>I38 — Two Fingers, Calcified and I39 — Tarmac, 01:15: the pack's own casualty — bone aged a century in seconds, a melted ring carrying the Basarab dragon crest — and the one photograph that ends the mission. <em>Gate:</em> 1 shift of full forensic work; be at the fence with a camera for the tarmac, and taking the photograph spends the window.</li>
      <li>I44 — Consignment Markings and I45 — Airfield Briefing Sheet: the chalk tally reading 10/12, a ghosted <em>VATICAN MUSEUMS — STOREROOM 9</em> under the fresh stencil, and a crossed-out decoy aircraft. <em>Gate:</em> the service hangar and the dispatch desk, free; the Wayfinder packet delivers I45 on Day 1 if the cell never gets there.</li>
      </ul>
      <section class="sangreal-scene-links"><h3>Scene backgrounds</h3><ul><li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.EzLXgHrD8SOahA0Z]{TM11 — Breached abbey approach}</li><li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.URoAcs3MRSAqrakE]{TM12 — Abbey dining hall threshold}</li><li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.5UwVLTp8ofRAjQ9W]{BM07 — Abbey gate and courtyard}</li><li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.9wHAIjutxJqKmHqB]{BM08 — Abbey dining hall and cloister}</li></ul><p>GM: import the scene, then view or activate it when appropriate. Gridless; adjust token scale for your table. Maps expose room layouts.</p></section>
    positiveResult: >
      <p>Full forensics: the slaughter scene (I13), the Registry 16 telex (I14), and the
      Cessna 421 clearance (I15). The cell learns — too late — what it was really carrying
      and where it went.</p>
    negativeResult: >
      <p>Spending more than 1 shift here brings military police from the nearby
      Novara-Cameri air base, initiating an armed standoff and costing 2 shifts. Evidence
      left behind is impounded; some of it will never be seen again.</p>
    milestoneChanges: >
      <p><strong>O2 M3.</strong> The Elder Cleansing Strike has already happened; arriving
      after this milestone means the body is cold, the telex ash is cold, and the tarmac
      window is minutes wide. <strong>O1 M2.</strong> L'Entità's cleanup teams arrive
      behind the vampires to burn the abbey records — the two factions colliding in the
      same building is the case's loudest possible alarm.</p>
    npcUuids: []
    informationCardUuids: []
    organizationUuids: []
    locationUuids: []

- _id: sangreal-l7
  name: 'L7 — Palace of the Congregation for the Doctrine of the Faith (Vatican City)'
  type: location
  system:
    locationId: L7
    caseId: SANGREAL-87-091
    informationCardSlugs: [sangreal-ic16, sangreal-ic17, sangreal-ic41, sangreal-ic42]
    npcSlugs: [sangreal-npc-sabbatini, sangreal-npc-ghiberti]
    availability: contact
    availabilityCondition: 'Requires confronting Cardinal Sabbatini with evidence from L6 (corpse, telex, flight manifest).'
    description: >
      <p><strong>Read aloud.</strong> <em>Green carpet, benches, busts, and the particular quiet of a waiting room outside a Prefect's door. Beyond it the Council Chamber: an oval table, Renaissance frescoes of heresy defeated, walnut panelling, and banker's lamps over dossiers. There is a file on the desk that is not yours and is further along than yours.</em></p>
      <p><strong>The place.</strong> The headquarters of the Inquisition,
      situated outside the southern colonnade of St. Peter's. The Council Chamber features
      Renaissance ceiling frescoes depicting the defeat of heresy, walnut paneling, and
      green banker lamps illuminating classified dossiers.</p>
      <p><img src="modules/neon-relic-mission-sangreal/assets/art/scenes/totm/tm-council.webp" alt="Council chamber" style="width:100%;height:auto"></p>
      <p><strong>Who is here.</strong></p>
      <ul>
      <li><strong>Cardinal Enrico Sabbatini</strong> — a statesman in his own building, at his desk, no longer pretending otherwise. <em>Wants</em> the phials back, the story suppressed, and the cure retained as an institutional deterrent; treats the Covenant as a tool to be hired and discarded. <em>Will not</em> apologise, admit the Church banked the sale, or discuss the 1582 order in front of a witness. <em>Knows:</em> everything the cell has just learned and more, including that his own file on the Talamasca is further along than theirs. His register is imperious and hostile — <em>Difficulty 4</em> — and drops to cynical cooperation the moment indisputable forensic proof lands on the table.</li>
      <li><strong>Father Ghiberti</strong> — summoned, terrified, useful. <em>Wants</em> to have written the curatorial failure down before anybody else does; <em>will not</em> contradict his Prefect in the room. <em>Knows:</em> the container's provenance and the 1962 file, which is what makes him worth protecting.</li>
      </ul>
      <p><strong>What is here.</strong></p>
      <ul>
      <li>I16 — The Quiescence Formula (CT3) and I41 — The Green Lamp: the containment recipe, and the surveillance frame of the Council Chamber with the dossier stamped REGISTRY 16 — AMSTERDAM. Proves Rome has been reading the same file all along, and that the sanitization squad is already in the antechamber. <em>Gate:</em> confronting Sabbatini with the corpse, the telex and the manifest; the HQ packet for I41.</li>
      <li>I17 — Dispatch Box, Microfiche and I42 — L'Entità Team, 1987: the Prefect's own argument, and the squad photograph — SCV 47 at the kerb, an issue Vatican gendarme wristwatch, a phosphorus canister on the third man's belt. <em>Gate:</em> the despatch box in the chamber; the Day 1 packet or recovered prints for I42.</li>
      </ul>
      <section class="sangreal-scene-links"><h3>Scene backgrounds</h3><ul><li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.c2expM3HLZD9xsBD]{TM14 — Council chamber}</li><li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.72tNLODObuOLLVyV]{TM15 — Claudia convent room}</li><li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.ODBMpIkV30orwoGM]{BM10 — Council chamber and antechamber}</li></ul><p>GM: import the scene, then view or activate it when appropriate. Gridless; adjust token scale for your table. Maps expose room layouts.</p></section>
    positiveResult: >
      <p><strong>Operational Resolution.</strong> Sabbatini admits the Church's historic
      deterrence strategy and signs the Concordat Requisition Order, providing diplomatic
      cover, weapons clearances, and funding for Mission 2: Recover the Sangreal. The
      Covenant exits the case with a mandate and a debt.</p>
    negativeResult: >
      <p>Displays of force or moralizing in the Council Chamber provoke an imperious
      dismissal (His Eminence's difficulty is 4). Without the L6 evidence, Sabbatini
      offers nothing but condolences and a limousine. L'Entità closes its doors and the
      Concordat funding never materializes.</p>
    milestoneChanges: >
      <p><strong>O1 M3.</strong> The Holy Crusade: by the time the cell reaches the
      Council Chamber, the Swiss Guard squad detailed to sanitize them is already in the
      antechamber. Sabbatini either calls it off — or it executes. <strong>O2 M3.</strong>
      Amsterdam sends a formal, bland note of condolence for "our missing sister",
      dead-ending diplomatic recourse.</p>
    npcUuids: []
    informationCardUuids: []
    organizationUuids: []
    locationUuids: []

- _id: sangreal-org-alliance
  name: "O1 — The Holy Alliance (L'Entità)"
  type: organization
  system:
    organizationId: O1
    caseId: SANGREAL-87-091
    npcSlugs: [sangreal-npc-sabbatini, sangreal-npc-entita-operative]
    locationSlugs: [sangreal-l1]
    isActive: true
    isDormant: false
    description: >
      <h3>Public Identity</h3>
      <p>Pontifical diplomacy, doctrinal oversight, historical preservation. The Holy
      See's oldest continuous intelligence apparatus, formalized in the twentieth century
      as <em>L'Entità</em> and operating under the motto <em>Cum Cruce et Gladio</em>
      ("With Cross and Sword").</p>
      <h3>Clandestine Core</h3>
      <p>Covert wet-work, geopolitical intelligence, and occult quarantine. The Church
      suppresses preternatural artifacts out of geopolitical necessity, not religious
      puritanism. Vault IX was never a devotional shrine: it was a biological deterrent
      held against the aristocratic vampire dynasties of Eastern Europe.</p>
      <h3>Countdown Track — 10 squares</h3>
      <p>Advances when the cell causes public disturbances, damages church property, or
      challenges clerical authority. (Track this countdown here and on the DA brief;
      the Operations Board app does not read item-based case files.)</p>
      <ul>
      <li><strong>7 — Frontier Cloak (M1):</strong> L'Entità activates its network inside
      the Italian Ministry of the Interior. Swiss-Italian border crossings fall under
      paramilitary surveillance; overland movement requires forged passports or costs an
      additional operational shift.</li>
      <li><strong>4 — Sanitization Sweep (M2):</strong> Vatican containment operatives
      clean up the Privatklinik Sonnenberg. Dr. Elizabeth Graf is targeted for liquidation
      and all oncology records are incinerated if the investigators have not secured
      them.</li>
      <li><strong>1 — Holy Crusade (M3):</strong> Cardinal Sabbatini concludes the
      Covenant cell has uncovered the biological truth. An armed tactical squad of
      plainclothes Swiss Guard commandos deploying phosphorus grenades intercepts the team
      to sanitize the operation.</li>
      </ul>
      <h3>Strategic Goal</h3>
      <p>Unconditional recovery of the Twelve Phials, total public suppression of the breach, and retention of the cure as an institutional deterrent. <strong>Behind that:</strong> an undiluted bloodline restored would end the accommodation that has kept the peace for two centuries — the Church cannot exterminate the dynasties, and the dynasties can no longer renew themselves except through this fluid. Sabbatini holds the phials not to use them but to make sure nobody else does, and he is right about what they would do in the wrong hands. The Covenant is a tool to be hired, manipulated, and discarded if it uncovers the truth.</p>
      <h3>Behaviour toward the cell</h3>
      <p>Politely invisible until the cell becomes a liability. L'Entità does not obstruct an
      investigation it commissioned — it shadows it, files on it, and removes evidence it considers
      institutional. The cell's contact is clerical, courteous and always a rank above them. The moment
      the cell looks like it might learn what the cure is, the register changes from support to
      containment, and the squad in the antechamber is the last stage of that curve.</p>
      <h3>What gives them away</h3>
      <p>Vatican plates where there should be none (SCV 47), a gendarme wristwatch on a plainclothes
      operative, sanitation crews that arrive before the police, and paperwork that predates the
      incident. A cell that photographs vehicles and keeps gate logs can see the pattern two days
      before it is aimed at them.</p>
      <h3>What they know</h3>
      <p>That Vault IX held a biological deterrent rather than a relic; that the deterrent was banked
      and brokered through an ecclesiastical escrow in Vaduz; and that Sabbatini's own dossier on
      Registry 16 is further along than the cell's. They do <em>not</em> know that Claudia is the
      Talamasca's until very late — and admitting it is the single most expensive sentence Sabbatini
      can be made to say.</p>
    npcUuids: []
    locationUuids: []

- _id: sangreal-org-talamasca
  name: 'O2 — The Order of the Talamasca (Registry 16)'
  type: organization
  system:
    organizationId: O2
    caseId: SANGREAL-87-091
    npcSlugs: [sangreal-npc-vane, sangreal-npc-basarab-operative, sangreal-npc-basarab-elder]
    locationSlugs: [sangreal-l5, sangreal-l6]
    isActive: true
    isDormant: false
    description: >
      <h3>Public Identity</h3>
      <p>A secular historical foundation and antiquarian library — the "psychic
      detectives" and chroniclers of the preternatural world. Autonomous Motherhouses in
      London, Amsterdam, and Rome, with secondary archival libraries worldwide. Field
      researchers carry unembellished business cards inscribed with the motto:
      <em>"We watch, and we are always there."</em></p>
      <h3>Clandestine Core — Registry 16</h3>
      <p>The Amsterdam Motherhouse's covert operational arm: sensitive intelligence
      collection, recovery of hazardous artifacts, and preemptive neutralization of
      existential threats to preternatural survival. Its mortal operatives are conditioned
      to believe the Order is a benign scholarly body; its hidden elders include ancient
      vampire bloodlines that retain control over executive policy.</p>
      <p>Sister Claudia Vane — trained in paleography and counter-surveillance, embedded
      in the Vatican's Congregation for the Doctrine of the Faith — is one of its operatives.
      She believes the phials contain a primordial demonic contagion. She does not know
      her true superiors are executing a counter-measure to destroy the only substance on
      Earth capable of purging their immortality.</p>
      <h3>Countdown Track — 12 squares</h3>
      <p>Advances as Claudia transmits progress reports or as the cell accesses
      preternatural nodes. (Track this countdown here and on the DA brief.)</p>
      <ul>
      <li><strong>9 — Signal Intercept (M1):</strong> Listening posts in Amsterdam decrypt
      Swiss PTT telex transmissions. The Talamasca maps the Covenant's operational path,
      feeding encrypted updates to Claudia.</li>
      <li><strong>6 — Extraction Green-Light (M2):</strong> Claudia receives coded
      authorization to execute field theft of the steel attaché as soon as Monsignor Corvi
      is isolated. The trigger moment is L5.</li>
      <li><strong>2 — Elder Cleansing Strike (M3):</strong> The hidden vampire retrieval
      pack locates the Novara safehouse, executes Claudia to ensure the cure cannot be
      turned against their bloodlines, and takes the case to the airstrip.</li>
      </ul>
      <h3>Strategic Goal</h3>
      <p>Interception of the Twelve Phials via double agent, extraction to Eastern Europe, and permanent industrial incineration of the cure. <strong>Behind that:</strong> Registry 16's hidden elders are ancient vampire bloodlines, and they have known since 1582 what this fluid does to their tissue. Their fear is not of a weapon but of a medicine — the Church using the cure to unmake them, which is exactly what the histopathology proves the fluid can do. They also know that pure blood restores what four centuries of dilution has cost them, which is why the order is <em>incinerate</em> and not <em>keep</em>: the dynasties are not of one mind, and the elders would rather the cure be ash than in the hands of anyone who might use it. Protect the bloodline — at any cost to mortal lives.</p>
      <h3>Behaviour toward the cell</h3>
      <p>Helpful, warm, and entirely transactional. Registry 16's mortal field officers genuinely
      believe the Order is a scholarly body, so the cell meets courteous researchers offering leads
      they cannot use and asking questions that map the Covenant's route. Claudia is the only asset in
      the field, and she is run as an ally: she shares the Church's paperwork, argues for speed,
      and only breaks cover at the Lingotto when the case is isolated.</p>
      <h3>What gives them away</h3>
      <p>The stillness — never surprised, only delayed; answers about Church procedure that arrive
      instantly and answers about the theft that arrive half a beat late. Beyond that: a witness no
      report mentions (a nun's veil in the corridor frame), a ledger line erased with correction
      fluid, an embossed stamp on a map casing, and a telex order perforated by an Amsterdam machine.
      A cell that keeps every document it touches can read the whole conspiracy off paper alone.</p>
      <h3>What they know</h3>
      <p>That the cure burns their bloodlines to ash on contact — the pack has already paid two fingers
      for the proof. That the Covenant is being used as muscle. That Amsterdam is reading every packet
      the Covenant sends, and that the rendezvous at San Nazzaro is a trap the cell has been walking
      toward since Geneva. They do not know that the cell has the histopathology, and if they did,
      Claudia would kill the cell's case rather than abandon it.</p>
    npcUuids: []
    locationUuids: []
