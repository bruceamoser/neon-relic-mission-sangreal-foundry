    description: >-
      <h3>Motivation and conduct</h3><p><strong>Fear:</strong> the Church can impose mortality on the hidden
      elders. <strong>Goal:</strong> remove and incinerate the reserve under their control.
      <strong>Methods:</strong> mortal agents taught that destruction prevents an outbreak; route
      interception; a recovery pack. <strong>Leverage:</strong> authenticated neutral custody can buy time;
      convincing Claudia of her handlers’ nature can break the extraction plan. Ordinary members need not know
      the leadership is vampiric. The Basarab command in this mission seeks destruction, not a magical dose
      that strengthens an elder immune to the purge.</p><p>Use the faction attempts on the Case Board. Advance
      once for an actual change in capability or pressure; do not also fire duplicate person-track events. A
      failed or prevented attempt remains prevented unless the faction obtains a new opportunity.</p>
