- _id: sangreal-l2
  name: "L2 — Monsignor Corvi's Private Quarters (Rome)"
  type: location
  system:
    locationId: L2
    caseId: SANGREAL-87-091
    informationCardSlugs: [sangreal-ic02, sangreal-ic04, sangreal-ic16, sangreal-ic20, sangreal-ic21, sangreal-ic22]
    availability: open
    availabilityCondition: ''
    description: >
      <p><strong>Read aloud.</strong> <em>The apartment is baroque, dusty and wrong: thousands of leather spines, every drawer pulled open and put back by somebody who searched it like a scholar rather than a burglar. Nothing is missing. Behind the Saint Sebastian there is a wall safe, and the safe has been drilled through the spindle with a jeweller's patience.</em></p>
      <p><strong>The place.</strong> A baroque third-floor apartment in the
      Palace of the Holy Office. Thousands of leather-bound patristic volumes line the
      walls. Drawers have been pulled out and searched with academic precision — nothing
      taken, everything displaced. Behind an oil painting of Saint Sebastian sits an open
      wall safe, its mechanical combination lock drilled cleanly.</p>
      <p><img src="modules/neon-relic-mission-sangreal/assets/art/scenes/totm/tm-quarters-arrival.webp" alt="Corvi quarters arrival" style="width:100%;height:auto"></p>
      <p><strong>Who is here.</strong></p>
      <ul>
      <li><strong>Two Vatican gendarmes</strong> — bored, correct, and not curious; they admit the cell only under Sister Claudia's escort and will log the visit either way. <em>Want</em> their shift to end without an incident. <em>Will not</em> admit anyone without papers, however senior.</li>
      <li><strong>Nobody else.</strong> Corvi has been gone since the theft and the searcher came and went weeks ago. <em>You decide</em> who turned the drawers over — the evidence points at a professional who took nothing, which is not how a thief works.</li>
      </ul>
      <p><strong>What is here.</strong></p>
      <ul>
      <li>I04 — Numerals on Rag Paper: sheet music and a blotter whose mirror-writing reads GENEVA and 4409. Proves Corvi had worked out the destination before he fled. <em>Gate:</em> on the desk, free; reading the cipher is <em>Lore (WIT) Difficulty 2</em>, and the card stands as evidence either way.</li>
      <li>I16 — The Quiescence Formula (CT3): the mechanical recipe for moving or neutralising the blood — linen, gall, vinegar, myrrh, absolute darkness. <em>Gate:</em> the kit, or the Council Chamber in the epilogue.</li>
      <li>I20 — Safe Dial, Drilled: bright swarf at the spindle, carpet scuffs showing somebody knelt in the same spot twice, weeks apart. Proves the professional — and that Claudia searched this room before the Covenant arrived. <em>Gate:</em> a patient search, an hour of work, no roll.</li>
      <li>I21 — Diplomatic Passport: a second hand has written <em>accompagné</em> in the margin. Proves he crossed at Chiasso with a companion the reports omit. <em>Gate:</em> the desk effects; no roll if the room is searched patiently.</li>
      <li>I22 — The Archive, 1962: two men in cassocks at a card catalogue, a red grease-pencil X across the older man's face, the folder labelled XII-SANG. Proves the case is a 1962 project with a face somebody wanted forgotten. <em>Gate:</em> it is in the drawer.</li>
      </ul>
      <section class="sangreal-scene-links"><h3>Scene backgrounds</h3><ul><li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.1xPFy0jFa4uqHScD]{TM03 — Corvi quarters arrival}</li><li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.KpUAj1DanbE4NuOW]{BM02 — Apartment and guarded corridor}</li></ul><p>GM: import the scene, then view or activate it when appropriate. Gridless; adjust token scale for your table. Maps expose room layouts.</p></section>
    positiveResult: >
      <p>A patient search (Research undertaking) finds the Polybius cipher slip (I04), the
      containment protocol notes (I16), and the agent's own copy of the surveillance
      timeline (duplicate I02). Corvi's handwriting on the desk blotter is legible under
      raking light.</p>
    negativeResult: >
      <p>Spending more than 1 shift here without silencing the guards alerts the Holy
      Alliance, advancing Track O1 by 1 square. A heavy-handed search destroys the
      blotter impressions and the cipher slip's hiding place.</p>
    milestoneChanges: >
      <p><strong>O1 M1.</strong> The apartment is sealed pending "archival inventory" —
      entry thereafter requires a formal writ. <strong>O1 M2.</strong> L'Entità
      sanitizes the apartment overnight; the safe is removed wall and all.</p>
    npcUuids: []
    informationCardUuids: []
    organizationUuids: []
    locationUuids: []

- _id: sangreal-l3
  name: 'L3 — Union de Banques Suisses (Geneva)'
  type: location
  system:
    locationId: L3
    caseId: SANGREAL-87-091
    informationCardSlugs: [sangreal-ic06, sangreal-ic07, sangreal-ic08, sangreal-ic23, sangreal-ic24, sangreal-ic25, sangreal-ic26]
    npcSlugs: [sangreal-npc-mercier]
    availability: clue
    availabilityCondition: 'Requires the EC 30 boarding pass (I02) or the decoded Polybius cipher (I04).'
    description: >
      <p><strong>Read aloud.</strong> <em>Grey alpine granite, brass fittings, rain coming off the steps. Inside, the lobby runs on marble and quiet money: a night counter, three private viewing booths, and a vault somewhere below with a door three feet thick. Nobody in the building is a cultist. That is what makes it work.</em></p>
      <p><strong>The place.</strong> A neoclassical banking house on the
      Rue du Rhône, clad in gray alpine granite. The subterranean vault features
      three-foot-thick chrome doors and private wood-paneled viewing booths where
      high-net-worth clients transact business anonymously.</p>
      <p><img src="modules/neon-relic-mission-sangreal/assets/art/scenes/totm/tm-bank-arrival.webp" alt="Geneva bank exterior" style="width:100%;height:auto"></p>
      <p><strong>Who is here.</strong></p>
      <ul>
      <li><strong>Jean-Paul Mercier</strong> — wood-panelled booth, three-piece suit, ironed shirt, warm lamp, slight sweat; professionally pleasant and privately terrified. <em>Wants</em> the transaction buried and his own name out of it; <em>will not</em> admit that he erased a ledger line at the buyer's request, and threats of violence close him and trip the alarm beneath the counter. <em>Knows:</em> the account that paid, the box number, the date, and that a nun came in alone afterwards and asked for the same box. He sells the escrow carbon for money and gives up the ledger only under real pressure — and he lies once, claiming he never saw the woman.</li>
      </ul>
      <p><strong>What is here.</strong></p>
      <ul>
      <li>I06 — The Escrow Transfer Slip: CHF 500,000 from <em>Kurt Hausmann — Sonnenberg Privatklinik, Zurich</em> into an ecclesiastical escrow account in Vaduz, memo <em>Acquisition of Primary Specimen (1 of 12)</em>. <em>Gate:</em> Mercier under payment or pressure — <em>Manipulate (EMP) or Command (EMP) Difficulty 2</em>.</li>
      <li>I23 — Night Deposit and I24 — Bank Staff Record: the lobby camera frame of the night deposit, and the record showing why the buyer chose a clerk with both vault access and a debt. <em>Gate:</em> the security office (Mercier's cooperation, a bribe, or a discreet visit arranged through Petra) and personnel records (<em>Manipulate (EMP) Difficulty 2</em> or <em>Tech (WIT) Difficulty 2</em>).</li>
      <li>I25 — The Ledger Page: the middle entry struck through with correction fluid; beneath it <em>VANE, C.</em> at 02:10. Proves Claudia entered the vault alone and Mercier was paid to erase it. <em>Gate:</em> vault access — Mercier's cooperation, or a night visit through the Geneva corridor.</li>
      <li>I07 — Patient File 09-H and I08 — The Swiss PTT Intercept Tape: Hausmann's clinical dossier and the wiretap of a payphone call ordering eleven vessels brought to the Lingotto works. <em>Gate:</em> the booth records; the PTT tape from the bank mail.</li>
      <li>I26 — The 06:40 to Geneva: the long-lens platform photograph, misfiled in the bank's parcel room — a priest with the attaché, and a man in a grey raincoat at the far end of the platform. <em>Gate:</em> the unattributed surveillance prints in the parcel room, or bought from the Intermediary later.</li>
      </ul>
      <section class="sangreal-scene-links"><h3>Scene backgrounds</h3><ul><li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.WYkoHrGfng0UZ3lZ]{TM04 — Geneva bank exterior}</li><li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.w9Gp844xc19nFp0a]{TM05 — Private viewing room}</li><li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.b2nGfJTzx9PeMk09]{BM03 — Bank vault level}</li></ul><p>GM: import the scene, then view or activate it when appropriate. Gridless; adjust token scale for your table. Maps expose room layouts.</p></section>
    positiveResult: >
      <p>Mercier surrenders the escrow slip under pressure or payment (I06). The booth
      records hand over the clinical file reference (I07) and the wiretap reel log (I08).
      The Geneva corridor opens: Zurich is now on the board.</p>
    negativeResult: >
      <p>Hostile action or triggering the silent bank alarms summons Swiss police within
      10 minutes, consuming 1 shift in legal delays and advancing Track O1 by 1 square.
      The locker's contents are resealed under judicial order.</p>
    milestoneChanges: >
      <p><strong>O2 M1.</strong> Amsterdam has already mapped the Geneva transfers;
      arriving after this milestone means Claudia's updates to her handler are current
      and the bank's staff have been quietly warned about "Covenant interest".
      <strong>O1 M1.</strong> Swiss federal police begin comparing manifests with
      Italian border entries.</p>
