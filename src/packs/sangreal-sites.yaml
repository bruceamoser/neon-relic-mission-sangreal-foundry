- _id: sangreal-l1
  name: 'L1 — Subterranean Vault IX (Vatican City)'
  type: location
  system:
    locationId: L1
    caseId: SANGREAL-87-091
    informationCardSlugs: [sangreal-ic01, sangreal-ic02, sangreal-ic03, sangreal-ic05, sangreal-ic18, sangreal-ic19, sangreal-ic43]
    npcSlugs: [sangreal-npc-ghiberti, sangreal-npc-vane]
    availability: open
    availabilityCondition: ''
    description: >
      <p><strong>Read aloud.</strong> <em>The lift takes forty feet of rock in one drop and stops with a hydraulic sigh. When the doors open the cold arrives before the light: two degrees, wet stone, and under the ozone something older that smells of incense and dried blood. The room is octagonal, brick faced in lead, refrigeration lines sweating down the walls. On the black granite altar sits an induction cradle of melted copper and eleven velvet moorings. The twelfth is an empty ring in the dust. Under the plinth, a tarnished brass plate reads one word: <strong>SANGREAL</strong>.</em></p>
      <p><strong>The place.</strong> Located forty feet beneath the Campo
      Santo Teutonico, reached via a private hydraulic lift concealed behind the Longinus
      Crossing Pier inside St. Peter's Basilica. The vault is an octagonal chamber of
      ancient Roman brick faced with modern lead sheeting, cooled to 2°C by industrial
      refrigeration lines. In the center sits an altar of Swedish black granite, flanked
      by melted copper conduits and scorched masonry. Below the empty electromagnetic
      mooring plinth — the attaché's cradle — a tarnished brass sign reads one word:
      <strong>SANGREAL</strong>. The chamber smells of ozone, cold
      incense, and dried blood.</p>
      <p><img src="modules/neon-relic-mission-sangreal/assets/art/scenes/totm/tm-lift-descent.webp" alt="Hydraulic lift vestibule and descent" style="width:100%;height:auto"></p>
      <p><strong>Who is here.</strong></p>
      <ul>
      <li><strong>Father Ghiberti</strong> — small and precise, cassock and lanyard, reading glasses on a cord. <em>Wants</em> the breach recorded as a curatorial failure and the vault back under seal; <em>will not</em> open the 1582 brief, name the Prefect, or say the word Sangreal aloud in the stacks — press him and he simply stops answering. <em>Knows:</em> the register card was pulled by hand, a workshop won a contract in 1964 to build a sealed container for shelf-mark XII-SANG, and somebody has been re-reading the 1582 file this year. He trades all three for the vault evidence and a written admission that this was a curatorial failure.</li>
      <li><strong>Sister Claudia Vane</strong> — black habit over a grey under-layer, scuffed leather folio held in both hands, completely still, never surprised. <em>Wants</em> to stay attached to the cell and to be the one holding the access log; <em>will not</em> touch the case or leave the cell alone in the vault on the first visit. <em>Knows:</em> the official inventory and the liturgical calendar, which she recites perfectly — answers questions about the Church instantly and questions about the theft half a beat late. She can recite the manifest but not the contents, and that ignorance is true.</li>
      </ul>
      <p><strong>What is here.</strong></p>
      <ul>
      <li>I01 — The Burnt Electromagnet Relay: sulfurous residue baked into slag, scorching on the underside of the plinth. Proves the vault was coaxed open from below, not forced. <em>Gate:</em> none — it is lying on the altar.</li>
      <li>I19 — Plinth Detail, Brass Plate: the plaque and a case-shaped scratch outline in the granite. Proves the case was seated and removed many times. <em>Gate:</em> <em>Investigate (WIT) Difficulty 1</em> to notice the outline. The word on the plate reads as <em>San Greal</em> to anyone who sees it — the Grail — and the room is arranged to encourage that reading. Play every refusal to describe the contents straight, without irony.</li>
      <li>I02 — CCTV Reel #87-04 and I18 — Second Descent: the corridor reel and the log of the 04:02 descent. Held in the gate house, not the vault. <em>Gate:</em> the duty officer's cooperation (see L1's own gate in the walkthrough); the Day 12 HQ packet delivers both if the cell stalls.</li>
      <li>I03 — The Excised Codex Register and I43 — The Case, 1964: the pulled register card and the workshop photograph, with the pinned order <em>XII phials — Gethsemane lot — destroyed if opened</em>. <em>Gate:</em> Ghiberti's help with the archival index, 1 shift; free once the cell shows him the vault evidence.</li>
      <li>I05 — Embossed Stamp, Map Casing: three cities ringed in pencil — Geneva, Zurich, Turin — before the cell had a case file. <em>Gate:</em> must be earned in play; there is no HQ fallback.</li>
      </ul>
      <section class="sangreal-scene-links"><h3>Scene backgrounds</h3><ul><li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.e5iULuABev6xj4n0]{TM01 — Hydraulic lift vestibule and descent}</li><li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.fk4iveJh9oz2DMDa]{TM02 — Vault IX arrival}</li><li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.FyPnU7Tmzk9RJebD]{BM01 — Vault and lift vestibule}</li></ul><p>GM: import the scene, then view or activate it when appropriate. Gridless; adjust token scale for your table. Maps expose room layouts.</p></section>
    positiveResult: >
      <p>With Claudia's escort, the cell walks the vault floor legitimately: the melted
      induction cradle (I01), the security console tape (I02), the excised catalog card
      (I03), and the first glimpse of the Watcher's hallmark (I05) are all recoverable
      without alerting Curial security.</p>
    negativeResult: >
      <p>Accessing the vault without alerting Curial security requires successful
      Subterfuge or Bureaucracy rolls. Failure advances Track O1 by 1 square — the
      gendarmerie posts a written irregular-access notice by morning.</p>
    milestoneChanges: >
      <p><strong>O1 M1.</strong> The vault is resealed under L'Entità supervision; further
      access requires forged pontifical documentation. <strong>O1 M2.</strong> The
      register is confiscated and Ghiberti is reassigned. <strong>O1 M3.</strong>
      The chamber is emptied and sanitized — any evidence not already secured is gone.</p>
