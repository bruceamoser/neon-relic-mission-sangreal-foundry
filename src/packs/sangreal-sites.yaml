    isActive: true
    isDormant: false
    description: >-
      <h3>Motivation and conduct</h3><p><strong>Fear:</strong> a fresh supply outside diluted vampire
      inheritance can create potent predators and end the numerical accommodation. <strong>Goal:</strong>
      secure the reserve and stop new recipients while preserving Church authority. <strong>Methods:</strong>
      diplomatic access, surveillance, sealed transport, and escalating pressure on unsafe custody.
      <strong>Leverage:</strong> a verified inventory and independent non-deployment agreement can produce
      cooperation. Sabbatini did not order the theft or the Swiss treatment. The historic deterrent record is
      real, but it does not make every cleric a conspirator. Lethal suppression is a specific, preventable
      decision, not an automatic reaction to player knowledge.</p><p>Use the faction attempts on the Case
      Board. Advance once for an actual change in capability or pressure; do not also fire duplicate
      person-track events. A failed or prevented attempt remains prevented unless the faction obtains a new
      opportunity.</p>
    npcUuids: []
    locationUuids: []
