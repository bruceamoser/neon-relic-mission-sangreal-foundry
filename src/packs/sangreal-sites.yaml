# Mission: Sangreal — Locations & Factions (Item pack)
# Items: location (L1–L7), organization (O1–O2)
# Source: docs/mission-sangreal-design-guide.md §5, §7
---

- _id: sangreal-l1
  name: 'L1 — Subterranean Vault IX (Vatican City)'
  type: location
  system:
    locationId: L1
    caseId: SANGREAL-87-091
    informationCardSlugs: [sangreal-ic01, sangreal-ic02, sangreal-ic03, sangreal-ic05]
    npcSlugs: [sangreal-npc-ghiberti, sangreal-npc-vane]
    availability: open
    availabilityCondition: ''
    description: >
      <p><strong>Architectural forensics.</strong> Located forty feet beneath the Campo
      Santo Teutonico, reached via a private hydraulic lift concealed behind the Longinus
      Crossing Pier inside St. Peter's Basilica. The vault is an octagonal chamber of
      ancient Roman brick faced with modern lead sheeting, cooled to 2°C by industrial
      refrigeration lines. In the center sits an altar of Swedish black granite, flanked
      by melted copper conduits and scorched masonry. Below the empty electromagnetic
      mooring plinth — the attaché's cradle — a tarnished brass sign reads one word:
      <strong>SANGREAL</strong>. The chamber smells of ozone, cold
      incense, and dried blood.</p>
      <p><strong>Dramatis personae.</strong> Father Ghiberti — nervous Curial archivist,
      keeper of the vault register. Sister Claudia Vane — helpful liaison, present by
      treaty right.</p>
      <p><strong>Available information.</strong> Physical inspection of the altar yields
      I1. Examining the security consoles yields I2. Searching the archival catalog
      reveals I3. Observing Claudia's gear yields I5.</p>
    positiveResult: >
      <p>With Claudia's escort, the cell walks the vault floor legitimately: the melted
      induction cradle (I1), the security console tape (I2), the excised catalog card
      (I3), and the first glimpse of the Watcher's hallmark (I5) are all recoverable
      without alerting Curial security.</p>
    negativeResult: >
      <p>Accessing the vault without alerting Curial security requires successful
      Subterfuge or Bureaucracy rolls. Failure advances Track O1 by 1 square — the
      gendarmerie posts a written irregular-access notice by morning.</p>
    milestoneChanges: >
      <p><strong>O1 M1.</strong> The vault is resealed under L'Entità supervision; further
      access requires forged pontifical documentation. <strong>O1 M2.</strong> The
      register is confiscated and Ghiberti is reassigned. <strong>O1 M3.</strong>
      The chamber is emptied and sanitized — any evidence not already secured is gone.</p>
    npcUuids: []
    informationCardUuids: []
    organizationUuids: []
    locationUuids: []

- _id: sangreal-l2
  name: "L2 — Monsignor Corvi's Private Quarters (Rome)"
  type: location
  system:
    locationId: L2
    caseId: SANGREAL-87-091
    informationCardSlugs: [sangreal-ic02, sangreal-ic04, sangreal-ic16]
    availability: open
    availabilityCondition: ''
    description: >
      <p><strong>Architectural forensics.</strong> A baroque third-floor apartment in the
      Palace of the Holy Office. Thousands of leather-bound patristic volumes line the
      walls. Drawers have been pulled out and searched with academic precision — nothing
      taken, everything displaced. Behind an oil painting of Saint Sebastian sits an open
      wall safe, its mechanical combination lock drilled cleanly.</p>
      <p><strong>Dramatis personae.</strong> Two Vatican gendarmes guard the corridor;
      they admit the team only under Sister Claudia's diplomatic escort.</p>
      <p><strong>Available information.</strong> Searching the Clementine Vulgate yields
      I4. Inspecting the safe yields I16. Blotter impressions on the desk provide a
      duplicate of I2.</p>
    positiveResult: >
      <p>A patient search (Research undertaking) finds the Polybius cipher slip (I4), the
      containment protocol notes (I16), and the agent's own copy of the surveillance
      timeline (duplicate I2). Corvi's handwriting on the desk blotter is legible under
      raking light.</p>
    negativeResult: >
      <p>Spending more than 1 shift here without silencing the guards alerts the Holy
      Alliance, advancing Track O1 by 1 square. A heavy-handed search destroys the
      blotter impressions and the cipher slip's hiding place.</p>
    milestoneChanges: >
      <p><strong>O1 M1.</strong> The apartment is sealed pending "archival inventory" —
      entry thereafter requires a formal writ. <strong>O1 M2.</strong> L'Entità
      sanitizes the apartment overnight; the safe is removed wall and all.</p>
    npcUuids: []
    informationCardUuids: []
    organizationUuids: []
    locationUuids: []

- _id: sangreal-l3
  name: 'L3 — Union de Banques Suisses (Geneva)'
  type: location
  system:
    locationId: L3
    caseId: SANGREAL-87-091
    informationCardSlugs: [sangreal-ic06, sangreal-ic07, sangreal-ic08]
    npcSlugs: [sangreal-npc-mercier]
    availability: clue
    availabilityCondition: 'Requires the EC 30 boarding pass (I2) or the decoded Polybius cipher (I4).'
    description: >
      <p><strong>Architectural forensics.</strong> A neoclassical banking house on the
      Rue du Rhône, clad in gray alpine granite. The subterranean vault features
      three-foot-thick chrome doors and private wood-paneled viewing booths where
      high-net-worth clients transact business anonymously.</p>
      <p><strong>Dramatis personae.</strong> Jean-Paul Mercier — senior vault clerk,
      immaculate suit, visibly anxious. He has read the transaction memos and wants very
      much not to have.</p>
      <p><strong>Available information.</strong> Interrogating or bribing Mercier yields
      I6. Searching booth 4409-C records yields I7 and I8.</p>
    positiveResult: >
      <p>Mercier surrenders the escrow slip under pressure or payment (I6). The booth
      records hand over the clinical file reference (I7) and the wiretap reel log (I8).
      The Geneva corridor opens: Zurich is now on the board.</p>
    negativeResult: >
      <p>Hostile action or triggering the silent bank alarms summons Swiss police within
      10 minutes, consuming 1 shift in legal delays and advancing Track O1 by 1 square.
      The locker's contents are resealed under judicial order.</p>
    milestoneChanges: >
      <p><strong>O2 M1.</strong> Amsterdam has already mapped the Geneva transfers;
      arriving after this milestone means Claudia's updates to her handler are current
      and the bank's staff have been quietly warned about "Covenant interest".
      <strong>O1 M1.</strong> Swiss federal police begin comparing manifests with
      Italian border entries.</p>
    npcUuids: []
    informationCardUuids: []
    organizationUuids: []
    locationUuids: []

- _id: sangreal-l4
  name: 'L4 — Privatklinik Sonnenberg (Zurich)'
  type: location
  system:
    locationId: L4
    caseId: SANGREAL-87-091
    informationCardSlugs: [sangreal-ic07, sangreal-ic09, sangreal-ic10, sangreal-ic11]
    npcSlugs: [sangreal-npc-graf, sangreal-npc-hausmann]
    availability: clue
    availabilityCondition: 'Requires the escrow transfer slip (I6) or the clinical file (I7).'
    description: >
      <p><strong>Architectural forensics.</strong> A modernist clinical facility of white
      concrete and glass in the forests of the Zurichberg. The third-floor experimental
      oncology ward is blacked out: windows are taped with heavy black polyethylene
      sheeting, and fluorescent lights are smashed. The air smells of bleach, decaying
      flesh, and fresh blood.</p>
      <p><strong>Dramatis personae.</strong> Dr. Elizabeth Graf — traumatized
      pathologist hiding in a surgical theater, determined to destroy her own research.
      Kurt Hausmann — The Feral Banker, stalking the ceiling conduits above the ward.</p>
      <p><strong>Available information.</strong> Rescuing Dr. Graf yields I7, I9, and
      I10. Searching the laboratory freezers yields I11.</p>
    positiveResult: >
      <p>Calming Graf (first aid, light discipline, or psychiatric intervention) secures
      the full medical sequence: patient file (I7), histopathology log (I9), and the CT1
      vector mechanics (I10). The lab freezers give up the resonance field records (I11).
      This is where the False Revelation is meant to land.</p>
    negativeResult: >
      <p>Kurt Hausmann hunts from the shadows. He is repelled by flares and ultraviolet
      torches but cannot be reasoned with. Gunfire or loud combat brings Swiss tactical
      police, costing 2 shifts and advancing Tracks O1 and O2 by 2 squares each. A
      panicked Graf destroys her slides unless someone takes the time to steady her.</p>
    milestoneChanges: >
      <p><strong>O1 M2.</strong> The Sanitization Sweep arrives: Graf is targeted for
      liquidation and all oncology records are incinerated if the cell has not already
      secured them. <strong>O2 M1.</strong> Talamasca cleaners have swept the ward of
      Claudia's traces — the intercept reel log is the only remaining lead to the
      wiretap.</p>
    npcUuids: []
    informationCardUuids: []
    organizationUuids: []
    locationUuids: []

- _id: sangreal-l5
  name: 'L5 — Lingotto Fiat Assembly Complex (Turin)'
  type: location
  system:
    locationId: L5
    caseId: SANGREAL-87-091
    informationCardSlugs: [sangreal-ic10, sangreal-ic11, sangreal-ic12]
    npcSlugs: [sangreal-npc-corvi, sangreal-npc-vane]
    availability: clue
    availabilityCondition: 'Requires the wiretap tape (I8).'
    description: >
      <p><strong>Architectural forensics.</strong> Giacomo Mattè-Trucco's industrial
      plant, stretching a third of a mile with concrete spiral ramps and a rooftop test
      track. Rain cascades through broken skylights into abandoned assembly halls.
      Monsignor Corvi has barricaded himself in an overhead glass supervisor's booth
      fifty feet above the factory floor, holding the steel attaché case.</p>
      <p><strong>Dramatis personae.</strong> Monsignor Matteo Corvi — exhausted,
      feverish, at the end of his flight. Sister Claudia Vane — to Corvi's back,
      diplomatically, exactly where she wants to be.</p>
      <p><strong>Available information.</strong> Peaceful negotiation with Corvi yields
      I10, I11, and I12. Securing the attaché grants physical possession of the primary
      relic.</p>
    positiveResult: >
      <p>Corvi talks: the vector mechanics (I10), the resonance field (I11), and his own
      translation of the Gospel of the Twelve (I12). If the cell demonstrates independent
      custodial credentials and cites Ebionite theology, he surrenders the case to them —
      and the room goes quiet enough to hear Claudia's thread snap.</p>
    negativeResult: >
      <p><strong>The Betrayal Set-Piece.</strong> Once Corvi surrenders the briefcase,
      Claudia snaps The Veil of Veronica's Thread. A blinding phosphorus flash forces an
      Endure check against flash-blindness; Claudia vanishes with the case and the agents'
      transport line. Failure to reconstruct her escape route costs 2 shifts and advances
      Track O2 to Milestone M3.</p>
    milestoneChanges: >
      <p><strong>O2 M3.</strong> After the green-light is executed, the Talamasca no
      longer needs the cell: Claudia's movements become untraceable without physical
      evidence (toll stubs, teleprinter logs, Corvi's papers). <strong>O1 M2.</strong>
      L'Entità watches the plant through binoculars from the Fiat access road; a wide
      public incident here triggers the sanitization sweep early.</p>
    npcUuids: []
    informationCardUuids: []
    organizationUuids: []
    locationUuids: []

- _id: sangreal-l6
  name: 'L6 — The Fortified Retreat of San Nazzaro (Novara)'
  type: location
  system:
    locationId: L6
    caseId: SANGREAL-87-091
    informationCardSlugs: [sangreal-ic13, sangreal-ic14, sangreal-ic15]
    npcSlugs: [sangreal-npc-vane]
    availability: clue
    availabilityCondition: 'Requires tracking Claudia — toll stubs, teleprinter logs, or Corvi''s papers.'
    description: >
      <p><strong>Architectural forensics.</strong> An eleventh-century fortified brick
      abbey along the Sesia river plains near Novara. The perimeter features defensive
      moats and brick walls. The heavy oak carriage doors have been broken inward, their
      iron hinges torn from the masonry. A single kerosene lantern illuminates the
      stone-flagged dining hall.</p>
      <p><strong>Dramatis personae.</strong> Sister Claudia Vane — corpse, pinned to the
      dining table. Her killers are already airborne.</p>
      <p><strong>Available information.</strong> Autopsy of Claudia yields I13. Searching
      her satchel yields I14. Checking the telegraph desk yields I15.</p>
    positiveResult: >
      <p>Full forensics: the slaughter scene (I13), the Registry 16 telex (I14), and the
      Cessna 421 clearance (I15). The cell learns — too late — what it was really carrying
      and where it went.</p>
    negativeResult: >
      <p>Spending more than 1 shift here brings military police from the nearby
      Novara-Cameri air base, initiating an armed standoff and costing 2 shifts. Evidence
      left behind is impounded; some of it will never be seen again.</p>
    milestoneChanges: >
      <p><strong>O2 M3.</strong> The Elder Cleansing Strike has already happened; arriving
      after this milestone means the body is cold, the telex ash is cold, and the tarmac
      window is minutes wide. <strong>O1 M2.</strong> L'Entità's cleanup teams arrive
      behind the vampires to burn the abbey records — the two factions colliding in the
      same building is the case's loudest possible alarm.</p>
    npcUuids: []
    informationCardUuids: []
    organizationUuids: []
    locationUuids: []

- _id: sangreal-l7
  name: 'L7 — Palace of the Congregation for the Doctrine of the Faith (Vatican City)'
  type: location
  system:
    locationId: L7
    caseId: SANGREAL-87-091
    informationCardSlugs: [sangreal-ic16, sangreal-ic17]
    npcSlugs: [sangreal-npc-sabbatini, sangreal-npc-ghiberti]
    availability: contact
    availabilityCondition: 'Requires confronting Cardinal Sabbatini with evidence from L6 (corpse, telex, flight manifest).'
    description: >
      <p><strong>Architectural forensics.</strong> The headquarters of the Inquisition,
      situated outside the southern colonnade of St. Peter's. The Council Chamber features
      Renaissance ceiling frescoes depicting the defeat of heresy, walnut paneling, and
      green banker lamps illuminating classified dossiers.</p>
      <p><strong>Dramatis personae.</strong> Cardinal Enrico Sabbatini — Prefect, and no
      longer pretending otherwise. Father Ghiberti — summoned, terrified, useful.</p>
      <p><strong>Available information.</strong> Confronting Sabbatini with Claudia's
      corpse, the telex, and the flight manifest unlocks the containment protocols (I16).
      Searching Claudia's convent room yields I17.</p>
    positiveResult: >
      <p><strong>Operational Resolution.</strong> Sabbatini admits the Church's historic
      deterrence strategy and signs the Concordat Requisition Order, providing diplomatic
      cover, weapons clearances, and funding for Mission 2: Recover the Sangreal. The
      Covenant exits the case with a mandate and a debt.</p>
    negativeResult: >
      <p>Displays of force or moralizing in the Council Chamber provoke an imperious
      dismissal (His Eminence's difficulty is 4). Without the L6 evidence, Sabbatini
      offers nothing but condolences and a limousine. L'Entità closes its doors and the
      Concordat funding never materializes.</p>
    milestoneChanges: >
      <p><strong>O1 M3.</strong> The Holy Crusade: by the time the cell reaches the
      Council Chamber, the Swiss Guard squad detailed to sanitize them is already in the
      antechamber. Sabbatini either calls it off — or it executes. <strong>O2 M3.</strong>
      Amsterdam sends a formal, bland note of condolence for "our missing sister",
      dead-ending diplomatic recourse.</p>
    npcUuids: []
    informationCardUuids: []
    organizationUuids: []
    locationUuids: []

- _id: sangreal-org-alliance
  name: "O1 — The Holy Alliance (L'Entità)"
  type: organization
  system:
    organizationId: O1
    caseId: SANGREAL-87-091
    npcSlugs: [sangreal-npc-sabbatini, sangreal-npc-entita-operative]
    locationSlugs: [sangreal-l1]
    isActive: true
    isDormant: false
    description: >
      <h3>Public Identity</h3>
      <p>Pontifical diplomacy, doctrinal oversight, historical preservation. The Holy
      See's oldest continuous intelligence apparatus, formalized in the twentieth century
      as <em>L'Entità</em> and operating under the motto <em>Cum Cruce et Gladio</em>
      ("With Cross and Sword").</p>
      <h3>Clandestine Core</h3>
      <p>Covert wet-work, geopolitical intelligence, and occult quarantine. The Church
      suppresses preternatural artifacts out of geopolitical necessity, not religious
      puritanism. Vault IX was never a devotional shrine: it was a biological deterrent
      held against the aristocratic vampire dynasties of Eastern Europe.</p>
      <h3>Countdown Track — 10 squares</h3>
      <p>Advances when the cell causes public disturbances, damages church property, or
      challenges clerical authority. (Track this countdown here and on the DA brief;
      the Operations Board app does not read item-based case files.)</p>
      <ul>
      <li><strong>7 — Frontier Cloak (M1):</strong> L'Entità activates its network inside
      the Italian Ministry of the Interior. Swiss-Italian border crossings fall under
      paramilitary surveillance; overland movement requires forged passports or costs an
      additional operational shift.</li>
      <li><strong>4 — Sanitization Sweep (M2):</strong> Vatican containment operatives
      clean up the Privatklinik Sonnenberg. Dr. Elizabeth Graf is targeted for liquidation
      and all oncology records are incinerated if the investigators have not secured
      them.</li>
      <li><strong>1 — Holy Crusade (M3):</strong> Cardinal Sabbatini concludes the
      Covenant cell has uncovered the biological truth. An armed tactical squad of
      plainclothes Swiss Guard commandos deploying phosphorus grenades intercepts the team
      to sanitize the operation.</li>
      </ul>
      <h3>Strategic Goal</h3>
      <p>Unconditional recovery of the Twelve Phials, total public suppression of the
      breach, and retention of the cure as an institutional deterrent. The Covenant is a
      tool to be hired, manipulated, and discarded if it uncovers the truth.</p>
    npcUuids: []
    locationUuids: []

- _id: sangreal-org-talamasca
  name: 'O2 — The Order of the Talamasca (Registry 16)'
  type: organization
  system:
    organizationId: O2
    caseId: SANGREAL-87-091
    npcSlugs: [sangreal-npc-vane, sangreal-npc-basarab-operative, sangreal-npc-basarab-elder]
    locationSlugs: [sangreal-l5, sangreal-l6]
    isActive: true
    isDormant: false
    description: >
      <h3>Public Identity</h3>
      <p>A secular historical foundation and antiquarian library — the "psychic
      detectives" and chroniclers of the preternatural world. Autonomous Motherhouses in
      London, Amsterdam, and Rome, with secondary archival libraries worldwide. Field
      researchers carry unembellished business cards inscribed with the motto:
      <em>"We watch, and we are always there."</em></p>
      <h3>Clandestine Core — Registry 16</h3>
      <p>The Amsterdam Motherhouse's covert operational arm: sensitive intelligence
      collection, recovery of hazardous artifacts, and preemptive neutralization of
      existential threats to preternatural survival. Its mortal operatives are conditioned
      to believe the Order is a benign scholarly body; its hidden elders include ancient
      vampire bloodlines that retain control over executive policy.</p>
      <p>Sister Claudia Vane — trained in paleography and counter-surveillance, embedded
      in the Vatican's Congregation for the Doctrine of the Faith — is one of its operatives.
      She believes the phials contain a primordial demonic contagion. She does not know
      her true superiors are executing a counter-measure to destroy the only substance on
      Earth capable of purging their immortality.</p>
      <h3>Countdown Track — 12 squares</h3>
      <p>Advances as Claudia transmits progress reports or as the cell accesses
      preternatural nodes. (Track this countdown here and on the DA brief.)</p>
      <ul>
      <li><strong>9 — Signal Intercept (M1):</strong> Listening posts in Amsterdam decrypt
      Swiss PTT telex transmissions. The Talamasca maps the Covenant's operational path,
      feeding encrypted updates to Claudia.</li>
      <li><strong>6 — Extraction Green-Light (M2):</strong> Claudia receives coded
      authorization to execute field theft of the steel attaché as soon as Monsignor Corvi
      is isolated. The trigger moment is L5.</li>
      <li><strong>2 — Elder Cleansing Strike (M3):</strong> The hidden vampire retrieval
      pack locates the Novara safehouse, executes Claudia to ensure the cure cannot be
      turned against their bloodlines, and takes the case to the airstrip.</li>
      </ul>
      <h3>Strategic Goal</h3>
      <p>Interception of the Twelve Phials via double agent, extraction to Eastern Europe,
      and permanent industrial incineration of the cure. Protect the bloodline — at any
      cost to mortal lives.</p>
    npcUuids: []
    locationUuids: []
