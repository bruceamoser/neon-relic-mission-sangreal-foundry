- _id: sangreal-l4
  name: 'L4 — Privatklinik Sonnenberg (Zurich)'
  type: location
  system:
    locationId: L4
    caseId: SANGREAL-87-091
    informationCardSlugs: [sangreal-ic07, sangreal-ic09, sangreal-ic10, sangreal-ic11, sangreal-ic27, sangreal-ic28, sangreal-ic29, sangreal-ic30, sangreal-ic31, sangreal-ic32]
    npcSlugs: [sangreal-npc-graf, sangreal-npc-hausmann]
    availability: clue
    availabilityCondition: 'Requires the escrow transfer slip (I06) or the clinical file (I07).'
    description: >
      <p><strong>Read aloud.</strong> <em>White concrete and glass between the trees, and one floor of it gone wrong: the third-storey windows taped over in black polyethylene, width-matched strips, neat — the work of somebody who knew what was coming. Inside the ward the tubes are smashed and the air is thick with bleach and something older. Nothing moves. Then something shifts in the ceiling conduit above you.</em></p>
      <p><strong>The place.</strong> A modernist clinical facility of white
      concrete and glass in the forests of the Zurichberg. The third-floor experimental
      oncology ward is blacked out: windows are taped with heavy black polyethylene
      sheeting, and fluorescent lights are smashed. The air smells of bleach, decaying
      flesh, and fresh blood.</p>
      <p><img src="modules/neon-relic-mission-sangreal/assets/art/scenes/totm/tm-clinic-arrival.webp" alt="Sonnenberg forest approach" style="width:100%;height:auto"></p>
      <p><strong>Who is here.</strong></p>
      <ul>
      <li><strong>Dr. Elizabeth Graf</strong> — no sleep, glasses pushed up into her hair, a slide box held against her chest like a shield, matches she keeps moving further from the slides. <em>Wants</em> the work destroyed and her family out of the country; <em>will not</em> leave without her slides and will burn them rather than hand them over; she lies once — that she has only the slides in her hands. <em>Knows:</em> the batch numbers, the sponsor account, the six-shift window, and the composition of the quiescence kit on her bench. She is the only NPC who will say the word <em>cure</em> before the Lingotto, and only if the histopathology is already on the table.</li>
      <li><strong>Kurt Hausmann</strong> — an expensive suit that no longer fits, in a room with the lights killed, still lucid, radiant and wrong. He has not slept since the injection and does not leave the ward. <em>Wants</em> to understand what was done to him and will talk about it freely; <em>will not</em> admit what he has begun to want at night — press him and he answers with perfect courtesy and moves to the far side of the room. <em>Knows:</em> that a Church account arranged the injection, that the man who paid brought the case himself and would not open it.</li>
      <li><strong>The night staff</strong> — a duty nurse, a porter, a records clerk. Ordinary people on a shift. <em>Know</em> who is on three, who signs for deliveries, and that Graf has been sleeping in her office; they volunteer all of it for a polite question. Lean on them and they call the day manager, and the cell loses a shift of access.</li>
      </ul>
      <p><strong>What is here.</strong></p>
      <ul>
      <li>I27 — Intake Photograph, 09-H: a gaunt elderly man with an identification board and a gold wristwatch still on his wrist. Pair it with F05 — the horror is the pairing, never the picture alone. <em>Gate:</em> the ward wall (free) or the records room (<em>Tech (WIT) Difficulty 2</em>).</li>
      <li>I09 — Histopathology Log: Marrow Graft, I28 — Photophobia Test 02:40, I12 — Palimpsest Leaf: the medical and documentary proof. Filaments in no known tissue, annotated <em>foreign graft — not infection</em>; burns outlining a strip light's footprint; Corvi's own margin line, <em>sanguis remedium, non sacramentum</em>. <em>Gate:</em> Graf's cooperation — hold I12 until the table has seen I09.</li>
      <li>I29 — The Injection Log and I30 — Ward 3, Corridor Camera: the sponsor's Vaduz trust account, and the ceiling silhouette at the top of the frame with the spill trail stopping under a service duct at 02:40. Proves a real institution paid, and that the thing on the third floor is not human violence. <em>Gate:</em> first aid and light discipline for Graf; <em>Tech (WIT) Difficulty 2</em> or the night porter's keys for the tape.</li>
      <li>I10 — The Vector Mechanics (CT1) and I11 — The Resonance Field (CT2): the six-shift conversion window, and blood bags spoiled by proximity. <em>Gate:</em> the lab material, 1 shift; the freezer chart is <em>Tech (WIT) Difficulty 2</em> but the card is theirs by Day 4 either way.</li>
      <li>I31 — Sonnenberg, Observed and I32 — Daylight Test: Combustion: the perimeter photographs of both factions watching the clinic, and white ash in the fume hood identical to the fingers that end the case. <em>Gate:</em> the night shift, 1 shift; the pathology lab, 1 shift, no roll.</li>
      </ul>
      <section class="sangreal-scene-links"><h3>Scene backgrounds</h3><ul><li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.kr4nu0sVNfrcGAJq]{TM06 — Sonnenberg forest approach}</li><li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.1HRljmcL11d0CPLS]{TM07 — Blacked-out third-floor ward}</li><li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.jP9jheucndZOEHLE]{TM08 — Surgical theatre refuge}</li><li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.jpOPWYTG4Yqt6hk4]{BM04 — Ward, theatre and lab}</li></ul><p>GM: import the scene, then view or activate it when appropriate. Gridless; adjust token scale for your table. Maps expose room layouts.</p></section>
    positiveResult: >
      <p>Calming Graf (first aid, light discipline, or psychiatric intervention) secures
      the full medical sequence: patient file (I07), histopathology log (I09), and the CT1
      vector mechanics (I10). The lab freezers give up the resonance field records (I11).
      This is where the False Revelation is meant to land.</p>
    negativeResult: >
      <p>Kurt Hausmann hunts from the shadows. He is repelled by flares and ultraviolet
      torches but cannot be reasoned with. Gunfire or loud combat brings Swiss tactical
      police, costing 2 shifts and advancing Tracks O1 and O2 by 2 squares each. A
      panicked Graf destroys her slides unless someone takes the time to steady her.</p>
    milestoneChanges: >
      <p><strong>O1 M2.</strong> The Sanitization Sweep arrives: Graf is targeted for
      liquidation and all oncology records are incinerated if the cell has not already
      secured them. <strong>O2 M1.</strong> Talamasca cleaners have swept the ward of
      Claudia's traces — the intercept reel log is the only remaining lead to the
      wiretap.</p>
    npcUuids: []
    informationCardUuids: []
    organizationUuids: []
    locationUuids: []

- _id: sangreal-l5
  name: 'L5 — Lingotto Fiat Assembly Complex (Turin)'
  type: location
  system:
    locationId: L5
    caseId: SANGREAL-87-091
    informationCardSlugs: [sangreal-ic10, sangreal-ic11, sangreal-ic12, sangreal-ic33, sangreal-ic34, sangreal-ic35, sangreal-ic36, sangreal-ic37]
    npcSlugs: [sangreal-npc-corvi, sangreal-npc-vane]
    availability: clue
    availabilityCondition: 'Requires the wiretap tape (I08).'
    description: >
      <p><strong>Read aloud.</strong> <em>Four hundred metres of concrete and iron and broken glass, rain coming through the skylights in ropes. The assembly lines are dead and the spiral ramp curves away into the dark. High up on the far side, one glass box is lit. Inside it a man in a priest's coat has been praying out loud for two days and has stopped being sure anyone is listening.</em></p>
      <p><strong>The place.</strong> Giacomo Mattè-Trucco's industrial
      plant, stretching a third of a mile with concrete spiral ramps and a rooftop test
      track. Rain cascades through broken skylights into abandoned assembly halls.
      Monsignor Corvi has barricaded himself in an overhead glass supervisor's booth
      fifty feet above the factory floor, holding the steel attaché case.</p>
      <p><img src="modules/neon-relic-mission-sangreal/assets/art/scenes/totm/tm-factory-arrival.webp" alt="Lingotto assembly hall" style="width:100%;height:auto"></p>
      <p><strong>Who is here.</strong></p>
      <ul>
      <li><strong>Monsignor Matteo Corvi</strong> — unshaven, three days in the same coat, feverish from sleeping beside the case, praying in Latin. <em>Wants</em> to be found by the right people and to explain himself to somebody who will understand the theology; <em>will not</em> be moved by authority alone — anything that sounds like the Holy Alliance and he destroys his notebook and runs deeper into the works. <em>Knows:</em> the Ebionite fragments, the translation, what the twelve phials are, and why the Church built a prison rather than a reliquary. Every fact this case calls the paradigm inversion comes out of his mouth if the cell sounds like custodians rather than enforcers.</li>
      <li><strong>Sister Claudia Vane</strong> — at Corvi's back, diplomatic, precisely where she wants to be, arguing hard for moving on tonight. <em>Wants</em> the case in her hands and the cell used up getting it there; <em>will not</em> touch the case in front of witnesses, be separated from it, or fight to win — only to escape with it. <em>Knows:</em> her own orders and the Talamasca's position, and sincerely believes the phials hold a plague. She never says her handler's name — and if the cell mentions Amsterdam in front of Corvi she interrupts, compliments the research and changes the subject. That is the most visible thing she does all case.</li>
      <li><strong>The Turin Intermediary</strong> — a heavy-set broker in a good coat with a cigar, never facing a camera. <em>Wants</em> money and a train out; <em>will not</em> be moved by threats. <em>Knows:</em> who is buying, roughly how many, what they arrived on, and that they asked for the phials rather than the case. He does not know they are not human and does not care.</li>
      </ul>
      <p><strong>What is here.</strong></p>
      <ul>
      <li>I30/I34-type vault material, I10 and I11 if missed in Zurich: the vector mechanics and the resonance records. <em>Gate:</em> the Day 5 and Day 4 packets, or Corvi's own papers.</li>
      <li>I34 — Assembly Hall, Camera 6: the case's deadbolt taped over — a field repair on a cracked latch — and Corvi casting no shadow in the puddles. <em>Gate:</em> the control room, 1 shift.</li>
      <li>I37 — The Empty Needle: a split rosary bead with a clean deliberate cut and ochre fibres inside. The best early-warning prop in the case — a cell that finds it here can pre-empt the betrayal entirely. <em>Gate:</em> searching Claudia's kit while it is unattended — <em>Sneak (AGI) Difficulty 2</em>; she notices a clumsy attempt and repacks it out of reach.</li>
      <li>I12 — Palimpsest Leaf, Codex, I33 — Lingotto, Rooftop, Rain, I35 — Breve Apostolicum, 1582 and I36 — Suppressed Index Card: Corvi's translation, the frame the cell can take themselves from the test track, and the two Roman documents if they were missed. <em>Gate:</em> Corvi's surrender, a camera and a vantage point, and the Day 5 packet respectively.</li>
      </ul>
      <section class="sangreal-scene-links"><h3>Scene backgrounds</h3><ul><li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.n61lTAaEdGfuCmPZ]{TM09 — Lingotto assembly hall}</li><li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.eu4Vy9WBx8iGce1d]{TM10 — Lingotto rooftop in rain}</li><li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.jqBp0bbZpuYJAVE1]{BM05 — Assembly floor}</li><li>@UUID[Compendium.neon-relic-mission-sangreal.sangreal-scenes.Scene.gAxI1cJhYftPzFGK]{BM06 — Supervisor booth and catwalk}</li></ul><p>GM: import the scene, then view or activate it when appropriate. Gridless; adjust token scale for your table. Maps expose room layouts.</p></section>
    positiveResult: >
      <p>Corvi talks: the vector mechanics (I10), the resonance field (I11), and his own
      translation of the Gospel of the Twelve (I12). If the cell demonstrates independent
      custodial credentials and cites Ebionite theology, he surrenders the case to them —
      and the room goes quiet enough to hear Claudia's thread snap.</p>
    negativeResult: >
      <p><strong>The Betrayal Set-Piece.</strong> Once Corvi surrenders the briefcase,
      Claudia snaps The Veil of Veronica's Thread. A blinding phosphorus flash forces an
      Endure check against flash-blindness; Claudia vanishes with the case and the agents'
      transport line. Failure to reconstruct her escape route costs 2 shifts and advances
      Track O2 to Milestone M3.</p>
    milestoneChanges: >
      <p><strong>O2 M3.</strong> After the green-light is executed, the Talamasca no
      longer needs the cell: Claudia's movements become untraceable without physical
      evidence (toll stubs, teleprinter logs, Corvi's papers). <strong>O1 M2.</strong>
      L'Entità watches the plant through binoculars from the Fiat access road; a wide
      public incident here triggers the sanitization sweep early.</p>
