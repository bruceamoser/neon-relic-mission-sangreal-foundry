        description: 'Requires blood (1 STR or 1 Stress) and an apostolic prayer to activate.'
        checked: false
      - id: CT2
        description: 'The stone draws warmth from the holder; repeated use numbs the fingers.'
        checked: false
      - id: CT3
        description: 'Stored in silk, away from ferrous metals — otherwise it drags loose hardware toward itself.'
        checked: false
      - id: ''
        description: ''
        checked: false
