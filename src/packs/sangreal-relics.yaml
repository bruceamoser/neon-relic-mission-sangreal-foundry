        checked: false
      - id: ''
        description: ''
        checked: false
      - id: ''
        description: ''
        checked: false
    relicImage: modules/neon-relic-mission-sangreal/assets/art/relic-lodestone.svg
    daNotes: >
      <p>The breach tool and the proof of premeditation. The residue in the vault's copper
      conduits (I1) is the strongest physical evidence in the Rome cluster — let careful
      players earn it. If the cell recovers the Lodestone itself, it becomes a tactical
      answer to electronic security for the rest of the case.</p>
    caseId: SANGREAL-87-091
    description: >
      <p>VC-16 relic sheet for the vault-breach artifact. DA eyes only.</p>

- _id: sangreal-vc16-veronica
  name: "VC-16 — The Veil of Veronica's Thread"
  type: relicSheet
  system:
    relicName: "The Veil of Veronica's Thread"
    tier: 1
    category: object
    riskTag: 'Single-Use Relic'
    corruptionCost: 1
    artifactDie: d4
    emissionType: 'Burst — phosphorus flash + 5-minute displacement'
    mundaneAppearance: 'A frayed ochre thread on an unadorned silver needle, tucked inside wooden rosary beads like an unfinished repair.'
    surfaceRead: >
      <p>A sewing repair. Utterly unremarkable, even under inspection by someone who does
      not know to look inside the beads.</p>
    operationalRead: >
      <p>Post-flash forensic sites show phosphorus residue with no accelerant, no heat
      bloom, and no tracks leaving the point of disappearance. Tape and film near an
      activation read as blank or fully overexposed.</p>
    coldArchiveRead: >
      <p>Listed in the suppressed index as a "Veronica type" single-use displacement
      device — cloister-made, originally for extracting confessors from hostile
      jurisdictions. The Talamasca has acquired three in eighty years. This is the
      fourth.</p>
    activationCondition: >
      Snap the thread while whispering <em>Nunc Dimittis</em>. Single use; burns to white
      ash.
    mechanicalEffect: >
      <p>Instant phosphorus flash — everyone with line of sight must pass an Endure check
      or suffer flash-blindness for 2 rounds. The user vanishes from sight, sound, and
      electronic surveillance for 5 minutes, leaving no scent or tracks. They reappear
      wherever they stopped walking.</p>
    fractureCondition: >
      Gear Die 1 — the flash fires but the displacement fails. The user is blind, marked,
      and standing exactly where they were.
    containmentProfile: >
      Handle only when ready to burn it. There is no way to test the thread without
      consuming it, and no way to track a displaced user once it is spent.
    containmentTruths:
      - id: CT1
        description: 'Single activation: snap and whisper. The thread burns to ash.'
        checked: false
      - id: CT2
        description: 'The thread smells of sweat and grave cloth; prolonged handling distresses animals.'
        checked: false
      - id: CT3
        description: 'No recovery after use. The needle remains; the thread is gone.'
        checked: false
      - id: ''
        description: ''
        checked: false
      - id: ''
        description: ''
        checked: false
      - id: ''
        description: ''
        checked: false
      - id: ''
        description: ''
        checked: false
      - id: ''
        description: ''
        checked: false
    relicImage: modules/neon-relic-mission-sangreal/assets/art/relic-veronica.svg
    daNotes: >
      <p>Claudia's escape hatch and the engine of the Turin betrayal. When it fires at L5,
      the cell loses the case and their transport line — play the five minutes of absence
      as a cold, quiet horror rather than a chase. The thread does not fail Claudia; it
      simply runs out at Novara, where the Basarab pack does not need to track her at all.
      They were already waiting.</p>
    caseId: SANGREAL-87-091
    description: >
      <p>VC-16 relic sheet for the Talamasca extraction device. DA eyes only.</p>

