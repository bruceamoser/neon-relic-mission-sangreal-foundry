# Mission: Sangreal — Relics & Equipment (Item pack)
# Items: artifact, relicSheet, weapon, gear
# Source: docs/mission-sangreal-design-guide.md §4, §7–§8
---

- _id: sangreal-relic-phials
  name: 'The Twelve Phials of Gethsemane'
  type: artifact
  img: modules/neon-relic-mission-sangreal/assets/art/relic-phials.webp
  system:
    tier: 3
    corruptionCost: 3
    artifactDie:
      current: d20
      starting: d20
    activationCondition: >
      Introduction into open tissue or mucous membranes (CT1). The vector activates on
      contact — ingestion, injection, or blood-to-wound exposure. Handling an unsealed
      phial without protection is a containment breach.
    effect: >
      <p><strong>Human ingestion.</strong> The subject gains +3 STR, +3 AGI, +2 Armor
      Rating, severe photophobia (2 Physical Damage per round in direct sunlight), and an
      insatiable hunger for living human blood (Willpower/Discipline checks required to
      resist attacking wounded targets).</p>
      <p><strong>Vampiric ingestion.</strong> The subject must pass an Endure check against
      Difficulty 5. Failure triggers rapid biological decay — physical cells age centuries
      in seconds, reducing the body to calcified ash in three combat rounds. Success purges
      all supernatural traits, leaving a dying mortal subject suffering systemic organ
      failure.</p>
    fractureCondition: >
      On a Gear Die 1 while handling the case under stress, roll the
      <em>Phial Fracture (d6)</em> table in the Relic Tables pack.
    emission:
      type: pulse
      radius: '100 m'
      trigger: 'Proximity to wounded, anemic, or terminally ill individuals'
      corruptionAmount: 1
      isSuppressed: false
    containmentProfile:
      type: 'Sovereign Bio-Vector'
      isContained: false
      truths:
        triggerCondition: >
          CT1 — Contact with open tissue or mucous membranes. Uninfected humans convert
          within six shifts (24 hours); active vampires burn to ash in minutes.
        appetite: >
          CT2 — Within 100 meters, unshielded phials psychically pull the sick and wounded
          toward consumption while accelerating their cellular decay.
        quiescenceCondition: >
          CT3 — Absolute darkness, lead-antimony foil below 4°C, wrapped in unbleached
          linen soaked in gall, wine vinegar, and myrrh. Daylight causes the fluid to boil
          and combust into white ash.
    activePressure: false
    decay:
      value: 0
      enabled: false
    replicable: false
    loreIdentified: false
    description: >
      <p>A 1964 brushed-steel diplomatic attaché case lined with lead-antimony foil and
      secured by dual mechanical combination deadbolts. The interior holds a molded blue
      velvet rack of twelve cylindrical, thick-walled Roman glass phials, each sealed with
      imperial red beeswax and inscribed with cursive Aramaic characters. Every phial holds
      50 ml of dark, un-coagulated arterial blood.</p>
      <p>The craftsmanship is late Roman; the contents are not. The fluid has never
      coagulated, never cooled below body temperature, and never stopped reacting to the
      living.</p>

- _id: sangreal-vc16-phials
  name: 'VC-16 — Twelve Phials of Gethsemane'
  type: relicSheet
  system:
    relicName: 'The Twelve Phials of Gethsemane'
    tier: 3
    category: object
    riskTag: 'Sovereign Bio-Vector'
    corruptionCost: 3
    artifactDie: d20
    emissionType: 'Pulse — 100 m hematological field'
    mundaneAppearance: >
      A locked 1964 steel attaché case. Heavy for its size. Warm to the touch near the
      hinges. The brass combination dials carry no manufacturer's mark.
    surfaceRead: >
      <p><strong>Orthodox exterior.</strong> A 1964 steel diplomatic attaché held in
      Vatican custody. The Holy See refuses to describe its contents; the only detail
      on record is a tarnished brass sign reading SANGREAL, recovered from below the
      case's electromagnetic mooring plinth. Diplomatic property, sealed under
      pontifical treaty, and certified as generating zero bio-contamination and zero
      occult hazard.</p>
    operationalRead: >
      <p><strong>Forensic anomaly.</strong> The blood is un-coagulated after nearly two
      millennia and reads as oxygenated arterial fluid. The case lining is lead-antimony,
      not leather or felt. Photographic analysis of the theft shows the case casts an
      opaque, pitch-black shadow. Around the sick and wounded, the phials exert a
      measurable psychic pull and accelerate cellular decay.</p>
    coldArchiveRead: >
      <p><strong>Subversive synthesis.</strong> The suppressed index of the Secret Archives
      does not catalog the phials as relics of devotion. Vault IX held them as an
      instrument of deterrence: the bloodline of an immune carrier whose biology unmakes
      the curse others call immortality. Rome never venerated the Sangreal. It stockpiled
      it.</p>
    activationCondition: >
      Contact with open tissue or mucous membranes. The vector does not negotiate: it
      rewrites what it touches. Ingestion by an uninfected human forces mutagenic
      conversion within six shifts; ingestion by an active vampire breaks necrotic stasis
      and ages the body to ash in minutes (Endure Difficulty 5 negates, leaving a dying
      mortal).
    mechanicalEffect: >
      <p>See the artifact item <strong>The Twelve Phials of Gethsemane</strong> for the
      full mechanical profile: +3 STR / +3 AGI / +2 AR and blood-hunger for converted
      humans; fatal senescence for vampires. Exposure to direct sunlight destroys a phial's
      contents (white ash) — and ruptures the glass catastrophically.</p>
    fractureCondition: >
      Fracture on Gear Die 1s while the case is handled under pressure — roll the
      <em>Phial Fracture (d6)</em> table: hairline stress, vapor leak, catastrophic
      rupture, or resonance detonation.
    containmentProfile: >
      Keep sealed in darkness, wrapped in gall/vinegar/myrrh-soaked linen, inside
      lead-antimony foil below 4°C. Never open in daylight. Never handle unshielded near
      the injured. If a phial breaks: clear the area, suppress sunlight, and expect
      reanimation in the dark.
    containmentTruths:
      - id: CT1
        description: 'Contact with open tissue or mucous membranes converts humans within six shifts and destroys vampires in minutes.'
        checked: false
      - id: CT2
        description: 'Within 100 m, unshielded phials psychically pull the sick toward consumption and accelerate their decay.'
        checked: false
      - id: CT3
        description: 'Absolute darkness, lead-antimony foil below 4°C, unbleached linen soaked in gall, wine vinegar, and myrrh. Daylight burns it to ash.'
        checked: false
      - id: ''
        description: ''
        checked: false
      - id: ''
        description: ''
        checked: false
      - id: ''
        description: ''
        checked: false
      - id: ''
        description: ''
        checked: false
      - id: ''
        description: ''
        checked: false
    relicImage: modules/neon-relic-mission-sangreal/assets/art/relic-phials.svg
    daNotes: >
      <p>The case's centerpiece and the campaign's moral fulcrum. Rome calls it a
      deterrent; Amsterdam calls it an execution order; the truth is that it is a cure no
      one dares use. Guard the pacing: the relic should feel seductive to the desperate and
      monstrous to the principled. The fracture table is the pressure valve for every
      careless handoff.</p>
    caseId: SANGREAL-87-091
    description: >
      <p>VC-16 relic sheet for the mission's central artifact. DA eyes only.</p>

- _id: sangreal-relic-lodestone
  name: 'The Lodestone of St. Jude'
  type: artifact
  img: modules/neon-relic-mission-sangreal/assets/art/relic-lodestone.webp
  system:
    tier: 1
    corruptionCost: 1
    artifactDie:
      current: d6
      starting: d6
    activationCondition: >
      The user coats the stone in saliva and fresh arterial blood — inflicting 1 STR
      damage or 1 Stress — while reciting an apostolic prayer.
    effect: >
      <p>Generates a 5-meter <em>Null-Induction Sphere</em> for 60 seconds. All
      electronic potential, electromagnetic attraction, and battery discharge cease
      entirely; industrial electromagnets fail, alarm circuits burn out, and tape
      recorders go silent. Mechanical locks remain mechanical.</p>
    fractureCondition: >
      Fracture on Gear Die 1s while active — the sphere collapses in a burst of static
      and the stone crumbles to magnetite sand.
    emission:
      type: burst
      radius: '5 m'
      trigger: 'Activation'
      corruptionAmount: 0
      isSuppressed: false
    containmentProfile:
      type: 'Minor Relic'
      isContained: true
      truths:
        triggerCondition: >
          Activation requires blood and recitation; the Sphere suppresses electromagnetic
          phenomena within 5 meters for 60 seconds.
        appetite: >
          The stone draws warmth from the hand that holds it; repeated use leaves fingers
          numb and blood cold.
        quiescenceCondition: >
          Wrapped in silk and stored away from ferrous metals. It will drag loose keys,
          pins, and wire toward itself in a pocket.
    activePressure: false
    decay:
      value: 0
      enabled: false
    replicable: false
    loreIdentified: false
    description: >
      <p>A thumb-sized nodule of natural magnetite banded with tarnished first-century
      Judaean silver wire. The wire is hand-twisted, not cast — the work of a provincial
      silversmith, and older than any workshop mark it once carried.</p>
      <p>The stone is the reason Vault IX ever held the phials. Corvi used it to kill the
      electromagnetic mooring and walk the case out of the vault.</p>

- _id: sangreal-relic-veronica
  name: "The Veil of Veronica's Thread"
  type: artifact
  img: modules/neon-relic-mission-sangreal/assets/art/relic-veronica.webp
  system:
    tier: 1
    corruptionCost: 1
    artifactDie:
      current: d4
      starting: d4
    activationCondition: >
      Snap the thread between thumb and forefinger while whispering the Latin
      <em>Nunc Dimittis</em>. The thread is single-use; it burns to white ash on
      activation.
    effect: >
      <p>Produces an instantaneous blinding flash of phosphorus light (Endure check or
      suffer flash-blindness for 2 rounds) accompanied by a 5-minute temporal and sensory
      displacement. The user vanishes from sight, sound, and electronic surveillance,
      leaving zero scent trails or physical tracks.</p>
    fractureCondition: >
      Fracture on Gear Die 1s — the flash consumes the thread without displacing the
      user, marking their last position in light-dazzled long exposure.
    emission:
      type: burst
      radius: 'Line of sight'
      trigger: 'Thread snapped'
      corruptionAmount: 0
      isSuppressed: false
    containmentProfile:
      type: 'Single-Use Relic'
      isContained: true
      truths:
        triggerCondition: >
          Single activation: snap + whisper. Effect lasts five minutes before the user
          snaps back into sensory reality.
        appetite: >
          The thread smells faintly of sweat and grave cloth each time it is examined.
        quiescenceCondition: >
          One use only. After burning, nothing remains but white ash and a needle.
    activePressure: false
    decay:
      value: 0
      enabled: false
    replicable: false
    loreIdentified: false
    description: >
      <p>A three-inch frayed linen thread dyed pale ochre, threaded through an unadorned
      silver sewing needle. Sister Claudia keeps it hidden inside her wooden rosary
      beads, where it looks like a repair no one bothered to finish.</p>

