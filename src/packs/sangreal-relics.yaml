- _id: sangreal-kit-phosphorusflare
  name: 'Phosphorus Flare'
  type: consumable
  system:
    description: >
      Military-grade phosphorus flare. Burns sun-bright for one scene and leaves no
      shadow worth hiding in — repels photophobic targets, or ruins everyone's night
      vision indoors. Distinct from a standard signal flare: hotter, whiter, and far
      less polite in enclosed spaces.
    consumableType: supply
    currentDie: d6
    startingDie: d6
    cl: 2
