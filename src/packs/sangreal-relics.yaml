      <p>A pilgrim's curio — magnetite and silver wire, first-century Judaean work. Of
      interest to antiquarians, not to physicists.</p>
    operationalRead: >
      <p>Forensic residue at Vault IX links it to the breach: copper induction coils
      melted from the inside out under total magnetic saturation, with sulfur, lapis
      lazuli, and crystalline Judaean silver vitrified in the slag.</p>
    coldArchiveRead: >
      <p>The Secret Archives' suppressed index lists the Lodestone as a "mooring key" —
      the only object authorized to approach Vault IX's electromagnetic plinth. Corvi
      requested the index card for it nine days before the theft.</p>
    activationCondition: >
      Blood and prayer. The user takes 1 STR damage or 1 Stress to coat the stone, then
      recites. The sphere lasts 60 seconds.
    mechanicalEffect: >
      <p>All electronic potential, electromagnetic attraction, and battery discharge cease
      inside 5 meters. Industrial electromagnets fail, alarm circuits burn out, tape
      recorders go silent, radios die. Mechanical systems are unaffected.</p>
    fractureCondition: >
      Rolling a Gear Die 1 while the sphere is active collapses it in a burst of static;
      the stone crumbles to magnetite sand.
    containmentProfile: >
      Wrap in silk; keep away from ferrous metals, magnetic media, and pacemaker wearers.
      It will pull at keys, pins, and wire through cloth.
    containmentTruths:
