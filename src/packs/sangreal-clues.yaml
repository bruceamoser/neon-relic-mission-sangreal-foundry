  system:
    cardId: I-15
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l6]
    content: >
      <p>A filed flight clearance from a military airfield: Cessna 421 Golden Eagle, registration
      YR-BAS, owner Basarab Holdings S.A. (Bucharest). Flight plan filed for Cluj-Napoca International
      Airport, Romania. Cargo: <em>Ecclesiastical Medical Supplies — Ten Consignment Units.</em>
