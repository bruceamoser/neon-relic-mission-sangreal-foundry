- _id: sangreal-ic16
  name: 'I16 — The Quiescence Formula (CT3)'
  type: informationCard
  system:
    cardId: I-16
    cardType: containmentTruth
    foundAtSlugs: [sangreal-l2, sangreal-l7]
    knownBySlugs: [sangreal-npc-sabbatini, sangreal-npc-ghiberti]
    npcSlugs: [sangreal-npc-sabbatini, sangreal-npc-ghiberti]
    content: >
      <p>Containment protocol, in Latin on a single leaf: the phials must remain in absolute darkness,
      wrapped in unbleached flax linens soaked in wine vinegar, gall and myrrh, and sealed in
      lead-antimony foil below 4°C. Direct sunlight causes the fluid to boil and combust into white
      ash.</p>
    hqFallback: 3
    daNotes: >
      <p><strong>Retrieval.</strong> At L2, the wall safe behind the St. Sebastian painting
      (1 shift); at L7, Sabbatini repeats it from memory to test the cell and Ghiberti can
      confirm the archival copy.</p>
      <p><strong>Reading the image.</strong> No standalone photograph exists — the protocol
      arrives as text. Photographic support: <strong>I32</strong> (a daylight-combustion
      test in a modern fume hood) and the 4 °C freezer in <strong>I11</strong>.</p>
      <p><strong>Clues &amp; easter eggs.</strong> The quiescence kit photographed in I32 —
      linen, gall, vinegar, myrrh — is already present in a Swiss clinic. Rome's protocol
      is in play in Zurich: someone in the Church knew where the phials were going.</p>
      <p><strong>DA truth.</strong> Mechanical instructions for safe transport without
      triggering an explosive fracture. The Vatican has been practicing this protocol for
      four centuries; the Covenant has hours to learn it.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

