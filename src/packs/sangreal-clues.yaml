- _id: sangreal-ic01
  name: 'I1 — The Burnt Electromagnet Relay'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/intel/i01-vault-altar-forensic.webp
  system:
    cardId: I-1
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l1]
    knownBySlugs: [sangreal-npc-ghiberti]
    npcSlugs: [sangreal-npc-ghiberti]
    content: >
      <p>The industrial electromagnet cradle anchored to the vault floor did not fail
      from a blown breaker. The copper induction coils melted from the inside out under
      total magnetic saturation. Vitrified within the copper slag is a fine residue:
      elemental sulfur, pulverized lapis lazuli, and crystalline Judaean silver.</p>
      <p><em>Found at: L1 — Subterranean Vault IX. Known by: Father Ghiberti.</em></p>
    hqFallback: 12
    daNotes: >
      <p><strong>Retrieval.</strong> At L1, a physical inspection of the melted induction
      cradle on the altar (a forensic sweep — Investigations or Research, 1 shift). Claudia's
      escort keeps it legal; a botched sweep alerts the gendarmerie.</p>
      <p><strong>Reading the image.</strong> A flash-lit evidence photograph of the octagonal
      vault: copper coils melted on black granite, scorch marks on the ancient brick,
      condensation beading on the lead-sheeted walls, an evidence ruler across the frame.</p>
      <p><strong>Clues &amp; easter eggs.</strong> Sulfurous residue glitters inside the
      slag. The empty mooring plinth is scorched from <em>beneath</em> — the failure came
      up through the cradle, not down from the room.</p>
      <p><strong>DA truth.</strong> Confirms an occult artifact was used rather than
      mechanical tools. The chemical profile matches the Lodestone of St. Jude, cataloged
      in the Secret Archives' suppressed index.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic02
  name: 'I2 — CCTV Reel #87-04'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/intel/i02-cctv-porta-santanna-0314.webp
  system:
    cardId: I-2
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l1, sangreal-l2]
    npcSlugs: [sangreal-npc-vane]
    content: >
      <p>A 16mm black-and-white surveillance film from the Porta Sant'Anna gate
      (03:14 AM). Monsignor Corvi leaves on foot carrying a heavy attaché case.
      Photographic enlargement reveals two details: in the puddle reflections, Corvi
      casts a faint shadow, but the briefcase casts an opaque, pitch-black shadow.
      Protruding from Corvi's coat is a green railway pass: "EC 30 (Romulus) —
      Carrozza 4, Posto 18 — Roma Termini a Genève Cornavin."</p>
      <p><em>Found at: L1 — Subterranean Vault IX / L2 — Corvi's Quarters. Known by:
      the gate detail; Sister Claudia Vane diverts attention unless confronted.</em></p>
    hqFallback: 11
    daNotes: >
      <p><strong>Retrieval.</strong> At L1, the security console holds the reel — viewing it
      needs Claudia's escort or a Subterfuge check; at L2 the desk blotter carries a
      duplicate viewing note. 1 shift.</p>
      <p><strong>Reading the image.</strong> One 16 mm black-and-white frame from the Porta
      Sant'Anna camera: Corvi walks out alone under the arch lamp with the attaché; the
      cobbles are wet; the burned-in clock reads 03:14.</p>
      <p><strong>Clues &amp; easter eggs.</strong> In the puddle beside him Corvi casts a
      faint shadow, but the case throws an opaque, pitch-black one. A green railway pass
      juts from his coat. At the far left edge of frame, a nun's veil catches the lamp
      light — forty metres behind him, and never mentioned in any report.</p>
      <p><strong>DA truth.</strong> The dense shadow indicates lead-antimony foil lining.
      The boarding pass unlocks Location L3 (Geneva Private Depository).</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic03
  name: 'I3 — The Excised Codex Register'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/intel/i03-register-excised-card.webp
  system:
    cardId: I-3
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l1]
    knownBySlugs: [sangreal-npc-ghiberti]
    npcSlugs: [sangreal-npc-ghiberti]
    content: >
      <p>The mahogany card catalog drawer in the Archivio Segreto. The index card for
      shelf-mark "MS-Vat-Heb-418" has been excised with a scalpel. In its place sits a
      red charge card inscribed in Latin cursive: "Extractum per Breve Apostolicum —
      Anno Domini 1582 — Ad Capsam XII-SANG-00."</p>
      <p><em>Found at: L1 — Subterranean Vault IX. Known by: Father Ghiberti.</em></p>
    hqFallback: 13
    daNotes: >
      <p><strong>Retrieval.</strong> At L1, the Archivio Segreto catalog drawer — searching
      it requires Ghiberti's cooperation (reassurance, not pressure). 1 shift.</p>
      <p><strong>Reading the image.</strong> A top-down photograph of the open catalog
      drawer: one index card excised with a scalpel, a red charge card laid in its place,
      dust on every surrounding card.</p>
      <p><strong>Clues &amp; easter eggs.</strong> The excised stub still shows the shelf-mark
      <em>MS-Vat-Heb-418</em>. The red card reads in Latin cursive: <em>Extractum per Breve
      Apostolicum — Anno Domini 1582 — Ad Capsam XII-SANG-00</em>. The red card has no dust:
      it was placed recently.</p>
      <p><strong>DA truth.</strong> Connects Corvi's historical research to the attaché's
      contents ("XII-SANG"), proving the theft was premeditated — this was never a crime
      of opportunity.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic04
  name: 'I4 — The Polybius Vulgate Cipher'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/intel/i04-corvi-desk-blotter.webp
  system:
    cardId: I-4
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l2]
    content: >
      <p>A slip of 17th-century rag paper hidden within a 1592 Clementine Vulgate Bible
      on Corvi's desk, resting at the Gospel of John, Chapter 6. The paper contains
      Latin numerals arranged in coordinate pairs: IV-I I-V III-II I-I IV-IV I-I /
      IV-V I-II IV-III / II-I I-I IV-V IV-III III-II I-I III-III III-III / IV-I IV-IV
      II-IV IV-IV I-II / I-III.</p>
      <p><em>Found at: L2 — Monsignor Corvi's Private Quarters. Requires a physical
      search.</em></p>
    hqFallback: 10
    daNotes: >
      <p><strong>Retrieval.</strong> At L2, a patient search of the desk and the Vulgate
      (Research, 1 shift) — heavy-handed searching destroys the slip's hiding place and the
      blotter impressions.</p>
      <p><strong>Reading the image.</strong> Corvi's desk in lamplight: the 1592 Vulgate open
      at John 6, a slip of rag paper with a grid of Roman numerals, a leather desk blotter
      under raking light.</p>
      <p><strong>Clues &amp; easter eggs.</strong> The blotter's mirror-writing reads
      <em>GENEVA</em> and <em>4409</em> in reverse — two of the four cipher answers are
      already on the desk. A Roma Termini ticket corner pokes out from beneath the blotter.</p>
      <p><strong>DA truth.</strong> Decodes via a 5x5 Latin alphabet Polybius Square
      (merging I/J and U/V) into: "GENEVA / UBS / HAUSMANN / 4409 / C". Unlocks Location
      L3 and identifies Kurt Hausmann.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic05
  name: "I5 — The Watcher's Hallmark"
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/intel/i05-map-casing-hallmark.webp
  system:
    cardId: I-5
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l1]
    knownBySlugs: [sangreal-npc-vane]
    npcSlugs: [sangreal-npc-vane]
    content: >
      <p>Sister Claudia lays out a diocesan road map of Northern Italy. In the
      lower-right margin of the leather map casing, an embossed stamp is pressed into
      the hide: an open eye enclosed within an ouroboros (a serpent eating its own
      tail), flanked by the tiny initials "T.O.W."</p>
      <p><em>Found at: L1 — carried by Sister Claudia Vane. No fallback — requires
      field deduction.</em></p>
    hqFallback: 0
    daNotes: >
      <p><strong>Retrieval.</strong> No fallback — the cell must physically observe or palm
      Claudia's map casing, then make the deduction themselves.</p>
      <p><strong>Reading the image.</strong> A road map of Northern Italy beside its worn
      leather casing; the casing's lower margin carries an embossed stamp — an open eye
      inside a serpent eating its own tail — flanked by the tiny initials T.O.W.</p>
      <p><strong>Clues &amp; easter eggs.</strong> Three locations are circled faintly in
      pencil: Geneva, Zurich, Turin — the operational clock, plotted before the cell had a
      case file. A second, fainter impression sits beside the first: the stamp has been
      used many times.</p>
      <p><strong>DA truth.</strong> The insignia of The Talamasca ("The Order of the
      Watchers"). If questioned, Claudia claims it is an archival seal from a Bolognese
      bookbinder. Left unremarked, it is the thread that unravels her.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic06
  name: 'I6 — The Escrow Transfer Slip'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/intel/i06-escrow-slip-carbon.webp
  system:
    cardId: I-6
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l3]
    knownBySlugs: [sangreal-npc-mercier]
    npcSlugs: [sangreal-npc-mercier]
    content: >
      <p>A carbon-leaf escrow receipt from locker 4409-C at Union de Banques Suisses,
      confirming a telegraphic transfer of 500,000 Swiss Francs from "Kurt Hausmann,
      Sonnenberg Privatklinik, Zurich" to an ecclesiastical escrow account in Vaduz.
      The transaction memo reads: "Acquisition of Primary Specimen (1 of 12) —
      Experimental Oncology Protocol."</p>
      <p><em>Found at: L3 — Union de Banques Suisses, Geneva. Known by:
      Jean-Paul Mercier.</em></p>
    hqFallback: 9
    daNotes: >
      <p><strong>Retrieval.</strong> At L3, Mercier surrenders the carbon under payment or
      pressure (Difficulty 2); violence closes him and trips the desk alarm beneath.</p>
      <p><strong>Reading the image.</strong> A carbon-leaf receipt on UBS letterhead on a
      leather blotter: a locker number, a telegraphic transfer amount, faint purple carbon
      typing, a fountain pen resting beside it.</p>
      <p><strong>Clues &amp; easter eggs.</strong> The memo line reads "Acquisition of
      Primary Specimen (1 of 12) — Experimental Oncology Protocol". A small pencilled tick
      sits beside the "1 of 12" — the clerk understood exactly what he was moving. The
      sheet is folded at the corner where it lived in a jacket.</p>
      <p><strong>DA truth.</strong> Confirms the sale of the first phial and unlocks
      Location L4 (Privatklinik Sonnenberg, Zurich). "Experimental Oncology Protocol" is
      the cover story Graf was told.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic07
  name: 'I7 — Patient File 09-Hausmann'
  type: informationCard
  system:
    cardId: I-7
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l3, sangreal-l4]
    knownBySlugs: [sangreal-npc-graf]
    npcSlugs: [sangreal-npc-graf, sangreal-npc-hausmann]
    content: >
      <p>Clinical dossier for Kurt Hausmann, age 62, admitted with end-stage metastatic
      lymphoma. Four days prior, Hausmann received an undocumented intravenous
      injection. Within forty-eight hours, all tumors went into remission.
      Concurrently, the patient developed core hypothermia (28.2°C), unreactive dilated
      pupils, severe cutaneous burns upon exposure to fluorescent lighting, and an
      insatiable craving for human plasma.</p>
      <p><em>Found at: L3 — Geneva / L4 — Privatklinik Sonnenberg. Known by:
      Dr. Elizabeth Graf.</em></p>
    hqFallback: 8
    daNotes: >
      <p><strong>Retrieval.</strong> At L4, calming Graf (first aid, light discipline, or
      psychoanalysis — in that order of practicality) secures the file; at L3, booth
      4409-C records hold the duplicate.</p>
      <p><strong>Reading the image.</strong> No standalone photograph survives — the file is
      a paper prop. Photographic support arrives via <strong>I27</strong> (intake photograph)
      and <strong>I28</strong> (photophobia test).</p>
      <p><strong>Clues &amp; easter eggs.</strong> The intake photo's gold wristwatch and the
      clinic logo are the thread-ends: the watch reappears on the feral predator, and the
      logo reappears on the letterhead of the escrow slip (I6). The same institution banked
      the money that injected him.</p>
      <p><strong>DA truth.</strong> <strong>The False Twist.</strong> Drives players to
      conclude Jesus was the First Vampire, and communion transmits an unholy condition.
      Let them believe it — the histopathology in I9 and the Ebionite text in I12 are the
      way back out.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic08
  name: 'I8 — The Swiss PTT Intercept Tape'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/intel/i08-wiretap-reel.webp
  system:
    cardId: I-8
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l3, sangreal-l4]
    content: >
      <p>A reel-to-reel audio tape of a wiretapped public payphone call from Zurich to
      Turin. Corvi states: "The Zurich test was an abomination! Hausmann has lost all
      humanity; he screams for marrow in the dark! You assured me the blood brought
      redemption, not this hellish thirst!" A calm, cultured voice responds: "Bring the
      remaining eleven vessels across the border to the Lingotto works in Turin. My
      house will pay triple. Do not let Rome's butchers reach you."</p>
      <p><em>Found at: L3 — Geneva / L4 — Zurich. Recovered from a telephone
      switchboard; no individual source.</em></p>
    hqFallback: 7
    daNotes: >
      <p><strong>Retrieval.</strong> At L3, the wiretap reel log (or the intercept tape
      itself) from the switchboard records; at L4, Claudia's swept traces leave only the
      reel log as the remaining lead.</p>
      <p><strong>Reading the image.</strong> A reel-to-reel tape in its cardboard box on a
      Swiss PTT switchboard desk, a typed transcript page clipped beneath a pencil, Bakelite
      handsets and cabling behind.</p>
      <p><strong>Clues &amp; easter eggs.</strong> A second tape box carries the same neat
      hand as the red charge card in I3 — someone was copying calls long before the
      Covenant arrived. The transcript's final line circles a Turin extension number.</p>
      <p><strong>DA truth.</strong> Unlocks Location L5 (Lingotto Fiat Assembly Complex,
      Turin) and confirms Corvi still controls eleven phials. The "cultured voice" belongs
      to the intermediary who will later be replaced by the Basarab pack on the wire.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic09
  name: 'I9 — Histopathology Log: Marrow Graft'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/intel/i09-histology-polaroid.webp
  system:
    cardId: I-9
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l4]
    knownBySlugs: [sangreal-npc-graf]
    npcSlugs: [sangreal-npc-graf]
    content: >
      <p>Histopathology notes and microscopic polaroids: "The introduced fluid did not
      merge with Hausmann's cellular biology. The foreign hematological vector attacked
      existing bone marrow like an aggressive, invasive graft, forcing an instantaneous
      genetic re-sequencing of somatic tissue into a predatory physiology. This fluid is
      not an infection; it is a universal biological vector carrying an un-mutated
      progenitor strain that ordinary human biology cannot safely regulate."</p>
      <p><em>Found at: L4 — Privatklinik Sonnenberg. Known by: Dr. Elizabeth Graf.</em></p>
    hqFallback: 6
    daNotes: >
      <p><strong>Retrieval.</strong> At L4, securing Graf's slides is the condition of her
      cooperation — she will not leave without them, and she will burn them if cornered.</p>
      <p><strong>Reading the image.</strong> An SX-70 polaroid of a microscope field: human
      marrow tissue shot at high magnification, dark fibrous filaments woven through the
      cells, Graf's handwriting crowding the white border.</p>
      <p><strong>Clues &amp; easter eggs.</strong> The filament structures do not belong to
      any known tissue. Her annotation reads: <em>foreign graft — not infection</em>. A second
      polaroid's edge intrudes at the frame — she took more than one, and kept one.</p>
      <p><strong>DA truth.</strong> Challenges the False Twist, revealing the blood as an
      apex biological carrier that causes predatory mutation only because human marrow
      lacks the regulatory mechanisms to process it.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic10
  name: 'I10 — The Vector Mechanics (CT1)'
  type: informationCard
  system:
    cardId: I-10
    cardType: containmentTruth
    foundAtSlugs: [sangreal-l4, sangreal-l5]
    knownBySlugs: [sangreal-npc-corvi, sangreal-npc-graf]
    npcSlugs: [sangreal-npc-corvi, sangreal-npc-graf]
    content: >
      <p>The vector triggers upon contact with open tissue or mucous membranes. In an
      uninfected human host, it forces rapid mutagenic adaptation, causing full
      predatory conversion within six shifts (24 hours). In an active vampire, the
      vector acts as a cellular purge, breaking necrotic stasis and forcing centuries of
      biological senescence to manifest in seconds, reducing the subject to ash.</p>
      <p><em>Found at: L4 — Zurich / L5 — Turin. Known by: Monsignor Corvi and
      Dr. Elizabeth Graf.</em></p>
    hqFallback: 5
    daNotes: >
      <p><strong>Retrieval.</strong> At L4 or L5 — Graf's charts or Corvi's account; both
      require a disposition shift before they will speak plainly about it.</p>
      <p><strong>Reading the image.</strong> No standalone photograph exists — the mechanics
      arrive as text and testimony. Photographic support: <strong>I28</strong> (the XII-1/12
      batch tag) and <strong>I29</strong> (the injection log).</p>
      <p><strong>Clues &amp; easter eggs.</strong> The batch numbers tie the clinical trail
      to the phial count (1 of 12). The charts give "six shifts" as the conversion window —
      the same clock the board counts down.</p>
      <p><strong>DA truth.</strong> Core mechanical containment truth. Explains why the
      vampire bloodlines fear the relic more than the Covenant or the Church ever could.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic11
  name: 'I11 — The Resonance Field (CT2)'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/intel/i11-resonance-freezer.webp
  system:
    cardId: I-11
    cardType: containmentTruth
    foundAtSlugs: [sangreal-l4, sangreal-l5]
    knownBySlugs: [sangreal-npc-corvi]
    npcSlugs: [sangreal-npc-corvi]
    content: >
      <p>The phials actively hunger for mortal trauma. Within 100 meters, individuals
      suffering from anemia, terminal illness, or lacerations experience an intense
      psychic compulsion to open a phial and drink. The proximity of the case
      accelerates cellular decay in injured subjects to provoke this consumption.</p>
      <p><em>Found at: L4 — Zurich / L5 — Turin. Known by: Monsignor Corvi.</em></p>
    hqFallback: 4
    daNotes: >
      <p><strong>Retrieval.</strong> At L4, searching the laboratory freezers (1 shift); at
      L5, Corvi describes the field directly once he trusts the cell.</p>
      <p><strong>Reading the image.</strong> Inside a clinical cold room: one small glass
      phial sealed with red wax on a steel tray, blood bags on the shelves behind it, a
      clipboard chart on the wall, a thermometer at 4 °C.</p>
      <p><strong>Clues &amp; easter eggs.</strong> The blood bags nearest the tray are
      spoiled, one swollen past bursting — proximity decay, caught mid-experiment. The
      chart's last line reads: "subject 09-H attempted to drink from the sharps bin,
      02:40." The thermometer sits exactly at the quiescence threshold from I16.</p>
      <p><strong>DA truth.</strong> Explains Hausmann's rapid decline and imposes stress
      penalties on wounded investigators. Any agent carrying the case while injured should
      feel the pull — play it as intrusive thought, not compulsion.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic12
  name: 'I12 — The Ebionite Palimpsest'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/intel/i12-palimpsest-uv.webp
  system:
    cardId: I-12
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l5]
    knownBySlugs: [sangreal-npc-corvi]
    npcSlugs: [sangreal-npc-corvi]
    content: >
      <p>Corvi's notebook containing his translation of the 2nd-century <em>Gospel of
      the Twelve</em> (Codex Ebionita, MS-Vat-Heb-418): "And the Lord gave unto the
      predators of the dark His cup, saying: 'Drink ye all of this; for this is my blood
      of the new covenant, poured out for many for the unmaking of your curse, that you
      may die the death of men and sleep in the dust like the sons of Adam.'"</p>
      <p><em>Found at: L5 — Lingotto Assembly Works. Known by: Monsignor Corvi.</em></p>
    hqFallback: 4
    daNotes: >
      <p><strong>Retrieval.</strong> At L5, from Corvi himself — the notebook is part of his
      surrender; without trust he destroys it first.</p>
      <p><strong>Reading the image.</strong> A conservation bench under ultraviolet light:
      the codex page beneath glass, faint older script surfacing under the lamp, Corvi's
      ruled notebook open beside it, cotton gloves and slides within reach.</p>
      <p><strong>Clues &amp; easter eggs.</strong> The palimpsest's underlayer is the actual
      Gospel of the Twelve — the visible text was written over it. Corvi's margin carries
      one Latin line: <em>sanguis remedium, non sacramentum</em> (blood is remedy, not
      sacrament). A Hotel Bristol, Geneva matchbook sits on the bench — his trail, pinned
      down.</p>
      <p><strong>DA truth.</strong> The final theological revelation: Christ was an immune
      progenitor who synthesized a cure for the vampire parasite. Once the cell reads this
      alongside I9, the Paradigm Inversion lands for good.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic13
  name: 'I13 — The Novara Slaughter'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/intel/i13-slaughter-hall.webp
  system:
    cardId: I-13
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l6]
    npcSlugs: [sangreal-npc-vane]
    content: >
      <p>Forensics at the retreat house: Sister Claudia Vane lies across the table, her
      carotid artery torn open by elongated dental punctures with an inter-canine
      breadth exceeding human anatomy, completely exsanguinated. On the floor sits a
      broken phial soaked into the terracotta tiles, beside two severed human metacarpals
      turned to calcified white ash from accelerated biological decay. The attaché case
      is gone.</p>
      <p><em>Found at: L6 — The Fortified Retreat of San Nazzaro. Requires forensic
      search.</em></p>
    hqFallback: 2
    daNotes: >
      <p><strong>Retrieval.</strong> At L6, a full forensic sweep of the dining hall
      (1 shift); beyond that, military police from Novara-Cameri impound the scene.</p>
      <p><strong>Reading the image.</strong> A flash photograph of the stone-flagged hall:
      Vane laid across the long table, arms folded by the killer; a single kerosene lantern;
      broken carriage doors behind her; a dark stain soaking the terracotta.</p>
      <p><strong>Clues &amp; easter eggs.</strong> Two severed metacarpals have gone to
      white calcified ash — one still shows a legible whorl ridge. A broken phial is soaked
      into the tiles. The attaché is gone, but its leather carry-strap hangs cut on the
      table edge. An unused second wine glass stands at the head of the table.
      <strong>Secondary asset:</strong> show <em>i13-carotid-detail.webp</em> via Image
      Popout when the wounds are examined with calipers — inter-canine breadth far beyond
      human anatomy.</p>
      <p><strong>DA truth.</strong> Proves Claudia was murdered by an ancient vampire
      strike team. The ash-crumbled fingers prove an attacker touched the spilled tenth
      phial and dissolved. Ten intact phials remain — and one is gone forever.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic14
  name: 'I14 — Telex Dispatch: Registry 16'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/intel/i14-telex-strip.webp
  system:
    cardId: I-14
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l6]
    npcSlugs: [sangreal-npc-vane]
    content: >
      <p>A charred telex strip recovered from the safehouse stove: "FROM: TALAMASCA
      MOTHERHOUSE AMSTERDAM // REGISTRY 16. TO: OPERATIVE CLAUDIA VANE. DIRECTIVE:
      SECURE SPECIMEN XII AT ALL COSTS. DEPLOY VERONICA THREAD FOR EXTRACTION. PROCEED
      TO NOVARA AIRSTRIP FOR RENDEZVOUS 'BASARAB'. DO NOT BREACH SEALS. SPECIMEN MUST BE
      FLOWN TO CARPATHIAN FACILITY FOR INCINERATION. PROTECT THE BLOODLINE."</p>
      <p><em>Found at: L6 — The Fortified Retreat of San Nazzaro. Known by: Sister
      Claudia Vane (deceased).</em></p>
    hqFallback: 1
    daNotes: >
      <p><strong>Retrieval.</strong> At L6, searching the safehouse stove grate or Claudia's
      satchel; the strip is partially burned but readable.</p>
      <p><strong>Reading the image.</strong> A curled, half-charred telex strip on an iron
      grate: typewritten capitals fading into burn, perforated top edge, soot and ash
      around it.</p>
      <p><strong>Clues &amp; easter eggs.</strong> The legible fragment orders the specimen
      flown to a Carpathian facility with the line <em>PROTECT THE BLOODLINE</em>. The
      perforation pattern is the Amsterdam machine's. A second melted strip on the grate
      corner preserves one unburned line: <em>RENDEZVOUS "BASARAB"</em> — the word that
      names the aircraft's owner.</p>
      <p><strong>DA truth.</strong> Confirms Claudia's role as a Talamasca mole and reveals
      that the Order's leadership is desperate to burn the cure to protect vampire elders.
      "Protect the bloodline" is the sentence that ends the Covenant's remaining trust in
      the Motherhouse.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic15
  name: 'I15 — Flight Clearance: YR-BAS'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/intel/i15-flight-clearance.webp
  system:
    cardId: I-15
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l6]
    content: >
      <p>Flight clearance from Novara-Cameri military airfield: Cessna 421 Golden Eagle,
      registration YR-BAS, owner Basarab Holdings S.A. (Bucharest). Flight plan filed for
      Cluj-Napoca International Airport, Romania. Cargo: "Ecclesiastical Medical
      Supplies — Ten Consignment Units." Departure: 01:15 hours tonight.</p>
      <p><em>Found at: L6 — dispatch desk, Fortified Retreat of San Nazzaro.</em></p>
    hqFallback: 1
    daNotes: >
      <p><strong>Retrieval.</strong> At L6, the dispatch desk in the abbey's outer office
      (1 shift with the telex and telex machine).</p>
      <p><strong>Reading the image.</strong> A typed flight clearance form on a wooden desk:
      carbon-copy type, an aerodrome ink stamp, a pilot's signature, a small printed
      heraldic crest beside the operator field — and a second, cancelled form beneath it.</p>
      <p><strong>Clues &amp; easter eggs.</strong> The owner line reads Basarab Holdings
      S.A. (Bucharest); the cargo line reads "Ecclesiastical Medical Supplies — Ten
      Consignment Units". Departure 01:15. The cancelled form beneath means the flight
      waited — this was not a diversion, it was a plan.</p>
      <p><strong>DA truth.</strong> The launchpad for Mission 2: Recover the Sangreal —
      ten phials have crossed into Eastern Europe by the time the cell reaches the tarmac.
