- _id: sangreal-ic31
  name: 'I31 — Sonnenberg, Observed'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/intel/i31-sonnenberg-stakeout.webp
  system:
    cardId: I-31
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l4]
    npcSlugs: [sangreal-npc-entita-operative]
    content: >
      <p>A night telephoto of a low clinic building taken from a tree line: one floor's windows
      blacked out with sheeting; on the access road below, a grey sixties sedan with white plates,
      wipers up. A dash-mounted camera and thermos sit in the foreground.</p>
    hqFallback: 6
    daNotes: >
      <p><strong>Retrieval.</strong> At L4, only by spending a night shift on the perimeter
      — or from the Watcher's negatives if he is caught (P7).</p>
      <p><strong>Reading the image.</strong> A compressed long-lens night shot: the half-dark
      clinic, a parked official sedan, and a photographer's kit abandoned on a dashboard in
      the foreground.</p>
      <p><strong>Clues &amp; easter eggs.</strong> SCV 47 — the same Vatican-plated Lancia
      that appears at Lingotto (I33) and in the sanitization team's photograph (I42):
      L'Entità has been watching the clinic since before the cell arrived. The newspaper
      under the camera is the Watcher's (I18, I23, I26). One blacked-out window's tape has
      been pulled <em>inward</em> — from inside.</p>
      <p><strong>DA truth.</strong> Three parties were staking Sonnenberg: the cell, the
      Watcher, and the Holy Alliance. Time any raid so the players can feel the other
      headlights blink.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic32
  name: 'I32 — Daylight Test: Combustion'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/intel/i32-daylight-test.webp
  system:
    cardId: I-32
    cardType: containmentTruth
    foundAtSlugs: [sangreal-l4]
    knownBySlugs: [sangreal-npc-graf]
    npcSlugs: [sangreal-npc-graf]
    content: >
      <p>A fume hood photographed after a test: a glass crucible boiled and fused to the concrete with
      a radial burst of fine white ash around it; a test log card headed <em>DAYLIGHT TEST 07:12 —
      COMPLETE COMBUSTION</em>; and on the bench beside the hood, a box of unbleached linen strips and
      a glass jar of gall, vinegar and myrrh.</p>
    hqFallback: 5
    daNotes: >
      <p><strong>Retrieval.</strong> At L4, in the pathology lab during the sweep; pairs
      directly with I16 (the quiescence protocol).</p>
      <p><strong>Reading the image.</strong> A restrained evidence photograph of a ruined
      crucible in a fume hood, white ash fanned across the concrete, a small log card, and
      an oddly domestic arrangement of linen and herbal jars on the bench.</p>
      <p><strong>Clues &amp; easter eggs.</strong> The ash is white and fine — the same
      material as the calcified fingers at Novara (I38). The linen, gall, vinegar and myrrh
      are the Vatican's own quiescence kit (I16), already installed in a Swiss clinic:
      somebody in the Church was prepared for exactly this accident. The log's time, 07:12,
      is twenty minutes after sunrise.</p>
      <p><strong>DA truth.</strong> CT3 in physical form — and proof that Rome's protocol
      followed the phials. This card is the bridge between the medical sequence (I7–I11)
      and the containment truths (I16).</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic33
