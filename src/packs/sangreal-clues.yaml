- _id: sangreal-ic10
  name: I10 — The Vector Mechanics (CT1)
  type: informationCard
  system:
    cardId: I-10
    cardType: containmentTruth
    foundAtSlugs:
      - sangreal-l4
      - sangreal-l5
    knownBySlugs:
      - sangreal-npc-corvi
      - sangreal-npc-graf
    npcSlugs:
      - sangreal-npc-corvi
      - sangreal-npc-graf
    content: >-
      <p>Exposure through open tissue or mucous membranes triggers the vector. In an uninfected human,
      predatory conversion completes over twenty-four hours. In an existing vampire, the vector breaks the
      state that arrests aging: the result is rapid senescence, with catastrophic decay or a surviving mortal
      in organ failure.</p>
    hqFallback: 5
    daNotes: >-
      <h3>Source and timing</h3><p>Analysis / Corvi plus clinical and exposure evidence. Use only if the event
      or record exists in the current branch.</p><h3>Job in the case</h3><p>Synthesis: CT1. Recipient state
      changes the effect. Humans convert after 24 elapsed hours; existing vampires resolve the artifact’s
      Endure Difficulty 5 test. Failure: ash in three rounds. Success: mortal with organ failure.</p><h3>What
      to do next</h3><p>Use protected handling. Share only the supported parts until the combined truth is
      established; never require a deliberate exposure experiment.</p><p>A purposeful examination finds the
      core observation; rolls determine time, discretion, or additional detail. The image’s decorative details
      are not extra mandatory clues. An HQ fallback needs a named source and cannot supply events that have
      not happened.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []
