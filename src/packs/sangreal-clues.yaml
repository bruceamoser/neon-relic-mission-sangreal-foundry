- _id: sangreal-ic39
  name: 'I39 — Tarmac, 01:15'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/intel/i39-tarmac-0115.webp
  system:
    cardId: I-39
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l6]
    npcSlugs: [sangreal-npc-basarab-elder]
    content: >
      <p>A telephoto frame shot through the airfield perimeter fence: a twin-engine Cessna
      on the tarmac, props turning, two figures loading a metal case through the cabin
      door. A third figure stands apart from the work, long coat motionless, face turned
      directly toward the camera — as if it has known the watcher was there all along.</p>
      <p><em>Found at: L6 — the perimeter, at the cost of the case's remaining hours.</em></p>
    hqFallback: 1
    daNotes: >
      <p><strong>Retrieval.</strong> At L6, a perimeter stakeout (or I45's briefing sheet
      first). Timing is everything: taking this photograph spends the window.</p>
      <p><strong>Reading the image.</strong> A grainy fence-line night photograph: cabin
      lights, turning props, two loaders, one watcher noticed and one watcher watched.</p>
      <p><strong>Clues &amp; easter eggs.</strong> The tail reads YR-BAS (I15). The crate
      carries the dragon crest (I44). The Elder looking down the lens is not a mistake:
      the pack knows the Covenant is watching and has stopped caring — if the players see
