- _id: sangreal-ic43
  name: 'I43 — The Case, 1964'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/intel/i43-attache-1964.webp
  system:
    cardId: I-43
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l1]
    knownBySlugs: [sangreal-npc-ghiberti]
    content: >
      <p>An archival black-and-white photograph dated 1964: inside a workshop, gloved hands line a
      brushed-steel attaché shell with grey metal foil; a small brass plaque waits on the bench beside
      the case; a typewritten workshop order is pinned to the wall behind.</p>
    hqFallback: 10
    daNotes: >
      <p><strong>Retrieval.</strong> At L1, requires Ghiberti's help with the archival
      index (same scene as I3/I36).</p>
      <p><strong>Reading the image.</strong> A high-contrast workshop photograph: gloved
      hands, foil, clamps, a waiting plaque, a pinned order — the bureaucratic normality
      of building a prison for something they refuse to describe.</p>
      <p><strong>Clues &amp; easter eggs.</strong> The plaque (SANGREAL, I19) was stamped
      before the case was finished: the name came first, the container after. The pinned
