- _id: sangreal-ic30
  name: 'I30 — Ward 3, Corridor Camera'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/intel/i30-ward-hallway-cctv.webp
  system:
    cardId: I-30
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l4]
    content: >
      <p>The third-floor ward corridor on the security tape: windows taped over with black
      polyethylene, smashed fluorescent tubes, an overturned wheelchair, a kicked mop
      bucket. At the very top edge of frame, a silhouette holds position against the
      ceiling — it does not belong to any orientation a human body can hold.</p>
      <p><em>Found at: L4 — the clinic security room, or Graf's copied stills.</em></p>
    hqFallback: 5
    daNotes: >
      <p><strong>Retrieval.</strong> At L4, from the security room tape (or from Graf, who
      made stills for her own record).</p>
      <p><strong>Reading the image.</strong> A black-and-white corridor frame: taped
      windows, wrecked lighting, abandoned equipment, and something on the ceiling at the
      top edge of the picture.</p>
      <p><strong>Clues &amp; easter eggs.</strong> The ceiling silhouette is the whole
      argument: this is not human violence and it is not a patient loose in the hall. The
      spill trail from the bucket stops under a service duct — he left through the
      ventilation, not the doors. The clock reads 02:40, matching I11's chart line.</p>
      <p><strong>DA truth.</strong> Timestamp-cross-referenced proof of Hausmann's
      vertical, predatory movement — the strongest single piece of the False Revelation.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic31
  name: 'I31 — Sonnenberg, Observed'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/intel/i31-sonnenberg-stakeout.webp
  system:
    cardId: I-31
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l4]
    npcSlugs: [sangreal-npc-entita-operative]
    content: >
      <p>Night telephoto of the clinic from the tree line: white concrete, one floor's
      windows blacked out with sheeting. On the access road below, a grey sixties sedan
      with white diplomatic plates idles, wipers up. In the foreground, the stakeout car's
      dashboard holds a thermos and a long-lens camera resting on a folded newspaper.</p>
      <p><em>Found at: L4 — the tree line, or recovered from a watcher's effects.</em></p>
    hqFallback: 6
    daNotes: >
      <p><strong>Retrieval.</strong> At L4, only by spending a night shift on the perimeter
      — or from the Watcher's negatives if he is caught (P7).</p>
      <p><strong>Reading the image.</strong> A compressed long-lens night shot: the half-dark
      clinic, a parked official sedan, and a photographer's kit abandoned on a dashboard in
      the foreground.</p>
      <p><strong>Clues &amp; easter eggs.</strong> SCV 47 — the same Vatican-plated Lancia
      that appears at Lingotto (I33) and in the sanitization team's photograph (I42):
      L'Entità has been watching the clinic since before the cell arrived. The newspaper
      under the camera is the Watcher's (I18, I23, I26). One blacked-out window's tape has
      been pulled <em>inward</em> — from inside.</p>
      <p><strong>DA truth.</strong> Three parties were staking Sonnenberg: the cell, the
      Watcher, and the Holy Alliance. Time any raid so the players can feel the other
      headlights blink.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic32
  name: 'I32 — Daylight Test: Combustion'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/intel/i32-daylight-test.webp
  system:
    cardId: I-32
    cardType: containmentTruth
    foundAtSlugs: [sangreal-l4]
    knownBySlugs: [sangreal-npc-graf]
    npcSlugs: [sangreal-npc-graf]
    content: >
      <p>Inside the clinic's fume hood: a glass crucible has boiled and fused to the
      concrete, leaving a radial burst of fine white ash. The test log card reads
      "DAYLIGHT TEST 07:12 — COMPLETE COMBUSTION." On the bench beside the hood sits a box
      of unbleached linen strips and a glass jar of gall, vinegar and myrrh.</p>
      <p><em>Found at: L4 — the pathology lab. Known by: Dr. Graf.</em></p>
    hqFallback: 5
    daNotes: >
      <p><strong>Retrieval.</strong> At L4, in the pathology lab during the sweep; pairs
      directly with I16 (the quiescence protocol).</p>
      <p><strong>Reading the image.</strong> A restrained evidence photograph of a ruined
      crucible in a fume hood, white ash fanned across the concrete, a small log card, and
      an oddly domestic arrangement of linen and herbal jars on the bench.</p>
      <p><strong>Clues &amp; easter eggs.</strong> The ash is white and fine — the same
      material as the calcified fingers at Novara (I38). The linen, gall, vinegar and myrrh
      are the Vatican's own quiescence kit (I16), already installed in a Swiss clinic:
      somebody in the Church was prepared for exactly this accident. The log's time, 07:12,
      is twenty minutes after sunrise.</p>
      <p><strong>DA truth.</strong> CT3 in physical form — and proof that Rome's protocol
      followed the phials. This card is the bridge between the medical sequence (I7–I11)
      and the containment truths (I16).</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic33
  name: 'I33 — Lingotto, Rooftop, Rain'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/intel/i33-lingotto-rooftop.webp
  system:
    cardId: I-33
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l5]
    knownBySlugs: [sangreal-npc-corvi, sangreal-npc-vane]
    npcSlugs: [sangreal-npc-corvi, sangreal-npc-vane]
    content: >
      <p>Telephoto, dusk, rain: the Lingotto's rooftop test track curves away into haze and
      one glass supervisor's booth burns high on the facade. Two figures are inside — a
      hunched man at the glass, and a nun standing precisely between him and the booth's
      only door.</p>
      <p><em>Found at: L5 — approach prints, or the Watcher's negatives. Known by: Corvi
      and Vane (neither will describe it the same way).</em></p>
    hqFallback: 4
    daNotes: >
      <p><strong>Retrieval.</strong> At L5, from the approach stakeout (1 shift) or the
      Watcher's archive if captured (P7).</p>
      <p><strong>Reading the image.</strong> A rain-blurred long-lens photograph of the
      rooftop track: water sheeting off the banked concrete, one lit booth, two silhouettes,
      the grey Lancia below with its wipers up.</p>
      <p><strong>Clues &amp; easter eggs.</strong> Vane's position is the tell — she is not
      beside Corvi, she is between him and the exit: she has already decided the room's
      geometry. A second case-sized rectangle is visible beside the attaché (his papers —
      the decoy that buys a second). The Lancia below is L'Entità's tail (I31, I42).</p>
      <p><strong>DA truth.</strong> The intervention window is real and short: the betrayal
      is already staged, geographically, when the cell arrives.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic34
  name: 'I34 — Assembly Hall, Camera 6'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/intel/i34-lingotto-floor-cctv.webp
  system:
    cardId: I-34
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l5]
    knownBySlugs: [sangreal-npc-corvi]
    npcSlugs: [sangreal-npc-corvi]
    content: >
      <p>Black-and-white factory camera, still live: rain pouring through broken skylights
      into the flooded assembly hall, and Corvi crossing the floor with the attaché held
      against his chest. The case's deadbolt is taped over — field repair on a cracked
      latch.</p>
      <p><em>Found at: L5 — the plant's derelict control room, tape still spooling.</em></p>
    hqFallback: 4
    daNotes: >
      <p><strong>Retrieval.</strong> At L5, in the control room — the camera has been
      running for months unattended; one shift to review the tape.</p>
      <p><strong>Reading the image.</strong> A motion-blurred surveillance frame of a vast
      flooded hall; a solitary figure mid-crossing; machinery and oil drums; camera label 6.</p>
      <p><strong>Clues &amp; easter eggs.</strong> The taped deadbolt means the case has
      been forced or dropped — its integrity is degrading toward the fracture table. In the
      puddles, the lights reflect but Corvi casts no shadow: a deniable, single-frame
      occult tell the DA may or may not reveal (it contradicts I1's altar — the case's
      active state has changed).</p>
      <p><strong>DA truth.</strong> For the players who have started to suspect the relic's
      behavior: here is the first photographic anomaly <em>after</em> the seal was cut at
      Zurich.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic35
  name: 'I35 — Breve Apostolicum, 1582'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/intel/i35-breve-1582.webp
  system:
    cardId: I-35
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l2, sangreal-l5]
    knownBySlugs: [sangreal-npc-corvi]
    npcSlugs: [sangreal-npc-corvi]
    content: >
      <p>A photographic reproduction of the 1582 papal brief, carried in Corvi's research
      kit: dense chancery cursive, a lead seal cracked and repaired with red wax, and
      marginal annotations in a second hand. In the corner, a shelf-mark: MS-Vat-Heb-418.</p>
      <p><em>Found at: L2 (his quarters) or L5 (his work kit). Known by: Corvi.</em></p>
    hqFallback: 5
    daNotes: >
      <p><strong>Retrieval.</strong> At L2 in the desk effects, or at L5 in his kit — both
      part of the paper trail (pair with I3's excised register).</p>
      <p><strong>Reading the image.</strong> A flat archival photograph of an aged
      parchment: formal Latin script, an imperfectly repaired seal, pencilled marginal
      notes, and a modern shelf-mark stamped in the corner.</p>
      <p><strong>Clues &amp; easter eggs.</strong> The shelf-mark ties this brief to the
      excised card in I3 — the same record the Vatican tried to erase. The cracked seal
      repaired with wax means the capsule was opened after sealing: the 1582 custodians
      broke protocol, and someone repaired the seal to hide it. The marginalia name the
      capsule XII-SANG-00: the case's institutional identity for four centuries.</p>
      <p><strong>DA truth.</strong> The phials were opened long before Corvi — the Church's
      quiescence protocol exists because someone learned what happens when you don't
      follow it.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic36
  name: 'I36 — Suppressed Index Card'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/intel/i36-lodestone-index.webp
  system:
    cardId: I-36
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l1, sangreal-l2]
    knownBySlugs: [sangreal-npc-ghiberti]
    content: >
      <p>The Secret Archives index card for the Lodestone of St. Jude, with a small pre-war
      catalog photograph of the nodule clipped to it. A large red stamp across the card
      reads SUPPRESSED — CONS. DOCT. FIDEI. A pencilled handling note at the bottom warns:
      <em>corrosive to ferrous circuitry — by order of the Prefect.</em></p>
      <p><em>Found at: L1 or L2 — the suppressed-index drawer. Known by: Father Ghiberti.</em></p>
    hqFallback: 6
    daNotes: >
      <p><strong>Retrieval.</strong> At L1, the suppressed-index drawer (Ghiberti again);
      at L2, a carbon in Corvi's file. 1 shift.</p>
      <p><strong>Reading the image.</strong> An archive card with a rusted paperclip, a
      pre-war photograph of a thumb-sized black nodule banded in silver wire, a big faded
      red stamp, typewritten notes and one pencil line.</p>
      <p><strong>Clues &amp; easter eggs.</strong> "Corrosive to ferrous circuitry" is the
      whole plan in five words: the Lodestone was known — and filed — as the one thing that
      disables the vault's electromagnets. The order came from the Prefect's office: the
      theft's occult tool was issued from inside the building it robbed.</p>
      <p><strong>DA truth.</strong> The Lodestone's index card links the breach (I1) to the
      Congregation (I17) — the current Prefect's fingerprints are on the weapon, whether
      or not he commissioned the crime.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic37
  name: 'I37 — The Empty Needle'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/intel/i37-rosary-open.webp
  system:
    cardId: I-37
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l5, sangreal-l6]
    npcSlugs: [sangreal-npc-vane]
    content: >
      <p>Forensic macro of Claudia's wooden rosary: one bead split cleanly open along its
      grain. The cavity is empty; a few ochre linen fibres remain inside. On the bead's
      outer surface, a faint line of scorching.</p>
      <p><em>Found at: L5 (if her kit is searched) or L6 (among her effects). Known by:
      those who examine her kit before the betrayal.</em></p>
    hqFallback: 5
    daNotes: >
      <p><strong>Retrieval.</strong> At L5, searching her kit while the cell still trusts
      her (a delicate, revealing scene); at L6 in her effects (I40) as evidence.</p>
      <p><strong>Reading the image.</strong> A millimetre-ruled forensic macro: a split
      bead on dark linen, fibres in the hollow, a faint scorch on the outer surface.</p>
      <p><strong>Clues &amp; easter eggs.</strong> The split is a clean, deliberate cut —
      she opened it herself. The ochre fibres are the remains of the Veronica Thread's
      sheath. The scorch is fresh: the Thread was snapped <em>recently and near here</em>.
      If the players search this before Turin, they can pre-empt the betrayal entirely.</p>
      <p><strong>DA truth.</strong> The single best early-warning prop in the mission.
      Reward the search; do not protect Claudia.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic38
  name: 'I38 — Two Fingers, Calcified'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/intel/i38-ash-fingers.webp
  system:
    cardId: I-38
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l6]
    content: >
      <p>Close-up of the two severed metacarpals from the dining hall floor: reduced to
      brittle white calcified material with radial fracture lines, half-embedded in a dried
      dark stain. Beside them, fused into the ash, is a tiny melted metal ring.</p>
      <p><em>Found at: L6 — the abbey, with the rest of the forensics (1 shift).</em></p>
    hqFallback: 2
    daNotes: >
      <p><strong>Retrieval.</strong> At L6, during full forensics with the murder scene
      (I13); I38 and I39 are the details that turn the scene into a chase.</p>
      <p><strong>Reading the image.</strong> A harsh macro of white, fractured bone
      substitute on terracotta, evidence arrow card in frame, a small metal ring melted
      into the material.</p>
      <p><strong>Clues &amp; easter eggs.</strong> Radial fracture lines show the bone aged
      a century in seconds — CT1's signature, identical to the crucible ash (I32). One
      finger's whorl ridge pattern survives: a printable partial the cell can pursue into
      Mission 2. The melted ring's crest is the Basarab dragon — one of the pack touched
