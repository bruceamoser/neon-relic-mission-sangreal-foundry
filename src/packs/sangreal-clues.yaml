      <p>Clinical documentation photograph: Hausmann's face and forearm under a fluorescent
      bank, mottled first-degree burns where the light fell; his pupils are fully dilated
      and give no response to the camera flash. The light switch behind him has been taped
      over. His IV site carries a taped batch label.</p>
      <p><em>Found at: L4 — Graf's clinical photographs. Known by: Dr. Graf.</em></p>
    hqFallback: 6
    daNotes: >
      <p><strong>Retrieval.</strong> At L4, with Graf's cooperation — the photographs are
      clinical evidence, and she took them herself.</p>
      <p><strong>Reading the image.</strong> A hard-flash clinical photograph of burns
      patterning the exact footprint of a strip light; unresponsive dilated pupils; a
      taped-over switch; a nurse's hand withdrawing at the frame edge.</p>
      <p><strong>Clues &amp; easter eggs.</strong> The batch tag on the IV site reads
      XII-1/12 — the first phial of twelve (I29, relic-phials). The taped switch is an act
      of triage by staff who had learned what light did to him. The withdrawing hand is the
      staff's verdict: nobody stays in the room voluntarily.</p>
      <p><strong>DA truth.</strong> The clinical proof that the change is photobiological,
      not psychological — and traceable to a numbered vessel.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic29
  name: 'I29 — The Injection Log'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/intel/i29-injection-log.webp
  system:
    cardId: I-29
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l4]
    knownBySlugs: [sangreal-npc-graf]
    content: >
      <p>A single page from the trial chart: typewritten drug line, witness signature,
      Graf's initials in blue ink. The drug line reads PROGENITOR VECTOR — BATCH XII-1/12;
      the sponsor line names a Zurich clinic and a Vaduz trust account. A room number is
      scrawled beside it: 3.14.</p>
      <p><em>Found at: L4 — Graf's study files. Known by: Dr. Graf.</em></p>
    hqFallback: 6
    daNotes: >
      <p><strong>Retrieval.</strong> At L4, in Graf's study files (she may need calming
      first — see I7).</p>
      <p><strong>Reading the image.</strong> A top-down photograph of a typed trial chart
      page: carbon type, two signatures, a coffee ring, a room number scrawled at an angle.</p>
      <p><strong>Clues &amp; easter eggs.</strong> The sponsor's Vaduz trust account is the
      same account as the escrow in I6 — the money that bought the phial also paid the
      clinic. The room number 3.14 rhymes with the vault's 03:14 timestamp (I2): a quiet
      numeric refrain the DA can echo elsewhere.</p>
      <p><strong>DA truth.</strong> The paper trail linking Rome's money, a Swiss clinic,
      and the first phial — the documented chain of custody for the vector's first human
      case.</p>
