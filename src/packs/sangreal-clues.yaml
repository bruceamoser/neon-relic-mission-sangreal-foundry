  system:
    cardId: I-21
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l2]
    content: >
      <p>Monsignor Corvi's Vatican diplomatic passport, open at its ID page. A border stamp
      marks the crossing at Chiasso; in the margin, in a different hand, a single French
      word has been written and not explained: <em>accompagné</em> — accompanied.</p>
      <p><em>Found at: L2 — the passport lies among Corvi's desk effects.</em></p>
    hqFallback: 9
    daNotes: >
      <p><strong>Retrieval.</strong> At L2, in the desk effects (no roll if the room is
      searched patiently).</p>
      <p><strong>Reading the image.</strong> A passport ID page photographed on the desk:
      a gaunt clergyman in flat frontal flash, typewritten fields, an ink border stamp,
      a handwritten marginal note in a second hand.</p>
      <p><strong>Clues &amp; easter eggs.</strong> The Chiasso stamp is timed two hours
      after the gate film (I2) — he traveled hard and fast. <em>Accompagné</em> means the
      border guards logged a companion the reports all omit. The passport photo comes from
