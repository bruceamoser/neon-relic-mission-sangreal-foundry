    content: >
      <p><strong>Dossier — Monsignor Matteo Corvi.</strong> Curator of the Secret Archives, Vatican City; late
      sixties. In Covenant records for eighteen years as a cooperating scholar — among the few men inside the
      Vatican who has ever answered a straight question with a straight answer.</p> <p>His office controls
      physical access to the Archives and its suppressed index; no Covenant operation behind those walls has
      ever succeeded without his goodwill. Description: black clerical dress and spectacles; slight build;
      keeps late hours by habit. Researchers who have worked beside him describe exact references, no
      speculation, and no favours asked in return.</p> <p><em>Assessment: meticulous, private, impossible to
      hurry. Responds to scholarship and to candour, and to nothing else.</em></p>
