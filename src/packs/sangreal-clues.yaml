- _id: sangreal-ic19
  name: 'I19 — The Name Below the Plinth'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/intel/i19-plinth-sign-macro.webp
  system:
    cardId: I-19
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l1]
    knownBySlugs: [sangreal-npc-ghiberti]
    content: >
      <p>Extreme close-up of the empty mooring plinth. Below it, a small tarnished brass
      sign is bolted to the granite — one word: SANGREAL. The stone bears a faint scratch
      outline in the exact footprint of the missing case, and a scrap of grey foil is
      trapped under one of the sign's screws.</p>
      <p><em>Found at: L1 — Subterranean Vault IX. Known by: Father Ghiberti (reluctantly).</em></p>
    hqFallback: 12
    daNotes: >
      <p><strong>Retrieval.</strong> At L1, close physical inspection of the plinth during
      the forensic sweep — no roll needed once the altar is examined.</p>
      <p><strong>Reading the image.</strong> A macro flash photograph: verdigris-stained
      brass in stamped capitals (SANGREAL), a case-shaped scrape in the black granite
      below, foil caught under a screw head.</p>
      <p><strong>Clues &amp; easter eggs.</strong> The scratch outline means the case was
      repeatedly seated and removed — it was opened <em>in situ</em> more than once. The
      trapped lead-antimony foil matches the case's lining. The plaque predates the 1964
      case entirely (I43): the name, and the project, are centuries older.</p>
      <p><strong>DA truth.</strong> The vault was a working containment cell, not a
      reliquary — and someone had already been opening the case long before the theft.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic20
  name: 'I20 — The Clean Drill'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/intel/i20-corvi-safe-drilled.webp
  system:
    cardId: I-20
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l2]
    content: >
      <p>The wall safe behind the St. Sebastian painting, standing open. The combination
      dial has been drilled precisely at the spindle; the drawers around it were searched
      with academic care — nothing taken, everything displaced. A small woman's compact
      mirror lies half-shadowed under the desk edge.</p>
      <p><em>Found at: L2 — Monsignor Corvi's Private Quarters.</em></p>
    hqFallback: 10
    daNotes: >
      <p><strong>Retrieval.</strong> At L2, inspecting the safe during the room search —
      pair this with I4 (blotter) as the room's two findings.</p>
      <p><strong>Reading the image.</strong> A flash photograph of an open safe in a
      baroque study: a drilled dial, fine metal swarf on the shelf, carpet scuffs at the
      skirting, a compact mirror just out of the room's light.</p>
      <p><strong>Clues &amp; easter eggs.</strong> The drill swarf is fine and bright — a
      professional at work, not a panic job. The scuff marks show the kneeling position
