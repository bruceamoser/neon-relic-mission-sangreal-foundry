    npcUuids: []

- _id: sangreal-ic34
  name: 'I34 — Assembly Hall, Camera 6'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/intel/i34-lingotto-floor-cctv.webp
  system:
    cardId: I-34
