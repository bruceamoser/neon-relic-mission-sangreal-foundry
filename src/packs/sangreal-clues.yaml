    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic40
  name: 'I40 — Her Effects, Laid Out'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/intel/i40-claudia-kit.webp
  system:
    cardId: I-40
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l6]
    npcSlugs: [sangreal-npc-vane]
    content: >
      <p>Evidence photograph: Claudia's belongings arranged in a grid on grey paper — a
      plain wooden rosary, a compact Beretta pistol, diplomatic papers, a leather transit
      folio, a key ring, toll stubs, and a plain business card printed with the motto
      <em>We watch, and we are always there.</em></p>
      <p><em>Found at: L6 — her satchel, laid out during forensics.</em></p>
    hqFallback: 3
    daNotes: >
      <p><strong>Retrieval.</strong> At L6, laying out her satchel (1 shift; pairs with
      I13, I37, I14).</p>
      <p><strong>Reading the image.</strong> A top-down evidence grid: the tools of a
      scholar-spy, arranged with the same precision she kept in life.</p>
      <p><strong>Clues &amp; easter eggs.</strong> The Talamasca card is the last nail:
      after I5, I14 and I25, it is incontrovertible. The toll stub is time-stamped ninety
      minutes before death — she drove straight here from Turin. A ring of grey animal
      hair is wound around the Beretta's trigger guard: something checked her weapon
      before she could reach it.</p>
      <p><strong>DA truth.</strong> Claudia died doing exactly what she was trained to do,
      for an Order that had already decided she was expendable. Play her character's end
