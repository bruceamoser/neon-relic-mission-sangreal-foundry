    content: >
      <p><strong>Dossier — Monsignor Matteo Corvi.</strong> Curator of the Secret Archives, Vatican
      City; late sixties. In Covenant records for eighteen years as a cooperating scholar — among the
      few men inside the Vatican who has ever answered a straight question with a straight answer.</p>
      <p>His office controls physical access to the Archives and its suppressed index; no Covenant
      operation behind those walls has ever succeeded without his goodwill. Description: black
      clerical dress and spectacles; slight build; keeps late hours by habit. Researchers who have
      worked beside him describe exact references, no speculation, and no favours asked in return.</p>
      <p><em>Assessment: meticulous, private, impossible to hurry. Responds to scholarship and to
      candour, and to nothing else.</em></p>
    hqFallback: 0
    daNotes: >
      <p><strong>Retrieval.</strong> Reveal when the cell first identifies Corvi
      as more than a name on a duty roster — the L2 desk effects, Ghiberti's
      story, or the L5 booth encounter.</p>
      <p><strong>Reading the image.</strong> Baroque archive at night; one desk
      lamp against cold shadow; catalogue volumes stacked like sandbags; pen
      resting; the attaché case half in frame at the edge of the light.</p>
      <p><strong>Clues &amp; easter eggs.</strong> On the desk, face down, a
      photograph with its corner turned up — the 1962 archive photo (I22), his
      mentor's era, the file he keeps private. His gold-rimmed reading glasses
      sit over the case, not his book. The fever-sweat is real: he has been
      running with something he cannot set down.</p>
      <p><strong>DA truth.</strong> Corvi is not the villain — he is a scholar
      who learned what the cure actually is and chose flight over burial. He
      wants Rome on record knowing what it holds; the players should decide
      whether that makes him a thief or a witness.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic47
  name: 'N2 — Sister Claudia Vane'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/portraits-clean/np02.webp
  system:
    cardId: N-2
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l2, sangreal-l5, sangreal-l6]
    npcSlugs: [sangreal-npc-vane]
    content: >
      <p><strong>Dossier — Sister Claudia Vane.</strong> Nun of the diocese of Rome; late thirties;
      attached to Covenant field-liaison duties for four years.</p>
      <p>Service record: no complaint, no correction; reports filed on time, equipment returned in
      better condition than it was issued. Description: grey habit and veil; plain wooden rosary worn
      at the belt. She maintains no visible ties outside her diocese and her duties, and she resolves
      problems before anyone upstream learns there was one.</p>
      <p><em>Assessment: exact, calm, self-contained. Her arrangements hold; that is all the Rome
      station has ever needed to know about her.</em></p>
    hqFallback: 0
    daNotes: >
      <p><strong>Retrieval.</strong> Two reveals. Early: a benign portrait
      shown while suspicion is playable. Late: the same portrait, at L6, when
      the cell lays out her effects.</p>
      <p><strong>Reading the image.</strong> Grey habit, black veil, wooden
      rosary at her belt, stance of a woman who has decided everything ahead of
      time. Warmer than the others? Look again.</p>
      <p><strong>Clues &amp; easter eggs.</strong> The rosary's third bead is
      not a bead — it is an empty needle holder, the sheath that carried the
      Veronica Thread (I37, I40). Visible only on close inspection, and the
      whole betrayal is in it: the tool is already at her belt, waiting for the
      day it gets used.</p>
      <p><strong>DA truth.</strong> Talamasca agent. Green-light arrives Day 6
      (O2); she takes the case on Day 4 and dies for it on Day 2. Play her — and
      this card — so the players ache either way.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic48
  name: 'N3 — Cardinal Enrico Sabbatini'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/portraits-clean/np03.webp
  system:
    cardId: N-3
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l7]
    npcSlugs: [sangreal-npc-sabbatini]
    content: >
      <p><strong>Dossier — Cardinal Enrico Sabbatini.</strong> Prefect of the Congregation for the
      Doctrine of the Faith; late seventies; four decades in the Curia.</p>
      <p>The Covenant has never placed an asset inside his secretariat, and his public record offers
      nothing to hold: no scandal, no leak, no family. Description: immaculate dress, unhurried
      carriage; a voice used sparingly and never raised. He receives whom he chooses, when he
      chooses, and answers only what he is asked — nothing more, ever.</p>
      <p><em>Assessment: courteous, unhurried. Assume every silence is deliberate.</em></p>
    hqFallback: 0
    daNotes: >
      <p><strong>Retrieval.</strong> The L7 accounting scene — in person, or as
      the target of approach surveillance (I41).</p>
      <p><strong>Reading the image.</strong> Marble and walnut; the lamp's green
      pool of light; fingers spread on a stamped dossier; a man who already
      knows what is inside it.</p>
      <p><strong>Clues &amp; easter eggs.</strong> The dossier under his hand is
      stamped REGISTRY 16 — AMSTERDAM (I41): the Talamasca file the cell is still
      assembling. On the wall behind him, a crucifix hangs slightly crooked —
      and he has not straightened it in years.</p>
      <p><strong>DA truth.</strong> The "iron nail" doctrine is his (I17): the
      cure exists to deter, never to be used. The Lodestone's handling order came
      from his office (I36). He is not the mission's antagonist — he is its
      political weather.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic49
  name: 'N4 — Dr. Elizabeth Graf'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/portraits-clean/np04.webp
  system:
    cardId: N-4
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l4]
    npcSlugs: [sangreal-npc-graf]
    content: >
      <p><strong>Dossier — Dr. Elizabeth Graf.</strong> Clinician; principal investigator of an
      oncology protocol in Zurich; fifties.</p>
      <p>Published widely and careful with detail; no disciplinary history in any registry the
      Covenant can reach. Description: white coat and reading glasses; precise, unhurried speech;
      concedes what she does not know. When she says she keeps full records, she means it.</p>
      <p><em>Assessment: methodical and stubborn about detail; treats a question like a
      specimen.</em></p>
    hqFallback: 0
    daNotes: >
      <p><strong>Retrieval.</strong> At L4 the moment the cell earns her trust —
      or for the DA's own reference from the actor.</p>
      <p><strong>Reading the image.</strong> Ward light the colour of wet paper;
      a coat pocket bulging with slides; the specific exhaustion of a doctor
      who has spent three nights deciding.</p>
      <p><strong>Clues &amp; easter eggs.</strong> The slide box on her desk is
      labelled <em>09-H MARROW</em> in her own handwriting — the histopathology
      she filed under a dead trial code and kept hidden (I9, I27). One slide is
      missing from the box: it lives inside her coat.</p>
      <p><strong>DA truth.</strong> O1M4 marks her for liquidation. The players
      choose whether she testifies, runs, or burns with the ward. Her slides are
      the physical bridge from the False Revelation to the Paradigm Inversion.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic50
  name: 'N5 — Kurt Hausmann'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/portraits-clean/np05.webp
  system:
    cardId: N-5
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l4]
    npcSlugs: [sangreal-npc-hausmann]
    content: >
      <p><strong>Dossier — Kurt Hausmann.</strong> Private banker, Zurich; sixty-two. Identity
      confirmed against the clinic's intake records: the name on the ward paperwork and the man in
      the bank's personnel files are one and the same.</p>
      <p>Background: ordinary money — two addresses, a marriage, an unremarkable clientele. The file
      holds no account of the last month of his life: no attendance at the bank, no medical leave
      filed, no missing-person report from anyone — no employer, tenant, or relative has made an
      inquiry.</p>
      <p><em>Assessment: current condition unknown. Handle with caution.</em></p>
    hqFallback: 0
    daNotes: >
      <p><strong>Retrieval.</strong> Show only after the cell has seen the
      intake file (I27) or the ward tape (I30) — the horror is in the pairing.</p>
      <p><strong>Reading the image.</strong> A documentary portrait in which
      nothing is edited: the same man as the clinic intake photograph, now
      one long night later; posture wrong, stillness wrong, cold room untouched
      by his presence.</p>
      <p><strong>Clues &amp; easter eggs.</strong> The gold wristwatch is still
      on his wrist — the same watch as the intake photo (I27) and the same
      object the feral predator wore on the ceiling footage. That watch is the
      entire False Revelation: the thing on the ceiling was once a man with a
      mortgage.</p>
      <p><strong>DA truth.</strong> Hausmann is what a phial does to a mortal
      who is already dying. He is not a monster the cell can redeem — he is the
      argument for everything Claudia, Corvi, and the Church believe about the
      cure.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic51
  name: 'N6 — Father Ghiberti'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/portraits-clean/np06.webp
  system:
    cardId: N-6
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l1, sangreal-l2]
    npcSlugs: [sangreal-npc-ghiberti]
    content: >
      <p><strong>Dossier — Father Ghiberti.</strong> Archivist, the Secret Archives, Vatican City;
      thirty-one years in post; four Prefects served.</p>
      <p>Has rendered small assistances to Covenant researchers for fifteen years — none of them
      written down on either side of the ledger. Description: small and precise; cassock and lanyard;
      reading glasses always to hand. Knows the stacks by heart and answers the question that was
      actually asked — not the one he was supposed to answer.</p>
      <p><em>Assessment: cannot be bought and cannot be hurried. Ask once, and ask plainly.</em></p>
    hqFallback: 0
    daNotes: >
      <p><strong>Retrieval.</strong> Introduced at L1 the first time the cell
      needs anything from the Archives.</p>
      <p><strong>Reading the image.</strong> Fluorescent light on a man who
      lives under it; card drawers labelled MS-Vat-Heb; his eyeglass chain
      wound twice around one finger — a nervous habit, not a fashion.</p>
      <p><strong>Clues &amp; easter eggs.</strong> At his feet on the floor, a
      torn index-card corner — all that survives of the suppressed Lodestone
      entry he pulled for someone else (I36). He has already done this favour
      once, and it cost him something.</p>
      <p><strong>DA truth.</strong> Ghiberti's allegiance is to the Archives,
      not the Covenant and not the Prefect. If the players protect the
      institution's dignity, he opens every drawer that matters: the workshop
      file (I43), the suppressed index (I36), the 1582 brief (I35).</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic52
  name: 'N7 — Jean-Paul Mercier'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/portraits-clean/np07.webp
  system:
    cardId: N-7
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l3]
    npcSlugs: [sangreal-npc-mercier]
    content: >
      <p><strong>Dossier — Jean-Paul Mercier.</strong> Night-desk clerk, private banking floor,
      Geneva; forty-six. Eleven years at the same desk; two commendations; one personnel note
      concerning longstanding personal debt.</p>
      <p>Description: immaculate suit, careful grooming; keeps his counter and his ledger in the same
      order, everything square and accounted for. Colleagues describe a man who does not bend the
      rules and does not discuss his evenings.</p>
      <p><em>Assessment: honest under normal pressure — and under more pressure than usual. Perceived
      as strained; loyal to the institution rather than to any patron.</em></p>
    hqFallback: 0
    daNotes: >
      <p><strong>Retrieval.</strong> At L3 when the cell works the bank —
      counter scene or his interrogation.</p>
      <p><strong>Reading the image.</strong> Marble, brass, blotter; the faint
      shine of a man who irons his own shirts because nobody else touches his
      things.</p>
      <p><strong>Clues &amp; easter eggs.</strong> A carbon copy slips from his
      pocket as he turns: <em>UBS 4409-C</em> (I24). He photographed the escrow
      transfer and kept a copy — the clerk understood exactly what he was
      moving, and started covering himself before anyone asked.</p>
      <p><strong>DA truth.</strong> Mercier is corruptible, not evil: debt
      chosen him for the bank's part of the scheme. The right pressure — or the
      right price — yields the ledger page with "Vane, C." under the correction
      fluid (I25).</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic53
  name: 'N8 — The Operative in Grey'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/portraits-clean/np08.webp
  system:
    cardId: N-8
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l7]
    npcSlugs: [sangreal-npc-entita-operative]
    content: >
      <p><strong>Dossier — unidentified male.</strong> No name, no rank, no insignia; now seen in
      Covenant surveillance photographs from three cities.</p>
      <p>Description: grey overcoat, dark tie, military cut of hair; mid-forties; carries nothing;
      checks his watch as a matter of habit rather than need. No diplomatic registry, no service
      record, and not one witness statement mentions him — he makes no effort to avoid the
      coverage, which suggests either indifference or a confidence that it will never matter.</p>
      <p><em>Assessment: professional, disciplined, deliberately unremarkable. Do not initiate
      contact.</em></p>
    hqFallback: 0
    daNotes: >
      <p><strong>Retrieval.</strong> Best introduced as the photo in I42; this
      card upgrades him from "someone in the background" to a face the players
      can fear.</p>
      <p><strong>Reading the image.</strong> Street light on dark wool; the
      wristwatch being consulted rather than read; a car waiting just out of
      frame.</p>
      <p><strong>Clues &amp; easter eggs.</strong> Under the coat's left lapel
      hangs a slim cylinder — a phosphorus grenade, the same canister visible on
      the third man in I42. By the time the players can see this photo clearly,
      the sanitization team is already armed and on the clock.</p>
      <p><strong>DA truth.</strong> He is L'Entità — the Holy Alliance's
      enforcement arm. O1's final escalation puts a squad of him around
      whatever the cell still loves.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic54
  name: 'N9 — The Retrieval Pack Operative'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/portraits-clean/np09.webp
  system:
    cardId: N-9
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l6]
    npcSlugs: [sangreal-npc-basarab-operative]
    content: >
      <p><strong>Dossier — unidentified male.</strong> No identification; description matches a man
      seen along freight routes in Northern Italy.</p>
      <p>Description: broad build, flat cap, worker's clothes; stands and moves like a man who has
      never once been in a hurry and never once been late. No paper trail exists under any name the
      Covenant has run — no border records, no customs history, no next of kin.</p>
      <p><em>Assessment: men with no paper are rare; assume tradecraft, and assume he is not
      alone.</em></p>
    hqFallback: 0
    daNotes: >
      <p><strong>Retrieval.</strong> Show after the slaughter — the card is part
      of what the cell learns about who did it.</p>
      <p><strong>Reading the image.</strong> Roadside sodium light; a lorry
      whose plates are muddied; a man whose stillness is wrong — a worker's body
      at rest like a machine idling.</p>
      <p><strong>Clues &amp; easter eggs.</strong> Two fingers of the right
      glove are missing, and the hand beneath them is not quite right — the
      hand that touched the broken phial during the strike, burned to white ash
      in seconds (I38). Even the pack pays a price for the cure.</p>
      <p><strong>DA truth.</strong> The pack is not a beast herd — it is a
      retrieval team, patient and professional, and the cell is competing with
      it. The Elder's people have been one step behind the case since Rome.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic55
  name: 'N10 — Unidentified Subject, Ward 3'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/npc-feral-ghoul.webp
  system:
    cardId: N-10
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l4]
    npcSlugs: [sangreal-mob-feralghouls]
    content: >
      <p><strong>Dossier — unidentified subject.</strong> No patient, staff member, or visitor
      matching the figure appears in any clinic roster the Covenant has checked, and no clinic
      record accounts for its presence.</p>
      <p>Records check: nothing resembling the subject appears in clinic archives, gendarmerie
      files, or any Bestiary index consulted to date. No Covenant station has recorded its like —
      the standard guidance for unclassified hostile phenomena therefore applies.</p>
      <p><em>Assessment: do not engage. Observe, report, withdraw.</em></p>
    hqFallback: 0
    daNotes: >
      <p><strong>Retrieval.</strong> Absolutely not before the ward tape (I30).
      This image is the payoff of the False Revelation, not its setup.</p>
      <p><strong>Reading the image.</strong> IR-lit corridor; one working strip
      light; the geometry of the thing is wrong in a way players feel before
      they can name.</p>
      <p><strong>Clues &amp; easter eggs.</strong> At its wrist, fluttering
      from a hospital tie: a toe tag reading <em>SONNENBERG — UNCLAIMED</em>.
      Somebody at this clinic processed these people as bodies — before they
      were dead, or expecting to be.</p>
      <p><strong>DA truth.</strong> The ghouls are the vector's failure mode:
      proximity decay, no mind left. Deploy them as weather, not antagonists —
      and remember they may be somebody the players met on Day 9.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic56
  name: 'N11 — Unidentified Male, Unaged'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/portraits-clean/np10.webp
  system:
    cardId: N-11
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l6]
    npcSlugs: [sangreal-npc-basarab-elder]
    content: >
      <p><strong>Dossier — unidentified male.</strong> No name; appears in Covenant case photographs
      across three decades without aging.</p>
      <p>Description: tall and spare; long dark coat; the stillness of a man who has never once
      hurried. No civil record, no residence, and no travel document exists under any identity the
      Covenant has tested. He is aware of being watched and has never once altered his behaviour
      because of it.</p>
      <p><em>Assessment: aware of the watcher; indifferent to being seen. There is no procedure in the
      manual for this.</em></p>
    hqFallback: 0
    daNotes: >
      <p><strong>Retrieval.</strong> The final image of the mission (I39 pairs
      with it); show when the cell reaches the tarmac.</p>
      <p><strong>Reading the image.</strong> Rain on tarmac; the Elder's coat
      collar stands high, and beneath it a fur lining of a cut three centuries
      out of date — boyar's clothing under a modern coat. His hands are
      still.</p>
      <p><strong>Clues &amp; easter eggs.</strong> On his right hand, a
      dragon-wolf signet ring — the Wallachian crest that appears on the crate
      (I44), the cufflink (N15), and the extortion file (I17). Every road in
      this case leads back to his house.</p>
      <p><strong>DA truth.</strong> He is the one thing in the mission that
      cannot be fought, only survived. He wants the phials gathered and burned;
      his patience is measured in dynasties. If the players ever see this card,
      the mission is already over on his schedule.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic57
  name: 'N12 — Gerard, Vatican Gendarme Duty Officer'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/portraits-clean/np11.webp
  system:
    cardId: N-12
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l1]
    npcSlugs: [sangreal-npc-gendarme-officer]
    content: >
      <p><strong>Dossier — gate-house gendarme officer.</strong> Vatican Gendarmerie; eleven years at
      a single post; name on file with Wayfinder.</p>
      <p>Description: uniform pressed by habit; torch and log book squared to the desk's edge, the
      same way, every night. Record: punctual, sober, no proceedings against him. He gives his
      statements carefully and volunteers nothing beyond the facts.</p>
      <p><em>Assessment: not corrupt; tired. Tired men account for everything — which is exactly why
      they are worth asking.</em></p>
    hqFallback: 0
    daNotes: >
      <p><strong>Retrieval.</strong> At L1, when the cell reviews the night of
      the theft with him.</p>
      <p><strong>Reading the image.</strong> Fluorescent gate-house light;
      uniform pressed by habit; the ledger squared precisely with the desk's
      edge — a man holding himself together with routine.</p>
      <p><strong>Clues &amp; easter eggs.</strong> The ledger page shows the
      night's entries in his orderly hand — and a second entry at 04:02 that he
      cannot explain and did not write (I18). He will not volunteer it. Pressed
      kindly, he admits he found the door to the stair already unlocked the
      next morning.</p>
      <p><strong>DA truth.</strong> His testimony — and this photograph of the
      doctored page — is the cell's earliest thread on the Watcher. Someone
      came down into that vault after the theft, and the ledger remembers even
      when nobody wants it to.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic58
  name: 'N13 — Petra, Covenant Logistics Officer'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/portraits-clean/np12.webp
  system:
    cardId: N-13
    cardType: supportingIntel
    foundAtSlugs: []
    npcSlugs: [sangreal-npc-logistics-officer]
    content: >
      <p><strong>Dossier — Logistics Officer, The Keep.</strong> Quartermaster at Covenant
      headquarters; twelve years' service.</p>
      <p>Every permit, crate, and rail warrant the Covenant moves passes her ledger, and nothing has
      ever been misplaced. Description: cardigan and lanyard; runs her department from the duty map
      by preference. Double-checks other people's arithmetic without comment, and is almost never
      wrong.</p>
      <p><em>Assessment: quiet competence. Answer her questions accurately; she checks.</em></p>
    hqFallback: 0
    daNotes: >
      <p><strong>Retrieval.</strong> An HQ colour card — use it between
      sessions or in any HQ scene, and in the debrief if the cell ever gets
      home.</p>
      <p><strong>Reading the image.</strong> Lamplight on paper; a hand-drawn
      map, travel manifests pinned in sequence, a telephone with a
      rotary dial.</p>
      <p><strong>Clues &amp; easter eggs.</strong> Three cities are ringed in
      pencil: Geneva, Zurich, Turin — the operational clock, plotted from the
      board, before the cell could know it themselves. The Watch's own route
      analysis hangs in the room where the cell's fates are administrated.</p>
      <p><strong>DA truth.</strong> A quiet knife: among her contracted
      couriers is one on a Talamasca string. If the cell ever wonders how the
      Order kept pace with them across four countries, the answer is in this
      office — and it isn't malice, it's payroll.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic59
  name: 'N14 — Stephan, Wayfinder Remote-Sensing Analyst'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/npc-wayfinder-analyst.webp
  system:
    cardId: N-14
    cardType: supportingIntel
    foundAtSlugs: []
    npcSlugs: [sangreal-npc-wayfinder-analyst]
    content: >
      <p><strong>Dossier — Wayfinder remote-sensing analyst.</strong> Instrument desk, Wayfinder Wing;
      recruited from a university geophysics bench four years ago.</p>
      <p>Colleagues route unusual traces past her before they go anywhere else; she keeps every plot
      the Wing has ever pulled, filed by region and date. Description: early thirties; answers
      questions completely, and has a habit of having already circled the anomaly before anyone asks
      her to look.</p>
      <p><em>Assessment: reads traces the way other people read handwriting.</em></p>
    hqFallback: 0
    daNotes: >
      <p><strong>Retrieval.</strong> HQ scene; also the natural voice for
      HQ-packet intel (the card that lets the DA deliver missed clues as an
      in-world person instead of a hand-wave).</p>
      <p><strong>Reading the image.</strong> Instrument light; pinned traces
      and aerial photographs; the printout she is holding has been circled by
      someone who reads patterns for a living.</p>
      <p><strong>Clues &amp; easter eggs.</strong> The printout in her hand
      reads <em>VAULT IX — LAST STABLE READING</em>. On the plot behind her
      shoulder, a second magnetic signature hangs behind the first — the
      second descent at 04:02 (I18), already recorded on paper before anyone
      put it in the case file.</p>
      <p><strong>DA truth.</strong> If the cell asks the right question, she is
      the one who confirms: two descents that night, two signatures, one
      unclaimed. Her instruments were ahead of the investigation the whole
      time.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic60
  name: 'N15 — The Turin Intermediary'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/portraits-clean/np14.webp
  system:
    cardId: N-15
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l5]
    npcSlugs: [sangreal-npc-turin-intermediary]
    content: >
      <p><strong>Dossier — the Turin intermediary.</strong> Licensed freight broker; a string of
      dissolved companies behind him; thirty years around docks and railheads.</p>
      <p>Description: soft, well-dressed; does business only in public, on ground he chooses. Keeps
      promises and books in equal order, and answers only the questions he is paid to answer.</p>
      <p><em>Assessment: loyal to the invoice. Pay on delivery; never on account.</em></p>
    hqFallback: 0
    daNotes: >
      <p><strong>Retrieval.</strong> At L5 — surveillance first, then a
      face-to-face if the cell flushes him.</p>
      <p><strong>Reading the image.</strong> Mid-morning light; a man perfectly
      at home in a city that is not his; the waiter arriving without being
      called.</p>
      <p><strong>Clues &amp; easter eggs.</strong> On his cuff, a tiny crest
      cufflink: the Wallachian dragon-wolf (I44, N11) — his second buyer's
      sign, worn in public like an engagement ring. He collects payment for
      errands he declines to remember and wears the brand of the last one.</p>
      <p><strong>DA truth.</strong> He sold the Novara rendezvous to the pack
      (Day 3) and wired his congratulations to Bucharest on Day 1 (P5). He is
      the human face of the case's market: not a believer, not a fanatic — an
      invoice.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic61
  name: 'N16 — The Grey Watcher'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/portraits-clean/np15.webp
  system:
    cardId: N-16
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l1]
    npcSlugs: [sangreal-npc-watcher]
    content: >
      <p><strong>Dossier — unidentified male.</strong> No name; appears in Covenant surveillance
      photographs in three countries across several years.</p>
      <p>Description: grey raincoat, average build and features; carries a folded newspaper. He has
      never once been the subject of a witness statement, and no record anywhere matches the face the
      index keeps proposing. He is never doing anything, and he is never absent either.</p>
      <p><em>Assessment: whatever this is, it is a discipline. The file will be updated when there is
      more to say.</em></p>
    hqFallback: 0
    daNotes: >
      <p><strong>Retrieval.</strong> The reveal card for the Watcher — show
      once the players have spotted him in two or more photographs (I18, I23,
      I26, I31).</p>
      <p><strong>Reading the image.</strong> Park bench, midday, the paper
      folded to a column he is not reading; ankles crossed with the patience of
      a man billing by the hour.</p>
      <p><strong>Clues &amp; easter eggs.</strong> The signet ring on his
      little finger is the only distinguishing feature he allows himself —
      an eye worked inside an ouroboros (I5, I18, I22): the Talamasca's mark,
      worn by the one agent who never needed to hide it. The Ouroboros Order
      has been inside this case since before the cell got the file.</p>
      <p><strong>DA truth.</strong> He is the Talamasca's Grey Watcher: keeps
      the negatives nobody else has — including the 04:02 descent — and leaves
      the cell a calling card when he is done: <em>We watch, and we are always
      there.</em> He is not an enemy. He is worse: a colleague, from a longer
      game.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

# Photographic evidence — the superseded NPC portraits.
# These are the photographs themselves: every clue that used to sit in the cast
# card's portrait now lives here, as evidence the cell finds or takes. The cast
# cards carry clean portraits; these carry the tells.
- _id: sangreal-ph01
  name: 'F1 — Night Desk, Archive'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/npc-corvi.webp
  system:
    cardId: 'F-1'
    cardType: supportingIntel
    content: 'A single desk lamp against a cold dark room: a middle-aged man in black seated among stacked leather-bound volumes, fountain pen in hand, a locked attaché case just inside the edge of the frame. He has the face of a man who has read something he cannot unread.'
    daNotes: '<p><strong>Retrieval.</strong> Days 12–11, working his rooms and the desk effects (L2) — not the booth. This is the night he stopped sleeping, four days before the plinth was opened.</p><p><strong>Reading the image.</strong> One warm lamp, everything else cold shadow; paper and leather in stacks; his collar dark with sweat at the throat.</p><p><strong>Clues &amp; easter eggs.</strong> Face down on the desk, a photograph with its corner turned up — the 1962 archive frame (I22). The attaché case at the frame edge is not the case that left the vault.</p><p><strong>DA truth.</strong> This is the frame the Covenant files him under: a scholar photographed the night he stopped sleeping, four days before he opened the plinth.</p>'
    npcSlugs: [sangreal-npc-corvi]
    locationSlugs: [sangreal-l2]

- _id: sangreal-ph02
  name: 'F2 — Vault Corridor, Nun'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/npc-vane.webp
  system:
    cardId: 'F-2'
    cardType: supportingIntel
    content: 'Strip-lit stone under a vaulted passage: a nun in black habit over a grey under-layer stands perfectly still, both hands folded over a scuffed leather folio, eyes on the lens a fraction too long. An iron grille sits at the left edge of the frame; a carved figure waits further down the passage.'
    daNotes: '<p><strong>Retrieval.</strong> Days 12–11, when the cell first treats her as an actor rather than an escort — the vault thread. I25 supplies the corroboration: a struck-through VANE, C. at 02:10.</p><p><strong>Reading the image.</strong> Cold fluorescent overhead, wet flagstones, heavy vignette; she does not look away and her hands are still.</p><p><strong>Clues &amp; easter eggs.</strong> The rosary at her belt: one wooden bead has been replaced with an empty metal needle holder. The folio is the size and weight of a vault logging book, not a breviary.</p><p><strong>DA truth.</strong> She was inside the vault alone, before the Covenant arrived, carrying the tool of an order that kills with a needle. Her independence is proven here and the ledger only dates it.</p>'
    npcSlugs: [sangreal-npc-vane]
    locationSlugs: [sangreal-l6]

- _id: sangreal-ph03
  name: 'F3 — Council Desk, Green Lamp'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/npc-sabbatini.webp
  system:
    cardId: 'F-3'
    cardType: supportingIntel
    content: 'Green lamplight in walnut panelling: a man behind a desk, one hand spread flat over a dossier as if the hand were part of the filing, painted ceiling out of focus above him. He is photographed from standing height, across the desk.'
    daNotes: '<p><strong>Retrieval.</strong> Epilogue — the L7 accounting scene, photographed in person, or caught as the target of approach surveillance (I41).</p><p><strong>Reading the image.</strong> The lamp throws one green pool across the desk; marble and walnut; two rings, no crest.</p><p><strong>Clues &amp; easter eggs.</strong> The dossier under his hand is stamped REGISTRY 16 — AMSTERDAM, and the hand covers half of it. Amsterdam appears on no itinerary the cell has seen.</p><p><strong>DA truth.</strong> He is not hiding the file from the room. He keeps it inside reach of his hand, which is what a man does with something he may have to destroy.</p>'
    npcSlugs: [sangreal-npc-sabbatini]
    locationSlugs: [sangreal-l7]

- _id: sangreal-ph04
  name: 'F4 — Ward Corridor, Torchlight'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/npc-graf.webp
  system:
    cardId: 'F-4'
    cardType: supportingIntel
    content: 'Hard torchlight from the side in a blacked-out ward: a woman in a lab coat stands among smashed fluorescent tubes, a slide box held against her chest, half-turned toward the light. Everything outside the beam is deep shadow.'
    daNotes: '<p><strong>Retrieval.</strong> At L4, the moment the cell earns her trust — or later, when the slides are the only thing of hers left.</p><p><strong>Reading the image.</strong> Shattered tubes, taped windows, no ambient light at all; glasses pushed up into her hair and both hands steady on the box.</p><p><strong>Clues &amp; easter eggs.</strong> The slide box is labelled 09-H MARROW in her own handwriting — the patient code from the intake photograph (I27). She is not destroying the work; she is carrying it.</p><p><strong>DA truth.</strong> The terror in the frame is not the thing overhead. It is the decision she has already made about her own research.</p>'
    npcSlugs: [sangreal-npc-graf]
    locationSlugs: [sangreal-l4]

- _id: sangreal-ph05
  name: 'F5 — Corner of a Dark Room'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/npc-hausmann.webp
  system:
    cardId: 'F-5'
    cardType: supportingIntel
    content: 'A sliver of light under a door is the only source: a man crouched in the corner of a dark room, head tilted, listening, in the ruin of a tailored suit. His skin reads grey in what little light there is.'
    daNotes: '<p><strong>Retrieval.</strong> After the intake photograph (I27) or the ward tape (I30) — never before. The horror is the pairing, not the picture.</p><p><strong>Reading the image.</strong> No fill light, no flash; the room is clinically clean and he is not; he is posed as if mid-listen rather than mid-attack.</p><p><strong>Clues &amp; easter eggs.</strong> He still wears the gold wristwatch from the intake photograph — the visual argument that the thing in the corridor was once this man.</p><p><strong>DA truth.</strong> He is not a patient who escaped. He is what the protocol produces, and he is listening for the next dose.</p>'
    npcSlugs: [sangreal-npc-hausmann]
    locationSlugs: [sangreal-l4]

- _id: sangreal-ph06
  name: 'F6 — Card Catalogue, Archive'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/npc-ghiberti.webp
  system:
    cardId: 'F-6'
    cardType: supportingIntel
    content: 'An archival lamp over mahogany card catalogues: a thin older priest stands in the stacks with one drawer open beside him, a spectacle hinge taped, caught mid-thought, about to close the drawer.'
    daNotes: '<p><strong>Retrieval.</strong> Days 14–13 — introduced at L1 the first time the cell needs anything from the Archives.</p><p><strong>Reading the image.</strong> Dust in the lamp beam, ranks of labelled drawers, an interrupted gesture: the hand is on the drawer, not on the card.</p><p><strong>Clues &amp; easter eggs.</strong> A torn index-card corner lies on the floor at his feet; the shelf-mark fragment on it matches the excised stub in I3.</p><p><strong>DA truth.</strong> He pulled the card before anyone told him to. Whatever he knows, he decided it was worth the risk of being seen deciding.</p>'
    npcSlugs: [sangreal-npc-ghiberti]
    locationSlugs: [sangreal-l1]

- _id: sangreal-ph07
  name: 'F7 — Viewing Booth, Bank'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/npc-mercier.webp
  system:
    cardId: 'F-7'
    cardType: supportingIntel
    content: 'A wood-panelled room the size of a cupboard: a man in a three-piece suit sits with bank documents squared in front of him under one warm lamp, professionally pleasant and sweating slightly. A carbon copy is sliding out of his jacket pocket.'
    daNotes: '<p><strong>Retrieval.</strong> Days 12–11, at L3 when the cell works the bank — the counter scene or his interrogation.</p><p><strong>Reading the image.</strong> Brass lamp, no window, documents aligned to the table edge; his hands stay flat and open on the page.</p><p><strong>Clues &amp; easter eggs.</strong> The carbon slipping from his pocket reads UBS 4409-C — the box number on the ledger page (I25). He photographed the transfer himself and kept a copy.</p><p><strong>DA truth.</strong> The copy is his insurance, and it is what he is actually afraid of. The cell is only the second thing in the room he cannot afford.</p>'
    npcSlugs: [sangreal-npc-mercier]
    locationSlugs: [sangreal-l3]

- _id: sangreal-ph08
  name: 'F8 — Vatican Corridor, Night'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/npc-entita-operative.webp
  system:
    cardId: 'F-8'
    cardType: supportingIntel
    content: 'A night corridor of dressed stone and dim sconces: a short, square-jawed man in a grey overcoat stands with both hands clasped in front of him, one side of his face in darkness, expression absolutely bland. He is not walking anywhere.'
    daNotes: '<p><strong>Retrieval.</strong> Any day after the group photograph (I42) surfaces — this promotes him from someone in the background to a face the cell can fear.</p><p><strong>Reading the image.</strong> One sconce, one side of the face; the coat is new and off-the-peg; he stands as if waiting for a door to open.</p><p><strong>Clues &amp; easter eggs.</strong> A phosphorus canister is clipped under the coat — the same cylinder carried by the third man in I42.</p><p><strong>DA truth.</strong> The people who clean these scenes have a face and a procurement chain, and both of them run through the Vatican.</p>'
    npcSlugs: [sangreal-npc-entita-operative]
    locationSlugs: [sangreal-l5]

- _id: sangreal-ph09
  name: 'F9 — Refectory, Candlelight'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/npc-basarab-operative.webp
  system:
    cardId: 'F-9'
    cardType: supportingIntel
    content: 'One candle in a long dark room: a lean man with collar-length black hair stands far too still beside it, one gloved hand at his side. The flame is the only light in the frame and he is not hurrying.'
    daNotes: '<p><strong>Retrieval.</strong> Days 2–1, with the forensics — I38 is the pairing. This frame is part of what the cell learns about who did the killing.</p><p><strong>Reading the image.</strong> A single flame, the edge of a long table, no other source; he stands beside the light rather than in it.</p><p><strong>Clues &amp; easter eggs.</strong> Two fingers of the right glove are missing and the hand beneath them is wrong — the same injury as the calcified metacarpals recovered from the dining-hall table (I13, I38).</p><p><strong>DA truth.</strong> The pack takes its own casualties and keeps working. The damage in this case runs in both directions, and only one side photographs it.</p>'
    npcSlugs: [sangreal-npc-basarab-operative]
    locationSlugs: [sangreal-l6]

- _id: sangreal-ph10
  name: 'F10 — Mortuary Alcove, Flash'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/npc-feral-ghoul.webp
  system:
    cardId: 'F-10'
    cardType: supportingIntel
    content: 'Flash against black: a figure in a mortuary alcove caught mid-lunge toward the lens, the flash falloff the only lighting in the frame. Tiled wall, a drain, the edge of a steel trolley.'
    daNotes: '<p><strong>Retrieval.</strong> Days 10–9, absolutely not before the ward tape (I30). This frame is the payoff of the False Revelation, not its setup.</p><p><strong>Reading the image.</strong> Harsh direct flash, no ambient detail; the figure is off the ground and mid-motion; the room behind it is a working mortuary.</p><p><strong>Clues &amp; easter eggs.</strong> A toe tag flutters at its wrist reading SONNENBERG — UNCLAIMED. It was tagged, stored, and then got up.</p><p><strong>DA truth.</strong> The Covenant file on the clinic ends here: whatever Sonnenberg produces does not stay dead, and no one comes to claim it.</p>'
    npcSlugs: [sangreal-mob-feralghouls]
    locationSlugs: [sangreal-l4]

- _id: sangreal-ph11
  name: 'F11 — Gate House, Logbook'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/npc-gendarme-officer.webp
  system:
    cardId: 'F-11'
    cardType: supportingIntel
    content: 'Dull daylight in a gate house: a uniformed duty officer photographed side-on at his desk, logbook open, one hand flat on the page, in the posture of a man counting hours.'
    daNotes: '<p><strong>Retrieval.</strong> Days 14–13, at L1, when the cell reviews the night of the theft with him.</p><p><strong>Reading the image.</strong> Ledgers squared to the desk edge, a coffee gone cold, a sidearm he has never drawn inside the cemetery in living memory.</p><p><strong>Clues &amp; easter eggs.</strong> The open page carries a second entry that night at 04:02 — the same minute as the second descent (I18). He wrote it down and told nobody.</p><p><strong>DA truth.</strong> He has been waiting fourteen days for somebody to ask. Respect for the log, a cigarette, and a promise that the inquiry is aimed at the thieves is the cheapest way in the mission offers.</p>'
    npcSlugs: [sangreal-npc-gendarme-officer]
    locationSlugs: [sangreal-l1]

- _id: sangreal-ph12
  name: 'F12 — Map Table, Safehouse'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/npc-logistics-officer.webp
  system:
    cardId: 'F-12'
    cardType: supportingIntel
    content: 'Practical lamplight in a safehouse: a woman in an olive field jacket leans over a folding map table, mid-sentence, a field telephone and packed crates behind her. Several place-names on the map are ringed in pencil.'
    daNotes: '<p><strong>Retrieval.</strong> An HQ colour frame — use it between sessions, in any HQ scene, and in the debrief if the cell ever gets home.</p><p><strong>Reading the image.</strong> Working light, no daylight; crates stacked and labelled; she is mid-sentence and does not look up for the camera.</p><p><strong>Clues &amp; easter eggs.</strong> The ringed names are Geneva, Zurich and Turin — the corridor this case has been running since the first week.</p><p><strong>DA truth.</strong> The desk knew the shape of the case before the cell left Rome. The interesting question is what she was told not to write down.</p>'
    npcSlugs: [sangreal-npc-logistics-officer]
    locationSlugs: []

- _id: sangreal-ph13
  name: 'F13 — Signals Room, Printouts'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/npc-wayfinder-analyst.webp
  system:
    cardId: 'F-13'
    cardType: supportingIntel
    content: 'Green CRT glow in a signals room: a man sits at a desk of stacked printouts, headphones around his neck, photographed from the side so the screens stay out of the frame. Reel-to-reel machines and oscilloscopes fill the wall behind him.'
    daNotes: '<p><strong>Retrieval.</strong> An HQ scene — also the natural voice for HQ-packet intel, the card that lets the DA deliver a missed clue as an in-world person instead of a hand-wave.</p><p><strong>Reading the image.</strong> Green glow against tungsten, paper everywhere, a machine wall doing work he is not describing to anyone.</p><p><strong>Clues &amp; easter eggs.</strong> The top printout reads VAULT IX — LAST STABLE READING. The readings stop the hour the seal was cut.</p><p><strong>DA truth.</strong> He is the only person in Europe who watched the vault breathe, and his numbers were the reason the Covenant moved at all.</p>'
    npcSlugs: [sangreal-npc-wayfinder-analyst]
    locationSlugs: []

- _id: sangreal-ph14
  name: 'F14 — Lingotto Works, Cigar'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/npc-turin-intermediary.webp
  system:
    cardId: 'F-14'
    cardType: supportingIntel
    content: 'Industrial gloom and rain running down skylights: a heavy-set man photographed at a factory works, face half-turned away from the camera, cigar lit. Nobody else is in the frame.'
    daNotes: '<p><strong>Retrieval.</strong> Days 6–5, at L5 — surveillance first, then face to face if the cell flushes him.</p><p><strong>Reading the image.</strong> Rain on glass, dark iron, one warm point of light at his hand; he never faces the lens, and that is the point of the frame.</p><p><strong>Clues &amp; easter eggs.</strong> A small crest on his cufflink — the dragon-wolf device that also appears on the crate stencil and the aircraft tail-fin (I39).</p><p><strong>DA truth.</strong> He is a broker, not a believer. He sold the location of the case, and he would sell the buyer name for the right figure.</p>'
    npcSlugs: [sangreal-npc-turin-intermediary]
    locationSlugs: [sangreal-l5]

- _id: sangreal-ph15
  name: 'F15 — Café Table, Newspaper'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/npc-watcher.webp
  system:
    cardId: 'F-15'
    cardType: supportingIntel
    content: 'Overcast daylight at a café table: a man in an overcoat reads a folded newspaper at reading height, entirely unmemorable, photographed from an adjoining table. The frame is ordinary and slightly too wide.'
    daNotes: '<p><strong>Retrieval.</strong> Days 12–11 at the earliest — show it once the players have found him in two or more other photographs (I18, I23, I26, I31). This is the reveal frame.</p><p><strong>Reading the image.</strong> Flat overcast light, an empty second cup, no eye contact, nothing about him that asks to be looked at.</p><p><strong>Clues &amp; easter eggs.</strong> The only distinguishing feature is a signet ring on the hand that holds the paper — the same hand that added the pencil line to the gatehouse ledger.</p><p><strong>DA truth.</strong> He has been in the file since Rome and he is not hiding. He is reading exactly what the cell is reading.</p>'
    npcSlugs: [sangreal-npc-watcher]
    locationSlugs: [sangreal-l5]

- _id: sangreal-ph16
  name: 'F16 — Cellar, Candlelight'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/npc-basarab-elder.webp
  system:
    cardId: 'F-16'
    cardType: supportingIntel
    content: 'Candlelight and dressed stone: an old man photographed standing in a cellar, both hands clasped behind his back, a fur collar under his coat three centuries out of date. One light source, no daylight, deep chiaroscuro.'
    daNotes: '<p><strong>Retrieval.</strong> Days 2–1, with the airfield evidence (I39) — show it when the cell asks who signed for the crate.</p><p><strong>Reading the image.</strong> A single candle, stone walls, shadow to the edges; his expression is mild and patient, as if he were examining furniture.</p><p><strong>Clues &amp; easter eggs.</strong> A dragon-wolf signet ring on the clasped hand — the same device as the crate stencil and the tail-fin on the aircraft (I39, I42).</p><p><strong>DA truth.</strong> This is the head of the bloodline, photographed in his own house, and he is at the airfield in person. The real antagonist has been in the case file since the first week.</p>'
    npcSlugs: [sangreal-npc-basarab-elder]
    locationSlugs: [sangreal-l6]
