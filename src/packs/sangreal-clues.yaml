    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic44
  name: 'I44 — Consignment Markings'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/intel/i44-basarab-crate.webp
  system:
    cardId: I-44
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l6]
    npcSlugs: [sangreal-npc-basarab-operative]
    content: >
      <p>A dented grey cargo crate on the tarmac after partial unloading: stencilled
      lettering, a chalk tally reading 10/12, and intact customs ties. Beneath the fresh
      paint of the new stencil, older lettering shows through the wear.</p>
      <p><em>Found at: L6 — the service hangar, behind the dispatch office.</em></p>
    hqFallback: 2
    daNotes: >
      <p><strong>Retrieval.</strong> At L6, searching the hangar — a quick but decisive
      find if the cell splits up under time pressure.</p>
      <p><strong>Reading the image.</strong> A wet-concrete photograph of a battered crate
      with layered markings: new stencil over old, a chalk tally, ties nobody has cut.</p>
      <p><strong>Clues &amp; easter eggs.</strong> The chalk tally 10/12 means two phials
      were already unaccounted for before the aircraft left Europe — one sold (I6), one
      broken (I13). The fresh stencil carries the Basarab crest; beneath it, ghosted
      through the paint, an older mark reads VATICAN MUSEUMS — STOREROOM 9: the crate
      that carries the cure out of Italy was itself Vatican property.</p>
      <p><strong>DA truth.</strong> The rip goes deeper than Novara. The logistics chain
      that moved the cure east began inside the Vatican — a Mission 2 thread.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic45
  name: 'I45 — Airfield Briefing Sheet'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/intel/i45-novara-aerial.webp
  system:
    cardId: I-45
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l6]
    content: >
      <p>A low-altitude reconnaissance print of Novara-Cameri airfield at dawn, annotated
      in red grease pencil: one parked Cessna circled heavily, a second aircraft crossed
      out beside the service hangar. In the margin block, a Wayfinder classification and
      one handwritten line: <em>wheels up 01:15 confirmed.</em></p>
      <p><em>Found at: L6 — the dispatch desk, or delivered by a Wayfinder packet.</em></p>
    hqFallback: 1
    daNotes: >
      <p><strong>Retrieval.</strong> At L6, on the dispatch desk — or requested from the
      Wayfinder analyst once the airfield is suspected.</p>
      <p><strong>Reading the image.</strong> An aerial photograph printed as a briefing
      sheet: hangars, tower, a runway; grease-pencil annotations; a typed classification
      block; a single handwritten confirmation.</p>
      <p><strong>Clues &amp; easter eggs.</strong> The crossed-out second aircraft is
      decoy traffic: the cell that chases it loses the forty minutes that matter. The
      handwritten confirmation is dated the same night as the flight clearance (I15) —
      the plan was locked before the slaughter, not after.</p>
      <p><strong>DA truth.</strong> The tactical map for the campaign's final scene.
      Hand it over early if the players earn it; let them feel the clock.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []
