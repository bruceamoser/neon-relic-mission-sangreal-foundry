- _id: sangreal-ic16
  name: 'I16 — The Quiescence Formula (CT3)'
  type: informationCard
  system:
    cardId: I-16
    cardType: containmentTruth
    foundAtSlugs: [sangreal-l2, sangreal-l7]
    knownBySlugs: [sangreal-npc-sabbatini, sangreal-npc-ghiberti]
    npcSlugs: [sangreal-npc-sabbatini, sangreal-npc-ghiberti]
    content: >
      <p>Latin containment protocol: The phials must remain in absolute darkness, wrapped
      in unbleached flax linens soaked in wine vinegar, gall, and myrrh, sealed in
      lead-antimony foil below 4°C. Direct sunlight causes the fluid to boil and combust
      into white ash.</p>
      <p><em>Found at: L2 — Corvi's Quarters / L7 — CDF Offices. Known by: Cardinal
      Enrico Sabbatini and Father Ghiberti.</em></p>
    hqFallback: 3
    daNotes: >
      <p><strong>Retrieval.</strong> At L2, the wall safe behind the St. Sebastian painting
      (1 shift); at L7, Sabbatini repeats it from memory to test the cell and Ghiberti can
      confirm the archival copy.</p>
      <p><strong>Reading the image.</strong> No standalone photograph exists — the protocol
      arrives as text. Photographic support: <strong>I32</strong> (a daylight-combustion
      test in a modern fume hood) and the 4 °C freezer in <strong>I11</strong>.</p>
      <p><strong>Clues &amp; easter eggs.</strong> The quiescence kit photographed in I32 —
      linen, gall, vinegar, myrrh — is already present in a Swiss clinic. Rome's protocol
      is in play in Zurich: someone in the Church knew where the phials were going.</p>
      <p><strong>DA truth.</strong> Mechanical instructions for safe transport without
      triggering an explosive fracture. The Vatican has been practicing this protocol for
      four centuries; the Covenant has hours to learn it.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic17
  name: 'I17 — The Basarab Extortion File'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/intel/i17-sabbatini-memo.webp
  system:
    cardId: I-17
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l7]
    knownBySlugs: [sangreal-npc-sabbatini]
    npcSlugs: [sangreal-npc-sabbatini]
    content: >
      <p>A tin dispatch box under the floorboards in Claudia's convent room: microfiche
      rolls detailing ancient aristocratic dynasties in Transylvania and Wallachia,
      paired with private Vatican memos confirming centuries of blackmail. A memorandum
      from Sabbatini reads: "We hold the Gethsemane vessels as an iron nail driven into
      their heads. So long as Rome holds the Cure that brings them death, they dare not
      cross the threshold of the Tiber."</p>
      <p><em>Found at: L7 — Claudia's convent quarters, Palace of the Congregation for
      the Doctrine of the Faith. Known by: Cardinal Enrico Sabbatini.</em></p>
    hqFallback: 0
    daNotes: >
      <p><strong>Retrieval.</strong> At L7, searching Claudia's convent quarters — the tin
      dispatch box sits under a loose floorboard (Investigations, 1 shift).</p>
      <p><strong>Reading the image.</strong> The open tin box on the floorboards:
      microfiche rolls, typewritten Vatican memos, a top memo under a glass paperweight,
      one microfiche strip held up to the lamplight.</p>
      <p><strong>Clues &amp; easter eggs.</strong> The memo line reads: "We hold the
      Gethsemane vessels as an iron nail driven into their heads… so long as Rome holds the
      Cure that brings them death, they dare not cross the threshold of the Tiber." The
      microfiche shows a Basarab crest beside a land registry. On the box lid's underside,
      an ouroboros-eye has been scorched into the tin — someone else has read this file.</p>
      <p><strong>DA truth.</strong> Post-case resolution material. Confirms the political
      context: the Church used the cure as a deterrent against European vampire families.
      Sabbatini will only discuss it once the Novara evidence is on his desk.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic18
