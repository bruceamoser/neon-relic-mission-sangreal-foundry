      <p><strong>Reading the image.</strong> A pushed black-and-white frame of three men
      moving with practiced economy; one car, three sightlines, no mistakes.</p>
      <p><strong>Clues &amp; easter eggs.</strong> The watch-checking operative wears an
      issue Vatican gendarme wristwatch — the same procurement chain as the gate detail
      (I18). The car is SCV 47, the recurring tail (I31, I33). The cylinder at the third
      man's belt matches the phosphorus canister in the operative's file portrait: by the
      time this roll is developed, the squad is already armed.</p>
      <p><strong>DA truth.</strong> The Holy Alliance's sanction team is not a rumor — it
      has been photographed in the field. Deploy them at O1 M3 with the players already
      knowing these faces.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic43
  name: 'I43 — The Case, 1964'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/intel/i43-attache-1964.webp
  system:
    cardId: I-43
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l1]
    knownBySlugs: [sangreal-npc-ghiberti]
    content: >
      <p>Archival black-and-white photograph, 1964: inside the Vatican workshop, gloved
      hands line a brushed-steel attaché shell with grey metal foil. On the bench beside
      the case waits a small brass plaque, already stamped. A typewritten workshop order
      is pinned to the wall behind.</p>
      <p><em>Found at: L1 — the workshop file, pulled by Ghiberti. Known by: Ghiberti
      (eventually).</em></p>
    hqFallback: 10
    daNotes: >
      <p><strong>Retrieval.</strong> At L1, requires Ghiberti's help with the archival
      index (same scene as I3/I36).</p>
      <p><strong>Reading the image.</strong> A high-contrast workshop photograph: gloved
      hands, foil, clamps, a waiting plaque, a pinned order — the bureaucratic normality
      of building a prison for something they refuse to describe.</p>
      <p><strong>Clues &amp; easter eggs.</strong> The plaque (SANGREAL, I19) was stamped
      before the case was finished: the name came first, the container after. The pinned
      order reads XII phials — Gethsemane lot — destroyed if opened. The workshop
      supervisor is the prelate from the 1962 photograph (I22) — the line stays inside the
      building for thirty years.</p>
      <p><strong>DA truth.</strong> The case was built by the same institution that
      guarded it, watched it, and — one way or another — arranged its theft. Nobody in
      this case is outside the Church.</p>
