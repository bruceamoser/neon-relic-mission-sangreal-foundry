      carbon-copy type, an aerodrome ink stamp, a pilot's signature, a small printed
      heraldic crest beside the operator field — and a second, cancelled form beneath it.</p>
      <p><strong>Clues &amp; easter eggs.</strong> The owner line reads Basarab Holdings
      S.A. (Bucharest); the cargo line reads "Ecclesiastical Medical Supplies — Ten
      Consignment Units". Departure 01:15. The cancelled form beneath means the flight
