    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic35
  name: 'I35 — Breve Apostolicum, 1582'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/intel/i35-breve-1582.webp
  system:
    cardId: I-35
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l2, sangreal-l5]
    knownBySlugs: [sangreal-npc-corvi]
    npcSlugs: [sangreal-npc-corvi]
    content: >
      <p>A photographic reproduction of a 1582 papal brief: dense chancery cursive on aged parchment;
      a lead seal cracked and repaired with red wax; marginal annotations in a second hand; and a
      shelf-mark stamped in the corner: <em>MS-Vat-Heb-418</em>.</p>
    hqFallback: 5
    daNotes: >
      <p><strong>Retrieval.</strong> At L2 in the desk effects, or at L5 in his kit — both
      part of the paper trail (pair with I3's excised register).</p>
      <p><strong>Reading the image.</strong> A flat archival photograph of an aged
      parchment: formal Latin script, an imperfectly repaired seal, pencilled marginal
      notes, and a modern shelf-mark stamped in the corner.</p>
      <p><strong>Clues &amp; easter eggs.</strong> The shelf-mark ties this brief to the
      excised card in I3 — the same record the Vatican tried to erase. The cracked seal
      repaired with wax means the capsule was opened after sealing: the 1582 custodians
      broke protocol, and someone repaired the seal to hide it. The marginalia name the
      capsule XII-SANG-00: the case's institutional identity for four centuries.</p>
      <p><strong>DA truth.</strong> The phials were opened long before Corvi — the Church's
      quiescence protocol exists because someone learned what happens when you don't
      follow it.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic36
  name: 'I36 — Suppressed Index Card'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/intel/i36-lodestone-index.webp
  system:
    cardId: I-36
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l1, sangreal-l2]
    knownBySlugs: [sangreal-npc-ghiberti]
    content: >
      <p>An archive index card for an object catalogued as the Lodestone of St. Jude, with a small
      pre-war photograph of a dark banded nodule clipped to it. A red stamp across the card reads
      <em>SUPPRESSED — CONS. DOCT. FIDEI</em>; a pencilled handling note at the foot of the card
      warns: <em>corrosive to ferrous circuitry.</em></p>
    hqFallback: 6
    daNotes: >
      <p><strong>Retrieval.</strong> At L1, the suppressed-index drawer (Ghiberti again);
      at L2, a carbon in Corvi's file. 1 shift.</p>
      <p><strong>Reading the image.</strong> An archive card with a rusted paperclip, a
      pre-war photograph of a thumb-sized black nodule banded in silver wire, a big faded
      red stamp, typewritten notes and one pencil line.</p>
      <p><strong>Clues &amp; easter eggs.</strong> "Corrosive to ferrous circuitry" is the
      whole plan in five words: the Lodestone was known — and filed — as the one thing that
      disables the vault's electromagnets. The order came from the Prefect's office: the
      theft's occult tool was issued from inside the building it robbed.</p>
      <p><strong>DA truth.</strong> The Lodestone's index card links the breach (I1) to the
      Congregation (I17) — the current Prefect's fingerprints are on the weapon, whether
      or not he commissioned the crime.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic37
  name: 'I37 — The Empty Needle'
  type: informationCard
  img: modules/neon-relic-mission-sangreal/assets/art/intel/i37-rosary-open.webp
  system:
    cardId: I-37
    cardType: supportingIntel
    foundAtSlugs: [sangreal-l5, sangreal-l6]
    npcSlugs: [sangreal-npc-vane]
    content: >
      <p>A forensic macro of a wooden rosary: one bead split cleanly open along its grain. The cavity
      is empty; a few pale fibres remain caught inside, and a faint line of scorching crosses the
      bead's outer surface.</p>
    hqFallback: 5
    daNotes: >
      <p><strong>Retrieval.</strong> At L5, searching her kit while the cell still trusts
      her (a delicate, revealing scene); at L6 in her effects (I40) as evidence.</p>
      <p><strong>Reading the image.</strong> A millimetre-ruled forensic macro: a split
      bead on dark linen, fibres in the hollow, a faint scorch on the outer surface.</p>
      <p><strong>Clues &amp; easter eggs.</strong> The split is a clean, deliberate cut —
      she opened it herself. The ochre fibres are the remains of the Veronica Thread's
      sheath. The scorch is fresh: the Thread was snapped <em>recently and near here</em>.
      If the players search this before Turin, they can pre-empt the betrayal entirely.</p>
      <p><strong>DA truth.</strong> The single best early-warning prop in the mission.
      Reward the search; do not protect Claudia.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic38
  name: 'I38 — Two Fingers, Calcified'
