      <p><strong>Reading the image.</strong> A harsh macro of white, fractured bone
      substitute on terracotta, evidence arrow card in frame, a small metal ring melted
      into the material.</p>
      <p><strong>Clues &amp; easter eggs.</strong> Radial fracture lines show the bone aged
      a century in seconds — CT1's signature, identical to the crucible ash (I32). One
      finger's whorl ridge pattern survives: a printable partial the cell can pursue into
      Mission 2. The melted ring's crest is the Basarab dragon — one of the pack touched
      the spilled phial and died for it.</p>
      <p><strong>DA truth.</strong> This is the mechanical revelation of the campaign:
      the cure is the only thing the vampires fear, and they will burn it to stay unafraid.</p>
    foundAtUuids: []
    knownByUuids: []
    npcUuids: []

- _id: sangreal-ic39
  name: 'I39 — Tarmac, 01:15'
